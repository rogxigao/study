<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1700" viewBox="0 0 1200 1700">
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#2c5549"/>
      <stop offset="0.6" stop-color="#24483e"/>
      <stop offset="1" stop-color="#1c3a31"/>
    </linearGradient>
    <linearGradient id="topLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="grain2" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <style>
      .serif { font-family: 'Source Han Serif SC','Noto Serif SC','Songti SC','STSong','SimSun',serif; }
    </style>
  </defs>

  <rect width="1200" height="1700" fill="#f7f1e3"/>
  <rect width="1200" height="1120" fill="url(#green)"/>
  <rect width="1200" height="1120" fill="url(#topLight)"/>
  <rect width="1200" height="1700" filter="url(#grain2)" opacity="0.045"/>

  <rect x="0" y="0" width="14" height="1700" fill="#17312a" opacity="0.55"/>
  <line x1="14" y1="0" x2="14" y2="1700" stroke="#0f241e" stroke-opacity="0.35" stroke-width="1"/>

  <text x="112" y="112" class="serif" font-size="25" letter-spacing="3" fill="#f5eeda" fill-opacity="0.72">高等院校经济管理类数学基础课教材</text>
  <line x1="112" y1="146" x2="1088" y2="146" stroke="#f5eeda" stroke-opacity="0.22" stroke-width="1"/>

  <g transform="translate(946,120) rotate(-2)">
    <rect width="100" height="100" fill="none" stroke="#c0604a" stroke-width="3"/>
    <text x="50" y="47" text-anchor="middle" class="serif" font-size="34" fill="#d07a63">高</text>
    <text x="50" y="85" text-anchor="middle" class="serif" font-size="34" fill="#d07a63">数</text>
  </g>

  <text x="612" y="566" text-anchor="middle" class="serif" font-size="330" font-weight="600" letter-spacing="26" fill="#f7f1e3">高等</text>
  <text x="612" y="930" text-anchor="middle" class="serif" font-size="330" font-weight="600" letter-spacing="26" fill="#f7f1e3">数学</text>

  <text x="600" y="1030" text-anchor="middle" class="serif" font-size="54" letter-spacing="18" fill="#e9dcc2">经、管类</text>
  <text x="600" y="1084" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="15" letter-spacing="9" fill="#f5eeda" fill-opacity="0.5">ADVANCED MATHEMATICS</text>

  <text x="600" y="1246" text-anchor="middle" class="serif" font-size="36" letter-spacing="8" fill="#2a251d">郭　军　　房　少　梅</text>
  <text x="600" y="1300" text-anchor="middle" class="serif" font-size="22" letter-spacing="10" fill="#7e7466">主　编</text>

  <g opacity="0.32">
    <path d="M140 1540 C 360 1532 480 1450 620 1382 S 880 1300 1060 1272" fill="none" stroke="#7d7360" stroke-width="2.6"/>
    <line x1="420" y1="1452" x2="980" y2="1276" fill="none" stroke="#9c2f24" stroke-width="1.4" stroke-dasharray="8 8" opacity="0.75"/>
    <circle cx="700" cy="1352" r="5" fill="#9c2f24" opacity="0.85"/>
  </g>

  <line x1="420" y1="1604" x2="780" y2="1604" stroke="#c9bda6" stroke-width="1"/>
  <text x="600" y="1650" text-anchor="middle" class="serif" font-size="32" letter-spacing="10" fill="#4b4439">科学出版社</text>
