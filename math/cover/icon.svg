<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#2b5347"/>
      <stop offset="0.55" stop-color="#24483e"/>
      <stop offset="1" stop-color="#1b382f"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <style>
      .serif { font-family: 'Source Han Serif SC','Noto Serif SC','Songti SC','STSong','SimSun',serif; }
      .paper { fill: #f5eeda; }
      .faint { fill: #f5eeda; opacity: .62; }
    </style>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" filter="url(#grain)" opacity="0.05"/>

  <rect x="42" y="42" width="940" height="940" fill="none" stroke="#efe6d2" stroke-opacity="0.32" stroke-width="2"/>
  <rect x="58" y="58" width="908" height="908" fill="none" stroke="#efe6d2" stroke-opacity="0.14" stroke-width="1"/>

  <text x="512" y="176" text-anchor="middle" class="serif faint" font-size="26" letter-spacing="14">经 管 类</text>

  <text x="522" y="520" text-anchor="middle" class="serif paper" font-size="280" font-weight="600" letter-spacing="20">高等</text>
  <text x="522" y="812" text-anchor="middle" class="serif paper" font-size="280" font-weight="600" letter-spacing="20">数学</text>

  <g transform="translate(806,112) rotate(-2)">
    <rect width="94" height="94" fill="none" stroke="#c0604a" stroke-width="3"/>
    <text x="47" y="44" text-anchor="middle" class="serif" font-size="32" fill="#cf725c">高</text>
    <text x="47" y="80" text-anchor="middle" class="serif" font-size="32" fill="#cf725c">数</text>
  </g>

  <line x1="392" y1="866" x2="632" y2="866" stroke="#efe6d2" stroke-opacity="0.28" stroke-width="1"/>
  <text x="512" y="914" text-anchor="middle" class="serif faint" font-size="25" letter-spacing="6">科学出版社</text>
</svg>
