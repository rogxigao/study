       steps:['层数 <m>log<sub>2</sub>n + 1</m>（从 n 切到 1）。','每层合并总比较次数约 <m>n</m>。','相乘得 <m>O(n log n)</m>。'],
       ans:'<m>log<sub>2</sub>n</m> 层，每层 <m>O(n)</m>'}
    ]}
  ]
},

{
  id:'11.5', title:'程序正确性',
  blocks:[
    {t:'lead', h:'程序「跑通了」不等于正确。测试只能证明存在错误，不能证明没有错误。<b>要证明正确，得用逻辑。</b>'},
    {t:'def', lb:'正确性的两层', h:'<ul style="margin:4px 0 0"><li><b>部分正确</b>：若程序终止，则结果符合规格。</li><li><b>终止性</b>：程序对一切合法输入都会停。</li><li>两者合起来叫<b>完全正确</b>。</li></ul>'},
    {t:'p', h:'注意这个拆分很聪明：它把「结果对不对」和「会不会停」分开证。因为前者用逻辑推，后者常用计数或良序原理。'},
    {t:'def', lb:'霍尔三元组', h:'<p><m>{P} S {Q}</m> 读作：<b>若执行 <m>S</m> 前断言 <m>P</m> 成立，且 <m>S</m> 终止，则执行后 <m>Q</m> 成立</b>。</p><p><m>P</m> 叫前置条件，<m>Q</m> 叫后置条件。</p>'},
    {t:'h3', h:'循环不变式'},
    {t:'p', h:'循环是正确性证明的难点，因为它的执行次数不确定。办法是找一个<b>循环不变式</b>：一个在每次循环前后都成立的断言。证明分三步：'},
    {t:'ol', items:[
      '<b>初始化</b>：进入循环前，不变式成立。',
      '<b>保持</b>：若某轮开始时不成立式成立，则该轮结束时仍成立。',
      '<b>终止</b>：循环结束时，不变式加上退出条件，能推出后置条件。'
    ]},
    {t:'p', h:'这和数学归纳法是同一个骨架：初始化对应基础步，保持对应归纳步，终止对应「归纳到终点」。'},
    {t:'p', h:'<b>例</b>：下面这段求 <m>a<sup>n</sup></m> 的循环'},
    {t:'f', h:'i = 0; p = 1;　while i &lt; n: p = p·a; i = i+1', note:'结束时 p = aⁿ'},
    {t:'p', h:'取不变式「<m>p = a<sup>i</sup></m> 且 <m>i ≤ n</m>」。初始化：<m>i=0, p=1=a<sup>0</sup></m>，成立。保持：每轮 <m>p</m> 乘 <m>a</m>、<m>i</m> 加 1，<m>p = a<sup>i</sup></m> 仍成立。终止：<m>i = n</m>，代入得 <m>p = a<sup>n</sup></m>。'},
    {t:'p', h:'<b>终止性怎么证？</b>找一个<b>严格递减且有下界</b>的量。上面循环里 <m>n − i</m> 每轮减 1，最小到 0，所以必然终止。这个量叫<b>循环变式</b>（variant）。'},
    {t:'warn', h:'<p>找不变式是门手艺，没有通用算法。经验是：<b>写下循环变量的含义</b>。「<m>p</m> 存的是前 <m>i</m> 项的积」「<m>i</m> 之前的部分已排好序」——这类句子往往就是不变式。</p>'},

    {t:'ex', title:'例 1　数组求和的不变式', q:'证明：循环 <code>s=0; i=0; while i&lt;n: s=s+A[i]; i=i+1</code> 结束后 <m>s</m> 等于数组前 <m>n</m> 项之和。',
      steps:[
        '不变式取「<m>s = A[0]+…+A[i−1]</m> 且 <m>0 ≤ i ≤ n</m>」。',
        '<b>初始化</b>：<m>i=0</m>，空和为 0，成立。',
        '<b>保持</b>：第 <m>i</m> 轮把 <m>A[i]</m> 加进 <m>s</m>，<m>i</m> 变 <m>i+1</m>，不变式仍成立。',
        '<b>终止</b>：<m>i=n</m>，代回得 <m>s = A[0]+…+A[n−1]</m>。',
        '<b>终止性</b>：<m>n−i</m> 严格递减且非负。'
      ], ans:'完全正确'},

    {t:'exs', id:'11.5', items:[
      {q:'「程序对所有测试用例都通过了」能否证明程序正确？',
       hint:'测试是抽样还是穷举？',
       steps:['测试只能覆盖有限个输入。','输入空间通常是无限的，未测到的地方可能有错。','测试能<b>否证</b>正确性（找到反例），不能<b>证明</b>。'],
       ans:'不能，测试只能发现错误'},
      {q:'循环 <code>while x != 1: if x even: x=x/2 else: x=3x+1</code> 的终止性能证明吗？',
       hint:'这是考拉兹猜想。',
       steps:['这是著名的 3n+1 问题（考拉兹猜想）。','至今无人证明它对一切正整数终止，也无人找到反例。','说明「找一个递减的变式」并不总能做到。'],
       ans:'不能，这是未解猜想'}
    ]}
  ]
}

]};

CH[12] = {
  title: '离散概率',
  en: 'Discrete Probability',
  origin: 7,
  intro: '概率不是「感觉上有多大可能」，而是<b>数事件里的元素</b>。样本空间定好，事件就是它的子集，概率就是子集大小除以总大小。这一章真正有用的两个工具是：<b>条件概率</b>（把样本空间换掉）和<b>期望的线性性</b>（不用管分布也能算期望）。',
  sections: [

{
  id:'12.1', title:'概率基础',
  blocks:[
    {t:'lead', h:'扔一个骰子，样本空间是 <m>{1,2,3,4,5,6}</m>。「点数是偶数」这个事件是子集 <m>{2,4,6}</m>。概率就是 <m>3/6</m>。<b>没有比这更玄的东西</b>。'},
    {t:'def', lb:'样本空间与事件', h:'<p><b>样本空间</b> <m>S</m> 是所有可能结果的集合。<b>事件</b> <m>E</m> 是 <m>S</m> 的子集。</p><p>若每个结果等可能，则</p><div class="f" style="margin:6px 0">P(E) = |E| / |S|</div>'},
    {t:'p', h:'这个定义只适用于<b>等可能</b>的情形。骰子灌了铅、硬币两面不等重，就不能这么算，得用公理化定义（每条结果带一个权重，权重和为 1）。'},
    {t:'thm', lb:'基本性质', h:'<ul style="margin:4px 0 0"><li><m>0 ≤ P(E) ≤ 1</m>，<m>P(S)=1</m>，<m>P(∅)=0</m></li><li><b>补事件</b>：<m>P(Ē) = 1 − P(E)</m></li><li><b>容斥</b>：<m>P(E∪F) = P(E) + P(F) − P(E∩F)</m></li><li>若 <m>E ⊆ F</m>，则 <m>P(E) ≤ P(F)</m></li></ul>'},
    {t:'p', h:'<b>补事件是最常用的技巧</b>。「至少一个」几乎总是从反面算更快：<m>P(至少一个) = 1 − P(一个都没有)</m>。'},
    {t:'p', h:'<b>生日问题</b>就是这个技巧的经典：23 个人里至少两人生日相同的概率是 50.7%，反直觉地高。算法是算「全都不同」：'},
    {t:'f', h:'P(全不同) = (365/365)·(364/365)·…·(343/365) ≈ 0.493　⟹　P(至少一对相同) ≈ 0.507'},
    {t:'w', id:'birthday'},
    {t:'p', h:'为什么这么高？因为「一对相同」的<b>配对</b>有 <m>C(23,2)=253</m> 对，每一对都有约 <m>1/365</m> 的碰撞机会。人直觉上算的是「有人和我同一天生日」（约 22/365），而不是「任意两人」。'},
    {t:'warn', h:'<p>算概率前先问三个问题：</p><ol style="margin:6px 0 0"><li>样本空间是什么？每个结果等可能吗？</li><li>事件是「至少一个」还是「恰好一个」？</li><li>要不要用补事件？</li></ol><p style="margin-top:6px">三个问题里错一个，答案就全错。</p>'},

    {t:'ex', title:'例 1　两个骰子', q:'掷两个骰子，点数之和为 7 的概率是多少？',
      steps:[
        '样本空间是<b>有序对</b>，共 <m>6×6 = 36</m> 个结果（不能算成 21 种组合，因为组合不等可能）。',
        '和为 7 的有：(1,6)(2,5)(3,4)(4,3)(5,2)(6,1)，共 6 个。',
        '<m>P = 6/36 = 1/6</m>。'
      ], ans:'<m>1/6</m>'},

    {t:'exs', id:'12.1', items:[
      {q:'从 1 到 100 随机取一个整数，它能被 3 或 5 整除的概率是多少？',
       hint:'用容斥。',
       steps:['被 3 整除：<m>⌊100/3⌋ = 33</m> 个。','被 5 整除：20 个。','同时被 3、5 整除即被 15 整除：6 个。','<m>33+20−6 = 47</m>，概率 <m>47/100</m>。'],
       ans:'0.47'},
      {q:'一枚硬币掷 4 次，至少出现一次正面的概率？',
       hint:'用补事件。',
       steps:['反事件是「四次全反面」，概率 <m>(1/2)<sup>4</sup> = 1/16</m>。','<m>1 − 1/16 = 15/16</m>。'],
       ans:'<m>15/16</m>'},
      {q:'为什么「两个骰子点数和」不能把样本空间当成 21 种组合？',
       hint:'(1,1) 和 (1,2) 的可能性一样吗？',
       steps:['组合 (1,2) 对应 (1,2) 和 (2,1) 两种有序结果。','组合 (1,1) 只有一种。','两者不等可能，所以不能用组合数当分母。'],
       ans:'组合不等可能，必须用有序对'}
    ]}
  ]
},

{
  id:'12.2', title:'条件概率与独立性',
  blocks:[
    {t:'lead', h:'「已知某件事发生了，另一件事的概率」——这不是新概念，只是<b>把样本空间缩小到已知事件里</b>。'},
    {t:'def', lb:'条件概率', h:'<p>当 <m>P(F) &gt; 0</m> 时，</p><div class="f" style="margin:6px 0">P(E | F) = P(E ∩ F) / P(F)</div><p>直观：把 <m>F</m> 当成新的样本空间，看 <m>E</m> 在其中占多大比例。</p>'},
    {t:'p', h:'<b>从集合角度理解</b>：原来的分母是 <m>|S|</m>，现在分母换成 <m>|F|</m>，分子换成 <m>|E∩F|</m>。就这一件事。'},
    {t:'thm', lb:'乘法法则', h:'<p><m>P(E ∩ F) = P(F)·P(E|F) = P(E)·P(F|E)</m>。多个事件可以链式展开：</p><div class="f" style="margin:6px 0">P(E<sub>1</sub>∩…∩E<sub>n</sub>) = P(E<sub>1</sub>)P(E<sub>2</sub>|E<sub>1</sub>)…P(E<sub>n</sub>|E<sub>1</sub>…E<sub>n−1</sub>)</div>'},
    {t:'def', lb:'独立', h:'<p><m>E</m> 与 <m>F</m> <b>独立</b>，如果</p><div class="f" style="margin:6px 0">P(E ∩ F) = P(E)·P(F)</div><p>等价地（当概率非零）：<m>P(E|F) = P(E)</m>——知道 <m>F</m> 发生与否，不改变 <m>E</m> 的概率。</p>'},
    {t:'warn', h:'<p><b>互斥 ≠ 独立</b>，这两件事经常被混为一谈。</p><p>若 <m>E</m> 与 <m>F</m> 互斥且概率都大于 0，则 <m>P(E∩F)=0 ≠ P(E)P(F) &gt; 0</m>，所以它们<b>一定不独立</b>。互斥意味着「一个发生就排除了另一个」，这是极强的相关性。</p>'},
    {t:'p', h:'<b>独立性的判断不能靠直觉。</b>「掷两枚硬币，第一枚正面」与「两枚结果相同」独立吗？算一下：<m>P(相同)=1/2</m>，<m>P(相同|第一枚正)=P(第二枚正)=1/2</m>，相同，独立。但换成三枚硬币，「第一枚正面」与「三枚中正面数为偶数」就不独立了。'},
    {t:'p', h:'多个事件<b>两两独立</b>也不等于<b>相互独立</b>。三事件相互独立要求每一个子集的交都等于各自概率的乘积，四个等式全成立才行。'},

    {t:'ex', title:'例 1　不放回抽牌', q:'一副 52 张牌，不放回抽两张。已知第一张是 A，第二张也是 A 的概率？',
      steps:[
        '第一张抽走一张 A，剩 3 张 A、51 张牌。',
        '在新的样本空间里，概率是 <m>3/51 = 1/17</m>。',
        '若改为<b>放回</b>，则仍是 <m>4/52 = 1/13</m>，两次独立。'
      ], ans:'<m>1/17</m>（放回则 <m>1/13</m>）'},

    {t:'exs', id:'12.2', items:[
      {q:'<m>P(E)=0.4</m>，<m>P(F)=0.5</m>，<m>P(E∩F)=0.2</m>。两者独立吗？',
       hint:'比较乘积。',
       steps:['<m>P(E)P(F) = 0.4×0.5 = 0.2</m>。','正好等于 <m>P(E∩F)</m>。'],
       ans:'独立'},
      {q:'若 <m>P(E)=0.3</m>、<m>P(F)=0.4</m> 且互斥，它们独立吗？',
       hint:'互斥时交事件概率是多少？',
       steps:['互斥则 <m>P(E∩F) = 0</m>。','<m>P(E)P(F) = 0.12 ≠ 0</m>。','所以不独立。'],
       ans:'不独立'},
      {q:'为什么「不放回抽样」会让两次结果不独立？',
       hint:'看第二次的样本空间。',
       steps:['第一次的结果改变了剩余牌堆的构成。','第二次的概率依赖第一次抽到了什么。','<m>P(第二次A) = 1/13</m>，但 <m>P(第二次A|第一次A) = 1/17</m>，不等。'],
       ans:'第一次抽走了牌，改变了第二次的样本空间'}
    ]}
  ]
},

{
  id:'12.3', title:'贝叶斯定理',
  blocks:[
    {t:'lead', h:'贝叶斯回答的是一个反方向的问题：<b>看到了结果，怎么反推原因</b>。医生看到阳性报告，想知道病人真患病的概率——这就是贝叶斯。'},
    {t:'thm', lb:'全概率公式', h:'<p>若 <m>F<sub>1</sub>, …, F<sub>n</sub></m> 构成样本空间的一个划分（互不相交、并起来是全集），则</p><div class="f" style="margin:6px 0">P(E) = Σ<sub>i</sub> P(E | F<sub>i</sub>) · P(F<sub>i</sub>)</div>'},
    {t:'thm', lb:'贝叶斯定理', h:'<div class="f" style="margin:6px 0">P(F | E) = P(E | F)·P(F) / P(E)</div><p>分母 <m>P(E)</m> 通常用全概率公式展开成「各种原因下出现 E 的总和」。</p>'},
    {t:'p', h:'四个名字要分清：<m>P(F)</m> 是<b>先验</b>（看结果之前对原因的信念），<m>P(E|F)</m> 是<b>似然</b>（该原因下出现这个结果的概率），<m>P(F|E)</m> 是<b>后验</b>（看到结果之后更新的信念），<m>P(E)</m> 是<b>证据</b>（归一化常数）。'},
    {t:'p', h:'<b>为什么重要？</b>因为人脑天生把 <m>P(E|F)</m> 和 <m>P(F|E)</m> 搞反。医生说「这个检测准确率 99%」，指的是 <m>P(阳性|患病)</m>，而不是你关心的 <m>P(患病|阳性)</m>。两者可以差几十倍。'},
    {t:'w', id:'bayes'},
    {t:'tip', h:'<p><b>算贝叶斯的笨办法最可靠</b>：假设总共有 10000 人，按先验算出患病和健康各多少人，再按似然算出各有多少人阳性，最后用「真阳性 / 全部阳性」。用人数代替概率，几乎不会算错。</p>'},

    {t:'ex', title:'例 1　疾病检测', q:'某病患病率 1%。检测灵敏度 99%（患病者 99% 阳性），假阳性率 2%（健康者 2% 阳性）。某人阳性，他真患病的概率是多少？',
      steps:[
        '设总人数 10000：患病 100 人，健康 9900 人。',
        '患病者中阳性：<m>100×0.99 = 99</m> 人。',
        '健康者中误报阳性：<m>9900×0.02 = 198</m> 人。',
        '全部阳性 <m>99+198 = 297</m> 人，其中真患病 99 人。',
        '<m>P = 99/297 = 1/3</m>。'
      ], ans:'约 33.3%，远低于直觉的 99%'},
    {t:'p', h:'这个结果不是悖论。<b>因为健康人基数太大了</b>，2% 的误报率乘上 9900 人，绝对数就压过了 99 个真阳性。这也解释了为什么罕见病不适合全民筛查——假阳性会把医疗系统淹掉。'},

    {t:'exs', id:'12.3', items:[
      {q:'把上题的患病率改成 10%，后验变成多少？',
       hint:'同样用 10000 人算。',
       steps:['患病 1000 人，阳性 <m>990</m> 人。','健康 9000 人，误报 <m>180</m> 人。','<m>990/(990+180) = 990/1170 ≈ 0.846</m>。'],
       ans:'约 84.6%'},
      {q:'为什么 <m>P(E|F)</m> 和 <m>P(F|E)</m> 一般不等？',
       hint:'举一个极端例子。',
       steps:['设 <m>F</m> = 人，<m>E</m> = 会呼吸。','<m>P(呼吸|人) = 1</m>，但 <m>P(人|呼吸)</m> 远小于 1（还有别的动物）。','分母不同：一个是 <m>P(F)</m>，一个是 <m>P(E)</m>。'],
       ans:'分母不同，条件概率不是对称关系'}
    ]}
  ]
},

{
  id:'12.4', title:'期望与方差',
  blocks:[
    {t:'lead', h:'期望不是「最可能的值」，而是<b>长期平均值</b>。掷一个骰子，期望 3.5，但永远掷不出 3.5。'},
    {t:'def', lb:'期望', h:'<p>离散随机变量 <m>X</m> 取值 <m>x<sub>1</sub>, x<sub>2</sub>, …</m>，概率 <m>p(x<sub>i</sub>)</m>，则</p><div class="f" style="margin:6px 0">E(X) = Σ x<sub>i</sub> p(x<sub>i</sub>)</div>'},
    {t:'p', h:'<b>例</b>：掷骰子 <m>E(X) = (1+2+3+4+5+6)/6 = 3.5</m>。掷 1000 次的平均值会非常接近 3.5，这就是大数定律的直观。'},
    {t:'thm', lb:'期望的线性性', h:'<div class="f" style="margin:4px 0">E(X + Y) = E(X) + E(Y)</div><p><b>不需要 X 与 Y 独立</b>。这是期望最好用的性质，没有之一。</p>'},
    {t:'p', h:'<b>经典应用：n 个人随机拿回帽子，期望有多少人拿对？</b>令 <m>X<sub>i</sub></m> 表示第 <m>i</m> 人拿对（1 或 0）。<m>P(X<sub>i</sub>=1) = 1/n</m>，所以 <m>E(X<sub>i</sub>) = 1/n</m>。由线性性：'},
    {t:'f', h:'E(拿对人数) = Σ E(X<sub>i</sub>) = n · (1/n) = 1'},
    {t:'p', h:'不管 <m>n</m> 是 10 还是 100 万，期望都是 1 个。这个结论如果硬算分布，会非常麻烦——线性性一步到位。'},
    {t:'def', lb:'方差', h:'<p><m>V(X) = E((X − E(X))<sup>2</sup>) = E(X<sup>2</sup>) − (E(X))<sup>2</sup></m>，标准差 <m>σ = √V(X)</m>。</p><p>期望描述「重心」，方差描述「分散程度」。</p>'},
    {t:'p', h:'注意 <m>E(X<sup>2</sup>) ≠ (E(X))<sup>2</sup></m>，两者差一个方差。这个坑考试很爱设。'},
    {t:'p', h:'<b>几何分布</b>：反复试验直到首次成功，每次成功率 <m>p</m>，则期望次数 <m>1/p</m>。直觉：成功率为 1/6 时，平均要试 6 次。'},
    {t:'p', h:'<b>期望与决策</b>：彩票的期望收益通常低于票价（否则发行方亏本）。但期望低不代表不该买——如果 2 元换一个「可能中 500 万」的想象，效用上未必不划算。期望是数学，值不值是另一回事。'},

    {t:'ex', title:'例 1　两个骰子的期望和', q:'掷两个骰子，点数之和的期望是多少？',
      steps:[
        '设 <m>X<sub>1</sub>, X<sub>2</sub></m> 分别为两个骰子，<m>E(X<sub>1</sub>) = E(X<sub>2</sub>) = 3.5</m>。',
        '由线性性，<m>E(X<sub>1</sub>+X<sub>2</sub>) = 3.5 + 3.5 = 7</m>。',
        '不需要列出 36 种情况，也不需要两者独立。'
      ], ans:'7'},

    {t:'exs', id:'12.4', items:[
      {q:'掷一枚骰子，求 <m>E(X<sup>2</sup>)</m> 与 <m>V(X)</m>。',
       hint:'<m>E(X<sup>2</sup>) = (1+4+9+16+25+36)/6</m>。',
       steps:['<m>E(X<sup>2</sup>) = 91/6 ≈ 15.17</m>。','<m>(E(X))<sup>2</sup> = 3.5<sup>2</sup> = 12.25</m>。','<m>V = 15.17 − 12.25 = 35/12 ≈ 2.92</m>。'],
       ans:'<m>E(X<sup>2</sup>)=91/6</m>，<m>V(X)=35/12</m>'},
      {q:'一个游戏：掷骰子，掷出 6 得 10 元，否则付 2 元。期望收益是多少？值得玩吗？',
       hint:'算加权平均。',
       steps:['<m>E = 10×(1/6) + (−2)×(5/6)</m>。','<m>= 10/6 − 10/6 = 0</m>。'],
       ans:'期望为 0，公平游戏（长期不赚不亏）'},
      {q:'为什么 <m>E(XY) = E(X)E(Y)</m> 需要独立性，而 <m>E(X+Y)</m> 不需要？',
       hint:'看乘积里有没有交叉项。',
       steps:['和的期望展开后是 <m>Σx p + Σy p</m>，逐项可拆。','积的期望是 <m>Σ xy p(x,y)</m>，需要 <m>p(x,y)=p(x)p(y)</m> 才能拆成两个和相乘。','所以乘积需要独立，加法不需要。'],
       ans:'加法逐项可拆，乘法需要联合分布可分解'}
    ]}
  ]
}

]};

CH[13] = {
  title: '计算模型',
  en: 'Modeling Computation',
  origin: 13,
  intro: '前面十二章都在讲「怎么算」。这一章反过来问：<b>什么才算「能算」</b>？答案是三个层层加码的机器：有限状态机（只能记常数信息）、带输出的状态机、图灵机（有无限纸带）。最后你会发现，有些问题<b>根本没有算法</b>——这不是技术不够，是逻辑上的不可能。',
  sections: [

{
  id:'13.1', title:'语言与文法',
  blocks:[
    {t:'lead', h:'要研究「计算的极限」，得先把「问题」变成精确的数学对象。办法是把问题看成<b>字符串的集合</b>。'},
    {t:'def', lb:'字母表与串', h:'<ul style="margin:4px 0 0"><li><b>字母表</b> <m>Σ</m>：非空有限符号集，如 <m>{0,1}</m> 或 <m>{a,b,c}</m>。</li><li><b>串</b>：字母的有限序列。<b>空串</b>记作 <m>λ</m>（或 <m>ε</m>）。</li><li><m>Σ<sup>*</sup></m>：由 <m>Σ</m> 中符号组成的所有串的集合，含空串。</li><li><b>语言</b>：<m>Σ<sup>*</sup></m> 的子集。</li></ul>'},
    {t:'p', h:'<b>为什么用语言建模问题？</b>因为任何「输入」都能编码成串：一个整数、一张图、一段程序，都能写成 0/1 串。于是「判定某类输入是否满足性质」就变成了「某个串是否属于某个语言」。'},
    {t:'def', lb:'文法', h:'<p>文法是一个四元组 <m>G = (V, T, S, P)</m>：</p><ul style="margin:6px 0 0"><li><m>V</m>：变量（非终结符）集合</li><li><m>T</m>：终结符集合（<m>V ∩ T = ∅</m>）</li><li><m>S</m>：起始符号</li><li><m>P</m>：产生式集合，形如 <m>A → w</m></li></ul>'},
    {t:'p', h:'从 <m>S</m> 出发，反复用产生式替换左边的变量，直到串里只剩终结符。这个过程叫<b>派生</b>，记作 <m>S ⇒* w</m>。文法生成的语言就是所有能派生出的串。'},
    {t:'p', h:'<b>例</b>：<m>S → 0S1</m>，<m>S → λ</m>。派生过程：<m>S ⇒ 0S1 ⇒ 00S11 ⇒ 0011</m>。这个文法生成的语言是'},
    {t:'f', h:'L(G) = { 0<sup>n</sup>1<sup>n</sup> | n ≥ 0 }'},
    {t:'p', h:'这个例子很重要：它<b>不是正则语言</b>。因为要数 0 的个数再配同样多的 1，需要「记住」数到几了——有限个状态做不到。这就是 13.2 节要讲的边界。'},
    {t:'p', h:'<b>BNF（巴科斯-诺尔范式）</b>是文法的工程写法，你在语言规范里见过：'},
    {t:'f', h:'⟨标识符⟩ ::= ⟨字母⟩ | ⟨标识符⟩⟨字母⟩ | ⟨标识符⟩⟨数字⟩', note:'变量用尖括号包起来，::= 代替 →'},
    {t:'p', h:'编程语言的语法就是这么定义的，编译器前端的第一步（词法、语法分析）就是在判断「这段代码能否由文法派生出来」。'},

    {t:'ex', title:'例 1　写一个文法', q:'写出生成「以 a 开头、后接任意个 b」的语言 <m>{ab<sup>n</sup> | n ≥ 0}</m> 的文法。',
      steps:[
        '起始符号必须产生一个 a。',
        '然后用一个递归变量产生任意个 b。',
        '<m>S → aA</m>，<m>A → bA</m>，<m>A → λ</m>。',
        '验证：<m>S ⇒ aA ⇒ abA ⇒ abbA ⇒ abb</m>。'
      ], ans:'<m>S → aA</m>；<m>A → bA | λ</m>'},

    {t:'exs', id:'13.1', items:[
      {q:'<m>Σ = {a,b}</m>，<m>Σ<sup>*</sup></m> 中有多少个长度为 3 的串？',
       hint:'每位两个选择。',
       steps:['每一位可取 a 或 b。','<m>2<sup>3</sup> = 8</m>。'],
       ans:'8 个'},
      {q:'文法 <m>S → SS | a | λ</m> 生成什么语言？',
       hint:'先看最短的串。',
       steps:['最短是 <m>λ</m> 和 <m>a</m>。','用 <m>S→SS</m> 可以拼接任意两个已有的串。','所以生成的是「任意个 a 组成的串」，含空串。'],
       ans:'<m>{a<sup>n</sup> | n ≥ 0}</m>'},
      {q:'为什么 <m>{0<sup>n</sup>1<sup>n</sup>}</m> 无法用正则表达式描述？',
       hint:'正则表达式没有「计数器」。',
       steps:['正则表达式只能表达「有限状态能记住的信息」。','要匹配 <m>0<sup>n</sup>1<sup>n</sup></m> 必须记住读了几个 0，<m>n</m> 无上界。','有限状态装不下无界计数。'],
       ans:'需要无界计数，超出有限状态能力'}
    ]}
  ]
},

{
  id:'13.2', title:'有限状态自动机',
  blocks:[
    {t:'lead', h:'有限状态自动机是<b>没有内存的机器</b>：它只能记住「我现在处于哪个状态」，而状态数固定。它的全部能力，就是在这张固定的图上走路。'},
    {t:'def', lb:'确定性有限自动机（DFA）', h:'<p>一个 DFA 是五元组 <m>M = (S, I, f, s<sub>0</sub>, F)</m>：</p><ul style="margin:6px 0 0"><li><m>S</m>：有限状态集</li><li><m>I</m>：输入字母表</li><li><m>f: S × I → S</m>：转移函数（每个状态每个输入<b>恰有一个</b>去向）</li><li><m>s<sub>0</sub></m>：起始状态</li><li><m>F ⊆ S</m>：接受状态集</li></ul>'},
    {t:'p', h:'<b>「确定性」的含义</b>：给定当前状态和当前输入，下一步去哪是唯一的。这也是它叫 DFA 的原因；允许「多个可能去向」的版本叫 NFA，两者识别能力其实相同。'},
    {t:'p', h:'读完整条输入串后，若停在接受状态，就说这个串被<b>接受</b>；否则被拒绝。一个 DFA 接受的所有串构成一个<b>正则语言</b>。'},
    {t:'w', id:'dfa'},
    {t:'p', h:'<b>怎么读状态图？</b>圆圈是状态，双圈是接受状态，箭头是转移，从「无处而来」的箭头指向起始状态。走完输入后看落在单圈还是双圈。'},
    {t:'h3', h:'常见任务的 DFA 设计'},
    {t:'table', head:['要识别的语言','需要记住什么','状态数'],
      rows:[
        ['1 的个数为偶数','当前是奇还是偶','2'],
        ['串中含有 01','还没见到 0 / 见到了 0 / 已出现 01','3'],
        ['被 3 整除（二进制）','当前余数 0、1、2','3'],
        ['以 00 结尾','末尾有几个连续的 0（0/1/2 个）','3']
      ]},
    {t:'p', h:'<b>设计方法</b>：问自己「读到一半时，我需要记住哪些信息才能继续判断」。记住的信息就是状态。<b>需要的状态数 = 需要区分的情形数</b>。'},
    {t:'p', h:'<b>它的极限在哪？</b>有限状态机无法完成「配对计数」——比如 <m>0<sup>n</sup>1<sup>n</sup></m>、括号匹配、回文判断。因为这些任务要求记住一个无上界的数，而状态数必须固定。这不是设计得不好，是原理上不可能。'},

    {t:'ex', title:'例 1　偶数个 1', q:'设计 DFA，识别「含有偶数个 1」的二进制串。',
      steps:[
        '只需记住当前 1 的个数是奇还是偶，两个状态。',
        '<m>s<sub>0</sub></m>（偶，起始且接受），<m>s<sub>1</sub></m>（奇）。',
        '读 0：状态不变。读 1：在 <m>s<sub>0</sub></m> 与 <m>s<sub>1</sub></m> 之间切换。',
        '空串也含 0 个 1（偶数），所以 <m>s<sub>0</sub></m> 是接受状态。'
      ], ans:'两状态，读 1 翻转，读 0 保持'},

    {t:'exs', id:'13.2', items:[
      {q:'设计 DFA 识别「以 01 结尾」的串，需要几个状态？',
       hint:'记住末尾匹配了几位。',
       steps:['状态 0：末尾没有匹配任何前缀。','状态 1：末尾是 0。','状态 2：末尾已是 01（接受）。','读 0 从状态 1 回状态 1，读 1 从状态 1 进状态 2。'],
       ans:'3 个状态'},
      {q:'为什么 DFA 无法识别括号是否配对？',
       hint:'嵌套层数有上界吗？',
       steps:['配对要求记住当前嵌套深度。','深度可以是任意大，没有上界。','有限状态数装不下无界深度。'],
       ans:'嵌套深度无界，超出有限状态'},
      {q:'一个 DFA 有 3 个状态、字母表 <m>{0,1}</m>，转移表最多有多少个条目？',
       hint:'每个状态每种输入一项。',
       steps:['<m>3 × 2 = 6</m>。','每一项都必须有定义（DFA 要求完全）。'],
       ans:'6 项'}
    ]}
  ]
},

{
  id:'13.3', title:'带输出的有限状态机',
  blocks:[
    {t:'lead', h:'DFA 只回答「接不接受」。很多实际系统需要<b>输出</b>：售货机要出货，电梯要开门，协议要回包。于是有了带输出的版本。'},
    {t:'table', head:['类型','输出取决于','典型场景'],
      rows:[
        ['Moore 机','当前<b>状态</b>','状态本身就是输出，如交通灯'],
        ['Mealy 机','当前状态 + <b>输入</b>','输入触发动作，如售货机'],
        ['DFA','无输出，只有接受/拒绝','语言识别']
      ]},
    {t:'p', h:'<b>Moore 机</b>：每个状态挂一个输出值，读入改变状态，输出随之改变。形式上是 <m>(S, I, O, f, g, s<sub>0</sub>)</m>，其中 <m>g: S → O</m>。'},
    {t:'p', h:'<b>Mealy 机</b>：输出挂在<b>转移</b>上，形式是 <m>g: S × I → O</m>。同一条转移，输入不同则输出不同。'},
    {t:'p', h:'<b>例：自动售货机</b>（Mealy）。状态表示「已投多少钱」：0 元、5 元、10 元。投 5 元从 0 到 5，不输出；从 5 到 10，不输出；在 10 元状态再投 5 元，输出「出货 + 找零」。这就是一个三状态的 Mealy 机。'},
    {t:'p', h:'<b>例：电梯</b>（Moore）。状态是楼层，输出是「当前楼层显示」。按键改变状态，显示跟着变。'},
    {t:'p', h:'两种模型<b>表达能力相同</b>：任何 Moore 机都能转成等价的 Mealy 机，反之亦然（Mealy 转 Moore 可能要多一个状态来记住上一次的输入）。选择哪种只看哪种写起来自然。'},
    {t:'tip', h:'<p>状态机不只是理论。TCP 连接就是一个状态机（LISTEN / SYN-SENT / ESTABLISHED / FIN-WAIT…），正则表达式引擎是 NFA 的模拟，游戏里的 AI 行为树本质也是状态机。</p><p>凡是有「记住当前处境、按输入切换」的需求，状态机就是最简模型。</p>'},

    {t:'ex', title:'例 1　串检测器', q:'设计一个 Mealy 机，读二进制串，每当刚读到的两位是 01 时输出 1，否则输出 0。',

<tr><td><m>Σ<sub>k=1</sub><sup>n</sup> k</m></td><td><m>n(n+1)/2</m></td></tr>
<tr><td><m>Σ<sub>k=1</sub><sup>n</sup> k<sup>2</sup></m></td><td><m>n(n+1)(2n+1)/6</m></td></tr>
<tr><td><m>Σ<sub>k=1</sub><sup>n</sup> k<sup>3</sup></m></td><td><m>[n(n+1)/2]<sup>2</sup></m></td></tr>
<tr><td><m>Σ<sub>k=1</sub><sup>n</sup> (2k−1)</m></td><td><m>n<sup>2</sup></m></td></tr>
<tr><td><m>Σ<sub>k=0</sub><sup>n</sup> ar<sup>k</sup></m></td><td><m>a(r<sup>n+1</sup>−1)/(r−1)</m>，<m>r≠1</m></td></tr>
</tbody></table>

<h3>基数</h3>
<table class="tbl dense"><thead><tr><th style="width:110px">概念</th><th>内容</th></tr></thead><tbody>
<tr><td>等势</td><td>存在 <m>A→B</m> 的双射，记 <m>|A|=|B|</m></td></tr>
<tr><td>可数</td><td>有限，或与 <m>ℤ<sup>+</sup></m> 等势（能排队列举）</td></tr>
<tr><td>典型结论</td><td><m>ℤ</m>、<m>ℚ</m>、偶数集都可数；<m>ℝ</m>、<m>(0,1)</m>、0-1 无限序列集不可数</td></tr>
<tr><td>康托定理</td><td><m>|P(A)| &gt; |A|</m>，对无限集也成立</td></tr>
</tbody></table>
`},

{ n:3, title:'计数', tag:'四大公式、鸽巢、二项式、隔板法', html: `
<h3 style="margin-top:0">★ 四公式总表（最高频）</h3>
<table class="tbl dense"><thead><tr><th style="width:104px"></th><th style="width:44%">不重复</th><th style="width:44%">可重复</th></tr></thead><tbody>
<tr><td><b>有序</b></td><td><m>P(n,r) = <span class="frac"><span>n!</span><span>(n−r)!</span></span></m><br><span style="font-size:12px;color:var(--muted)">排队、排名、职务分配</span></td>
<td><m>n<sup>r</sup></m><br><span style="font-size:12px;color:var(--muted)">密码、编号、字符串</span></td></tr>
<tr><td><b>无序</b></td><td><m>C(n,r) = <span class="frac"><span>n!</span><span>r!(n−r)!</span></span></m><br><span style="font-size:12px;color:var(--muted)">选小组、选菜</span></td>
<td><m>C(n+r−1, r)</m><br><span style="font-size:12px;color:var(--muted)">买几个、非负整数解</span></td></tr>
</tbody></table>
<p class="kv" style="color:var(--muted)">桥梁：<m>P(n,r) = C(n,r)·r!</m>　　<b>做题先问两句：顺序算不算不同？能不能重复？</b></p>

<h3>基本原理</h3>
<table class="tbl dense"><thead><tr><th style="width:110px">原理</th><th>内容</th><th style="width:130px">识别信号</th></tr></thead><tbody>
<tr><td>加法原理</td><td>分成 <b>互斥</b> 的几类，各类相加</td><td>「或」「分几种情况」</td></tr>
<tr><td>乘法原理</td><td>分成 <b>依次</b> 的几步，各步相乘</td><td>「先…再…」</td></tr>
<tr><td>鸽巢原理</td><td><m>n</m> 物入 <m>m</m> 盒 ⟹ 必有盒 ≥ <m>⌈n/m⌉</m> 个</td><td>「至少有一个」「必然存在」</td></tr>
<tr><td>容斥（两集）</td><td><m>|A∪B| = |A|+|B|−|A∩B|</m></td><td>「至少满足一个」</td></tr>
</tbody></table>

<h3>二项式与组合恒等式</h3>
<table class="tbl dense"><thead><tr><th style="width:130px">名称</th><th>公式</th></tr></thead><tbody>
<tr><td>二项式定理</td><td><m>(x+y)<sup>n</sup> = Σ<sub>k=0</sub><sup>n</sup> C(n,k) x<sup>n−k</sup> y<sup>k</sup></m></td></tr>
<tr><td>对称</td><td><m>C(n,k) = C(n,n−k)</m></td></tr>
<tr><td>帕斯卡</td><td><m>C(n,k) = C(n−1,k−1) + C(n−1,k)</m></td></tr>
<tr><td>求和</td><td><m>Σ<sub>k=0</sub><sup>n</sup> C(n,k) = 2<sup>n</sup></m></td></tr>
<tr><td>范德蒙德</td><td><m>C(m+n,r) = Σ<sub>k</sub> C(m,k)·C(n,r−k)</m></td></tr>
<tr><td>常考特例</td><td><m>C(2n,n) = Σ<sub>k</sub> C(n,k)<sup>2</sup></m></td></tr>
</tbody></table>

<h3>3.5 广义计数</h3>
<table class="tbl dense"><thead><tr><th style="width:150px">情形</th><th>公式</th></tr></thead><tbody>
<tr><td>有重复排列</td><td><m>n<sup>r</sup></m>（<m>r</m> 可大于 <m>n</m>）</td></tr>
<tr><td>有重复组合</td><td><m>C(n+r−1, r)</m>；等价于 <m>x₁+…+x<sub>n</sub>=r</m> 的非负整数解</td></tr>
<tr><td>非负整数解</td><td><m>C(n+r−1, r)</m></td></tr>
<tr><td>正整数解</td><td><m>C(r−1, n−1)</m>（每个先垫 1，令 <m>yᵢ=xᵢ−1</m>）</td></tr>
<tr><td>不可区分物体排列</td><td><m><span class="frac"><span>n!</span><span>n₁!n₂!⋯n<sub>k</sub>!</span></span></m>（如 MISSISSIPPI = 34650）</td></tr>
</tbody></table>

<h3>★ 3.5.5 放入盒子（<m>m</m> 物、<m>n</m> 盒）</h3>
<table class="tbl dense"><thead><tr><th style="width:118px"></th><th style="width:44%">盒子可区分</th><th>盒子不可区分</th></tr></thead><tbody>
<tr><td><b>物体可区分</b></td><td>允许空：<m>n<sup>m</sup></m><br>非空：<m>Σ<sub>k=0</sub><sup>n</sup>(−1)<sup>k</sup>C(n,k)(n−k)<sup>m</sup></m></td>
<td>允许空：<m>Σ<sub>k≤n</sub>S(m,k)</m><br>非空：<m>S(m,n)</m>（第二类 Stirling）</td></tr>
<tr><td><b>物体不可区分</b></td><td>允许空：<m>C(n+m−1, m)</m><br>非空：<m>C(m−1, n−1)</m></td>
<td>允许空：分拆成 ≤ n 部分<br>非空：分拆恰 n 部分</td></tr>
</tbody></table>
<p class="kv" style="color:var(--muted)">判据：物体看「有没有编号」，盒子看「有没有名字」。「分成 3 组」（无名字，S(5,3)=25）≠「住进 3 个房间」（有编号，150），差 <m>3!</m> 倍。</p>

<h3>生成排列与组合</h3>
<table class="tbl dense"><thead><tr><th style="width:130px">内容</th><th>要点</th></tr></thead><tbody>
<tr><td>下一个排列</td><td>① 从右找第一对 <m>a<sub>i</sub>&lt;a<sub>i+1</sub></m>；② 从右找首个 <m>&gt;a<sub>i</sub></m>；③ 交换；④ 反转 <m>i</m> 之后</td></tr>
<tr><td>生成组合</td><td>位串法，<m>n</m> 位二进制从 <m>00…0</m> 到 <m>11…1</m>，共 <m>2<sup>n</sup></m> 个</td></tr>
</tbody></table>
`},

{ n:4, title:'高级计数', tag:'递推、分治、生成函数、容斥', html: `
<h3 style="margin-top:0">线性齐次递推</h3>
<table class="tbl dense"><thead><tr><th style="width:110px">形式</th><th>解法</th></tr></thead><tbody>
<tr><td>特征方程</td><td><m>a<sub>n</sub> = pa<sub>n−1</sub> + qa<sub>n−2</sub></m> → <m>r<sup>2</sup> − pr − q = 0</m></td></tr>
<tr><td>两根相异</td><td><m>a<sub>n</sub> = αr₁<sup>n</sup> + βr₂<sup>n</sup></m></td></tr>
<tr><td>重根 <m>r</m></td><td><m>a<sub>n</sub> = (α + βn)r<sup>n</sup></m></td></tr>
<tr><td>非齐次</td><td>齐次通解 + 一个特解（先猜常数，代回定值）</td></tr>
<tr><td>初值</td><td>必给前 <m>k</m> 项，否则序列不唯一</td></tr>
</tbody></table>
<p class="kv" style="color:var(--muted)">斐波那契 <m>f<sub>n</sub> = (φ<sup>n</sup>−ψ<sup>n</sup>)/√5</m>，<m>φ=(1+√5)/2</m>。汉诺塔 <m>H(n)=2H(n−1)+1 ⟹ 2<sup>n</sup>−1</m>。</p>

<h3>分治递推与主定理</h3>
<table class="tbl dense"><thead><tr><th style="width:150px">内容</th><th>公式 / 结论</th></tr></thead><tbody>
<tr><td>标准形式</td><td><m>f(n) = a·f(n/b) + O(n<sup>d</sup>)</m></td></tr>
<tr><td><m>a &lt; b<sup>d</sup></m></td><td><m>O(n<sup>d</sup>)</m>（合并主导）</td></tr>
<tr><td><m>a = b<sup>d</sup></m></td><td><m>O(n<sup>d</sup> log n)</m>（如归并排序）</td></tr>
<tr><td><m>a &gt; b<sup>d</sup></m></td><td><m>O(n<sup>log<sub>b</sub>a</sup>)</m>（递归主导）</td></tr>
<tr><td>二分查找</td><td><m>f(n)=f(n/2)+1 ⟹ O(log n)</m></td></tr>
</tbody></table>

<h3>生成函数</h3>
<table class="tbl dense"><thead><tr><th style="width:180px">生成函数</th><th>对应序列</th></tr></thead><tbody>
<tr><td><m>1/(1−x)</m></td><td><m>1,1,1,1,…</m></td></tr>
<tr><td><m>1/(1−ax)</m></td><td><m>1,a,a<sup>2</sup>,a<sup>3</sup>,…</m></td></tr>
<tr><td><m>1/(1−x)<sup>2</sup></m></td><td><m>1,2,3,4,…</m>（第 n 项 = n+1）</td></tr>
<tr><td><m>(1+x)<sup>n</sup></m></td><td><m>C(n,0),C(n,1),…,C(n,n)</m></td></tr>
</tbody></table>
<p class="kv" style="color:var(--muted)">用法：每类物品一个因子，<m>x<sup>k</sup></m> 的系数就是「取 k 个」的方案数；有上限就截断因子。</p>

<h3>容斥与两个经典应用</h3>
<table class="tbl dense"><thead><tr><th style="width:120px">内容</th><th>公式</th></tr></thead><tbody>
<tr><td>一般式</td><td><m>|A₁∪…∪A<sub>n</sub>| = Σ|A<sub>i</sub>| − Σ|A<sub>i</sub>∩A<sub>j</sub>| + Σ|A<sub>i</sub>∩A<sub>j</sub>∩A<sub>k</sub>| − …</m></td></tr>
<tr><td>符号规律</td><td>奇数个集合的交取 <b>+</b>，偶数个取 <b>−</b></td></tr>
<tr><td>满射个数</td><td><m>Σ<sub>k=0</sub><sup>n</sup>(−1)<sup>k</sup>C(n,k)(n−k)<sup>m</sup></m></td></tr>
<tr><td>错排</td><td><m>D<sub>n</sub> = n!(1 − 1/1! + 1/2! − … + (−1)<sup>n</sup>/n!) ≈ n!/e</m></td></tr>
<tr><td>错排前几项</td><td><m>D₁=0, D₂=1, D₃=2, D₄=9, D₅=44, D₆=265</m></td></tr>
</tbody></table>
`},

{ n:5, title:'关系', tag:'性质、闭包、等价、偏序', html: `
<h3 style="margin-top:0">★ 五条性质（判断的核心）</h3>
<table class="tbl dense"><thead><tr><th style="width:80px">性质</th><th>定义</th><th>矩阵上</th><th>图上看</th></tr></thead><tbody>
<tr><td>自反</td><td><m>∀a, aRa</m></td><td>对角线全 1</td><td>每点有自环</td></tr>
<tr><td>反自反</td><td><m>∀a, ¬aRa</m></td><td>对角线全 0</td><td>无自环</td></tr>
<tr><td>对称</td><td><m>aRb ⟹ bRa</m></td><td>关于对角线对称</td><td>边都是双向</td></tr>
<tr><td>反对称</td><td><m>aRb∧bRa ⟹ a=b</m></td><td>无对称的 1 对</td><td>互异点间无双向边</td></tr>
<tr><td>传递</td><td><m>aRb∧bRc ⟹ aRc</m></td><td><m>M<sup>2</sup> ≤ M</m></td><td>接力必有直达边</td></tr>
</tbody></table>
<p class="kv" style="color:var(--muted)"><b>反对称 ≠ 不对称</b>。「≤」既自反又反对称，完全合法。</p>

<h3>闭包</h3>
<table class="tbl dense"><thead><tr><th style="width:110px">闭包</th><th>公式</th><th>操作</th></tr></thead><tbody>
<tr><td>自反闭包</td><td><m>r(R) = R ∪ I<sub>A</sub></m></td><td>补对角线</td></tr>
<tr><td>对称闭包</td><td><m>s(R) = R ∪ R<sup>−1</sup></m></td><td>补反向边</td></tr>
<tr><td>传递闭包</td><td><m>t(R) = R ∪ R<sup>2</sup> ∪ … ∪ R<sup>n</sup></m></td><td>Warshall，<m>O(n<sup>3</sup>)</m></td></tr>
</tbody></table>
<p class="kv" style="color:var(--muted)">Warshall：<code>W[i][j] |= W[i][k] &amp;&amp; W[k][j]</code>，逐列当中间点。与 Floyd 同骨架。</p>

<h3>等价关系</h3>
<table class="tbl dense"><thead><tr><th style="width:120px">要点</th><th>内容</th></tr></thead><tbody>
<tr><td>定义</td><td>自反 + 对称 + 传递</td></tr>
<tr><td>等价类</td><td><m>[a] = {x | xRa}</m></td></tr>
<tr><td>基本定理</td><td>等价关系 ⟺ 集合的一个<b>划分</b>；<m>[a]∩[b]=∅</m> 或 <m>[a]=[b]</m></td></tr>
<tr><td>计数</td><td><m>n</m> 元集上等价关系个数 = Bell 数 <m>B<sub>n</sub> = ΣS(n,k)</m></td></tr>
</tbody></table>

<h3>偏序</h3>
<table class="tbl dense"><thead><tr><th style="width:110px">要点</th><th>内容</th></tr></thead><tbody>
<tr><td>定义</td><td>自反 + 反对称 + 传递</td></tr>
<tr><td>全序</td><td>任意两元素都能比较（「≤」是；「整除」不是）</td></tr>
<tr><td>哈斯图</td><td>去自环、去传递边、方向统一朝上</td></tr>
<tr><td>极大 / 最大</td><td>极大：上面没人了（可多个）；最大：比所有都大（唯一）</td></tr>
<tr><td>极小 / 最小</td><td>同理，方向相反</td></tr>
</tbody></table>
`},

{ n:6, title:'图', tag:'握手、欧拉、最短路、平面、着色', html: `
<h3 style="margin-top:0">★ 握手定理</h3>
<div class="f" style="margin:6px 0">Σ<sub>v∈V</sub> deg(v) = 2|E|</div>
<p class="kv" style="color:var(--muted)">推论：<b>奇数度顶点必为偶数个</b>。常用于快速否定「不存在这样的图」。</p>

<h3>特殊图的边数 / 度数</h3>
<table class="tbl dense"><thead><tr><th style="width:130px">图</th><th>顶点</th><th>边数</th><th>每点度</th></tr></thead><tbody>
<tr><td>完全图 <m>K<sub>n</sub></m></td><td><m>n</m></td><td><m>n(n−1)/2</m></td><td><m>n−1</m></td></tr>
<tr><td>圈图 <m>C<sub>n</sub></m></td><td><m>n</m></td><td><m>n</m></td><td>2</td></tr>
<tr><td>轮图 <m>W<sub>n</sub></m></td><td><m>n+1</m></td><td><m>2n</m></td><td>中心 <m>n</m>，其余 3</td></tr>
<tr><td>立方体 <m>Q<sub>n</sub></m></td><td><m>2<sup>n</sup></m></td><td><m>n·2<sup>n−1</sup></m></td><td><m>n</m></td></tr>
<tr><td>完全二分 <m>K<sub>m,n</sub></m></td><td><m>m+n</m></td><td><m>mn</m></td><td>—</td></tr>
</tbody></table>
<p class="kv" style="color:var(--muted)">二分图判定：<b>不含奇圈</b>。连通图边数下界 <m>n−1</m>。</p>

<h3>欧拉 vs 哈密顿</h3>
<table class="tbl dense"><thead><tr><th></th><th>欧拉（走遍所有<b>边</b>）</th><th>哈密顿（走遍所有<b>点</b>）</th></tr></thead><tbody>
<tr><td>判定</td><td>有简单充要条件</td><td>无已知充要条件（NP 完全）</td></tr>
<tr><td>回路条件</td><td>连通且<b>所有</b>顶点度数为偶</td><td>狄拉克：<m>deg(v) ≥ n/2</m>（充分不必要）</td></tr>
<tr><td>通路条件</td><td>连通且<b>恰好 2 个</b>奇度顶点</td><td>—</td></tr>
</tbody></table>

<h3>最短路</h3>
<table class="tbl dense"><thead><tr><th style="width:110px">算法</th><th>适用</th><th>复杂度</th></tr></thead><tbody>
<tr><td>Dijkstra</td><td>单源，<b>边权非负</b>，贪心</td><td><m>O(E log V)</m></td></tr>
<tr><td>Bellman-Ford</td><td>单源，可含负权，能查负环</td><td><m>O(VE)</m></td></tr>
<tr><td>Floyd</td><td>全源，可含负权（无负环）</td><td><m>O(V<sup>3</sup>)</m></td></tr>
</tbody></table>

<h3>平面图</h3>
<table class="tbl dense"><thead><tr><th style="width:130px">结论</th><th>公式</th></tr></thead><tbody>
<tr><td>欧拉公式</td><td><m>V − E + F = 2</m>（连通平面图，<m>F</m> 含外部面）</td></tr>
<tr><td>边数上界</td><td><m>V ≥ 3</m> 的简单平面图：<m>E ≤ 3V − 6</m></td></tr>
<tr><td>无三角形</td><td><m>E ≤ 2V − 4</m></td></tr>
<tr><td>非平面</td><td><m>K<sub>5</sub></m>（<m>10 &gt; 9</m>）、<m>K<sub>3,3</sub></m>（<m>9 &gt; 8</m>）；库拉托夫斯基定理</td></tr>
</tbody></table>

<h3>图着色</h3>
<table class="tbl dense"><thead><tr><th style="width:130px">图</th><th>色数 <m>χ</m></th></tr></thead><tbody>
<tr><td>二分图 / 树 / 偶圈</td><td>≤ 2</td></tr>
<tr><td>奇圈 <m>C<sub>2k+1</sub></m></td><td>3</td></tr>
<tr><td>完全图 <m>K<sub>n</sub></m></td><td><m>n</m></td></tr>
<tr><td>平面图</td><td>≤ 4（四色定理）</td></tr>
<tr><td>贪心上界</td><td><m>Δ + 1</m>（<m>Δ</m> 为最大度数）</td></tr>
</tbody></table>
`},

{ n:7, title:'树', tag:'等价刻画、遍历、生成树', html: `
<h3 style="margin-top:0">★ 树的等价刻画（<m>n</m> 个顶点）</h3>
<table class="tbl dense"><thead><tr><th style="width:40px">#</th><th>命题</th></tr></thead><tbody>

<h3>计数与遍历</h3>
<table class="tbl dense"><thead><tr><th style="width:150px">内容</th><th>结论</th></tr></thead><tbody>
<tr><td>满 <m>m</m> 叉树叶子数</td><td><m>l = (m−1)i + 1</m>（<m>i</m> 为内部顶点数）</td></tr>
<tr><td>前序</td><td>根 → 左 → 右（复制树、前缀表达式）</td></tr>
<tr><td>中序</td><td>左 → 根 → 右（BST 得升序）</td></tr>
<tr><td>后序</td><td>左 → 右 → 根（释放内存、后缀表达式）</td></tr>
<tr><td>还原</td><td>前序 + 中序可唯一确定；<b>前序 + 后序不行</b></td></tr>
</tbody></table>

<h3>生成树</h3>
<table class="tbl dense"><thead><tr><th style="width:150px">内容</th><th>结论</th></tr></thead><tbody>
<tr><td>存在性</td><td>图有生成树 ⟺ 图连通</td></tr>
<tr><td>边数</td><td>任何生成树恰 <m>n−1</m> 条边</td></tr>
<tr><td>完全图</td><td><m>K<sub>n</sub></m> 有 <m>n<sup>n−2</sup></m> 棵生成树（凯莱）</td></tr>
<tr><td>Kruskal</td><td>按边权升序，不成环就选；并查集；<m>O(E log E)</m>，适合稀疏图</td></tr>
<tr><td>Prim</td><td>从一点扩，每次选连出去的最小边；<m>O(E log V)</m>，适合稠密图</td></tr>
<tr><td>MST 唯一性</td><td>可能不唯一，但<b>总权值一定相同</b></td></tr>
</tbody></table>
`},

{ n:8, title:'布尔代数', tag:'恒等式、范式、门电路、卡诺图', html: `
<h3 style="margin-top:0">★ 布尔恒等式</h3>
<table class="tbl dense"><thead><tr><th style="width:90px">名称</th><th>等式</th></tr></thead><tbody>
<tr><td>同一律</td><td><m>x+0=x</m>　　<m>x·1=x</m></td></tr>
<tr><td>支配律</td><td><m>x+1=1</m>　　<m>x·0=0</m></td></tr>
<tr><td>幂等律</td><td><m>x+x=x</m>　　<m>x·x=x</m></td></tr>
<tr><td>互补律</td><td><m>x+x̄=1</m>　　<m>x·x̄=0</m></td></tr>
<tr><td>德摩根</td><td><m><span style="text-decoration:overline">x+y</span> = x̄·ȳ</m>　　<m><span style="text-decoration:overline">x·y</span> = x̄+ȳ</m></td></tr>
<tr><td>分配律</td><td><m>x·(y+z) = x·y + x·z</m>　　<m>x+(y·z) = (x+y)(x+z)</m></td></tr>
</tbody></table>
<p class="kv" style="color:var(--muted)">与命题逻辑同构：<m>+→∨</m>、<m>·→∧</m>、<m>0→F</m>、<m>1→T</m>。</p>

<h3>两种标准形式</h3>
<table class="tbl dense"><thead><tr><th style="width:110px">形式</th><th>构造</th><th>何时更短</th></tr></thead><tbody>
<tr><td>积之和 DNF</td><td>每个 1 行写一个小项（1 写原变量、0 写反变量，相乘），全部相加</td><td>1 少 0 多</td></tr>
<tr><td>和之积 CNF</td><td>每个 0 行写一个大项（0 写原变量、1 写反变量，相加），全部相乘</td><td>0 少 1 多</td></tr>
<tr><td>函数总数</td><td><m>n</m> 个变量共 <m>2<sup>2<sup>n</sup></sup></m> 个布尔函数</td><td>双指数增长</td></tr>
</tbody></table>

<h3>门电路与完备性</h3>
<table class="tbl dense"><thead><tr><th style="width:110px">结论</th><th>内容</th></tr></thead><tbody>
<tr><td>基本门</td><td>NOT <m>x̄</m>、AND <m>x·y</m>、OR <m>x+y</m>、XOR <m>x⊕y</m>、NAND <m><span style="text-decoration:overline">x·y</span></m>、NOR <m><span style="text-decoration:overline">x+y</span></m></td></tr>
<tr><td>功能完备</td><td><m>{¬,∧,∨}</m>、<m>{¬,∧}</m>、<m>{¬,∨}</m>、<b>单独 NAND</b>、<b>单独 NOR</b></td></tr>
<tr><td>NAND 造非</td><td><m>x̄ = x ↑ x</m></td></tr>
<tr><td>NAND 造与</td><td><m>x·y = (x ↑ y) ↑ (x ↑ y)</m></td></tr>
<tr><td>NAND 造或</td><td><m>x+y = x̄ ↑ ȳ</m></td></tr>
</tbody></table>

<h3>卡诺图合并规则</h3>
<table class="tbl dense"><thead><tr><th style="width:130px">圈住 1 的个数</th><th>消去变量数</th></tr></thead><tbody>
<tr><td>2 个相邻</td><td>1 个</td></tr>
<tr><td>4 个（1×4 或 2×2）</td><td>2 个</td></tr>
<tr><td>8 个</td><td>3 个</td></tr>
<tr><td colspan="2"><b>边界环绕</b>：最左列与最右列相邻，最上行与最下行相邻（格雷码首尾只差一位）</td></tr>
</tbody></table>
<p class="kv" style="color:var(--muted)">步骤：格雷码排表 → 填 1 → 圈尽可能大的 2 的幂方块（可重叠）→ 每圈写一项 → 相加。</p>
`},

{ n:9, title:'算法', tag:'复杂度、查找、排序、设计策略', html: `
<h3 style="margin-top:0">★ 三种渐近记号</h3>
<table class="tbl dense"><thead><tr><th style="width:90px">记号</th><th>含义</th><th>类比</th></tr></thead><tbody>
<tr><td><m>f = O(g)</m></td><td>从某个 n 起，<m>f</m> 不超过 <m>g</m> 的常数倍（上界）</td><td>≤</td></tr>
<tr><td><m>f = Ω(g)</m></td><td><m>f</m> 不低于 <m>g</m> 的常数倍（下界）</td><td>≥</td></tr>
<tr><td><m>f = Θ(g)</m></td><td>上下界同阶</td><td>=</td></tr>
<tr><td><m>f = o(g)</m></td><td>增长严格更慢</td><td>&lt;</td></tr>
</tbody></table>
<p class="kv" style="color:var(--muted)">用法：只留最高阶项、去掉系数。<m>3n<sup>2</sup>+5n+2 = O(n<sup>2</sup>)</m>。</p>

<h3>常见增长（从慢到快）</h3>
<div class="f" style="margin:6px 0">1 &lt; log n &lt; √n &lt; n &lt; n log n &lt; n² &lt; n³ &lt; 2ⁿ &lt; n!</div>
<table class="tbl dense"><thead><tr><th>复杂度</th><th>n=1000</th><th>每秒十亿次可处理</th></tr></thead><tbody>
<tr><td><m>log<sub>2</sub>n</m></td><td>10</td><td>规模几乎无上限</td></tr>
<tr><td><m>n log<sub>2</sub>n</m></td><td>约 10<sup>4</sup></td><td>约 4×10<sup>7</sup></td></tr>
<tr><td><m>n<sup>2</sup></m></td><td>10<sup>6</sup></td><td>约 3×10<sup>4</sup></td></tr>
<tr><td><m>n<sup>3</sup></m></td><td>10<sup>9</sup></td><td>约 1000</td></tr>
<tr><td><m>2<sup>n</sup></m></td><td>10<sup>301</sup></td><td>约 30</td></tr>
<tr><td><m>n!</m></td><td>—</td><td>约 12</td></tr>
</tbody></table>

<h3>查找与排序</h3>
<table class="tbl dense"><thead><tr><th style="width:110px">算法</th><th>最坏代价</th><th>关键前提 / 特点</th></tr></thead><tbody>
<tr><td>线性查找</td><td><m>O(n)</m></td><td>无需有序</td></tr>
<tr><td>二分查找</td><td><m>O(log n)</m>，<m>⌊log<sub>2</sub>n⌋+1</m> 次比较</td><td><b>必须已排序</b></td></tr>
<tr><td>冒泡 / 插入</td><td><m>O(n<sup>2</sup>)</m>，<m>n(n−1)/2</m> 次比较</td><td>插入排序在近乎有序时 <m>O(n)</m></td></tr>
<tr><td>归并排序</td><td><m>O(n log n)</m></td><td>稳定，需额外空间</td></tr>
<tr><td>快速排序</td><td>平均 <m>O(n log n)</m>，最坏 <m>O(n<sup>2</sup>)</m></td><td>原地，但需选好基准</td></tr>
<tr><td>比较排序下界</td><td><m>Ω(n log n)</m></td><td>由 <m>log<sub>2</sub>(n!)</m> 推出</td></tr>
</tbody></table>

<h3>四种设计策略</h3>
<table class="tbl dense"><thead><tr><th style="width:90px">策略</th><th>适用信号</th><th>典型例子</th></tr></thead><tbody>
<tr><td>贪心</td><td>局部最优能推出全局最优</td><td>活动选择、Huffman、MST</td></tr>
<tr><td>分治</td><td>子问题同型且互不重叠</td><td>归并排序、快速幂</td></tr>
<tr><td>动态规划</td><td>子问题重复、有最优子结构</td><td>斐波那契、背包、编辑距离</td></tr>
<tr><td>回溯</td><td>需要枚举可行解</td><td>八皇后、数独</td></tr>
</tbody></table>
<p class="kv" style="color:var(--muted)">P：多项式时间可解；NP：多项式时间可验证。<m>P ⊆ NP</m>，是否相等未解。</p>
`},

{ n:10, title:'数论与密码学', tag:'整除、gcd、同余、CRT、RSA', html: `
<h3 style="margin-top:0">★ 同余与运算</h3>
<table class="tbl dense"><thead><tr><th style="width:110px">概念</th><th>内容</th></tr></thead><tbody>
<tr><td>整除</td><td><m>a|b ⟺ ∃c, b=ac</m></td></tr>
<tr><td>带余除法</td><td><m>a = qm + r</m>，<m>0 ≤ r &lt; m</m>，<m>q,r</m> 唯一</td></tr>
<tr><td>同余</td><td><m>a ≡ b (mod m) ⟺ m | (a−b)</m></td></tr>
<tr><td>可加减乘</td><td><m>a+c ≡ b+d</m>，<m>ac ≡ bd</m>，<m>a<sup>k</sup> ≡ b<sup>k</sup></m></td></tr>
<tr><td>除法</td><td><b>仅当除数与模互素</b>才能约</td></tr>
<tr><td>大指数降幂</td><td>先找周期（费马 / 欧拉），再把指数折回小范围</td></tr>
</tbody></table>

<h3>gcd 与欧几里得</h3>
<table class="tbl dense"><thead><tr><th style="width:130px">结论</th><th>内容</th></tr></thead><tbody>
<tr><td>辗转相除</td><td><m>gcd(a,b) = gcd(b, a mod b)</m>，余数为 0 时除数即 gcd</td></tr>
<tr><td>复杂度</td><td><m>O(log min(a,b))</m></td></tr>
<tr><td>贝祖定理</td><td><m>sa + tb = gcd(a,b)</m>，扩展欧几里得可求 <m>s,t</m></td></tr>
<tr><td>逆元存在</td><td><m>a</m> 在模 <m>m</m> 下可逆 <m>⟺ gcd(a,m)=1</m></td></tr>
<tr><td>算术基本定理</td><td>每个 <m>n&gt;1</m> 唯一分解为素数幂乘积</td></tr>
<tr><td>gcd / lcm</td><td>取最小 / 最大指数；<m>gcd·lcm = ab</m></td></tr>
</tbody></table>

<h3>线性同余与 CRT</h3>
<table class="tbl dense"><thead><tr><th style="width:130px">结论</th><th>内容</th></tr></thead><tbody>
<tr><td>有解条件</td><td><m>ax ≡ b (mod m)</m> 有解 <m>⟺ gcd(a,m) | b</m></td></tr>
<tr><td>解的个数</td><td>有解时在模 <m>m</m> 下恰有 <m>gcd(a,m)</m> 个</td></tr>
<tr><td>解法</td><td>同除 <m>d=gcd</m> → 求逆元 → 乘到右边 → 加 <m>m/d</m> 的倍数</td></tr>
<tr><td>CRT</td><td>模数两两互素时，方程组在模 <m>M=∏m<sub>i</sub></m> 下解唯一</td></tr>
<tr><td>构造</td><td><m>x = Σ a<sub>i</sub>M<sub>i</sub>y<sub>i</sub></m>，<m>M<sub>i</sub>=M/m<sub>i</sub></m>，<m>y<sub>i</sub></m> 是 <m>M<sub>i</sub></m> 模 <m>m<sub>i</sub></m> 的逆</td></tr>
</tbody></table>

<h3>★ RSA</h3>
<table class="tbl dense"><thead><tr><th style="width:110px">步骤</th><th>内容</th></tr></thead><tbody>
<tr><td>1 选素数</td><td>取大素数 <m>p, q</m></td></tr>
<tr><td>2 算模数</td><td><m>n=pq</m>；<m>φ(n)=(p−1)(q−1)</m> 保密</td></tr>
<tr><td>3 公钥 e</td><td><m>gcd(e, φ(n))=1</m>，常用 65537</td></tr>
<tr><td>4 私钥 d</td><td><m>ed ≡ 1 (mod φ(n))</m></td></tr>
<tr><td>5 加密</td><td><m>C = M<sup>e</sup> mod n</m></td></tr>
<tr><td>6 解密</td><td><m>M = C<sup>d</sup> mod n</m></td></tr>
<tr><td>正确性</td><td><m>ed = 1+kφ(n)</m>，由欧拉定理 <m>M<sup>φ(n)</sup>≡1</m> 还原</td></tr>
<tr><td>安全性</td><td>依赖大整数分解困难；量子计算机上的 Shor 算法可破</td></tr>
</tbody></table>
<p class="kv" style="color:var(--muted)">欧拉定理：<m>gcd(a,n)=1 ⟹ a<sup>φ(n)</sup>≡1 (mod n)</m>；费马小定理是其 <m>n</m> 为素数的特例。</p>
`},

{ n:11, title:'归纳与递归', tag:'三种归纳、递归定义、递归式、不变式', html: `
<h3 style="margin-top:0">★ 三种归纳形式</h3>
<table class="tbl dense"><thead><tr><th style="width:100px">形式</th><th>基础步</th><th>归纳步</th></tr></thead><tbody>
<tr><td>第一归纳法</td><td>证 <m>P(1)</m></td><td>设 <m>P(k)</m>，证 <m>P(k+1)</m></td></tr>
<tr><td>强归纳法</td><td>证 <m>P(1)…P(n<sub>0</sub>)</m>（视跨度）</td><td>设 <m>P(1)…P(k)</m> 全真，证 <m>P(k+1)</m></td></tr>
<tr><td>结构归纳</td><td>对每个基础情形验证</td><td>对每条递归规则：设输入满足，证构造结果满足</td></tr>
<tr><td>良序原理</td><td colspan="2">非空正整数集必有最小元；与归纳法等价（取最小反例）</td></tr>
</tbody></table>
<p class="kv" style="color:var(--muted)">常见错误：循环论证（把要证的当假设）、漏基础步、归纳步在最小 <m>k</m> 处断裂（如「所有马同色」在 <m>k=1</m> 失效）。</p>

<h3>递归定义的三要素</h3>
<table class="tbl dense"><thead><tr><th style="width:110px">要素</th><th>作用</th></tr></thead><tbody>
<tr><td>基础情形</td><td>给出最基本的对象</td></tr>
<tr><td>递归规则</td><td>由已有对象构造新对象</td></tr>
<tr><td>排斥条款</td><td>声明「除此之外没有别的」，保证定义是紧的</td></tr>
</tbody></table>

<h3>★ 常见递归式</h3>
<table class="tbl dense"><thead><tr><th>递归式</th><th>解</th><th>来源</th></tr></thead><tbody>
<tr><td><m>T(n)=T(n−1)+1</m></td><td><m>O(n)</m></td><td>阶乘、线性递归</td></tr>
<tr><td><m>T(n)=2T(n−1)+1</m></td><td><m>O(2<sup>n</sup>)</m></td><td>汉诺塔（精确 <m>2<sup>n</sup>−1</m>）</td></tr>
<tr><td><m>T(n)=T(n/2)+1</m></td><td><m>O(log n)</m></td><td>二分查找</td></tr>
<tr><td><m>T(n)=2T(n/2)+n</m></td><td><m>O(n log n)</m></td><td>归并排序</td></tr>
<tr><td><m>T(n)=2T(n/2)+1</m></td><td><m>O(n)</m></td><td>树的遍历</td></tr>
</tbody></table>
<p class="kv" style="color:var(--muted)">展开法：<m>T(n)=2T(n/2)+n=4T(n/4)+2n=…=2<sup>k</sup>T(n/2<sup>k</sup>)+kn</m>，取 <m>k=log<sub>2</sub>n</m>。</p>

<h3>循环不变式三步</h3>
<table class="tbl dense"><thead><tr><th style="width:100px">步骤</th><th>要证的事</th></tr></thead><tbody>
<tr><td>初始化</td><td>进入循环前不变式成立（对应基础步）</td></tr>
<tr><td>保持</td><td>每轮开始时成立 ⟹ 本轮结束时仍成立（对应归纳步）</td></tr>
<tr><td>终止</td><td>循环结束条件 + 不变式 ⟹ 后置条件</td></tr>
<tr><td>终止性</td><td>另找严格递减且有下界的量（变式）</td></tr>
</tbody></table>
<p class="kv" style="color:var(--muted)">部分正确（若终止则结果对）+ 终止性 = 完全正确。</p>
`},

{ n:12, title:'离散概率', tag:'样本空间、条件概率、贝叶斯、期望', html: `
<h3 style="margin-top:0">★ 基本公式</h3>
<table class="tbl dense"><thead><tr><th style="width:120px">名称</th><th>公式</th></tr></thead><tbody>
<tr><td>等可能概率</td><td><m>P(E) = |E| / |S|</m></td></tr>
<tr><td>补事件</td><td><m>P(Ē) = 1 − P(E)</m></td></tr>
<tr><td>容斥</td><td><m>P(E∪F) = P(E)+P(F)−P(E∩F)</m></td></tr>
<tr><td>条件概率</td><td><m>P(E|F) = P(E∩F)/P(F)</m>，<m>P(F)&gt;0</m></td></tr>
<tr><td>乘法法则</td><td><m>P(E∩F) = P(F)P(E|F)</m></td></tr>
<tr><td>独立</td><td><m>P(E∩F)=P(E)P(F) ⟺ P(E|F)=P(E)</m></td></tr>
<tr><td>全概率</td><td><m>P(E) = Σ P(E|F<sub>i</sub>)P(F<sub>i</sub>)</m>（<m>F<sub>i</sub></m> 为划分）</td></tr>
<tr><td>贝叶斯</td><td><m>P(F|E) = P(E|F)P(F) / P(E)</m></td></tr>
</tbody></table>
<p class="kv" style="color:var(--muted)"><b>互斥 ≠ 独立</b>：互斥且概率非零时一定不独立。生日问题 <m>n=23</m> 时概率约 0.507，配对数是 <m>C(23,2)=253</m>。</p>

<h3>★ 期望与方差</h3>
<table class="tbl dense"><thead><tr><th style="width:120px">名称</th><th>公式 / 结论</th></tr></thead><tbody>
<tr><td>期望</td><td><m>E(X) = Σ x<sub>i</sub>p(x<sub>i</sub>)</m></td></tr>
<tr><td>线性性</td><td><m>E(X+Y) = E(X)+E(Y)</m>，<b>不需要独立</b></td></tr>
<tr><td>乘积</td><td><m>E(XY) = E(X)E(Y)</m>，<b>需要独立</b></td></tr>
<tr><td>方差</td><td><m>V(X) = E(X<sup>2</sup>) − (E(X))<sup>2</sup></m></td></tr>
<tr><td>几何分布</td><td>首次成功的期望次数 <m>= 1/p</m></td></tr>
<tr><td>帽子问题</td><td><m>n</m> 人随机拿帽，期望拿对人数恒为 1</td></tr>
</tbody></table>
<p class="kv" style="color:var(--muted)">贝叶斯算不准时用「假设 10000 人」：先按先验分病人/健康人，再按似然算各类阳性人数，最后真阳性 ÷ 全部阳性。</p>
`},

{ n:13, title:'计算模型', tag:'文法、DFA、图灵机、可计算性', html: `
<h3 style="margin-top:0">★ 语言与文法</h3>
<table class="tbl dense"><thead><tr><th style="width:110px">概念</th><th>内容</th></tr></thead><tbody>
<tr><td>字母表 <m>Σ</m></td><td>非空有限符号集；<m>Σ<sup>*</sup></m> 是所有串（含空串 <m>λ</m>）</td></tr>
<tr><td>语言</td><td><m>Σ<sup>*</sup></m> 的子集</td></tr>
<tr><td>文法</td><td><m>G=(V,T,S,P)</m>，产生式 <m>A → w</m></td></tr>
<tr><td>派生</td><td>从 <m>S</m> 反复替换，直到只剩终结符</td></tr>
<tr><td>经典例子</td><td><m>S→0S1 | λ</m> 生成 <m>{0<sup>n</sup>1<sup>n</sup>}</m>（非正则）</td></tr>
</tbody></table>

<h3>有限状态自动机</h3>
<table class="tbl dense"><thead><tr><th style="width:110px">项目</th><th>内容</th></tr></thead><tbody>
<tr><td>DFA 五元组</td><td><m>(S, I, f, s<sub>0</sub>, F)</m>，<m>f: S×I→S</m> 每项唯一</td></tr>
<tr><td>接受</td><td>读完串后停在 <m>F</m> 中</td></tr>
<tr><td>能力边界</td><td>只能记常数信息；<b>无法</b>做无界计数（<m>0<sup>n</sup>1<sup>n</sup></m>、括号匹配、回文）</td></tr>
<tr><td>Moore 机</td><td>输出由<b>状态</b>决定，<m>g: S→O</m></td></tr>
<tr><td>Mealy 机</td><td>输出由<b>转移</b>决定，<m>g: S×I→O</m></td></tr>
<tr><td>设计方法</td><td>问「读到一半必须记住什么」，记住的信息就是状态</td></tr>
</tbody></table>

<h3>图灵机</h3>
<table class="tbl dense"><thead><tr><th style="width:110px">项目</th><th>内容</th></tr></thead><tbody>
<tr><td>组成</td><td>有限状态 + <b>无限纸带</b> + 读写头</td></tr>
<tr><td>一步动作</td><td>读符号 → 写新符号 → 左/右移 → 换状态</td></tr>
<tr><td>与 DFA 的差别</td><td>记忆容量从常数变成无界，故能完成计数与配对</td></tr>
<tr><td>丘奇-图灵论题</td><td>凡「有效可计算」的函数都能被图灵机计算（论题，非定理）</td></tr>
</tbody></table>

<h3>可计算性层级</h3>
<table class="tbl dense"><thead><tr><th style="width:130px">类别</th><th>含义</th><th>例子</th></tr></thead><tbody>
<tr><td>P</td><td>多项式时间可解</td><td>排序、最短路、素性判定</td></tr>
<tr><td>NP</td><td>多项式时间可验证</td><td>SAT、数独、旅行商判定版</td></tr>
<tr><td>NP 完全</td><td>NP 中最难，互相可归约</td><td>SAT、3-着色、背包判定</td></tr>
<tr><td>不可判定</td><td><b>根本不存在算法</b></td><td>停机问题、程序等价性</td></tr>
</tbody></table>
<p class="kv" style="color:var(--muted)">停机问题用对角线法证明：假设判定器 <m>H</m> 存在 → 构造「反着做」的 <m>D</m> → 问 <m>H(D,D)</m> 无论怎么答都矛盾。</p>
`}

];

    o:['真','假','无法确定','取决于论域'], a:1,

    o:['¬p ∧ ¬q','¬p ∨ ¬q','p ∨ q','p ∧ q'], a:1,

]},

{ id:'c2', n:2, title:'第 2 章 基本结构', mins:12, tag:'集合、函数、求和、基数',
  qs:[
  { id:'c2-1', q:'集合 <m>A</m> 有 5 个元素，则 <m>|P(A)|</m> 等于？',
    o:['5','10','25','32'], a:3,
    s:'幂集元素个数为 <m>2<sup>n</sup></m>。每个元素「选或不选」两种状态，5 个元素共 <m>2<sup>5</sup> = 32</m>。'},
  { id:'c2-2', q:'<m>A = {1,2,3}</m>，<m>B = {3,4}</m>，则 <m>A ⊕ B</m>（对称差）等于？',
    o:['{3}','{1,2,4}','{1,2,3,4}','∅'], a:1,
    s:'对称差是「恰好属于其中一个」的元素：<m>A−B = {1,2}</m>，<m>B−A = {4}</m>，合起来 <m>{1,2,4}</m>。公共的 3 被排除。'},
  { id:'c2-3', q:'<m>f: ℤ → ℤ</m>，<m>f(n) = 2n</m>，它是什么类型的映射？',
    o:['单射但不满射','满射但不单射','双射','既非单射也非满射'], a:0,
    s:'单射：<m>2a=2b ⟹ a=b</m>；不满射：3 是整数但没有整数 n 使 <m>2n=3</m>。所以是单射不满射。'},
  { id:'c2-4', q:'<m>Σ<sub>k=1</sub><sup>10</sup> k²</m> 等于？',
    o:['55','285','385','1023'], a:2,
    s:'平方和公式 <m>n(n+1)(2n+1)/6 = 10×11×21/6 = 385</m>。<b>55 是 Σk，不是 Σk²</b>，这是最常见的看错。'},
  { id:'c2-5', q:'下列哪个集合是<b>不可数</b>的？',
    o:['整数集 ℤ','有理数集 ℚ','正偶数集','实数集 ℝ'], a:3,
    s:'ℤ、ℚ、偶数集都能排成队列（可数）。实数集由康托对角线法证明不可数——这是本章最反直觉的结论。'},
  { id:'c2-6', q:'判断：若 <m>A ⊆ B</m> 且 <m>B ⊆ A</m>，则 <m>A = B</m>。', t:'tf', a:true,

]},

{ id:'c3', n:3, title:'第 3 章 计数', mins:18, tag:'四大公式、鸽巢、隔板法、盒子模型',
  qs:[
  { id:'c3-1', q:'8 个人里选 3 人分别担任班长、学委、体委，有多少种选法？',
    o:['56','168','336','512'], a:2,
    s:'职务不同，顺序要紧，用排列：<m>P(8,3) = 8×7×6 = 336</m>。<b>56 是 C(8,3)</b>，那是「选 3 人组成小组」的答案。'},
  { id:'c3-2', q:'5 种糖果中买 3 颗（只关心种类和数量），有多少种买法？',
    o:['10','15','35','125'], a:2,
    s:'允许重复、不计顺序 → 重复组合：<m>C(5+3−1, 3) = C(7,3) = 35</m>。<b>125 是 5³</b>，那是把顺序也当不同的答案。'},
  { id:'c3-3', q:'6 个<b>相同</b>的球放进 4 个<b>不同</b>的盒子，允许空盒，有多少种放法？',
    o:['24','84','210','4096'], a:1,
    s:'球不可区分、盒可区分、允许空 → 隔板法：<m>C(4+6−1, 6) = C(9,6) = 84</m>。<b>4096 是 4⁶</b>，那是球可区分时的答案。'},
  { id:'c3-4', q:'5 个<b>不同</b>的球放进 3 个<b>不同</b>的盒子，每盒至少一个，有多少种放法？',
    o:['150','243','25','60'], a:0,
    s:'满射计数，用容斥：<m>3<sup>5</sup> − 3·2<sup>5</sup> + 3·1<sup>5</sup> = 243 − 96 + 3 = 150</m>。<b>243 是允许空盒</b>的答案，<b>25 是盒子不可区分</b>（S(5,3)）的答案。'},
  { id:'c3-5', q:'一个班 40 人，至少有多少人出生在同一个月？',
    o:['3','4','5','12'], a:1,
    s:'鸽巢原理：<m>⌈40/12⌉ = ⌈3.33⌉ = 4</m>。<b>注意要向上取整</b>，取 3 就错了。'},
  { id:'c3-6', q:'单词 MISSISSIPPI 的字母全部重排，能得到多少个不同的字符串？',
    o:['39 916 800','34 650','11 880','1 663 200'], a:1,
    s:'M1、I4、S4、P2，共 11 个字母：<m>11!/(1!·4!·4!·2!) = 34 650</m>。39 916 800 是 11!，忘了除掉重复。'},
  { id:'c3-7', q:'判断：「5 个人分成 3 个小组」和「5 个人住进 3 个房间」的答案相同。', t:'tf', a:false,
    s:'错。分组时组没有编号（盒子不可区分），答案是 <m>S(5,3)=25</m>；住房间时房间有编号，答案是 150。两者差 <m>3! = 6</m> 倍。'},
  { id:'c3-8', q:'从 1 到 100 中取一个数，是 2 的倍数或 3 的倍数的有多少个？',
    o:['83','67','50','33'], a:1,
    s:'容斥：<m>50 + 33 − 16 = 67</m>。<b>83 是直接相加</b>，把 6 的倍数算了两遍；16 就是 <m>⌊100/6⌋</m>。'}

{ id:'c5', n:5, title:'第 5 章 关系', mins:15, tag:'性质、闭包、等价、偏序',

    s:'有 <m>1→2</m> 和 <m>2→3</m>，就必须补上 <m>1→3</m>。<b>原关系本身不传递</b>，因为缺少这条边。'},

  { id:'c5-6', q:'一个关系是自反的，它的关系矩阵必须满足？',

    s:'凯莱公式 <m>n<sup>n−2</sup> = 4<sup>2</sup> = 16</m>。'},
  { id:'c7-5', q:'判断：已知一棵二叉树的前序和后序遍历，就能唯一确定这棵树。', t:'tf', a:false,
    s:'错。前序和后序都区分不出「左孩子」还是「右孩子」。例如前序 AB、后序 BA，B 可能是 A 的左孩子也可能是右孩子。必须有中序才能定。'}
]},

{ id:'c8', n:8, title:'第 8 章 布尔代数', mins:10, tag:'恒等式、范式、门电路、卡诺图',
  qs:[
  { id:'c8-1', q:'2 个变量的布尔函数一共有多少个？',
    o:['4','8','16','256'], a:2,
    s:'<m>2<sup>2<sup>n</sup></sup></m>，<m>n=2</m> 时为 <m>2<sup>4</sup> = 16</m>。3 个变量是 256，注意是双指数增长。'},
  { id:'c8-2', q:'化简 <m>x + x̄y</m> 的结果是？',
    o:['x','y','x + y','xy'], a:2,
    s:'<m>x + x̄y = (x + x̄)(x + y) = 1·(x + y) = x + y</m>。这一步用的是分配律，不是吸收律。'},
  { id:'c8-3', q:'下列哪个门单独就构成功能完备集？',
    o:['与门 AND','或门 OR','异或门 XOR','与非门 NAND'], a:3,
    s:'NAND 自带取反能力：<m>x̄ = x↑x</m>，<m>xy = (x↑y)↑(x↑y)</m>，<m>x+y = x̄↑ȳ</m>。AND 和 OR 是单调的，造不出非门。'},
  { id:'c8-4', q:'卡诺图中圈住 4 个相邻的 1（2×2 方块），可以消去几个变量？',
    o:['1 个','2 个','3 个','4 个'], a:1,
    s:'圈 <m>2<sup>k</sup></m> 个格就消去 k 个变量。2 格消 1 个，4 格消 2 个，8 格消 3 个。'},
  { id:'c8-5', q:'判断：只用与门和或门就能表示所有布尔函数。', t:'tf', a:false,
    s:'错。与门和或门都是单调的——输入全 0 时输出必为 0，造不出「输入 0 输出 1」的非门。必须有取反能力。'}
]},


{ id:'c9', n:9, title:'第 9 章 算法', mins:12, tag:'复杂度、查找、排序、设计策略',
  qs:[
  { id:'c9-1', q:'对长度 <m>1024</m> 的有序表做二分查找，最坏需要比较多少次？',
    o:['10','11','12','1024'], a:1,
    s:'<m>log<sub>2</sub>1024 = 10</m>，最坏还要多比较一次（区间缩到 1 时的那次），所以是 11。一般式 <m>⌊log<sub>2</sub>n⌋+1</m>。'},
  { id:'c9-2', q:'<m>3n<sup>2</sup> + 5n + 2</m> 属于哪个复杂度类？',
    o:['<m>O(n)</m>','<m>O(n<sup>2</sup>)</m>','<m>O(n<sup>3</sup>)</m>','<m>O(log n)</m>'], a:1,
    s:'大 O 只保留最高阶项、去掉系数，所以是 <m>O(n<sup>2</sup>)</m>。注意它同时也是 <m>O(n<sup>3</sup>)</m>（上界不唯一），但紧的上界是 <m>n<sup>2</sup></m>。'},
  { id:'c9-3', q:'<m>n = 50</m> 时，<m>2<sup>n</sup></m> 大约是多少？',
    o:['10<sup>5</sup>','10<sup>10</sup>','10<sup>15</sup>','10<sup>50</sup>'], a:2,
    s:'<m>2<sup>10</sup> ≈ 10<sup>3</sup></m>，所以 <m>2<sup>50</sup> = (2<sup>10</sup>)<sup>5</sup> ≈ 10<sup>15</sup></m>。按每秒十亿次算要跑十几天。'},
  { id:'c9-4', q:'归并排序的时间复杂度是？',
    o:['<m>O(n)</m>','<m>O(n log n)</m>','<m>O(n<sup>2</sup>)</m>','<m>O(log n)</m>'], a:1,
    s:'递归式 <m>T(n)=2T(n/2)+n</m>。切了 <m>log<sub>2</sub>n</m> 层，每层合并总代价约 <m>n</m>，相乘得 <m>n log n</m>。'},
  { id:'c9-5', q:'判断：贪心算法在 0-1 背包问题上总能得到最优解。', t:'tf', a:false,
    s:'不能。按单位价值贪心可能选走「比值高但占地大」的物品，挡住更优组合。反例：容量 10，A(6,10)、B(5,9)、C(4,7)，贪心得 16，最优是 A+C=17。'},
  { id:'c9-6', q:'判断：<m>f(n)=O(g(n))</m> 表示 <m>f</m> 的增长不快于 <m>g</m> 的某个常数倍。', t:'tf', a:true,
    s:'这正是定义：存在 <m>C</m> 和 <m>n<sub>0</sub></m>，当 <m>n&gt;n<sub>0</sub></m> 时 <m>|f(n)| ≤ C|g(n)|</m>。它给出的是上界，不要求紧。'}
]},

{ id:'c10', n:10, title:'第 10 章 数论与密码学', mins:14, tag:'同余、gcd、CRT、RSA',
  qs:[
  { id:'c10-1', q:'<m>3<sup>100</sup> mod 7</m> 等于？',
    o:['1','2','4','6'], a:2,
    s:'<m>3<sup>6</sup> ≡ 1 (mod 7)</m>，<m>100 = 6×16+4</m>，所以 <m>3<sup>100</sup> ≡ 3<sup>4</sup> = 81 ≡ 4</m>。'},
  { id:'c10-2', q:'<m>gcd(414, 662)</m> 等于？',
    o:['1','2','6','82'], a:1,
    s:'辗转相除：<m>662=1×414+248</m>，<m>414=1×248+166</m>，<m>248=1×166+82</m>，<m>166=2×82+2</m>，<m>82=41×2+0</m>，故 gcd 为 2。'},
  { id:'c10-3', q:'<m>7</m> 在模 <m>26</m> 下的逆元是？',
    o:['3','11','15','19'], a:2,
    s:'<m>7×15 = 105 = 4×26+1</m>，所以逆元是 15。也可用扩展欧几里得：<m>3×26 − 11×7 = 1</m>，<m>−11 ≡ 15</m>。'},
  { id:'c10-4', q:'满足 <m>x≡2 (mod 3)</m>、<m>x≡3 (mod 5)</m>、<m>x≡2 (mod 7)</m> 的最小正整数是？',
    o:['17','23','38','53'], a:1,
    s:'<m>M=105</m>，<m>M<sub>1</sub>=35</m>、<m>M<sub>2</sub>=21</m>、<m>M<sub>3</sub>=15</m>，逆元分别为 2、1、1，得 <m>x=2×35×2+3×21+2×15=233 ≡ 23</m>。'},
  { id:'c10-5', q:'RSA 中 <m>p=5</m>、<m>q=11</m>、<m>e=3</m>，私钥 <m>d</m> 是？',
    o:['7','17','27','37'], a:2,
    s:'<m>φ(n)=4×10=40</m>，解 <m>3d≡1 (mod 40)</m>。<m>3×27=81=2×40+1</m>，所以 <m>d=27</m>。'},
  { id:'c10-6', q:'判断：同余式两边可以随意约去同一个数。', t:'tf', a:false,
    s:'不行。<m>2×3 ≡ 2×8 (mod 10)</m> 成立，约掉 2 得 <m>3≡8 (mod 10)</m> 不成立。只有当除数与模<b>互素</b>时才能约。'}
]},

{ id:'c11', n:11, title:'第 11 章 归纳与递归', mins:12, tag:'归纳法、递归定义、递归式、不变式',
  qs:[
  { id:'c11-1', q:'用归纳法证明 <m>1+3+…+(2n−1)=n<sup>2</sup></m>，归纳步的关键一步是？',
    o:['代入 n=1 验证','把 <m>k<sup>2</sup></m> 加上 <m>2k+1</m> 得 <m>(k+1)<sup>2</sup></m>','假设结论对所有 n 成立','把 n 换成 2n'],
    a:1,
    s:'归纳假设是 <m>Σ<sub>i=1</sub><sup>k</sup>(2i−1)=k<sup>2</sup></m>，加上第 <m>k+1</m> 项 <m>2k+1</m>，得 <m>k<sup>2</sup>+2k+1=(k+1)<sup>2</sup></m>。'},
  { id:'c11-2', q:'汉诺塔 5 个盘子最少要移动多少步？',
    o:['15','16','31','63'], a:2,
    s:'<m>2<sup>5</sup>−1=31</m>。递推式 <m>T(n)=2T(n−1)+1</m>，每多一个盘子，步数翻倍再加一。'},
  { id:'c11-3', q:'强归纳法与普通归纳法的关系是？',
    o:['强归纳能证更多命题','两者逻辑等价','普通归纳能证更多命题','强归纳不需要基础步'], a:1,
    s:'两者等价，只是强归纳的归纳假设更多（假设前面全部成立），写起来方便。任何强归纳证明都能改写成普通归纳。'},
  { id:'c11-4', q:'归并排序的递归式 <m>T(n)=2T(n/2)+n</m> 解出来是？',
    o:['<m>O(n)</m>','<m>O(n log n)</m>','<m>O(n<sup>2</sup>)</m>','<m>O(2<sup>n</sup>)</m>'], a:1,
    s:'展开得 <m>2<sup>k</sup>T(n/2<sup>k</sup>)+kn</m>，取 <m>k=log<sub>2</sub>n</m>，得 <m>n+ n log<sub>2</sub>n</m>，即 <m>O(n log n)</m>。'},
  { id:'c11-5', q:'循环不变式的证明<b>不需要</b>下列哪一步？',
    o:['初始化：进入循环前成立','保持：每轮结束后仍成立','终止：退出时能推出后置条件','统计：算出循环执行了几次'], a:3,
    s:'三步是初始化、保持、终止。执行次数属于终止性分析，用「循环变式」单独证，不属于不变式的三步。'},
  { id:'c11-6', q:'判断：归纳步里可以假设 <m>P(n)</m> 对所有正整数 <m>n</m> 成立。', t:'tf', a:false,
    s:'那是循环论证。归纳步只能假设<b>某一个</b> <m>k</m> 成立（或强归纳下假设到 <m>k</m> 为止），再推出 <m>k+1</m>。'}
]},

{ id:'c12', n:12, title:'第 12 章 离散概率', mins:13, tag:'样本空间、条件概率、贝叶斯、期望',
  qs:[
  { id:'c12-1', q:'掷两个骰子，点数之和为 7 的概率是？',
    o:['1/12','1/9','1/6','1/4'], a:2,
    s:'样本空间是有序对共 36 种，和为 7 的有 6 种（1+6 到 6+1），<m>6/36=1/6</m>。不能按 21 种组合算，因为组合不等可能。'},
  { id:'c12-2', q:'23 个人中至少两人生日相同的概率约为？',
    o:['0.06','0.27','0.51','0.89'], a:2,
    s:'约 50.7%。算法是算反面：<m>P(全不同)=365×364×…×343 / 365<sup>23</sup> ≈ 0.493</m>。直觉低估是因为只想到「和我在同一天」，忽略了 <m>C(23,2)=253</m> 对组合。'},
  { id:'c12-3', q:'患病率 1%，灵敏度 99%，假阳性率 2%。某人阳性，真患病概率约为？',
    o:['约 99%','约 50%','约 33%','约 2%'], a:2,
    s:'设 10000 人：病人 100，真阳性 99；健康 9900，误报 198。全部阳性 297 人，<m>99/297 = 1/3</m>。健康人基数大是后验低的原因。'},
  { id:'c12-4', q:'判断：使用 <m>E(X+Y)=E(X)+E(Y)</m> 需要 X 与 Y 独立。', t:'tf', a:false,
    s:'不需要。期望的线性性对任意随机变量都成立。需要独立性的是乘积：<m>E(XY)=E(X)E(Y)</m>。'},
  { id:'c12-5', q:'掷一枚均匀骰子，<m>E(X<sup>2</sup>)</m> 等于？',
    o:['<m>91/6</m>','<m>49/4</m>','<m>7/2</m>','<m>35/12</m>'], a:0,
    s:'<m>(1+4+9+16+25+36)/6 = 91/6 ≈ 15.17</m>。注意 <m>35/12</m> 是方差，<m>49/4</m> 是 <m>(EX)<sup>2</sup></m>。'},
  { id:'c12-6', q:'判断：两个概率非零的互斥事件一定不独立。', t:'tf', a:true,
    s:'互斥意味着 <m>P(E∩F)=0</m>，而独立要求 <m>P(E∩F)=P(E)P(F)&gt;0</m>，矛盾。互斥是极强的相关，恰好与独立相反。'}
]},

{ id:'c13', n:13, title:'第 13 章 计算模型', mins:12, tag:'文法、DFA、图灵机、可计算性',
  qs:[
  { id:'c13-1', q:'识别「含有偶数个 1」的 DFA 最少需要几个状态？',
    o:['1','2','3','4'], a:1,
    s:'只需记住当前 1 的个数是奇还是偶，两个状态；读 1 翻转，读 0 保持。起始状态是接受状态（空串有 0 个 1）。'},
  { id:'c13-2', q:'下列哪个语言<b>不能</b>被有限状态自动机识别？',
    o:['以 01 结尾的串','1 的个数为偶数的串','<m>{0<sup>n</sup>1<sup>n</sup> | n≥0}</m>','含子串 00 的串'], a:2,
    s:'<m>0<sup>n</sup>1<sup>n</sup></m> 需要记住读了几个 0，n 无上界，超出有限状态的记忆能力。其余三个都只需常数信息。'},
  { id:'c13-3', q:'图灵机与有限状态自动机的本质区别是？',
    o:['状态数更多','有无限纸带可读写','转移函数更复杂','能处理二进制输入'], a:1,
    s:'关键在记忆容量：DFA 只能记住当前状态（信息量固定），图灵机的纸带可以存任意多符号，因此能完成计数、配对这类任务。'},
  { id:'c13-4', q:'停机问题的判定性如何？',
    o:['可在多项式时间判定','可在指数时间判定','不可判定','只对大程序不可判定'], a:2,
    s:'不存在通用算法判断任意程序是否停机。用对角线法证明：假设判定器存在，构造一个「反着做」的程序喂给自己，无论怎么答都矛盾。'},
  { id:'c13-5', q:'Moore 机与 Mealy 机的区别在于？',
    o:['Moore 输出取决于状态，Mealy 取决于转移','Moore 没有状态','Mealy 不能识别语言','Moore 只能处理二进制'], a:0,
    s:'Moore 的输出挂在状态上（<m>g:S→O</m>），Mealy 挂在转移上（<m>g:S×I→O</m>）。两者表达能力相同，可互相转换。'},
  { id:'c13-6', q:'判断：停机问题不可判定，是因为目前的计算机还不够快。', t:'tf', a:false,
    s:'与速度无关。证明只用到「程序可以读自己的代码」这一点，任何能表达程序的计算模型都会遇到同样的对角线矛盾。'}
]},

{ id:'m1', type:'mock', title:'模拟卷 A · 期末全真', mins:60, tag:'覆盖本科教学版 8 章，难度贴近期末',
  qs:[
  { id:'m1-1', q:'与 <m>¬(p → q)</m> 等价的是？',
    o:['¬p ∧ q','p ∧ ¬q','¬p ∨ q','p ∨ ¬q'], a:1,
    s:'<m>¬(p→q) ≡ ¬(¬p∨q) ≡ p ∧ ¬q</m>。直观理解：「p 蕴含 q」不成立，就是「p 成立但 q 不成立」。'},
  { id:'m1-2', q:'<m>|A| = 3</m>，<m>|B| = 4</m>，则 <m>|A × B|</m> 等于？',
    o:['7','12','16','64'], a:1,
    s:'笛卡尔积的元素个数是两者之积：<m>3 × 4 = 12</m>。每个 A 的元素配一个 B 的元素。'},
  { id:'m1-3', q:'5 个人排成一排，甲、乙必须相邻，有多少种排法？',
    o:['24','48','72','120'], a:1,
    s:'捆绑法：甲乙捆成一个整体，与其余 3 人共 4 个元素排列 <m>4! = 24</m>，内部甲乙可互换 <m>2! = 2</m>，共 48。'},
  { id:'m1-4', q:'<m>(x+y)<sup>6</sup></m> 展开式中 <m>x²y⁴</m> 的系数是？',
    o:['6','15','20','30'], a:1,
    s:'要出现 <m>x²y⁴</m>，需在 6 个括号里选 4 个取 y：<m>C(6,4) = C(6,2) = 15</m>。'},
  { id:'m1-5', q:'递推 <m>a<sub>n</sub> = 3a<sub>n−1</sub> − 2a<sub>n−2</sub></m> 的特征根是？',
    o:['1 和 2','−1 和 −2','2 和 3','1 和 3'], a:0,
    s:'<m>r² − 3r + 2 = (r−1)(r−2) = 0</m>，根为 1 和 2。通解 <m>α·1<sup>n</sup> + β·2<sup>n</sup></m>。'},
  { id:'m1-6', q:'100 以内与 30 互素的整数有多少个？',
    o:['26','34','40','66'], a:0,
    s:'<m>30 = 2×3×5</m>。不互素即被 2、3、5 之一整除，容斥得 <m>50+33+20−16−10−6+3 = 74</m>，所以互素有 <m>100−74 = 26</m> 个。'},
  { id:'m1-7', q:'3 元集合上共有多少个不同的等价关系？',
    o:['3','5','6','8'], a:1,
    s:'等价关系个数 = 划分数 = Bell 数 <m>B<sub>3</sub> = 1 + 3 + 1 = 5</m>（1 块 1 种，2 块 3 种，3 块 1 种）。'},
  { id:'m1-8', q:'一个<b>连通</b>图有 7 个顶点，最少需要多少条边？',
    o:['5','6','7','21'], a:1,
    s:'连通图下界是 <m>n−1 = 6</m>，此时正好是一棵树（无回路）。少于 6 条必然分成多个连通分量。'},
  { id:'m1-9', q:'<m>K<sub>3,3</sub></m> 是平面图吗？',
    o:['是，可以画平','不是，无法不交叉地画出','取决于画法','含三角形所以不是'], a:1,
    s:'<m>K<sub>3,3</sub></m> 是二分图，没有三角形，若为平面图需满足 <m>E ≤ 2V−4 = 8</m>，但实际 <m>E = 9</m>，矛盾，故非平面。'},
  { id:'m1-10', q:'5 个不同的球放进 2 个<b>相同</b>的盒子，每盒至少一个，有多少种放法？',
    o:['16','30','15','32'], a:2,
    s:'这是第二类 Stirling 数 <m>S(5,2) = 2<sup>4</sup> − 1 = 15</m>。理解为：每球选 A 或 B 有 32 种，去掉全 A、全 B 两种，再除以盒子互换的 2，得 15。'},
  { id:'m1-11', q:'8 个顶点的树，顶点最大度数最大可以是多少？',
    o:['3','5','7','8'], a:2,
    s:'星形树：1 个中心点连接其余 7 个点，中心度数为 7。树不可能有 8 度顶点（那需要自环或重边）。'},
  { id:'m1-12', q:'只用 NAND 门实现非门 <m>x̄</m>，应该怎么接？',
    o:['x 接一个输入端，另一个接 1','两输入端都接 x','两输入端都接 0','x 接一个，另一个接 x̄'], a:1,
    s:'<m>NAND(x,x) = <span style="text-decoration:overline">x·x</span> = x̄</m>。把同一信号接到两个输入端，就退化成非门。'}
]},

{ id:'m2', type:'mock', title:'模拟卷 B · 期末全真', mins:60, tag:'覆盖本科教学版 8 章，侧重概念辨析',
  qs:[
  { id:'m2-1', q:'<m>p ↔ q</m> 等价于？',
    o:['(p→q) ∧ (q→p)','(p→q) ∨ (q→p)','p ∧ q','¬p ∨ ¬q'], a:0,
    s:'双条件就是「两个方向都成立」。注意不能用 ∨——那几乎总是真，太弱了。'},
