<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>离散数学 · 逐章精读 | Rosen 8e 本科教学版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#F5F1E8; --surface:#FFFDF7; --surface-2:#FBF8F0;
  --ink:#22252A; --ink2:#4C5057; --muted:#807D75;
  --line:#E4DDCE; --line2:#D5CCB8;
  --accent:#A63E2B; --accent-soft:#FAEDE8; --accent-line:#E8C9BE;
  --teal:#2C5F6E; --teal-soft:#E9F1F3;
  --green:#3E7550; --green-soft:#EBF3EC;
  --amber:#9A6D16; --amber-soft:#FBF1DC;
  --bad:#B4442F; --bad-soft:#FBEAE6;
  --shadow:0 1px 2px rgba(40,32,20,.05),0 8px 24px -12px rgba(40,32,20,.12);
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --math:"Cambria Math",Cambria,Georgia,"Times New Roman",serif;
}
[data-theme="dark"]{
  --paper:#15171B; --surface:#1C1F24; --surface-2:#212429;
  --ink:#E9E5DC; --ink2:#BDB9B0; --muted:#8A867E;
  --line:#2C3037; --line2:#3A3F47;
  --accent:#E0795F; --accent-soft:#2B2120; --accent-line:#4A3330;
  --teal:#7FB4C2; --teal-soft:#1D282C;
  --green:#7FB48C; --green-soft:#1C2620;
  --amber:#D6A94E; --amber-soft:#2A2418;
  --bad:#E0795F; --bad-soft:#2E1E1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
}
html{scroll-behavior:smooth}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:15.5px; line-height:1.9; -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
::selection{background:var(--accent-line);color:var(--ink)}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh}
#side{
  width:274px;flex:0 0 274px;height:100vh;position:sticky;top:0;
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:40;
}
.brand{
  padding:22px 20px 16px;border-bottom:1px solid var(--line);
  display:flex;gap:12px;align-items:center;flex:0 0 auto;
}
.mark{
  width:38px;height:38px;flex:0 0 38px;border-radius:9px;
  background:var(--accent);color:#fff;display:grid;place-items:center;
  font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:0;
  box-shadow:var(--shadow);
}
.brand h1{font-family:var(--serif);font-size:16.5px;font-weight:600;letter-spacing:.03em;line-height:1.35}
.brand p{font-size:11px;color:var(--muted);letter-spacing:.02em;line-height:1.5;margin-top:2px}

.gauge{padding:14px 20px 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
.gauge-row{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--muted);margin-bottom:7px;letter-spacing:.02em}
.gauge-row b{color:var(--accent);font-family:var(--serif);font-size:14px;font-weight:600}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .45s cubic-bezier(.4,0,.2,1)}
.gauge-sub{font-size:11px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between}

.navbtn{
  margin:8px 12px 0;padding:9px 12px;border-radius:8px;border:1px dashed var(--line2);
  background:var(--surface-2);cursor:pointer;display:flex;align-items:center;gap:9px;
  transition:.15s;flex:0 0 auto;
}
.navbtn:last-of-type{margin-bottom:2px}
.navbtn:hover{border-color:var(--accent);color:var(--accent)}
.navbtn.on{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.navbtn b{display:block;font-size:12.5px;font-weight:500;color:var(--ink2);line-height:1.4;letter-spacing:.01em}
.navbtn span{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.02em;line-height:1.4}
.navbtn.on b{color:var(--accent)}
.navbtn svg{flex:0 0 auto;opacity:.55}
.navbtn .bdg{
  margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);
  color:#fff;font-size:10.5px;display:None;place-items:center;font-family:var(--sans);line-height:18px;
}
.navbtn .bdg.show{display:grid}

#tree{overflow-y:auto;flex:1 1 auto;padding:12px 10px 28px}
#tree::-webkit-scrollbar{width:6px}
#tree::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.ch{margin-bottom:2px}
.ch-h{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;
  cursor:pointer;user-select:none;transition:background .15s;
}
.ch-h:hover{background:var(--surface-2)}
.ch-n{
  width:21px;height:21px;flex:0 0 21px;border-radius:5px;display:grid;place-items:center;
  font-family:var(--serif);font-size:12px;font-weight:600;
  background:var(--line);color:var(--ink2);transition:.2s;
}
.ch.on .ch-n{background:var(--accent);color:#fff}
.ch-h b{font-size:13.5px;font-weight:500;flex:1;line-height:1.4;letter-spacing:.01em}
.ch-h svg{flex:0 0 auto;opacity:.4;transition:transform .2s}
.ch.open .ch-h svg{transform:rotate(90deg)}
.ch-s{display:none;padding:2px 0 8px 0}
.ch.open .ch-s{display:block}
.ch-div{margin:16px 4px 6px;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.ch-div b{font-size:11px;letter-spacing:.12em;color:var(--accent);font-weight:600}
.ch-div i{font-style:normal;font-size:10px;color:var(--muted);letter-spacing:.02em}
.sec{
  display:flex;align-items:flex-start;gap:8px;padding:6px 10px 6px 32px;border-radius:6px;
  cursor:pointer;font-size:13px;color:var(--ink2);line-height:1.5;transition:background .15s,color .15s;
  border-left:2px solid transparent;margin-left:2px;
}
.sec:hover{background:var(--surface-2);color:var(--ink)}
.sec.on{background:var(--accent-soft);color:var(--accent);font-weight:500;border-left-color:var(--accent)}
.sec .dot{
  width:5px;height:5px;flex:0 0 5px;border-radius:50%;margin-top:9px;
  border:1px solid var(--line2);background:transparent;transition:.2s;
}
.sec.v .dot{background:var(--line2);border-color:var(--line2)}
.sec.d .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

#main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
#bar{
  position:sticky;top:0;z-index:30;height:52px;display:flex;align-items:center;gap:14px;
  padding:0 34px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);flex:0 0 auto;
}
#bar .crumb{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:8px;min-width:0}
#bar .crumb b{color:var(--ink2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .sp{flex:1}
.iconbtn{
  width:31px;height:31px;border-radius:7px;border:1px solid var(--line);background:var(--surface);
  display:grid;place-items:center;cursor:pointer;color:var(--ink2);transition:.15s;
}
.iconbtn:hover{border-color:var(--line2);color:var(--accent);transform:translateY(-1px)}
#burger{display:none}

#doc{padding:44px 34px 20px;max-width:820px;width:100%;margin:0 auto;flex:1 1 auto}
#pager{
  max-width:820px;width:100%;margin:0 auto;padding:8px 34px 56px;
  display:grid;grid-template-columns:1fr 1fr;gap:12px;
}
.pg{
  display:flex;flex-direction:column;gap:3px;padding:13px 16px;border:1px solid var(--line);
  border-radius:10px;background:var(--surface);cursor:pointer;transition:.18s;text-decoration:none;
}
.pg:hover{border-color:var(--accent-line);box-shadow:var(--shadow);transform:translateY(-1px)}
.pg span{font-size:11px;color:var(--muted);letter-spacing:.06em}
.pg b{font-size:13.5px;font-weight:500;color:var(--ink);line-height:1.4}
.pg.next{text-align:right;grid-column:2}
.pg.empty{visibility:hidden}
footer{border-top:1px solid var(--line);padding:22px 34px 40px;text-align:center;font-size:11.5px;color:var(--muted);line-height:2}

/* ---------- typography ---------- */
.ch-head{margin-bottom:34px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.ch-kicker{
  font-size:11px;letter-spacing:.18em;color:var(--accent);font-weight:500;
  text-transform:uppercase;display:flex;align-items:center;gap:9px;margin-bottom:12px;
}
.ch-kicker::after{content:"";flex:1;height:1px;background:var(--accent-line)}
.ch-head h1{
  font-family:var(--serif);font-size:33px;font-weight:600;line-height:1.35;
  letter-spacing:.01em;margin-bottom:10px;
}
.ch-head h1 em{font-style:normal;color:var(--accent)}
.ch-desc{font-size:14px;color:var(--ink2);line-height:1.85;max-width:640px}

h2#sec-title{
  font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.4;
  margin:0 0 6px;letter-spacing:.01em;scroll-margin-top:70px;
}
.sec-meta{font-size:11.5px;color:var(--muted);letter-spacing:.04em;margin-bottom:26px;display:flex;gap:14px;align-items:center}
.sec-meta::after{content:"";flex:1;height:1px;background:var(--line)}

h3{font-family:var(--serif);font-size:17px;font-weight:600;margin:34px 0 12px;letter-spacing:.02em;line-height:1.5}
h3::before{content:"§";color:var(--accent);font-size:13px;margin-right:8px;opacity:.7}
p{margin:0 0 13px}
p.lead{font-size:15px;color:var(--ink2)}
ul,ol{margin:0 0 14px;padding-left:1.5em}
li{margin-bottom:6px}
li::marker{color:var(--muted)}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-line)}
a:hover{border-bottom-color:var(--accent)}
b,strong{font-weight:600;color:var(--ink)}
k{font-weight:600;color:var(--accent);font-style:normal}
code{font-family:var(--mono);font-size:.88em;background:var(--surface-2);padding:1px 5px;border-radius:4px;border:1px solid var(--line)}
hr{border:0;border-top:1px solid var(--line);margin:30px 0}

/* math */
m{font-family:var(--math);font-size:1.06em;letter-spacing:.01em;white-space:nowrap}
.f{
  display:block;text-align:center;font-family:var(--math);font-size:19px;
  margin:18px 0;padding:16px 12px;background:var(--surface-2);border-radius:9px;
  border:1px solid var(--line);line-height:2.1;overflow-x:auto;
}
.f small{font-size:11px;font-family:var(--sans);color:var(--muted);display:block;margin-top:8px;line-height:1.7;white-space:normal}
.frac{display:inline-grid;vertical-align:-.48em;text-align:center;margin:0 .16em;font-size:.95em}
.frac>span:first-child{border-bottom:1.2px solid currentColor;padding:0 .32em .06em}
.frac>span:last-child{padding:.06em .32em 0}
.binom{display:inline-flex;align-items:stretch;vertical-align:-.5em;margin:0 .1em}
.binom>.st{display:flex;flex-direction:column;justify-content:center;text-align:center;padding:0 .1em;line-height:1.12;font-size:.9em}
.binom>.pn{display:flex;align-items:center;font-size:1.75em;line-height:1;font-family:Georgia,serif;font-weight:300}

/* callouts */
.def,.thm,.tip,.warn{
  border-radius:9px;padding:15px 18px 14px;margin:20px 0;font-size:14.5px;line-height:1.85;
  border:1px solid var(--line);background:var(--surface);position:relative;
}
.def{border-left:3px solid var(--accent);background:var(--accent-soft);border-color:var(--accent-line)}
.thm{border-left:3px solid var(--teal);background:var(--teal-soft);border-color:var(--teal)}
.tip{border-left:3px solid var(--green);background:var(--green-soft);border-color:var(--green)}
.warn{border-left:3px solid var(--amber);background:var(--amber-soft);border-color:var(--amber)}
.def .lb,.thm .lb,.tip .lb,.warn .lb{
  display:block;font-size:10.5px;letter-spacing:.14em;font-weight:600;margin-bottom:6px;
  text-transform:uppercase;font-family:var(--sans);
}
.def .lb{color:var(--accent)} .thm .lb{color:var(--teal)}
.tip .lb{color:var(--green)} .warn .lb{color:var(--amber)}
.def p:last-child,.thm p:last-child,.tip p:last-child,.warn p:last-child{margin-bottom:0}
.def b,.thm b{color:inherit}

/* table */
.tbl{width:100%;border-collapse:collapse;margin:18px 0;font-size:13.5px;background:var(--surface);border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.tbl th{background:var(--surface-2);font-weight:600;font-size:12px;letter-spacing:.04em;color:var(--ink2);text-align:left;padding:10px 13px;border-bottom:1px solid var(--line2)}
.tbl td{padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.75}
.tbl tr:last-child td{border-bottom:0}
.tbl td.c,.tbl th.c{text-align:center}
.tbl code{font-size:.85em}
.tbl-wrap{overflow-x:auto;margin:18px 0;border-radius:9px}
.tbl-wrap .tbl{margin:0;min-width:520px}

/* exercise */
.exs{margin:26px 0 8px}
.exs-h{
  display:flex;align-items:center;gap:10px;font-size:11.5px;letter-spacing:.14em;
  color:var(--muted);font-weight:600;margin-bottom:12px;text-transform:uppercase;
}
.exs-h::after{content:"";flex:1;height:1px;background:var(--line)}
.exs-h em{font-style:normal;letter-spacing:0;color:var(--accent);font-size:11px}
.ex{
  border:1px solid var(--line);border-radius:10px;background:var(--surface);
  margin-bottom:10px;overflow:hidden;transition:border-color .2s;
}
.ex:hover{border-color:var(--line2)}
.ex.done{border-color:var(--green);background:var(--surface)}
.ex-q{display:flex;gap:12px;padding:15px 17px 12px;font-size:14.5px;line-height:1.85}
.ex-n{
  width:20px;height:20px;flex:0 0 20px;border-radius:50%;border:1px solid var(--line2);
  display:grid;place-items:center;font-size:11px;font-family:var(--serif);color:var(--muted);
  margin-top:3px;transition:.2s;
}
.ex.done .ex-n{background:var(--green);border-color:var(--green);color:#fff}
.ex-body{flex:1;min-width:0}
.ex-body p:last-child{margin-bottom:0}
.ex-tools{display:flex;gap:8px;padding:0 17px 14px 49px;flex-wrap:wrap}
.tbtn{
  font-family:var(--sans);font-size:12px;padding:4px 11px;border-radius:6px;cursor:pointer;
  border:1px solid var(--line2);background:transparent;color:var(--ink2);transition:.15s;letter-spacing:.02em;
}
.tbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ex-hint,.ex-sol{display:none;margin:0 17px 14px 49px;padding:13px 15px;border-radius:8px;font-size:13.5px;line-height:1.85}
.ex-hint{background:var(--amber-soft);border:1px solid var(--amber)}
.ex-hint .lb{color:var(--amber);font-size:10.5px;letter-spacing:.12em;font-weight:600;display:block;margin-bottom:5px}
.ex-sol{background:var(--surface-2);border:1px solid var(--line2)}
.ex-sol .lb{color:var(--teal);font-size:10.5px;letter-spacing:.12em;font-weight:600;display:block;margin-bottom:9px}
.ex-sol .st{display:flex;gap:9px;margin-bottom:8px}
.ex-sol .st>i{
  font-style:normal;width:17px;height:17px;flex:0 0 17px;border-radius:4px;background:var(--teal);
  color:#fff;font-size:10px;display:grid;place-items:center;margin-top:3px;font-family:var(--sans);
}
.ex-sol .st>div{flex:1;min-width:0}
.ex-sol .an{
  margin-top:11px;padding-top:10px;border-top:1px dashed var(--line2);font-size:13.5px;
}
.ex-sol .an b{color:var(--accent)}
.ex-mark{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.mbtn{
  font-size:11.5px;padding:3px 10px;border-radius:20px;cursor:pointer;border:1px solid var(--line2);
  background:transparent;color:var(--ink2);transition:.15s;
}
.mbtn.yes:hover,.mbtn.yes.on{background:var(--green);border-color:var(--green);color:#fff}
.mbtn.no:hover,.mbtn.no.on{background:var(--amber);border-color:var(--amber);color:#fff}

/* mark studied */
.markdone{
  display:flex;align-items:center;justify-content:space-between;gap:16px;margin:38px 0 8px;
  padding:16px 20px;border:1px dashed var(--line2);border-radius:10px;background:var(--surface-2);
  font-size:13px;color:var(--ink2);
}
.markdone button{
  font-size:12.5px;padding:7px 16px;border-radius:7px;cursor:pointer;border:1px solid var(--accent);
  background:var(--accent);color:#fff;transition:.15s;font-family:var(--sans);white-space:nowrap;
}
.markdone button:hover{filter:brightness(1.08)}
.markdone.done{border-style:solid;border-color:var(--green);background:var(--green-soft)}
.markdone.done button{background:var(--green);border-color:var(--green)}
.chapend{text-align:center;margin:20px 0 6px}
.chapend button{
  font-family:var(--sans);font-size:12.5px;padding:8px 20px;border-radius:20px;
  border:1px dashed var(--line2);background:transparent;color:var(--muted);cursor:pointer;transition:.15s;
}
.chapend button:hover{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* ---------- widgets ---------- */
.w{
  margin:24px 0;border:1px solid var(--line2);border-radius:11px;background:var(--surface);
  overflow:hidden;box-shadow:var(--shadow);
}
.w-h{
  display:flex;align-items:center;gap:9px;padding:11px 16px;border-bottom:1px solid var(--line);
  background:var(--surface-2);font-size:12px;letter-spacing:.06em;color:var(--ink2);font-weight:600;
}
.w-h .sq{width:7px;height:7px;border-radius:2px;background:var(--accent);flex:0 0 7px}
.w-h em{font-style:normal;font-weight:400;color:var(--muted);font-size:11px;letter-spacing:.02em;margin-left:auto}
.w-b{padding:18px}
.w-cap{font-size:11.5px;color:var(--muted);line-height:1.75;padding:0 16px 14px;letter-spacing:.01em}
.w-ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:16px}
.w-ctl label{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.w-ctl output{font-family:var(--math);font-size:14px;color:var(--accent);min-width:26px;display:inline-block;text-align:center;font-weight:600}
input[type=range]{
  -webkit-appearance:none;appearance:none;height:3px;border-radius:2px;background:var(--line2);
  width:118px;outline:none;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);
  border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:pointer;
}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);cursor:pointer}
.w-btn{
  font-family:var(--sans);font-size:12px;padding:5px 13px;border-radius:6px;cursor:pointer;
  border:1px solid var(--line2);background:var(--surface);color:var(--ink2);transition:.15s;
}
.w-btn:hover{border-color:var(--accent);color:var(--accent)}
.w-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.w-btn.sm{padding:3px 9px;font-size:11.5px}
.w-out{font-family:var(--math);font-size:15px;line-height:2}
.w-out .big{font-size:22px;color:var(--accent);font-weight:600}
.kv{font-family:var(--sans);font-size:12.5px;color:var(--ink2)}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;
  font-size:12px;border:1px solid var(--line2);background:var(--surface-2);color:var(--ink2);
  cursor:pointer;transition:.15s;font-family:var(--sans);
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
svg.wsvg{display:block;width:100%;height:auto;overflow:visible}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:.02em}

/* ---------- 速查手册 ---------- */
.pills{
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 30px;padding:10px 12px;
  border:1px solid var(--line);border-radius:10px;background:var(--surface-2);
  position:sticky;top:52px;z-index:20;
}
.pills button{
  font-family:var(--sans);font-size:12px;padding:4px 11px;border-radius:16px;
  border:1px solid var(--line2);background:var(--surface);color:var(--ink2);
  cursor:pointer;transition:.15s;white-space:nowrap;
}
.pills button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pills .sp{flex:1;min-width:8px}
.pills .pr{border-color:var(--accent);color:var(--accent)}
.sheet{margin:0 0 42px;scroll-margin-top:118px}
.sheet h2{font-family:var(--serif);font-size:20px;font-weight:600;margin:0 0 0;letter-spacing:.01em;line-height:1.5}
.sheet .sub{
  font-size:11.5px;color:var(--muted);letter-spacing:.05em;margin:5px 0 16px;padding-bottom:11px;
  border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap;
}
.sheet .sub a{font-size:11px;cursor:pointer;border-bottom:1px solid var(--accent-line)}
.sheet h3{font-size:14.5px;margin:22px 0 8px}
.sheet h3::before{content:"§";font-size:11px;margin-right:7px}
.tbl.dense{margin:10px 0 14px}
.tbl.dense td,.tbl.dense th{padding:7px 10px;font-size:12.8px;line-height:1.7}
.tbl.dense m{font-size:1.04em}
.sheet .f{margin:8px 0;padding:11px;font-size:16px}
@media print{.pills{display:none}}

/* ---------- 自测卷 ---------- */
.qz-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0 12px}
@media (max-width:700px){.qz-grid{grid-template-columns:1fr}}
.qz-card{
  position:relative;border:1px solid var(--line);border-radius:11px;padding:16px 18px;
  background:var(--surface);cursor:pointer;transition:.18s;
}
.qz-card:hover{border-color:var(--accent-line);box-shadow:var(--shadow);transform:translateY(-1px)}
.qz-card.done{border-color:var(--green)}
.qz-card .no{font-size:10.5px;letter-spacing:.14em;color:var(--accent);font-weight:600}
.qz-card h3{font-family:var(--serif);font-size:15.5px;font-weight:600;margin:5px 0 0;letter-spacing:.01em}
.qz-card h3::before{content:none}
.qz-card .meta{font-size:11.5px;color:var(--muted);display:flex;gap:14px;margin-top:9px;letter-spacing:.02em}
.qz-card .sc{position:absolute;top:14px;right:16px;font-family:var(--serif);font-size:21px;color:var(--accent);line-height:1}
.qz-card .sc em{font-style:normal;font-size:11px;color:var(--muted)}

.qz-bar{
  position:sticky;top:52px;z-index:20;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:10px 15px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);
  margin:0 0 24px;font-size:12.5px;color:var(--ink2);
}
.qz-bar .sp{flex:1}
.qz-bar b{color:var(--accent);font-family:var(--serif);font-size:14px}

.q{padding:18px 0;border-bottom:1px solid var(--line)}
.q:last-of-type{border-bottom:0}
.q-stem{display:flex;gap:11px;font-size:14.5px;line-height:1.85;margin-bottom:12px}
.q-stem>div{flex:1;min-width:0}
.q-no{
  width:23px;height:23px;flex:0 0 23px;border-radius:50%;background:var(--surface-2);
  border:1px solid var(--line2);display:grid;place-items:center;font-size:11.5px;
  color:var(--muted);margin-top:3px;font-family:var(--serif);
}
.q-opt{
  display:flex;gap:10px;align-items:flex-start;padding:9px 13px;border:1px solid var(--line);
  border-radius:8px;margin-bottom:7px;cursor:pointer;font-size:13.6px;line-height:1.75;
  background:var(--surface);transition:.14s;
}
.q-opt:hover{border-color:var(--accent-line);background:var(--surface-2)}
.q-opt .k{
  width:20px;height:20px;flex:0 0 20px;border-radius:50%;border:1px solid var(--line2);
  display:grid;place-items:center;font-size:11px;color:var(--muted);margin-top:2px;font-family:var(--serif);
}
.q-opt.sel{border-color:var(--teal);background:var(--teal-soft)}
.q-opt.sel .k{background:var(--teal);border-color:var(--teal);color:#fff}
.q-opt.ok{border-color:var(--green);background:var(--green-soft)}
.q-opt.ok .k{background:var(--green);border-color:var(--green);color:#fff}
.q-opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.q-opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
.q.locked .q-opt{cursor:default}
.q.locked .q-opt:hover{border-color:var(--line);background:var(--surface)}
.q.locked .q-opt.ok:hover{border-color:var(--green);background:var(--green-soft)}
.q.locked .q-opt.bad:hover{border-color:var(--bad);background:var(--bad-soft)}

.q-sol{
  display:none;margin-top:10px;padding:12px 15px;border-radius:8px;background:var(--surface-2);
  border:1px solid var(--line2);font-size:13.2px;line-height:1.85;
}
.q-sol.show{display:block}
.q-sol .lb{color:var(--teal);font-size:10.5px;letter-spacing:.12em;font-weight:600;display:block;margin-bottom:6px}

.qz-result{
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:18px 20px;margin:0 0 20px;
  border:1px solid var(--line);border-radius:11px;background:var(--surface-2);
}
.qz-result .big{font-family:var(--serif);font-size:42px;line-height:1;color:var(--accent)}
.qz-result .big em{font-style:normal;font-size:15px;color:var(--muted)}
.qz-result .txt{font-size:13px;color:var(--ink2);line-height:1.95;flex:1;min-width:200px}
.qz-act{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap;align-items:center}
.qz-act button{
  font-family:var(--sans);font-size:13px;padding:9px 22px;border-radius:8px;cursor:pointer;
  border:1px solid var(--accent);background:var(--accent);color:#fff;transition:.15s;
}
.qz-act button:hover{filter:brightness(1.08)}
.qz-act button.ghost{background:transparent;color:var(--ink2);border-color:var(--line2)}
.qz-act button.ghost:hover{border-color:var(--accent);color:var(--accent);filter:none}

/* ---------- 谬误侦探 ---------- */
.fl{border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:16px 18px;margin-bottom:12px}
.fl.answered{border-color:var(--line2)}
.fl-h{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.fl-no{font-family:var(--serif);font-size:12px;color:var(--accent);min-width:20px;letter-spacing:.04em}
.fl-h b{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.01em}
.fl-tag{margin-left:auto;font-size:10.5px;color:var(--muted);border:1px solid var(--line2);padding:1px 9px;border-radius:10px;white-space:nowrap}
.fl-g,.fl-claim{font-size:13.6px;line-height:1.85;margin-bottom:4px}
.fl-g .lb,.fl-claim .lb{color:var(--muted);font-size:10.5px;letter-spacing:.1em;margin-right:7px;font-weight:600}
.fl-claim{color:var(--ink);margin-bottom:13px}
.fl-claim em{font-style:normal;color:var(--accent)}
.fl-steps{margin:0 0 4px}
.fl-step{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:8px;
  margin-bottom:6px;cursor:pointer;font-size:13.5px;line-height:1.8;background:var(--surface);transition:.14s}
.fl-step:hover{border-color:var(--accent-line);background:var(--surface-2)}
.fl-step .i{width:20px;height:20px;flex:0 0 20px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line2);
  display:grid;place-items:center;font-size:11px;color:var(--muted);margin-top:2px;font-family:var(--serif)}
.fl-step>div{flex:1;min-width:0}
.fl-step.right{border-color:var(--green);background:var(--green-soft)}
.fl-step.right .i{background:var(--green);border-color:var(--green);color:#fff}
.fl-step.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fl-step.wrong .i{background:var(--bad);border-color:var(--bad);color:#fff}
.fl-step.loc{border-color:var(--amber);background:var(--amber-soft);box-shadow:0 0 0 2px var(--amber-soft)}
.fl-step.loc .i{background:var(--amber);border-color:var(--amber);color:#fff}
.fl-step.done{cursor:default}
.fl-step.done:hover{border-color:var(--line);background:var(--surface)}
.fl-act{display:flex;gap:8px;margin-top:4px}
.fl-act button{font-family:var(--sans);font-size:11.5px;padding:5px 13px;border-radius:16px;border:1px solid var(--line2);
  background:transparent;color:var(--ink2);cursor:pointer;transition:.14s}
.fl-act button:hover{border-color:var(--accent);color:var(--accent)}
.fl-fb{display:none;margin-top:11px;padding:12px 15px;border-radius:8px;font-size:13.2px;line-height:1.85;
  border:1px solid var(--line2);background:var(--surface-2)}
.fl-fb.show{display:block}
.fl-fb.ok{border-color:var(--green);background:var(--green-soft)}
.fl-fb.no{border-color:var(--bad);background:var(--bad-soft)}
.fl-fb .verdict-lb{display:block;font-size:10.5px;letter-spacing:.12em;font-weight:600;margin-bottom:6px}
.fl-fb.ok .verdict-lb{color:var(--green)}
.fl-fb.no .verdict-lb{color:var(--bad)}

/* ---------- 命令面板 & 阅读进度 ---------- */
#rdbar{position:fixed;top:0;left:0;height:2px;width:0;background:var(--accent);z-index:60;transition:width .08s linear;pointer-events:none}
#pal{position:fixed;inset:0;z-index:90;display:none;align-items:flex-start;justify-content:center;
  padding-top:11vh;background:rgba(30,24,16,.34);backdrop-filter:blur(3px)}
#pal.on{display:flex}
.pal-box{width:min(620px,92vw);background:var(--surface);border:1px solid var(--line2);border-radius:14px;
  box-shadow:0 26px 64px -22px rgba(0,0,0,.4);overflow:hidden}
.pal-box input{width:100%;border:0;background:transparent;padding:17px 20px;font-size:15.5px;color:var(--ink);
  outline:none;font-family:var(--sans);border-bottom:1px solid var(--line)}
.pal-box input::placeholder{color:var(--muted)}
.pal-list{max-height:54vh;overflow-y:auto;padding:6px}
.pal-item{display:flex;gap:12px;align-items:baseline;padding:9px 13px;border-radius:8px;cursor:pointer;font-size:13.5px;line-height:1.6}
.pal-item .g{font-size:10.5px;color:var(--muted);white-space:nowrap;min-width:92px;letter-spacing:.02em}
.pal-item .t{flex:1;min-width:0}
.pal-item.sel{background:var(--accent-soft)}
.pal-item.sel .t{color:var(--accent)}
.pal-empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}
.pal-foot{padding:8px 15px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);letter-spacing:.03em}
@media print{#pal,#rdbar{display:none}}

/* mobile */
#mask{display:none;position:fixed;inset:0;background:rgba(30,24,16,.35);z-index:35;backdrop-filter:blur(2px)}
@media (max-width:900px){
  #side{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:0 0 40px rgba(0,0,0,.18)}
  body.nav #side{transform:none}
  body.nav #mask{display:block}
  #burger{display:grid}
  #doc{padding:28px 18px 16px}
  #bar{padding:0 16px}
  #pager{padding:8px 18px 40px;grid-template-columns:1fr}
  .pg.next{grid-column:1;text-align:left}
  .ch-head h1{font-size:26px}
  h2#sec-title{font-size:20px}
  .ex-tools,.ex-hint,.ex-sol{margin-left:0;padding-left:13px;padding-right:13px}
  .ex-tools{padding-left:17px}
}
@media print{
  #side,#bar,#pager,footer,.ex-tools,.markdone{display:none!important}
  #doc{max-width:none;padding:0}
  .ex-sol,.ex-hint{display:block!important}
  body{background:#fff}
}
/* ===================================================================
   深色视觉系统 —— 按 landing-page-design 的 Part B 重构
   单一强调色 · 无衬线 · 8pt 节奏 · 统一缓动 · 状态可辨
   =================================================================== */

:root,[data-theme="dark"],[data-theme="light"]{
  --paper:#0A0A0A; --surface:#111111; --surface-2:#171717;
  --ink:#F5F5F5; --ink2:#A8A8A8; --muted:#7C7C7C;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --accent:#E07856; --accent-soft:rgba(224,120,86,.12); --accent-line:rgba(224,120,86,.32);
  --teal:#7FA8A3; --teal-soft:rgba(127,168,163,.10);
  --green:#86A97F; --green-soft:rgba(134,169,127,.10);
  --amber:#D2A45C; --amber-soft:rgba(210,164,92,.10);
  --bad:#E06A55; --bad-soft:rgba(224,106,85,.10);
  --shadow:0 24px 48px -32px rgba(0,0,0,.9);
  --sans:"Manrope","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  --serif:var(--sans);
}

html{background:#0A0A0A}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.75; letter-spacing:.004em;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(224,120,86,.28);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:6px;border:3px solid #0A0A0A}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.24)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
button:focus-visible,a:focus-visible{outline-offset:3px}

/* ---------- 骨架 ---------- */
#side{width:284px;flex:0 0 284px;background:#0A0A0A;border-right:1px solid var(--line)}
.brand{padding:24px 22px 20px;gap:13px}
.mark{
  width:40px;height:40px;flex:0 0 40px;border-radius:10px;
  font-family:var(--sans);font-size:18px;font-weight:700;color:#0A0A0A;
  box-shadow:none;letter-spacing:0;
}
.brand h1{font-family:var(--sans);font-size:15px;font-weight:600;letter-spacing:.01em;line-height:1.4}
.brand p{font-size:10.5px;color:var(--muted);line-height:1.6;margin-top:4px}

.gauge{padding:16px 22px 18px;border-bottom:1px solid var(--line)}
.gauge-row{font-size:11px;margin-bottom:9px;letter-spacing:.04em}
.gauge-row b{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--accent)}
.bar{height:3px;border-radius:2px;background:rgba(255,255,255,.08)}
.bar>i{background:var(--accent);border-radius:2px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.gauge-sub{font-size:10.5px;margin-top:9px}

.navbtn{
  margin:8px 14px 0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:#0F0F0F;transition:border-color .18s cubic-bezier(.22,1,.36,1),background .18s;
}
.navbtn:hover{border-color:var(--line2);background:#161616;color:var(--ink)}
.navbtn.on{border-color:var(--accent-line);background:var(--accent-soft)}
.navbtn b{font-size:13px;font-weight:500;color:var(--ink)}
.navbtn span{font-size:10.5px;color:var(--muted)}
.navbtn.on b{color:var(--accent)}
.navbtn .bdg{background:var(--accent);color:#0A0A0A;font-weight:600}

#tree{padding:14px 12px 32px}
#tree::-webkit-scrollbar{width:8px}
#tree::-webkit-scrollbar-thumb{border-width:2px}
.ch-h{padding:9px 10px;border-radius:8px;gap:10px}
.ch-h:hover{background:#141414}
.ch-n{
  width:22px;height:22px;flex:0 0 22px;border-radius:6px;background:#171717;
  font-family:var(--mono);font-size:11px;font-weight:500;color:#8A8A8A;
}
.ch.on .ch-n{background:var(--accent);color:#0A0A0A}
.ch-h b{font-size:13.5px;font-weight:500}
.ch-s{padding:2px 0 10px}
.sec{
  padding:7px 10px 7px 30px;border-radius:7px;font-size:13px;line-height:1.5;
  border-left:2px solid transparent;
}
.sec:hover{background:#141414;color:var(--ink)}
.sec.on{background:var(--accent-soft);color:var(--accent);font-weight:500;border-left-color:var(--accent)}
.sec .dot{width:4px;height:4px;flex:0 0 4px;margin-top:8px;border-color:rgba(255,255,255,.22)}
.sec.d .dot{background:var(--green);border-color:var(--green);box-shadow:none}
.ch-div{margin:18px 6px 8px;border-top-color:var(--line)}
.ch-div b{font-size:10.5px;letter-spacing:.14em;color:var(--accent)}
.ch-div i{font-size:10px}

#bar{
  height:56px;padding:0 40px;border-bottom:1px solid var(--line);
  background:rgba(10,10,10,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
#bar .crumb{font-size:12.5px;color:var(--muted)}
#bar .crumb b{color:var(--ink2);font-weight:500}
.iconbtn{
  width:32px;height:32px;border-radius:8px;border:1px solid var(--line);
  background:transparent;color:var(--ink2);
  transition:border-color .18s,background .18s,color .18s;
}
.iconbtn:hover{border-color:var(--line2);background:#171717;color:var(--ink);transform:none}

#doc{padding:56px 40px 24px;max-width:820px}
#pager{max-width:820px;padding:8px 40px 64px;gap:14px}
.pg{
  padding:16px 18px;border-radius:12px;border:1px solid var(--line);background:#0F0F0F;
  transition:border-color .2s cubic-bezier(.22,1,.36,1),transform .2s cubic-bezier(.22,1,.36,1);
}
.pg:hover{border-color:var(--accent-line);box-shadow:none;transform:translateY(-2px)}
.pg span{font-size:11px;color:var(--muted);letter-spacing:.04em}
.pg b{font-size:14px;font-weight:500}
footer{border-top:1px solid var(--line);font-size:11.5px}

/* ---------- 正文排版 ---------- */
.ch-head{margin-bottom:40px;padding-bottom:28px;border-bottom:1px solid var(--line)}
.ch-kicker{
  font-size:10.5px;letter-spacing:.18em;color:var(--accent);font-weight:600;
  margin-bottom:14px;
}
.ch-kicker::after{background:var(--accent-line);opacity:.45}
.ch-head h1{
  font-family:var(--sans);font-size:clamp(30px,4.2vw,44px);font-weight:600;
  line-height:1.14;letter-spacing:-.02em;margin-bottom:16px;
}
.ch-head h1 em{font-style:normal;color:var(--accent);font-weight:600}
.ch-desc{font-size:16px;color:var(--ink2);line-height:1.8;max-width:660px}

h2#sec-title{
  font-family:var(--sans);font-size:clamp(23px,2.8vw,30px);font-weight:600;
  line-height:1.28;letter-spacing:-.015em;margin:0 0 8px;
}
.sec-meta{font-size:11.5px;margin-bottom:32px;letter-spacing:.05em}
h3{
  font-family:var(--sans);font-size:18px;font-weight:600;line-height:1.5;
  margin:40px 0 14px;letter-spacing:-.005em;
}
h3::before{
  content:"";display:inline-block;width:14px;height:2px;border-radius:1px;
  background:var(--accent);vertical-align:middle;margin-right:10px;opacity:.9;
  position:static;
}
p{margin:0 0 16px}
p.lead{font-size:18px;color:#C9C9C9;line-height:1.82}
ul,ol{margin:0 0 18px;padding-left:1.4em}
li{margin-bottom:8px}
li::marker{color:var(--muted)}
a{color:var(--accent);border-bottom:1px solid var(--accent-line)}
a:hover{border-bottom-color:var(--accent)}
b,strong{font-weight:600;color:var(--ink)}
k{color:var(--accent)}
code{
  font-family:var(--mono);font-size:.86em;background:#1A1A1A;
  padding:1px 6px;border-radius:5px;border:1px solid var(--line);
}
hr{border-top:1px solid var(--line);margin:36px 0}
m{font-family:var(--math);font-size:1.05em;letter-spacing:.01em}
.f{
  background:#141414;border:1px solid var(--line);border-radius:12px;
  padding:20px 16px;margin:24px 0;font-size:20px;line-height:1.9;
}
.f small{font-size:11.5px;color:var(--muted)}

/* ---------- 定义 / 定理 / 提示 ---------- */
.def,.thm,.tip,.warn{
  border-radius:12px;padding:18px 20px 16px;margin:24px 0;
  font-size:15.5px;line-height:1.8;background:#0F0F0F;border:1px solid var(--line);
  border-left-width:2px;
}
.def{border-left-color:var(--accent);background:rgba(224,120,86,.045);border-color:var(--line)}
.thm{border-left-color:var(--teal);background:rgba(127,168,163,.045);border-color:var(--line)}
.tip{border-left-color:var(--green);background:rgba(134,169,127,.045);border-color:var(--line)}
.warn{border-left-color:var(--amber);background:rgba(210,164,92,.05);border-color:var(--line)}
.def .lb,.thm .lb,.tip .lb,.warn .lb{font-size:10.5px;letter-spacing:.14em;margin-bottom:8px}
.def .lb{color:var(--accent)} .thm .lb{color:var(--teal)}
.tip .lb{color:var(--green)} .warn .lb{color:var(--amber)}

/* ---------- 表格 ---------- */
.tbl{
  font-size:14px;background:#0F0F0F;border:1px solid var(--line);
  border-radius:12px;margin:22px 0;
}
.tbl th{
  background:#151515;font-size:11.5px;letter-spacing:.06em;color:var(--ink2);
  font-weight:600;padding:12px 15px;border-bottom:1px solid var(--line2);
}
.tbl td{padding:12px 15px;border-bottom:1px solid var(--line);line-height:1.7}
.tbl-wrap{border-radius:12px;margin:22px 0}
.tbl-wrap .tbl{margin:0}

/* ---------- 习题卡 ---------- */
.exs{margin:32px 0 8px}
.exs-h{font-size:11px;letter-spacing:.14em;color:var(--muted);margin-bottom:14px}
.exs-h em{color:var(--accent)}
.ex{
  border:1px solid var(--line);border-radius:14px;background:#0F0F0F;
  margin-bottom:12px;transition:border-color .2s cubic-bezier(.22,1,.36,1);
}
.ex:hover{border-color:var(--line2)}
.ex.done{border-color:rgba(134,169,127,.4);background:#0F0F0F}
.ex-q{font-size:15.5px;padding:18px 20px 14px;line-height:1.8}
.ex-n{
  width:22px;height:22px;flex:0 0 22px;border-radius:6px;background:#171717;
  border:1px solid var(--line2);font-family:var(--mono);font-size:11px;color:var(--muted);
}
.ex.done .ex-n{background:var(--green);border-color:var(--green);color:#0A0A0A}
.ex-tools{padding:0 20px 16px 54px;gap:8px}
.tbtn{
  font-size:12px;padding:5px 12px;border-radius:8px;border:1px solid var(--line2);
  background:transparent;color:var(--ink2);
  transition:border-color .18s,color .18s,background .18s;
}
.tbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tbtn.on{background:var(--accent);border-color:var(--accent);color:#0A0A0A}
.ex-hint,.ex-sol{margin:0 20px 16px 54px;padding:15px 17px;border-radius:10px;font-size:14px}
.ex-hint{background:rgba(210,164,92,.06);border:1px solid rgba(210,164,92,.32)}
.ex-sol{background:#141414;border:1px solid var(--line2)}
.ex-sol .st>i{background:var(--teal);color:#0A0A0A;border-radius:5px}
.ex-sol .an{border-top:1px dashed var(--line2);font-size:14px}
.ex-mark{font-size:12px;color:var(--muted)}
.mbtn{
  font-size:11.5px;padding:4px 11px;border-radius:999px;border:1px solid var(--line2);
  background:transparent;color:var(--ink2);
}
.mbtn.yes:hover,.mbtn.yes.on{background:var(--green);border-color:var(--green);color:#0A0A0A}
.mbtn.no:hover,.mbtn.no.on{background:var(--amber);border-color:var(--amber);color:#0A0A0A}

.markdone{
  margin:40px 0 8px;padding:18px 20px;border:1px solid var(--line);border-radius:14px;
  background:#0F0F0F;font-size:13px;color:var(--ink2);
}
.markdone button{
  font-size:13px;padding:9px 20px;border-radius:8px;border:1px solid var(--ink);
  background:var(--ink);color:#0A0A0A;font-weight:500;
  transition:opacity .18s,transform .18s;
}
.markdone button:hover{filter:none;opacity:.9;transform:translateY(-1px)}
.markdone.done{border-color:rgba(134,169,127,.4);background:rgba(134,169,127,.05)}
.markdone.done button{background:var(--green);border-color:var(--green);color:#0A0A0A}
.chapend button{
  font-size:12.5px;padding:9px 20px;border-radius:8px;border:1px solid var(--line2);
  background:transparent;color:var(--ink2);
}
.chapend button:hover{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* ---------- 交互组件外壳 ---------- */
.w{
  margin:28px 0;border:1px solid var(--line);border-radius:16px;background:#0F0F0F;
  box-shadow:none;
}
.w-h{
  padding:13px 18px;border-bottom:1px solid var(--line);background:#141414;
  font-size:12px;letter-spacing:.04em;color:var(--ink2);
}
.w-h .sq{width:6px;height:6px;border-radius:2px;background:var(--accent);flex:0 0 6px}
.w-h em{font-size:11px;color:var(--muted)}
.w-b{padding:20px}
.w-cap{font-size:12px;color:var(--muted);line-height:1.7;padding:0 18px 16px}
.w-ctl{gap:12px 20px;margin-bottom:18px}
.kv{font-size:12.5px;color:var(--ink2)}
.w-btn,.w-btn.sm{
  font-size:12px;padding:6px 13px;border-radius:8px;border:1px solid var(--line2);
  background:#141414;color:var(--ink2);
  transition:border-color .18s,color .18s,background .18s;
}
.w-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.w-btn.on{background:var(--accent);border-color:var(--accent);color:#0A0A0A}
.chip{
  padding:4px 11px;border-radius:999px;font-size:12px;border:1px solid var(--line2);
  background:#141414;color:var(--ink2);
}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#0A0A0A;font-weight:500}
input[type=range]{background:rgba(255,255,255,.14);height:3px}
input[type=range]::-webkit-slider-thumb{border-color:#0F0F0F;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
input[type=range]::-moz-range-thumb{border-color:#0F0F0F}
.euclid-in,.eu-in,.dfa-str{
  background:#0A0A0A;border:1px solid var(--line2);color:var(--ink);border-radius:8px;
}
.eu-in:focus,.dfa-str:focus,.lc-in:focus{border-color:var(--accent)}
.eu-tbl th,.eu-tbl td{border-bottom-color:var(--line)}
.eu-tbl tr.last td{background:rgba(127,168,163,.10);color:var(--teal)}
.rsa-box{background:#141414;border-color:var(--line2);border-radius:10px}
.rsa-box.pub{background:rgba(224,120,86,.08);border-color:var(--accent-line)}
.rsa-box.priv{background:rgba(127,168,163,.08);border-color:rgba(127,168,163,.3)}
.rsa-step{color:var(--ink2)}
.lc-in{background:#0A0A0A;border-color:var(--line2);color:var(--ink)}
.lc-key button{background:#141414;border-color:var(--line2);color:var(--ink2)}
.lc-key button:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.km-cell,.rl-cell,.bs-cell{background:#141414;border-color:var(--line2);color:var(--ink2)}
.km-cell.one{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.km-cell.hi{box-shadow:none;background:rgba(127,168,163,.14);border-color:var(--teal);color:var(--teal)}
.km-term{background:#141414;border-color:var(--line2)}
.km-term.on{background:rgba(127,168,163,.12);border-color:var(--teal);color:var(--teal)}
.bs-cell.mid{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.bs-cell.hit{background:rgba(127,168,163,.12);border-color:var(--teal);color:var(--teal)}

/* ---------- 速查手册 ---------- */
.pills{
  top:56px;padding:10px 12px;border-radius:12px;background:rgba(16,16,16,.86);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line);
}
.pills button{
  font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--line2);
  background:#141414;color:var(--ink2);
}
.pills button:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pills .pr{border-color:var(--accent-line);color:var(--accent);background:transparent}
.sheet{margin-bottom:48px}
.sheet h2{font-family:var(--sans);font-size:22px;font-weight:600;letter-spacing:-.01em}
.sheet .sub{font-size:11.5px;border-bottom-color:var(--line)}
.sheet h3{font-size:15px;margin:26px 0 10px}
.sheet h3::before{width:10px;height:2px;margin-right:8px}
.tbl.dense td,.tbl.dense th{padding:9px 11px;font-size:13px}
.sheet .f{padding:14px;font-size:17px}

/* ---------- 自测卷 ---------- */
.qz-grid{gap:14px}
.qz-card{
  padding:20px;border-radius:14px;border:1px solid var(--line);background:#0F0F0F;
  transition:border-color .2s cubic-bezier(.22,1,.36,1),transform .2s cubic-bezier(.22,1,.36,1);
}
.qz-card:hover{border-color:var(--accent-line);box-shadow:none;transform:translateY(-2px)}
.qz-card.done{border-color:rgba(134,169,127,.4)}
.qz-card .no{font-size:10.5px;letter-spacing:.14em;color:var(--accent)}
.qz-card h3{font-family:var(--sans);font-size:16px;margin-top:7px}
.qz-card .meta{font-size:11.5px;color:var(--muted);margin-top:10px}
.qz-card .sc{font-family:var(--sans);font-size:22px;color:var(--accent);font-weight:500}
.qz-bar{
  top:56px;padding:11px 16px;border-radius:12px;background:#141414;border:1px solid var(--line);
  font-size:12.5px;
}
.qz-bar b{font-family:var(--mono);font-size:13px}
.q{padding:22px 0}
.q-stem{font-size:15.5px;line-height:1.8}
.q-no{
  width:24px;height:24px;flex:0 0 24px;border-radius:7px;background:#171717;
  border:1px solid var(--line2);font-family:var(--mono);font-size:11px;
}
.q-opt{
  padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:#0F0F0F;
  font-size:14.5px;
}
.q-opt:hover{border-color:var(--accent-line);background:#141414}
.q-opt .k{
  width:21px;height:21px;flex:0 0 21px;border-radius:6px;border:1px solid var(--line2);
  font-family:var(--mono);font-size:10.5px;
}
.q-opt.sel{border-color:var(--teal);background:rgba(127,168,163,.10)}
.q-opt.sel .k{background:var(--teal);border-color:var(--teal);color:#0A0A0A}
.q-opt.ok{border-color:var(--green);background:rgba(134,169,127,.10)}
.q-opt.ok .k{background:var(--green);border-color:var(--green);color:#0A0A0A}
.q-opt.bad{border-color:var(--bad);background:rgba(224,106,85,.10)}
.q-opt.bad .k{background:var(--bad);border-color:var(--bad);color:#0A0A0A}
.q-sol{background:#141414;border:1px solid var(--line2);border-radius:10px;font-size:13.5px}
.qz-result{background:#141414;border:1px solid var(--line);border-radius:14px;padding:22px}
.qz-result .big{font-family:var(--sans);font-size:46px;font-weight:600;color:var(--accent)}
.qz-result .txt{font-size:13px}
.qz-act button{
  font-size:13px;padding:10px 22px;border-radius:8px;border:1px solid var(--ink);
  background:var(--ink);color:#0A0A0A;font-weight:500;
}
.qz-act button:hover{filter:none;opacity:.9}
.qz-act button.ghost{background:transparent;color:var(--ink2);border-color:var(--line2)}
.qz-act button.ghost:hover{border-color:var(--ink2);color:var(--ink)}

/* ---------- 谬误侦探 ---------- */
.fl{border:1px solid var(--line);border-radius:14px;background:#0F0F0F;padding:20px;margin-bottom:14px}
.fl.answered{border-color:var(--line2)}
.fl-no{font-family:var(--mono);font-size:11px;color:var(--accent)}
.fl-h b{font-family:var(--sans);font-size:16px}
.fl-tag{font-size:10.5px;border-color:var(--line2);color:var(--muted)}
.fl-g,.fl-claim{font-size:14px;line-height:1.8}
.fl-step{
  padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:#0F0F0F;
  font-size:14px;margin-bottom:7px;
}
.fl-step:hover{border-color:var(--accent-line);background:#141414}
.fl-step .i{
  width:21px;height:21px;flex:0 0 21px;border-radius:6px;background:#171717;
  border:1px solid var(--line2);font-family:var(--mono);font-size:10.5px;
}
.fl-step.right{border-color:var(--green);background:rgba(134,169,127,.10)}
.fl-step.right .i{background:var(--green);border-color:var(--green);color:#0A0A0A}
.fl-step.wrong{border-color:var(--bad);background:rgba(224,106,85,.10)}
.fl-step.wrong .i{background:var(--bad);border-color:var(--bad);color:#0A0A0A}
.fl-step.loc{border-color:var(--amber);background:rgba(210,164,92,.10);box-shadow:none}
.fl-step.loc .i{background:var(--amber);border-color:var(--amber);color:#0A0A0A}
.fl-step.done:hover{border-color:var(--line);background:#0F0F0F}
.fl-act button{font-size:11.5px;padding:6px 14px;border-radius:8px;border:1px solid var(--line2);color:var(--ink2)}
.fl-act button:hover{border-color:var(--accent);color:var(--accent)}
.fl-fb{background:#141414;border:1px solid var(--line2);border-radius:10px;font-size:13.5px}
.fl-fb.ok{border-color:var(--green);background:rgba(134,169,127,.08)}
.fl-fb.no{border-color:var(--bad);background:rgba(224,106,85,.08)}

/* ---------- 命令面板 ---------- */
#pal{background:rgba(0,0,0,.62);backdrop-filter:blur(6px)}
.pal-box{
  background:#111;border:1px solid var(--line2);border-radius:16px;
  box-shadow:0 32px 80px -24px rgba(0,0,0,.9);
}
.pal-box input{
  padding:18px 20px;font-size:16px;color:var(--ink);
  border-bottom:1px solid var(--line);font-family:var(--sans);
}
.pal-item{border-radius:8px;font-size:13.5px;padding:10px 13px}
.pal-item .g{font-size:10.5px;color:var(--muted)}
.pal-item.sel{background:var(--accent-soft)}
.pal-item.sel .t{color:var(--accent)}
.pal-foot{font-size:11px;color:var(--muted);border-top-color:var(--line)}
#mask{background:rgba(0,0,0,.62);backdrop-filter:blur(4px)}

/* ---------- 移动端 ---------- */
@media (max-width:900px){
  #side{box-shadow:0 0 60px rgba(0,0,0,.8)}
  #doc{padding:34px 20px 20px}
  #pager{padding:8px 20px 48px}
  #bar{padding:0 18px}
  .ch-head h1{font-size:30px}
  h2#sec-title{font-size:24px}
  .ch-head h1{letter-spacing:-.015em}
  .w-b{padding:16px}
  .pills{top:56px}
}

/* ---------- 打印：强制浅色 ---------- */
@media print{
  :root{
    --paper:#fff; --surface:#fff; --surface-2:#F7F7F7;
    --ink:#111; --ink2:#333; --muted:#666;
    --line:#DDD; --line2:#C8C8C8;
    --accent:#A63E2B; --accent-soft:#FAEDE8; --accent-line:#E8C9BE;
    --teal:#2C5F6E; --teal-soft:#E9F1F3;
    --green:#3E7550; --green-soft:#EBF3EC;
    --amber:#8A6212; --amber-soft:#FBF1DC;
  }
  body{background:#fff;color:#111;font-size:11pt;line-height:1.6}
  #doc{max-width:none;padding:0}
  .w,.ex,.fl,.qz-card,.def,.thm,.tip,.warn,.f,.tbl{background:#fff!important;box-shadow:none}
  .w-h,.tbl th{background:#F4F4F4!important}
  .ch-head h1{color:#111}
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

/* 交卷后的「再做一次」按钮 */
.qz-result .ghost{
  font-family:var(--sans);font-size:13px;padding:9px 18px;border-radius:8px;cursor:pointer;
  background:transparent;border:1px solid var(--line2);color:var(--ink2);
  transition:border-color .18s,color .18s;
}
.qz-result .ghost:hover{border-color:var(--ink2);color:var(--ink)}

/* 浅色强调块上的文字改为深色，保证对比度 */
.pasc .cl.on,.stepline .s.on{color:#0A0A0A}

@media print{
  .qz-bar,.q-opt,.q-sol,.fl-step,.fl-fb,.rsa-box,.markdone,.w-b{background:#fff!important;color:#111!important;border-color:#DDD!important}
  .fl-tag,.w-h em,.w-cap{color:#555!important}
  .qz-act,.fl-act,.w-ctl,.w-btn,.chip,.pills{display:none!important}
  .ch-kicker{color:#8A3A28!important}
  .ch-head h1 em{color:#8A3A28!important}
}

/* 速查页的小节标记：统一成短横线，去掉旧的 § */
.sheet h3::before{
  content:"";display:inline-block;width:10px;height:2px;border-radius:1px;
  background:var(--accent);vertical-align:middle;margin-right:8px;font-size:0;
}

</style>
</head>
<body>
<div id="rdbar"></div>
<div id="pal">
  <div class="pal-box">
    <input id="palIn" placeholder="搜章节、公式、自测卷…" spellcheck="false" autocomplete="off">
    <div class="pal-list" id="palList"></div>
    <div class="pal-foot">↑ ↓ 选择 · Enter 打开 · Esc 关闭 · Ctrl+K 随时唤起</div>
  </div>
</div>
<div id="app">
  <aside id="side">
    <div class="brand">
      <div class="mark">离</div>
      <div>
        <h1>离散数学 · 逐章精读</h1>
        <p>Rosen《离散数学及其应用》8e<br>本科教学版 · 8 章</p>
      </div>
    </div>
    <div class="gauge">
      <div class="gauge-row"><span>学习进度</span><b id="pct">0%</b></div>
      <div class="bar"><i id="pbar" style="width:0%"></i></div>
      <div class="gauge-sub"><span id="psec">0 / 0 节</span><span id="pex">0 题掌握</span></div>
    </div>
    <div class="navbtn" id="sumBtn">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2.5h6.5L13 5v8.5H4z"/><path d="M10 2.5V5h3"/><path d="M6 8h5M6 10.5h5"/></svg>
      <div><b>速查手册</b><span>全章知识点与公式</span></div>
    </div>
    <div class="navbtn" id="quizBtn">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M5.2 6.2l1.3 1.3 2.4-2.4"/><path d="M5.2 10.6h5.4"/></svg>
      <div><b>自测卷</b><span>13 套章测 + 2 套模拟</span></div>
      <span class="bdg" id="qzBadge">0</span>
    </div>
    <div class="navbtn" id="flawBtn">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.2L1.9 13.3h12.2z"/><path d="M8 6.2v3.2"/><path d="M8 11.6v.05"/></svg>
      <div><b>谬误侦探</b><span>点出证明错在哪一步</span></div>
    </div>
    <nav id="tree"></nav>
  </aside>
  <div id="mask"></div>
  <div id="main">
    <header id="bar">
      <button class="iconbtn" id="burger" aria-label="目录">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
      </button>
      <div class="crumb"><b id="crumb">—</b></div>
      <div class="sp"></div>
      <button class="iconbtn" id="palBtn" aria-label="搜索（Ctrl+K）">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5L14 14"/></svg>
      </button>
    </header>
    <article id="doc"></article>
    <nav id="pager"></nav>
    <footer>
      基于罗森《离散数学及其应用》原书第 8 版 · 本科教学版（机械工业出版社，徐六通 / 杨娟 / 吴斌 译）章节编号编排<br>
      进度自动保存在本机浏览器 · 建议用 Chrome / Edge 打开
    </footer>
  </div>
</div>

<script>
/* ================= framework ================= */
var CH = window.CH || {};
var W = {};                    /* widget registry */
var ORDER = [];                /* flat list of {ch, sid, title, chtitle} */
var KEY = 'dm.rosen.v1';

function load(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; }
}
var ST = load();
ST.sec = ST.sec || {};         /* sid -> 1 visited, 2 done */
ST.ex  = ST.ex  || {};         /* exid -> 'y' | 'n' */
ST.theme = ST.theme || 'light';
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(ST)); }catch(e){} }

function esc(s){ return s; }
function h(html){ return html; }

/* build flat order */
function buildOrder(){
  ORDER = [];
  var nums = Object.keys(CH).map(Number).sort(function(a,b){return a-b;});
  nums.forEach(function(n){
    CH[n].sections.forEach(function(s){
      ORDER.push({c:n, sid:s.id, t:s.title, ct:CH[n].title, s:s});
    });
  });
}

function scanEx(){
  EXALL = {};
  ORDER.forEach(function(o){
    (o.s.blocks||[]).forEach(function(b,i){
      if(b.t==='exs'){
        var g = b.id || ('g'+i);
        b.items.forEach(function(q,k){ EXALL[g+'-'+k] = true; });
      }
    });
  });
}

/* ---------- sidebar ---------- */
function buildTree(){
  var box = document.getElementById('tree'), out = '';
  var nums = Object.keys(CH).map(Number).sort(function(a,b){return a-b;});
  nums.forEach(function(n){
    if(n === 9) out += '<div class="ch-div"><b>全本补遗</b><i>本科教学版没收的 5 章</i></div>';
    var c = CH[n];
    var done = c.sections.filter(function(s){return ST.sec[s.id]===2;}).length;
    var cur = ST.cur && String(ST.cur).split('.')[0] == n;
    out += '<div class="ch'+(cur?' on open':'')+'" data-ch="'+n+'">';
    out += '<div class="ch-h" data-toggle="'+n+'">';
    out += '<span class="ch-n">'+n+'</span><b>'+(c.short||c.title)+'</b>';
    out += '<svg width="9" height="9" viewBox="0 0 8 8" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 1L5.5 4L2.5 7"/></svg>';
    out += '</div><div class="ch-s">';
    c.sections.forEach(function(s){
      var st = ST.sec[s.id]||0;
      var cls = 'sec'+(st===1?' v':'')+(st===2?' d':'')+(ST.cur===s.id?' on':'');
      out += '<div class="'+cls+'" data-sec="'+s.id+'"><span class="dot"></span><span>'+s.id+'&nbsp;&nbsp;'+s.title+'</span></div>';
    });
    out += '</div></div>';
  });
  box.innerHTML = out;
  var sb = document.getElementById('sumBtn'), qb = document.getElementById('quizBtn'), fb = document.getElementById('flawBtn');
  if(sb) sb.classList.toggle('on', ST.cur === 'sum');
  if(qb) qb.classList.toggle('on', ST.cur === 'quiz');
  if(fb) fb.classList.toggle('on', ST.cur === 'flaw');
  updateBadge();
  updateGauge();
}

function updateGauge(){
  var total = ORDER.length, done = 0, exok = 0;
  ORDER.forEach(function(o){ if(ST.sec[o.sid]===2) done++; });
  Object.keys(EXALL).forEach(function(k){ if(ST.ex[k]==='y') exok++; });
  var pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('pct').textContent = pct+'%';
  document.getElementById('pbar').style.width = pct+'%';
  document.getElementById('psec').textContent = done+' / '+total+' 节';
  document.getElementById('pex').textContent = exok+' 题掌握';
}
var EXALL = {};  /* exid -> true */

/* ---------- renderer ---------- */
var EXN = 0;

function renderBlocks(blocks){
  var out = '';
  blocks.forEach(function(b, i){
    var t = b.t;
    if(t==='p')    out += '<p'+(b.cls?' class="'+b.cls+'"':'')+'>'+b.h+'</p>';
    else if(t==='lead') out += '<p class="lead">'+b.h+'</p>';
    else if(t==='h3')   out += '<h3>'+b.h+'</h3>';
    else if(t==='hr')   out += '<hr>';
    else if(t==='ul')   out += '<ul>'+b.items.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>';
    else if(t==='ol')   out += '<ol>'+b.items.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ol>';
    else if(t==='f')    out += '<div class="f">'+b.h+(b.note?'<small>'+b.note+'</small>':'')+'</div>';
    else if(t==='def')  out += '<div class="def"><span class="lb">'+(b.lb||'定义')+'</span>'+b.h+'</div>';
    else if(t==='thm')  out += '<div class="thm"><span class="lb">'+(b.lb||'定理')+'</span>'+b.h+'</div>';
    else if(t==='tip')  out += '<div class="tip"><span class="lb">'+(b.lb||'要点')+'</span>'+b.h+'</div>';
    else if(t==='warn') out += '<div class="warn"><span class="lb">'+(b.lb||'易错')+'</span>'+b.h+'</div>';
    else if(t==='table'){
      out += '<div class="tbl-wrap"><table class="tbl"><thead><tr>'+
        b.head.map(function(x){return '<th'+(x.c?' class="c"':'')+'>'+x+'</th>';}).join('')+
        '</tr></thead><tbody>'+
        b.rows.map(function(r){
          return '<tr>'+r.map(function(x){
            var c = (x&&x.c)?' class="c"':'';
            var v = (x&&x.h!==undefined)?x.h:x;
            return '<td'+c+'>'+v+'</td>';
          }).join('')+'</tr>';
        }).join('')+'</tbody></table></div>';
    }
    else if(t==='ex'){
      out += '<div class="ex" data-ex="'+(b.id||'')+'"><div class="ex-q"><span class="ex-n">例</span>'+
        '<div class="ex-body">'+(b.title?'<p><b>'+b.title+'</b></p>':'')+b.q+'</div></div>'+
        '<div class="ex-tools"><button class="tbtn" data-act="sol">展开解答</button></div>'+
        '<div class="ex-sol"><span class="lb">解答</span>'+
        b.steps.map(function(s,k){return '<div class="st"><i>'+(k+1)+'</i><div>'+s+'</div></div>';}).join('')+
        (b.ans?'<div class="an"><b>答：</b>'+b.ans+'</div>':'')+
        '</div></div>';
    }
    else if(t==='exs'){
      var grp = b.id || ('g'+i);
      out += '<div class="exs"><div class="exs-h">练习 · '+b.items.length+' 题<em>先自己动笔，再展开</em></div>';
      b.items.forEach(function(q, k){
        var id = grp+'-'+k;
        EXALL[id] = true;
        var cls = 'ex'+(ST.ex[id]==='y'?' done':'');
        out += '<div class="'+cls+'" data-ex="'+id+'" data-key="'+id+'"><div class="ex-q"><span class="ex-n">'+(k+1)+'</span>'+
          '<div class="ex-body">'+q.q+'</div></div>'+
          '<div class="ex-tools">'+
            (q.hint?'<button class="tbtn" data-act="hint">提示</button>':'')+
            '<button class="tbtn" data-act="sol">看解析</button>'+
          '</div>'+
          (q.hint?'<div class="ex-hint"><span class="lb">提示</span>'+q.hint+'</div>':'')+
          '<div class="ex-sol"><span class="lb">解析</span>'+
          (q.steps||[]).map(function(s,k2){return '<div class="st"><i>'+(k2+1)+'</i><div>'+s+'</div></div>';}).join('')+
          (q.ans?'<div class="an"><b>答：</b>'+q.ans+'</div>':'')+
          '<div class="ex-mark"><span>现在清楚了吗</span>'+
            '<button class="mbtn yes'+(ST.ex[id]==='y'?' on':'')+'" data-act="yes">会了</button>'+
            '<button class="mbtn no'+(ST.ex[id]==='n'?' on':'')+'" data-act="no">还懵</button>'+
          '</div></div></div>';
      });
      out += '</div>';
    }
    else if(t==='w'){
      out += '<div class="w" data-w="'+b.id+'"></div>';
    }
    else if(t==='grid'){
      out += '<div class="grid2">'+b.items.map(function(x){
        return '<div class="gcell"><b>'+x.t+'</b><div>'+x.h+'</div></div>';
      }).join('')+'</div>';
    }
  });
  return out;
}

/* ---------- routing ---------- */
function go(sid, push){
  var o = ORDER.filter(function(x){return x.sid===sid;})[0];
  if(!o) return;
  ST.cur = sid;
  if(!ST.sec[sid]) ST.sec[sid] = 1;
  save();

  var c = CH[o.c];
  var secIdx = c.sections.indexOf(c.sections.filter(function(s){return s.id===sid;})[0]);
  var html = '';

  if(secIdx === 0){
    html += '<div class="ch-head">'+
      '<div class="ch-kicker">第 '+o.c+' 章 · Chapter '+o.c+(c.origin?'　全本原第 '+c.origin+' 章':'')+'</div>'+
      '<h1>'+c.title+(c.en?'<em> · '+c.en+'</em>':'')+'</h1>'+
      '<div class="ch-desc">'+c.intro+'</div></div>';
  }
  html += '<h2 id="sec-title">'+sid+'&nbsp;&nbsp;'+o.t+'</h2>';
  html += '<div class="sec-meta"><span>第 '+o.c+' 章 '+o.ct+'</span></div>';
  html += renderBlocks(o.s.blocks || []);

  var done = ST.sec[sid]===2;
  html += '<div class="markdone'+(done?' done':'')+'" data-mark="'+sid+'">'+
    '<span>'+(done?'本节已标记为学完，随时可以回来看。':'知识点读完了？标记一下，右侧进度会同步。')+'</span>'+
    '<button data-act="mark">'+(done?'✓ 已学完':'标记本节已学')+'</button></div>';

  var isLast = c.sections[c.sections.length-1].id === sid;
  if(isLast){
    html += '<div class="chapend"><button data-jumpsum="'+o.c+'">第 '+o.c+' 章知识点与公式速查 →</button></div>';
  }

  document.getElementById('doc').innerHTML = html;
  document.getElementById('crumb').innerHTML = '第 '+o.c+' 章 · '+o.ct+' <span style="opacity:.4">/</span> '+sid+' '+o.t;

  /* mount widgets */
  document.querySelectorAll('#doc [data-w]').forEach(function(el){
    var fn = W[el.getAttribute('data-w')];
    if(!fn){ el.outerHTML = '<div class="warn">组件 '+el.getAttribute('data-w')+' 未加载</div>'; return; }
    el.innerHTML = fn.html ? fn.html() : '';
    if(fn.mount) fn.mount(el);
  });

  buildTree();
  buildPager(sid);
  try{ if(push) history.replaceState(null,'','#'+sid); }catch(err){}
  window.scrollTo(0,0);
  document.body.classList.remove('nav');
  save();
}

function currentBlocks(sid){
  for(var i=0;i<ORDER.length;i++) if(ORDER[i].sid===sid) return ORDER[i].blocks;
  return [];
}

/* ---------- 自测卷 ---------- */
var QZSTATE = { pid:null, ans:{}, done:false };

function qzById(id){
  for(var i=0;i<QUIZ.length;i++) if(QUIZ[i].id===id) return QUIZ[i];
  return null;
}
function qzCorrect(q){ return q.t==='tf' ? (q.a?0:1) : q.a; }
function wrongCount(){ return Object.keys(ST.wrong||{}).length; }
function updateBadge(){
  var b = document.getElementById('qzBadge'); if(!b) return;
  var n = wrongCount();
  b.textContent = n;
  b.classList.toggle('show', n > 0);
}
function qHTML(q, i){
  var body = '';
  if(q.t==='tf'){
    body += '<div class="q-opt" data-opt="0"><span class="k">√</span><span>正确</span></div>';
    body += '<div class="q-opt" data-opt="1"><span class="k">×</span><span>错误</span></div>';
  } else {
    q.o.forEach(function(txt, k){
      body += '<div class="q-opt" data-opt="'+k+'"><span class="k">'+'ABCD'[k]+'</span><span>'+txt+'</span></div>';
    });
  }
  return '<div class="q" data-q="'+q.id+'">'+
    '<div class="q-stem"><span class="q-no">'+(i+1)+'</span><div>'+q.q+'</div></div>'+
    '<div class="q-opts">'+body+'</div>'+
    '<div class="q-sol"><span class="lb">解析</span>'+q.s+'</div></div>';
}
