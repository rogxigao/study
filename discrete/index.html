  sections: [

{
  id:'4.1', title:'递推关系的应用',
  blocks:[
    {t:'lead', h:'很多计数问题的答案不是「一个公式」，而是「一个自己依赖自己的公式」。这不是缺陷，而是一个可解的方程。'},
    {t:'def', lb:'递推关系', h:'<p>把序列 <m>{a<sub>n</sub>}</m> 的第 <m>n</m> 项用前面的项表示出来的方程，称为<b>递推关系</b>。配合<b>初始条件</b>（前几项的具体值），就能唯一确定整个序列。</p>'},
    {t:'warn', h:'<p>只有递推关系不够，<b>必须给初始条件</b>。同一个递推 <m>a<sub>n</sub> = 2a<sub>n−1</sub></m>，配 <m>a<sub>1</sub>=1</m> 得 <m>2<sup>n−1</sup></m>，配 <m>a<sub>1</sub>=5</m> 得 <m>5·2<sup>n−1</sup></m>——完全不同的序列。</p>'},
    {t:'w', id:'hanoi'},
    {t:'h3', h:'三个必须会建的模型'},
    {t:'p', h:'<b>① 斐波那契（兔子问题）</b>：<m>f<sub>n</sub> = f<sub>n−1</sub> + f<sub>n−2</sub></m>，<m>f<sub>1</sub>=f<sub>2</sub>=1</m>。每个月的兔子数 = 上个月已有的 + 上上个月新生的（因为每对成年兔每月生一对，且需要一个月成熟）。'},
    {t:'p', h:'<b>② 汉诺塔</b>：<m>H(n) = 2H(n−1) + 1</m>，<m>H(1)=1</m>，解得 <m>H(n) = 2<sup>n</sup> − 1</m>。'},
    {t:'p', h:'<b>③ 字符串计数</b>：长度为 <m>n</m> 且不含连续两个 0 的二进制串有多少个？设 <m>a<sub>n</sub></m> 为答案。按最后一位分类：末位是 1，前 <m>n−1</m> 位任意（<m>a<sub>n−1</sub></m>）；末位是 0，则倒数第二位必须是 1，前 <m>n−2</m> 位任意（<m>a<sub>n−2</sub></m>）。于是 <m>a<sub>n</sub> = a<sub>n−1</sub> + a<sub>n−2</sub></m>，又是斐波那契。'},

    {t:'ex', title:'例 1　带限制的字符串', q:'用 A、B、C 组成长度为 n 的字符串，要求不能出现连续两个 A。求递推关系。',
      steps:[
        '设 <m>a<sub>n</sub></m> 为符合条件的串数。按最后一位分类。',
        '末位不是 A（是 B 或 C）：前 <m>n−1</m> 位只需满足条件，有 <m>a<sub>n−1</sub></m> 种，末位 2 种选法，贡献 <m>2a<sub>n−1</sub></m>。',
        '末位是 A：则倒数第二位不能是 A，即前 <m>n−1</m> 位必须以 B 或 C 结尾。换个角度：末两位是 BA 或 CA，前 <m>n−2</m> 位只需满足条件，贡献 <m>2a<sub>n−2</sub></m>。',
        '所以 <m>a<sub>n</sub> = 2a<sub>n−1</sub> + 2a<sub>n−2</sub></m>，初值 <m>a<sub>1</sub>=3, a<sub>2</sub>=8</m>。'
      ], ans:'<m>a<sub>n</sub> = 2a<sub>n−1</sub> + 2a<sub>n−2</sub></m>'},

    {t:'exs', id:'4.1', items:[
      {q:'一个 1×n 的走廊要铺 1×1 和 1×2 的瓷砖，有多少种铺法？',
       hint:'看最左边那一块铺的是哪种。',
       steps:['设 <m>a<sub>n</sub></m> 为铺法数。','若最左放 1×1，剩下 n−1 长度：<m>a<sub>n−1</sub></m> 种。','若最左放 1×2，剩下 n−2 长度：<m>a<sub>n−2</sub></m> 种。','<m>a<sub>n</sub> = a<sub>n−1</sub>+a<sub>n−2</sub></m>，<m>a<sub>1</sub>=1, a<sub>2</sub>=2</m>——又是斐波那契（偏移一位）。'],
       ans:'<m>a<sub>n</sub> = a<sub>n−1</sub>+a<sub>n−2</sub></m>，<m>a<sub>n</sub> = f<sub>n+1</sub></m>'},
      {q:'求 <m>H(10)</m>，其中 <m>H(n)=2H(n−1)+1</m>，<m>H(1)=1</m>。',
       hint:'用闭式 <m>2<sup>n</sup>−1</m>。',
       steps:['<m>H(10) = 2<sup>10</sup> − 1</m>。','<m>= 1024 − 1</m>。'],
       ans:'1023'},
      {q:'数列 <m>a<sub>n</sub> = a<sub>n−1</sub> + n</m>，<m>a<sub>1</sub> = 1</m>，求 <m>a<sub>n</sub></m> 的闭式。',
       hint:'把它展开成求和。',
       steps:['<m>a<sub>n</sub> = a<sub>n−1</sub>+n = a<sub>n−2</sub>+(n−1)+n = ⋯</m>','<m>= a<sub>1</sub> + 2 + 3 + ⋯ + n</m>','<m>= 1 + (2+3+⋯+n) = n(n+1)/2</m>'],
       ans:'<m>a<sub>n</sub> = n(n+1)/2</m>'}
    ]}
  ]
},

{
  id:'4.2', title:'求解线性递推关系',
  blocks:[
    {t:'lead', h:'形如 <m>a<sub>n</sub> = c<sub>1</sub>a<sub>n−1</sub> + ⋯ + c<sub>k</sub>a<sub>n−k</sub></m> 的递推，有一套机械的解法：<b>把递推变成特征方程，解方程求根，再按根的形式写通解</b>。'},
    {t:'thm', lb:'二阶齐次递推的解法', h:'<p>对 <m>a<sub>n</sub> = pa<sub>n−1</sub> + qa<sub>n−2</sub></m>，写出<b>特征方程</b></p><div class="f" style="margin:8px 0">r<sup>2</sup> − pr − q = 0</div><p>设两根为 <m>r<sub>1</sub>, r<sub>2</sub></m>：</p><ul style="margin:6px 0 0"><li>若 <m>r<sub>1</sub> ≠ r<sub>2</sub></m>（实根）：<m>a<sub>n</sub> = αr<sub>1</sub><sup>n</sup> + βr<sub>2</sub><sup>n</sup></m></li><li>若 <m>r<sub>1</sub> = r<sub>2</sub> = r</m>（重根）：<m>a<sub>n</sub> = (α + βn)r<sup>n</sup></m></li></ul><p><m>α, β</m> 由初始条件确定。</p>'},
    {t:'p', h:'<b>为什么是 <m>r<sup>n</sup></m>？</b>因为如果假设解形如 <m>a<sub>n</sub> = r<sup>n</sup></m>，代入递推得 <m>r<sup>n</sup> = pr<sup>n−1</sup> + qr<sup>n−2</sup></m>，两边除以 <m>r<sup>n−2</sup></m> 就得 <m>r<sup>2</sup> = pr + q</m>——正是特征方程。'},
    {t:'w', id:'linrec'},
    {t:'warn', h:'<p><b>重根时为什么要乘 <m>n</m>？</b>因为两个根相同时，<m>r<sup>n</sup></m> 和 <m>r<sup>n</sup></m> 是同一个解，凑不出所有初值组合。乘个 <m>n</m> 就得到了线性无关的第二个解——这和微分方程里重根要乘 <m>x</m> 是同一回事。</p>'},
    {t:'p', h:'<b>非齐次情形</b>（右边多一项，如 <m>a<sub>n</sub> = 2a<sub>n−1</sub> + 1</m>）的处理是：先求齐次通解，再猜一个特解，两者相加。汉诺塔就属于这一类，猜 <m>a<sub>n</sub> = c</m> 得 <m>c = 2c+1</m>，即 <m>c = −1</m>，所以解形如 <m>α·2<sup>n</sup> − 1</m>。'},

    {t:'ex', title:'例 1　斐波那契的通项', q:'解 <m>f<sub>n</sub> = f<sub>n−1</sub> + f<sub>n−2</sub></m>，<m>f<sub>1</sub>=f<sub>2</sub>=1</m>。',
      steps:[
        '特征方程 <m>r<sup>2</sup> − r − 1 = 0</m>，根为 <m>r = (1 ± √5)/2</m>。记 <m>φ = (1+√5)/2</m>，<m>ψ = (1−√5)/2</m>。',
        '通解 <m>f<sub>n</sub> = αφ<sup>n</sup> + βψ<sup>n</sup></m>。',
        '代入初值解出 <m>α = 1/√5</m>，<m>β = −1/√5</m>。',
        '所以 <m>f<sub>n</sub></m> 是整数，却要用无理数表示——这就是著名的比内公式。'
      ], ans:'<m>f<sub>n</sub> = (φ<sup>n</sup> − ψ<sup>n</sup>)/√5</m>'},

    {t:'exs', id:'4.2', items:[
      {q:'解 <m>a<sub>n</sub> = 5a<sub>n−1</sub> − 6a<sub>n−2</sub></m>，<m>a<sub>0</sub>=1, a<sub>1</sub>=4</m>。',
       hint:'特征方程 <m>r<sup>2</sup>−5r+6=0</m>。',
       steps:['<m>r<sup>2</sup>−5r+6 = (r−2)(r−3) = 0</m>，根为 2 和 3。','通解 <m>a<sub>n</sub> = α·2<sup>n</sup> + β·3<sup>n</sup></m>。','<m>n=0</m>：<m>α+β=1</m>；<m>n=1</m>：<m>2α+3β=4</m>。','解得 <m>β=2, α=−1</m>。'],
       ans:'<m>a<sub>n</sub> = 3<sup>n+1</sup> − 2<sup>n</sup></m>'},
      {q:'解 <m>a<sub>n</sub> = 4a<sub>n−1</sub> − 4a<sub>n−2</sub></m>，<m>a<sub>0</sub>=1, a<sub>1</sub>=6</m>。',
       hint:'判别式为 0，是重根。',
       steps:['<m>r<sup>2</sup>−4r+4 = (r−2)<sup>2</sup></m>，重根 <m>r=2</m>。','通解 <m>a<sub>n</sub> = (α+βn)·2<sup>n</sup></m>。','<m>n=0</m>：<m>α=1</m>；<m>n=1</m>：<m>(1+β)·2=6</m>，得 <m>β=2</m>。'],
       ans:'<m>a<sub>n</sub> = (1+2n)·2<sup>n</sup></m>'},
      {q:'求 <m>a<sub>n</sub> = 2a<sub>n−1</sub> + 1</m>，<m>a<sub>1</sub>=1</m> 的解。',
       hint:'特解猜常数。',
       steps:['齐次部分 <m>a<sub>n</sub> = 2a<sub>n−1</sub></m> 通解 <m>α·2<sup>n</sup></m>。','猜特解 <m>c</m>：<m>c = 2c+1</m>，得 <m>c=−1</m>。','通解 <m>a<sub>n</sub> = α·2<sup>n</sup> − 1</m>。','<m>a<sub>1</sub>=1</m> 代入：<m>2α−1=1</m>，<m>α=1</m>。'],
       ans:'<m>a<sub>n</sub> = 2<sup>n</sup> − 1</m>'}
    ]}
  ]
},

{
  id:'4.3', title:'分治算法与递推关系',
  blocks:[
    {t:'lead', h:'分治算法天然产生递推：把一个规模 <m>n</m> 的问题拆成 <m>a</m> 个规模 <m>n/b</m> 的子问题，再把结果合并。'},
    {t:'def', lb:'分治递推', h:'<p>形如</p><div class="f" style="margin:8px 0">f(n) = a·f(n/b) + g(n)</div><p>其中 <m>a</m> 是子问题个数，<m>n/b</m> 是子问题规模，<m>g(n)</m> 是拆分与合并的代价。</p>'},
    {t:'table', head:['算法','递推','复杂度'],
      rows:[
        ['二分查找','<m>f(n) = f(n/2) + 1</m>','<m>O(log n)</m>'],
        ['归并排序','<m>f(n) = 2f(n/2) + n</m>','<m>O(n log n)</m>'],
        ['二分幂','<m>f(n) = f(n/2) + 1</m>','<m>O(log n)</m>'],
        ['朴素矩阵乘','<m>f(n) = 8f(n/2) + n<sup>2</sup></m>','<m>O(n<sup>3</sup>)</m>']
      ]},
    {t:'tip', h:'<p>主定理（Master Theorem）给了一个速判法：比较 <m>a</m> 与 <m>b<sup>d</sup></m>（其中 <m>g(n) = O(n<sup>d</sup>)</m>）。</p><ul><li><m>a &lt; b<sup>d</sup></m>：结果由 <m>g(n)</m> 主导，<m>O(n<sup>d</sup>)</m>。</li><li><m>a = b<sup>d</sup></m>：多一个对数因子，<m>O(n<sup>d</sup> log n)</m>。</li><li><m>a &gt; b<sup>d</sup></m>：结果由递归主导，<m>O(n<sup>log<sub>b</sub>a</sup>)</m>。</li></ul><p>归并排序里 <m>a=2, b=2, d=1</m>，<m>a = b<sup>d</sup></m>，所以是 <m>O(n log n)</m>。</p>'},

    {t:'ex', title:'例 1　归并排序的递推', q:'归并排序把 n 个数分成两半各自排序，再线性时间合并。写出递推并求解。',
      steps:['两个规模 <m>n/2</m> 的子问题，合并代价 <m>O(n)</m>：<m>f(n) = 2f(n/2) + n</m>。','展开一层：<m>f(n) = 4f(n/4) + 2n</m>。','再展开：<m>= 8f(n/8) + 3n</m>，规律是 <m>2<sup>k</sup>f(n/2<sup>k</sup>) + kn</m>。','当 <m>n/2<sup>k</sup> = 1</m> 即 <m>k = log<sub>2</sub>n</m> 时到底，得 <m>n·f(1) + n log n = O(n log n)</m>。'],
      ans:'<m>O(n log n)</m>'},

    {t:'exs', id:'4.3', items:[
      {q:'二分查找的递推是 <m>f(n) = f(n/2) + 1</m>，求复杂度。',
       hint:'展开到 <m>n/2<sup>k</sup>=1</m>。',
       steps:['展开 <m>k</m> 次得 <m>f(n) = f(n/2<sup>k</sup>) + k</m>。','<m>k = log<sub>2</sub>n</m> 时到底。','<m>f(n) = f(1) + log<sub>2</sub>n</m>。'],
       ans:'<m>O(log n)</m>'},
      {q:'若 <m>f(n) = 4f(n/2) + n</m>，求复杂度。',
       hint:'比较 <m>a=4</m> 与 <m>b<sup>d</sup>=2<sup>1</sup>=2</m>。',
       steps:['<m>a = 4 > b<sup>d</sup> = 2</m>，递归主导。','复杂度为 <m>O(n<sup>log<sub>2</sub>4</sup>) = O(n<sup>2</sup>)</m>。'],
       ans:'<m>O(n<sup>2</sup>)</m>'}
    ]}
  ]
},

{
  id:'4.4', title:'生成函数',
  blocks:[
    {t:'lead', h:'生成函数是计数里最像「魔法」的工具：<b>把一个数列编码成一个多项式的系数</b>，于是「数方案」变成了「算多项式乘法」。'},
    {t:'def', lb:'生成函数', h:'<p>序列 <m>a<sub>0</sub>, a<sub>1</sub>, a<sub>2</sub>, …</m> 的<b>生成函数</b>是</p><div class="f" style="margin:8px 0">G(x) = a<sub>0</sub> + a<sub>1</sub>x + a<sub>2</sub>x<sup>2</sup> + ⋯</div>'},
    {t:'p', h:'关键直觉：<b>多项式相乘时，指数相加、系数相乘</b>。而「取两个物品」的方案数恰好也是「两个选择的组合」——所以系数自动完成了计数。'},
    {t:'table', head:['生成函数','对应的序列'],
      rows:[
        ['<m>1/(1−x)</m>','<m>1,1,1,1,…</m>'],
        ['<m>1/(1−ax)</m>','<m>1,a,a<sup>2</sup>,a<sup>3</sup>,…</m>'],
        ['<m>1/(1−x)<sup>2</sup></m>','<m>1,2,3,4,…</m>'],
        ['<m>(1+x)<sup>n</sup></m>','<m>C(n,0), C(n,1), …, C(n,n)</m>']
      ]},
    {t:'p', h:'<b>怎么用它解计数题？</b>把「每类物品取几个」写成 <m>(1 + x + x<sup>2</sup> + ⋯)</m> 这样的因子，多个因子相乘，展开后 <m>x<sup>k</sup></m> 的系数就是「总共取 k 个」的方案数。'},
    {t:'warn', h:'<p>如果某类物品最多取 3 个，因子就写 <m>(1+x+x<sup>2</sup>+x<sup>3</sup>)</m> 而不是无穷级数。<b>限制条件直接体现在因子的截断上</b>——这是生成函数最好用的地方。</p>'},

    {t:'ex', title:'例 1　用生成函数数分法', q:'把 10 分成若干个 1、2、3 之和（顺序不计），有多少种？',
      steps:[
        '对应生成函数 <m>1/((1−x)(1−x<sup>2</sup>)(1−x<sup>3</sup>))</m>。',
        '展开后 <m>x<sup>10</sup></m> 的系数即为答案。',
        '手工枚举：设用 <m>a</m> 个 3、<m>b</m> 个 2、<m>c</m> 个 1，<m>3a+2b+c=10</m>。',
        '枚举 <m>a=0..3</m>：<m>a=0</m> 有 6 种（b=0..5），<m>a=1</m> 有 4 种，<m>a=2</m> 有 2 种，<m>a=3</m> 有 1 种。合计 13。'
      ], ans:'13 种'},

    {t:'exs', id:'4.4', items:[
      {q:'写出「从 3 种水果中取 n 个，每种至少取 1 个」的生成函数。',
       hint:'每种至少 1 个，因子从 <m>x</m> 开始。',
       steps:['单种的因子：<m>x + x<sup>2</sup> + x<sup>3</sup> + ⋯ = x/(1−x)</m>。','三种独立，相乘。'],
       ans:'<m>(x/(1−x))<sup>3</sup> = x<sup>3</sup>/(1−x)<sup>3</sup></m>'},
      {q:'<m>1/(1−x)<sup>2</sup></m> 展开后 <m>x<sup>n</sup></m> 的系数是多少？',
       hint:'查表或记 <m>1/(1−x)<sup>2</sup> = Σ(n+1)x<sup>n</sup></m>。',
       steps:['<m>1/(1−x)<sup>2</sup> = 1 + 2x + 3x<sup>2</sup> + 4x<sup>3</sup> + ⋯</m>。','系数依次为 1,2,3,…，所以第 n 项系数是 <m>n+1</m>。'],
       ans:'<m>n+1</m>'}
    ]}
  ]
},

{
  id:'4.5', title:'容斥原理',
  blocks:[
    {t:'lead', h:'「至少满足一个条件」的计数，直接加会重复。容斥就是<b>一加一减地修正误差</b>——加多了减，减多了加。'},
    {t:'thm', lb:'两个集合', h:'<div class="f" style="margin:4px 0">|A ∪ B| = |A| + |B| − |A ∩ B|</div>'},
    {t:'thm', lb:'三个集合', h:'<div class="f" style="margin:4px 0">|A∪B∪C| = |A|+|B|+|C| − |A∩B|−|A∩C|−|B∩C| + |A∩B∩C|</div>'},
    {t:'thm', lb:'一般形式', h:'<div class="f" style="margin:4px 0;font-size:16px">|A<sub>1</sub>∪⋯∪A<sub>n</sub>| = Σ|A<sub>i</sub>| − Σ|A<sub>i</sub>∩A<sub>j</sub>| + Σ|A<sub>i</sub>∩A<sub>j</sub>∩A<sub>k</sub>| − ⋯ + (−1)<sup>n+1</sup>|A<sub>1</sub>∩⋯∩A<sub>n</sub>|</div>'},
    {t:'w', id:'incl'},
    {t:'tip', h:'<p>符号规律很好记：<b>奇数个集合的交取正，偶数个取负</b>。</p><p>直觉上，一个元素如果属于 <m>k</m> 个集合，它被计算的次数是 <m>C(k,1)−C(k,2)+C(k,3)−⋯ = 1</m>——正好算一次。</p>'},

    {t:'ex', title:'例 1　1 到 100 中与 30 互素的数', q:'1 到 100 中有多少个数与 30 互素？',
      steps:[
        '<m>30 = 2 × 3 × 5</m>，与 30 不互素就是能被 2、3、5 之一整除。',
        '设 <m>A, B, C</m> 分别为被 2、3、5 整除的数集。<m>|A|=50, |B|=33, |C|=20</m>。',
        '两两交集：<m>|A∩B|=⌊100/6⌋=16</m>，<m>|A∩C|=⌊100/10⌋=10</m>，<m>|B∩C|=⌊100/15⌋=6</m>。',
        '三重交集：<m>|A∩B∩C|=⌊100/30⌋=3</m>。',
        '<m>|A∪B∪C| = 50+33+20−16−10−6+3 = 74</m>，所以互素的有 <m>100−74 = 26</m> 个。'
      ], ans:'26 个'},

    {t:'exs', id:'4.5', items:[
      {q:'一个班 50 人，30 人学英语，25 人学日语，10 人两样都学。有多少人两样都不学？',
       hint:'先算至少学一样的。',
       steps:['<m>|E∪J| = 30+25−10 = 45</m>。','两样都不学：<m>50 − 45 = 5</m>。'],
       ans:'5 人'},
      {q:'1 到 1000 中有多少个不能被 2、3、5 中任何一个整除？',
       hint:'套三集合容斥。',
       steps:['<m>|A|=500, |B|=333, |C|=200</m>。','两两：<m>|A∩B|=166, |A∩C|=100, |B∩C|=66</m>。','三重：<m>|A∩B∩C|=33</m>。','并集 <m>= 500+333+200−166−100−66+33 = 734</m>。','补集 <m>= 1000 − 734 = 266</m>。'],
       ans:'266 个'}
    ]}
  ]
},

{
  id:'4.6', title:'容斥原理的应用',
  blocks:[
    {t:'lead', h:'容斥不只能数集合，还能数<b>函数</b>和<b>排列</b>。这一节看两个经典应用：满射个数和错排。'},
    {t:'h3', h:'满射函数的个数'},
    {t:'p', h:'从 <m>m</m> 元集到 <m>n</m> 元集的<b>满射</b>有多少个？设 <m>A<sub>i</sub></m> 为「第 <m>i</m> 个目标元素没被指到」的函数集合，则'},
    {t:'f', h:'Σ<sub>k=0</sub><sup>n</sup> (−1)<sup>k</sup> C(n,k)(n−k)<sup>m</sup>', note:'这也正是 3.5.5 里「物体可区分、盒子可区分、不许空」的答案'},
    {t:'h3', h:'错排问题'},
    {t:'def', lb:'错排', h:'<p><b>错排</b> <m>D<sub>n</sub></m> 是 <m>{1,…,n}</m> 的排列中，满足「每个元素都不在自己原位」的排列数。</p>'},
    {t:'p', h:'用容斥：设 <m>A<sub>i</sub></m> 为「第 <m>i</m> 个元素恰好在原位」的排列集合，则'},
    {t:'f', h:'D<sub>n</sub> = n! (1 − 1/1! + 1/2! − 1/3! + ⋯ + (−1)<sup>n</sup>/n!)', note:'这个值约等于 n!/e，所以错排概率趋近于 1/e ≈ 0.368'},
    {t:'table', head:['n','1','2','3','4','5','6'],
      rows:[['<m>D<sub>n</sub></m>','0','1','2','9','44','265']]},

    {t:'ex', title:'例 1　信件装错', q:'4 封信随机装入 4 个写好地址的信封，全部装错的概率是多少？',
      steps:[
        '总装法：<m>4! = 24</m>。',
        '全部装错即错排：<m>D<sub>4</sub> = 4!(1 − 1 + 1/2 − 1/6 + 1/24) = 24(9/24) = 9</m>。',
        '概率 <m>9/24 = 3/8</m>。'
      ], ans:'<m>3/8</m>'},

    {t:'exs', id:'4.6', items:[
      {q:'计算 <m>D<sub>5</sub></m>。',
       hint:'用公式或递推 <m>D<sub>n</sub> = (n−1)(D<sub>n−1</sub>+D<sub>n−2</sub>)</m>。',
       steps:['<m>D<sub>3</sub>=2</m>，<m>D<sub>4</sub>=9</m>。','<m>D<sub>5</sub> = 4(9+2) = 44</m>。'],
       ans:'44'},
      {q:'从 5 元集到 3 元集的满射有多少个？',
       hint:'套容斥公式。',
       steps:['<m>3<sup>5</sup> − C(3,1)2<sup>5</sup> + C(3,2)1<sup>5</sup></m>。','<m>= 243 − 96 + 3 = 150</m>。'],
       ans:'150 个'}
    ]}
  ]
}

]};

CH[5] = {
  title: '关系',
  en: 'Relations',
  intro: '关系是把集合里的元素<b>两两连起来</b>。听起来简单，但它是整本书里结构最丰富的一章：等价关系把集合切成块，偏序把它排成层，传递闭包算出谁能到达谁。掌握这一章的关键是<b>会用三种语言描述同一个关系</b>——集合、矩阵、图。',
  sections: [

{
  id:'5.1', title:'关系及其性质',
  blocks:[
    {t:'lead', h:'「<m>a</m> 小于 <m>b</m>」「<m>a</m> 是 <m>b</m> 的父亲」「<m>a</m> 和 <m>b</m> 同余」——这些都是关系。它们的共同点是：<b>描述两个对象之间有没有某种联系</b>。'},
    {t:'def', lb:'二元关系', h:'<p>从集合 <m>A</m> 到 <m>B</m> 的<b>二元关系</b>是 <m>A × B</m> 的一个子集。若 <m>(a,b) ∈ R</m>，记作 <m>a R b</m>。</p><p><m>A</m> 上的关系就是 <m>A × A</m> 的子集，共 <m>2<sup>|A|<sup>2</sup></sup></m> 个不同的关系。</p>'},
    {t:'table', head:['性质','定义','关系图上看','矩阵上看'],
      rows:[
        ['自反','对每个 a 都有 <m>a R a</m>','每个点都有自环','主对角线全 1'],
        ['反自反','对每个 a 都没有 <m>a R a</m>','没有自环','主对角线全 0'],
        ['对称','<m>a R b ⟹ b R a</m>','边都是双向的','矩阵关于对角线对称'],
        ['反对称','<m>a R b</m> 且 <m>b R a ⟹ a=b</m>','互异点之间没有双向边','无对称的 1 对'],
        ['传递','<m>a R b, b R c ⟹ a R c</m>','有「接力」就有直达边','<m>M<sup>2</sup> ≤ M</m>']
      ]},
    {t:'warn', h:'<p>最容易混的是<b>「反对称」和「不对称」</b>。反对称不要求对称性缺席——它只是说「如果两个方向都有，那这两个元素必须相同」。</p><p>例如「≤」既是自反的，又是反对称的：<m>a≤b</m> 和 <m>b≤a</m> 同时成立时必然 <m>a=b</m>。它完全合法。</p>'},
    {t:'w', id:'relmat'},
    {t:'p', h:'<b>关系图</b>的画法：把每个元素画成一个点，<m>a R b</m> 就从 <m>a</m> 画一条有向边到 <m>b</m>；<m>a R a</m> 画一个自环。'},
    {t:'p', h:'<b>关系矩阵</b> <m>M<sub>R</sub></m>：第 <m>i</m> 行第 <m>j</m> 列为 1 当且仅当 <m>a<sub>i</sub> R a<sub>j</sub></m>。'},
    {t:'tip', h:'<p>判断性质时，<b>矩阵比图快</b>：自反看对角线，对称看上下三角是否互为镜像，传递看 <m>M<sup>2</sup></m> 的 1 是否都落在 <m>M</m> 的 1 里。</p><p>但<b>图比矩阵直观</b>：想不清结构时画图，要机械判定时看矩阵。</p>'},

    {t:'exs', id:'5.1', items:[
      {q:'设 <m>A = {1,2,3,4}</m>，<m>R = {(a,b) | a 整除 b}</m>。判断 <m>R</m> 的四条性质。',
       hint:'先列出所有有序对。',
       steps:['<m>R</m> 含 (1,1)(1,2)(1,3)(1,4)(2,2)(2,4)(3,3)(4,4)。','自反：每个 (a,a) 都在，成立。','反对称：若 a|b 且 b|a，则 a=b，成立。','对称：有 (1,2) 但没有 (2,1)，不成立。','传递：若 a|b 且 b|c 则 a|c，成立。'],
       ans:'自反、反对称、传递；不对称'},
      {q:'<m>A = {1,2,3}</m>，<m>R = {(1,2),(2,1),(2,3),(3,2)}</m>，判断对称性和传递性。',
       hint:'检查 (1,2) 和 (2,3) 能不能接力。',
       steps:['(1,2) 有 (2,1)，(2,3) 有 (3,2)，所以对称。','但 (1,2) 和 (2,3) 推出应有 (1,3)，而 (1,3) 不在 <m>R</m> 中。','所以不传递。'],
       ans:'对称，但不传递'},
      {q:'一个集合有 3 个元素，它上面一共有多少个不同的关系？',
       hint:'关系是 <m>A×A</m> 的子集。',
       steps:['<m>|A×A| = 9</m>。','子集个数 <m>2<sup>9</sup> = 512</m>。'],
       ans:'512 个'}
    ]}
  ]
},

{
  id:'5.2', title:'n 元关系及其应用',
  blocks:[
    {t:'lead', h:'二元关系描述「两个东西的关系」，<m>n</m> 元关系描述「<m>n</m> 个东西的关系」——它其实就是数据库里的一张表。'},
    {t:'def', lb:'n 元关系', h:'<p><m>n</m> 元关系是 <m>A<sub>1</sub> × A<sub>2</sub> × ⋯ × A<sub>n</sub></m> 的子集。每个元素是一个 <m>n</m> 元组。</p>'},
    {t:'p', h:'换个说法：一张学生成绩表就是三元关系（学号、课程、成绩）的子集。数据库里的「表」和「关系」本来就是同一个词——关系数据库的名字就是这么来的。'},
    {t:'def', lb:'关系的复合', h:'<p><m>S ∘ R = {(a,c) | 存在 b 使 a R b 且 b S c}</m>，即「先走 <m>R</m> 再走 <m>S</m>」。</p><p>注意顺序：<m>S ∘ R</m> 里 <m>R</m> 先作用，和函数复合的约定一致。</p>'},
    {t:'p', h:'复合在矩阵上就是<b>布尔矩阵乘法</b>：<m>M<sub>S∘R</sub> = M<sub>R</sub> ⊙ M<sub>S</sub></m>。而在图上，复合就是「走两步能到哪」。'},
    {t:'p', h:'<b>关系的幂</b> <m>R<sup>n</sup></m> 表示「走 <m>n</m> 步」。于是「<m>a</m> 能否到达 <m>b</m>」就等于问：是否存在 <m>n ≥ 1</m> 使 <m>(a,b) ∈ R<sup>n</sup></m>。这正是第 5.4 节传递闭包要解决的问题。'},

    {t:'exs', id:'5.2', items:[
      {q:'<m>R = {(1,2),(2,3)}</m>，<m>S = {(2,4),(3,5)}</m>，求 <m>S ∘ R</m>。',
       hint:'找「先 R 后 S」能接上的链。',
       steps:['1 R 2，2 S 4 → (1,4)。','2 R 3，3 S 5 → (2,5)。','其他接不上。'],
       ans:'<m>S∘R = {(1,4),(2,5)}</m>'},
      {q:'用关系语言描述「学生选课」这件事，指出它是几元关系。',
       hint:'需要记录哪些信息？',
       steps:['需要：学号、课程号、学期、成绩。','所以是四元关系，是 <m>学号 × 课程 × 学期 × 成绩</m> 的子集。','数据库里这就是一张选课表。'],
       ans:'四元关系'}
    ]}
  ]
},

{
  id:'5.3', title:'关系的表示',
  blocks:[
    {t:'lead', h:'同一个关系，三种表示：<b>有序对集合、0-1 矩阵、有向图</b>。做题时哪种方便就用哪种，但要能随时互相翻译。'},
    {t:'table', head:['表示','优点','适合'],
      rows:[
        ['有序对集合','精确、无歧义','定义、证明'],
        ['0-1 矩阵','适合机械计算','判断性质、算闭包'],
        ['有向图','直观、看结构','看连通性、找路径']
      ]},
    {t:'p', h:'三种表示之间的翻译规则：'},
    {t:'ol', items:[
      '<b>集合 → 矩阵</b>：元素 <m>a<sub>i</sub></m> 排在集合的第 <m>i</m> 个位置，<m>a<sub>i</sub> R a<sub>j</sub></m> 则 <m>m<sub>ij</sub> = 1</m>。',
      '<b>集合 → 图</b>：每个元素一个点，每个有序对一个箭头。',
      '<b>矩阵 → 图</b>：第 <m>i</m> 行第 <m>j</m> 列为 1，就从点 <m>i</m> 画箭头到点 <m>j</m>。'
    ]},
    {t:'warn', h:'<p>矩阵表示依赖<b>元素的排列顺序</b>。同一个关系，换个顺序写矩阵，矩阵就变了——但关系的性质不变。</p><p>所以判断「自反」「对称」这类性质时，用矩阵是安全的（这些性质在行列重排下保持）；但比较两个矩阵是否相等时，必须先确认顺序一致。</p>'},

    {t:'exs', id:'5.3', items:[
      {q:'<m>A = {1,2,3}</m>，<m>R = {(1,1),(1,3),(2,2),(3,1)}</m>，写出关系矩阵。',
       hint:'按 1,2,3 的顺序填 3×3 表。',
       steps:['第 1 行：(1,1)=1，(1,2)=0，(1,3)=1。','第 2 行：(2,1)=0，(2,2)=1，(2,3)=0。','第 3 行：(3,1)=1，(3,2)=0，(3,3)=0。'],
       ans:'<m>[[1,0,1],[0,1,0],[1,0,0]]</m>'}
    ]}
  ]
},

{
  id:'5.4', title:'关系的闭包',
  blocks:[
    {t:'lead', h:'一个关系可能「不够自反」「不够对称」「不够传递」。闭包就是<b>用最少的补充，让它满足某条性质</b>。'},
    {t:'def', lb:'三种闭包', h:'<ul style="margin:6px 0 0"><li><b>自反闭包</b> <m>r(R) = R ∪ I<sub>A</sub></m>：把所有 <m>(a,a)</m> 补上。</li><li><b>对称闭包</b> <m>s(R) = R ∪ R<sup>−1</sup></m>：把每条边都补上反向的。</li><li><b>传递闭包</b> <m>t(R)</m>：补上所有「接力能到」的边。</li></ul>'},
    {t:'thm', lb:'传递闭包的计算', h:'<div class="f" style="margin:4px 0">t(R) = R ∪ R<sup>2</sup> ∪ R<sup>3</sup> ∪ ⋯ ∪ R<sup>n</sup></div><p>其中 <m>n = |A|</m>。因为如果存在路径，最短的那条一定不超过 <m>n</m> 条边（否则必然重复经过某个点，可以缩短）。</p>'},
    {t:'p', h:'<b>Warshall 算法</b>是更高效的算法：逐个用中间点 <m>k</m> 去「打通」其他点。核心三行伪代码：'},
    {t:'f', h:'for k = 1 to n<br>　for i = 1 to n<br>　　for j = 1 to n<br>　　　W[i][j] = W[i][j] ∨ (W[i][k] ∧ W[k][j])', note:'意思是：如果 i 能到 k，k 能到 j，那就让 i 能到 j。三重循环，O(n³)'},
    {t:'w', id:'closure'},
    {t:'tip', h:'<p>Warshall 和第 6 章的 Floyd 最短路算法是同一个骨架。区别只在：Warshall 处理布尔值，Floyd 处理「取最小值 + 相加」。</p><p>看懂一个，另一个自然就懂了。</p>'},

    {t:'ex', title:'例 1　求传递闭包', q:'<m>A = {1,2,3,4}</m>，<m>R = {(1,2),(2,3),(3,4)}</m>，求 <m>t(R)</m>。',
      steps:[
        '这是一个链：1→2→3→4。',
        '走两步：<m>R<sup>2</sup> = {(1,3),(2,4)}</m>。',
        '走三步：<m>R<sup>3</sup> = {(1,4)}</m>。',
        '走四步：空（没有更长的简单路径）。',
        '合并：所有 <m>i &lt; j</m> 的有序对。'
      ], ans:'<m>t(R) = {(i,j) | i &lt; j}</m>，共 6 个'},

    {t:'exs', id:'5.4', items:[
      {q:'<m>A = {1,2,3}</m>，<m>R = {(1,2),(3,2)}</m>，求自反闭包和对称闭包。',
       hint:'自反补对角线，对称补反向边。',
       steps:['自反闭包：加上 (1,1),(2,2),(3,3)。','对称闭包：加上 (2,1),(2,3)。'],
       ans:'<m>r(R)</m> 加三个自环；<m>s(R) = {(1,2),(2,1),(3,2),(2,3)}</m>'},
      {q:'上题的 <m>R</m> 的传递闭包是什么？',
       hint:'检查有没有能接力的链。',
       steps:['(1,2) 的后继只有 2，(3,2) 的后继只有 2。','没有任何「a→b→c」形式的两条边首尾相接。','所以不需要补充。'],
       ans:'<m>t(R) = R</m>（本身已传递）'}
    ]}
  ]
},

{
  id:'5.5', title:'等价关系',
  blocks:[
    {t:'lead', h:'等价关系是「把东西按某个标准归类」的数学化。<b>同余、相似、同姓、同班</b>——凡是「差不多算一类」的关系，都是等价关系。'},
    {t:'def', lb:'等价关系', h:'<p>集合 <m>A</m> 上的关系如果<b>同时满足自反、对称、传递</b>，就称为<b>等价关系</b>。</p>'},
    {t:'def', lb:'等价类', h:'<p>对 <m>a ∈ A</m>，<b>等价类</b> <m>[a] = {x ∈ A | x R a}</m>，即所有与 <m>a</m> 等价的元素。</p>'},
    {t:'thm', lb:'基本定理', h:'<p>等价关系与<b>划分</b>是一一对应的：</p><ul style="margin:6px 0 0"><li>不同等价类互不相交：<m>[a] ∩ [b] = ∅</m> 或 <m>[a] = [b]</m>。</li><li>所有等价类的并是全集 <m>A</m>。</li></ul>'},
    {t:'w', id:'equiv'},
    {t:'tip', h:'<p>这个定理的实用价值在于：<b>证明一个关系是等价关系，等价于找到它对应的那个划分</b>。反之，想构造一个等价关系，只要先想好「怎么切块」，然后定义「在同一块里就等价」。</p>'},
    {t:'p', h:'「互不相交或完全相同」这句话值得琢磨——它排除了「部分重叠」的可能。为什么？若 <m>c ∈ [a] ∩ [b]</m>，则 <m>c R a</m> 且 <m>c R b</m>，由对称得 <m>a R c</m>，由传递得 <m>a R b</m>，于是 <m>[a] = [b]</m>。'},

    {t:'ex', title:'例 1　模 3 同余', q:'在 <m>ℤ</m> 上定义 <m>a R b ⟺ a ≡ b (mod 3)</m>。验证它是等价关系，并写出等价类。',
      steps:[
        '自反：<m>a − a = 0</m> 被 3 整除。',
        '对称：若 <m>3 | (a−b)</m>，则 <m>3 | (b−a)</m>。',
        '传递：若 <m>3|(a−b)</m> 且 <m>3|(b−c)</m>，则 <m>3|(a−c)</m>。',
        '三个等价类：<m>[0]={…,−3,0,3,6,…}</m>，<m>[1]={…,−2,1,4,7,…}</m>，<m>[2]={…,−1,2,5,8,…}</m>。'
      ], ans:'三个等价类，构成 <m>ℤ</m> 的一个划分'},

    {t:'exs', id:'5.5', items:[
      {q:'<m>A = {1,2,3,4,5,6}</m>，<m>R</m> 定义为「除以 3 的余数相同」。写出所有等价类。',
       hint:'按余数 0、1、2 分三组。',
       steps:['余 0：<m>{3,6}</m>。','余 1：<m>{1,4}</m>。','余 2：<m>{2,5}</m>。'],
       ans:'<m>{3,6}</m>、<m>{1,4}</m>、<m>{2,5}</m>'},
      {q:'判断：关系「a 是 b 的祖先」是等价关系吗？',
       hint:'逐条检查三条性质。',
       steps:['自反：自己不是自己的祖先，不满足。','对称：若 a 是 b 的祖先，b 不可能是 a 的祖先，不满足。','它是反自反、传递的，但不是等价关系。'],
       ans:'不是（不满足自反和对称）'},
      {q:'一个集合有 4 个元素，它上面有多少个不同的等价关系？',
       hint:'等价于问：4 元集有多少种划分。',
       steps:['1 块：1 种（全部一起）。','2 块：<m>S(4,2) = 7</m> 种。','3 块：<m>S(4,3) = 6</m> 种。','4 块：1 种。','合计 <m>1+7+6+1 = 15</m>。'],
       ans:'15 个（等于 Bell 数 B₄）'}
    ]}
  ]
},

{
  id:'5.6', title:'偏序',
  blocks:[
    {t:'lead', h:'等价关系把集合「摊平成一堆」，偏序则把它「排成层次」。前者关心「差不多」，后者关心「谁在前」。'},
    {t:'def', lb:'偏序关系', h:'<p>满足<b>自反、反对称、传递</b>的关系称为<b>偏序</b>。集合配上偏序叫<b>偏序集</b> <m>(S, ≼)</m>。</p>'},
    {t:'p', h:'「偏」的意思是：<b>不是任意两个元素都能比较</b>。「≤」在实数上是全序（任意两个都能比），但「整除」在正整数上只是偏序——2 和 3 谁也不整除谁，无法比较。'},
    {t:'h3', h:'哈斯图'},
    {t:'p', h:'偏序关系画成图会很乱（自环、传递边都是冗余的）。哈斯图把它<b>化简到最少</b>：'},
    {t:'ol', items:[
      '去掉所有自环（自反性已知）。',
      '去掉所有「可由传递性推出」的边（若 <m>a≼b≼c</m>，就不画 <m>a→c</m>）。',
      '把方向统一成「向上」，即 <m>a≼b</m> 时把 <m>b</m> 画在 <m>a</m> 上方。'
    ]},
    {t:'def', lb:'四个极值概念', h:'<ul style="margin:6px 0 0"><li><b>极大元</b>：没有比它更大的元素。可能不止一个。</li><li><b>极小元</b>：没有比它更小的元素。可能不止一个。</li><li><b>最大元</b>：比<b>所有</b>元素都大。唯一（如果存在）。</li><li><b>最小元</b>：比<b>所有</b>元素都小。唯一（如果存在）。</li></ul>'},
    {t:'warn', h:'<p><b>极大 ≠ 最大</b>。极大元只是「上面没人了」，最大元要求「比所有人都大」。</p><p>例子：集合 <m>{2,3,6,12}</m> 按整除关系，6 和 12 都是极大元吗？不——12 能被 6 整除，所以 6 不是极大元，12 是唯一的极大元，也是最大元。</p><p>但如果集合是 <m>{2,3,6}</m>，那么 2 和 3 都是极小元（互不整除），没有最小元。</p>'},
    {t:'p', h:'<b>拓扑排序</b>就是把偏序「拉直」成一个全序：不断取出极小元，删掉它，重复。如果中途卡住（有元素但都不是极小元），说明存在环，不是偏序。'},

    {t:'ex', title:'例 1　整除关系的哈斯图', q:'<m>S = {1,2,3,4,6,12}</m>，按整除关系画哈斯图，找出极大元、极小元、最大元、最小元。',
      steps:[
        '覆盖关系（中间没有其他元素的）：1≺2, 1≺3, 2≺4, 2≺6, 3≺6, 4≺12, 6≺12。',
        '注意 2≺12 不画，因为 2≺4≺12 已经蕴含了它。',
        '1 在最底下，12 在最上面。',
        '极大元：只有 12。极小元：只有 1。最大元：12。最小元：1。'
      ], ans:'极大=最大=12；极小=最小=1'},

    {t:'exs', id:'5.6', items:[
      {q:'<m>S = {2,3,6,12}</m> 按整除关系，求极大元和极小元。',
       hint:'两两检查谁能整除谁。',
       steps:['2|6，2|12，3|6，3|12，6|12。','极大元：12（没有更大的）。','极小元：2 和 3（互不整除，上方都有人但都不比对方小）。'],
       ans:'极大元 {12}；极小元 {2,3}'},
      {q:'「≤」在实数集上是偏序吗？是的话，它和整除关系有什么本质区别？',
       hint:'想想任意两个实数能不能比较。',
       steps:['「≤」满足自反、反对称、传递，是偏序。','而且任意两个实数都能比较大小。','整除关系在正整数上不满足这一点（2 和 3 无法比较）。','所以「≤」是全序，整除只是偏序。'],
       ans:'是偏序，而且是全序'},
      {q:'集合 <m>{a,b,c}</m> 的幂集按包含关系 <m>⊆</m> 构成偏序集，它的最大元、最小元是什么？',
       hint:'幂集的元素是子集。',
       steps:['最大元：包含所有元素的子集，即 <m>{a,b,c}</m>。','最小元：被所有子集包含的，即 <m>∅</m>。','它们都存在且唯一。'],
       ans:'最大元 <m>{a,b,c}</m>，最小元 <m>∅</m>'}
    ]}
  ]
}

]};

CH[6] = {
  title: '图',
  en: 'Graphs',
  intro: '图是离散数学里<b>最像「工具」</b>的一章。社交网络、地铁线路、任务依赖、电路板布线——全是图。这一章的公式不多，但概念密集：术语、连通、欧拉、哈密顿、平面、着色，每一块都有自己的判定定理。学的时候要多画图，别只看文字。',
  sections: [

{
  id:'6.1', title:'图和图模型',
  blocks:[
    {t:'lead', h:'图不是「函数图像」，是<b>点和线</b>。这个术语冲突让很多大一新生第一节课就懵了。'},
    {t:'def', lb:'图', h:'<p>图 <m>G = (V, E)</m> 由一个<b>顶点集</b> <m>V</m> 和一个<b>边集</b> <m>E</m> 组成，每条边连接一对顶点。</p><ul style="margin:6px 0 0"><li><b>无向图</b>：边没有方向，<m>{u,v}</m>。</li><li><b>有向图</b>：边有方向，<m>(u,v)</m>。</li><li><b>简单图</b>：没有自环，也没有重边。</li><li><b>多重图</b>：允许重边。</li></ul>'},
    {t:'p', h:'<b>怎么把一个实际问题变成图？</b>关键在于想清楚「什么充当顶点、什么充当边」。同一个场景，不同的建模方式会得到完全不同的图。'},
    {t:'table', head:['场景','顶点','边'],
      rows:[
        ['社交网络','人','认识关系'],
        ['地铁线路','车站','相邻区间'],
        ['任务调度','任务','「必须先做」的依赖'],
        ['网页链接','网页','超链接'],
        ['地图着色','区域','相邻关系']
      ]},
    {t:'tip', h:'<p>建模时最容易犯的错是<b>把「关系」当成顶点</b>，或者反过来。判断标准：你想问的问题，是关于「点能不能通到点」，还是关于「线本身」？</p><p>前者把对象当点，后者把对象当边（例如「一笔画遍所有桥」——桥是边，不是点）。'},

    {t:'exs', id:'6.1', items:[
      {q:'5 个人两两握手，一共握了几次手？用图论语言说，就是 <m>K<sub>5</sub></m> 有多少条边。',
       hint:'每对顶点之间一条边。',
       steps:['<m>K<sub>5</sub></m> 的边数等于从 5 个点里选 2 个。','<m>C(5,2) = 10</m>。'],
       ans:'10 次'},
      {q:'一个图有 6 个顶点、9 条边，所有顶点的度数之和是多少？',
       hint:'握手定理。',
       steps:['<m>Σdeg(v) = 2|E|</m>。','<m>= 2 × 9 = 18</m>。'],
       ans:'18'}
    ]}
  ]
},

{
  id:'6.2', title:'图的术语和几种特殊的图',
  blocks:[
    {t:'lead', h:'这一节是术语轰炸，但真正需要记住的核心只有一个：<b>握手定理</b>。其余的都是名词，遇到查一下就行。'},
    {t:'thm', lb:'握手定理', h:'<div class="f" style="margin:4px 0">Σ<sub>v∈V</sub> deg(v) = 2|E|</div><p>推论：<b>任何图中，奇数度顶点的个数必为偶数。</b></p>'},
    {t:'p', h:'握手定理的证明只有一句话：每条边贡献 2 个度数（两个端点各算一次）。所以度数之和永远是边数的两倍——一定是偶数。'},
    {t:'p', h:'推论也就跟着来了：如果奇度顶点有奇数个，它们的度数之和是奇数，而偶度顶点的度数之和是偶数，总和就成了奇数——与「必为偶数」矛盾。'},
    {t:'table', head:['名称','定义','边数 / 度数'],
      rows:[
        ['完全图 <m>K<sub>n</sub></m>','任意两点都有边','<m>n(n−1)/2</m> 条边，每点度 <m>n−1</m>'],
        ['圈图 <m>C<sub>n</sub></m>','一个环，<m>n ≥ 3</m>','<m>n</m> 条边，每点度 2'],
        ['轮图 <m>W<sub>n</sub></m>','<m>C<sub>n</sub></m> 加一个中心点连所有点','<m>2n</m> 条边'],
        ['<m>n</m> 立方体图 <m>Q<sub>n</sub></m>','<m>n</m> 位二进制串，差一位则相邻','<m>n·2<sup>n−1</sup></m> 条边，每点度 <m>n</m>'],
        ['二分图','顶点可分成两部分，边只跨部分','—'],
        ['完全二分图 <m>K<sub>m,n</sub></m>','两部分之间所有边都有','<m>mn</m> 条边']
      ]},
    {t:'p', h:'<b>二分图的判定</b>：一个图是二分图，当且仅当它<b>不含奇数长度的圈</b>。这是后面图着色一章的基础。'},
    {t:'warn', h:'<p>「奇度顶点个数为偶数」这条推论经常被用来<b>快速否定</b>某些图的存在性。</p><p>例如「是否存在 5 个顶点、度数分别为 3,3,3,3,3 的图？」——5 个奇度顶点，个数是奇数，直接否定，不用尝试画。</p>'},

    {t:'exs', id:'6.2', items:[
      {q:'<m>K<sub>6</sub></m> 有多少条边？每个顶点的度数是多少？',
       hint:'<m>C(6,2)</m> 和 <m>n−1</m>。',
       steps:['边数 <m>C(6,2) = 15</m>。','每点度数 <m>6−1 = 5</m>。','验证：<m>6 × 5 = 30 = 2 × 15</m>。'],
       ans:'15 条边，每点度为 5'},
      {q:'判断：是否存在一个图，5 个顶点的度数分别是 1,2,3,4,5？',
       hint:'数一下奇度顶点的个数。',
       steps:['奇度顶点有 1、3、5 三个，是奇数个。','由握手定理的推论，奇度顶点个数必须是偶数。','矛盾，所以不存在。'],
       ans:'不存在'},
      {q:'<m>Q<sub>3</sub></m>（3 维立方体图）有几个顶点、几条边？',
       hint:'顶点是 3 位二进制串。',
       steps:['顶点数 <m>2<sup>3</sup> = 8</m>。','每点度数为 3（可以翻转任意一位），总度 <m>24</m>。','边数 <m>24/2 = 12</m>。'],
       ans:'8 个顶点，12 条边'}
    ]}
  ]
},

{
  id:'6.3', title:'图的表示和图的同构',
  blocks:[
    {t:'lead', h:'图在计算机里怎么存？两种基本方式。以及一个更微妙的问题：<b>两个长得不一样的图，什么时候其实是同一个图</b>？'},
    {t:'table', head:['表示法','结构','适合'],
      rows:[
        ['邻接矩阵','<m>n × n</m> 的 0-1 矩阵，<m>a<sub>ij</sub>=1</m> 表示有边','稠密图；查两点是否相邻 O(1)'],
        ['邻接表','每个顶点挂一个链表，存它的邻居','稀疏图；省空间'],
        ['关联矩阵','<m>n × m</m>，行是点、列是边','少数场景（如网络流）']
      ]},
    {t:'p', h:'无向图的邻接矩阵是<b>对称</b>的，而且第 <m>i</m> 行的和就是顶点 <m>i</m> 的度数——这两个性质在判断图的性质时很好用。'},
    {t:'def', lb:'同构', h:'<p>两个图 <m>G<sub>1</sub></m> 和 <m>G<sub>2</sub></m> <b>同构</b>，如果存在一个双射 <m>f: V<sub>1</sub> → V<sub>2</sub></m>，使得 <m>u,v</m> 相邻当且仅当 <m>f(u),f(v)</m> 相邻。</p><p>直观说：<b>只是把点重新标了个号，结构完全一样</b>。</p>'},
    {t:'p', h:'判断同构没有简单的充要条件，但可以用<b>不变量</b>快速排除：顶点数、边数、度数序列、连通分量数、圈的分布。任何一项不同，就肯定不同构。'},
    {t:'tip', h:'<p>度数序列相同<b>不足以</b>说明同构。典型反例：一个 6 点图里有个 6-圈，另一个是两个不相交的 3-圈——度数序列都是 (2,2,2,2,2,2)，但显然不同构（一个连通，一个不连通）。</p><p>所以不变量只能用来「否定」，不能用来「肯定」。</p>'},

    {t:'exs', id:'6.3', items:[
      {q:'一个 4 个顶点的无向简单图，邻接矩阵第 2 行是 (1,0,1,1)，顶点 2 的度数是多少？',
       hint:'行和即度数（无向简单图无自环）。',
       steps:['行和为 <m>1+0+1+1 = 3</m>。','对应顶点 2 与其他三个点都有边（除了自己）。'],
       ans:'3'}
    ]}
  ]
},

{
  id:'6.4', title:'连通性',
  blocks:[
    {t:'lead', h:'连通性问的是一句很朴素的话：<b>从 A 能不能走到 B</b>。但它在不同场景下的含义差别很大。'},
    {t:'def', lb:'连通', h:'<p>无向图中，若 <m>u</m> 和 <m>v</m> 之间存在通路，则称它们<b>连通</b>。若图中任意两点都连通，称图为<b>连通图</b>。</p><p>不连通图会分成若干个<b>连通分量</b>，每个分量内部连通，分量之间没有边。</p>'},
    {t:'def', lb:'割点与割边', h:'<p>删掉某个顶点（及与之相连的边）后，图的连通分量数增加，这个顶点叫<b>割点</b>。类似地，删掉某条边后分量数增加，这条边叫<b>割边（桥）</b>。</p><p>它们是「网络的薄弱环节」——断掉就分裂。</p>'},
    {t:'p', h:'<b>有向图</b>的连通性要分两级：'},
    {t:'ul', items:[
      '<b>强连通</b>：任意两点 <m>u,v</m>，既有 <m>u→v</m> 的通路，也有 <m>v→u</m> 的通路。',
      '<b>弱连通</b>：把边都当成无向的之后连通。',
      '强连通一定弱连通，反之不然。'
    ]},
    {t:'p', h:'强连通分量可以用「两次 DFS」求：先在原图上 DFS 记录完成顺序，再在反图上按逆序 DFS，每次得到的点集就是一个强连通分量。这是 Tarjan / Kosaraju 算法的核心。'},

    {t:'exs', id:'6.4', items:[
      {q:'一个连通图有 7 个顶点，最少有多少条边？',
       hint:'连通图的边数下界是 <m>n−1</m>。',
       steps:['连通图至少要 <m>n−1</m> 条边（树的情形）。','<m>7−1 = 6</m>。'],
       ans:'6 条'},
      {q:'删掉一条边后图变成两个连通分量，这条边叫什么？',
       hint:'这是割边的定义。',
       steps:['删掉后分量数从 1 变成 2，增加了。','按定义，这条边是割边（桥）。'],
       ans:'割边（桥）'}
    ]}
  ]
},

{
  id:'6.5', title:'欧拉通路与哈密顿通路',
  blocks:[
    {t:'lead', h:'两个名字很像、难度却天差地别的问题：<b>欧拉</b>是「每条边走一次」，有漂亮的判定定理；<b>哈密顿</b>是「每个点走一次」，至今没有好的充要条件。'},
    {t:'table', head:['','欧拉','哈密顿'],
      rows:[
        ['要求','每条<b>边</b>恰好走一次','每个<b>顶点</b>恰好访问一次'],
        ['判定','有简单充要条件','无已知的简单充要条件'],
        ['复杂度','多项式时间','NP 完全'],
        ['典型问题','柯尼斯堡七桥','旅行商问题']
      ]},
    {t:'thm', lb:'欧拉定理', h:'<p>连通无向图 <m>G</m>：</p><ul style="margin:6px 0 0"><li>有<b>欧拉回路</b>（回到起点）⟺ <b>所有</b>顶点度数为偶数。</li><li>有<b>欧拉通路</b>（不要求回到起点）⟺ <b>恰好两个</b>顶点度数为奇数。</li></ul>'},
    {t:'w', id:'euler'},
    {t:'p', h:'<b>为什么？</b>走进去就必须走出来——每经过一个顶点，用掉两条边（一进一出），所以除了起点和终点，其余顶点的边必须成对出现，度数为偶。'},
    {t:'p', h:'<b>哈密顿</b>这边只有充分条件。狄拉克定理：若 <m>n ≥ 3</m> 且每个顶点度数 <m>≥ n/2</m>，则存在哈密顿回路。注意它是<b>充分不必要</b>的——很多图不满足条件却仍有哈密顿回路。'},
    {t:'warn', h:'<p>判断哈密顿回路时，常见的必要条件是：图中不能有割点、不能有「度数 1 的顶点」（除非 n=2）。这些条件能帮你<b>快速否定</b>，但不能证明存在。</p>'},

    {t:'ex', title:'例 1　七桥问题', q:'柯尼斯堡有 4 块陆地，7 座桥连接（A、B 各有 3 座，C、D 各有 5 座？）。能否一次走遍所有桥且每桥只走一次？',
      steps:[
        '把 4 块陆地看成顶点，7 座桥看成边。',
        '统计各顶点度数：A=3，B=3，C=5，D=3（按经典七桥布局）。',
        '奇度顶点有 4 个。',
        '由欧拉定理，奇度顶点必须是 0 个（回路）或 2 个（通路）。',
        '4 个奇度顶点 → 既无欧拉回路也无欧拉通路。'
      ], ans:'不能（欧拉证明的经典结论）'},

    {t:'exs', id:'6.5', items:[
      {q:'一个连通图所有顶点的度数都是偶数，它有什么特殊通路？',
       hint:'直接套欧拉定理。',
       steps:['所有顶点度数为偶。','满足欧拉回路的充要条件。','所以存在欧拉回路，可以从任一点出发走遍所有边再回来。'],
       ans:'存在欧拉回路'},
      {q:'一个图有 8 个顶点，度数分别为 2,2,2,2,4,4,4,4，是否存在欧拉回路？',
       hint:'检查奇度顶点个数。',
       steps:['所有度数都是偶数，奇度顶点 0 个。','图需要连通（题目未说明，但若连通则满足条件）。'],
       ans:'若连通，则存在欧拉回路'},
      {q:'为什么「每个顶点度数 ≥ n/2」只是哈密顿回路的充分条件而非必要条件？',
       hint:'想想一个很瘦长的圈。',
       steps:['考虑 <m>C<sub>10</sub></m>（10 个点的圈），每个顶点度数都是 2。','<m>2 &lt; 10/2 = 5</m>，不满足狄拉克条件。','但它显然有哈密顿回路（就是沿着圈走一圈）。','所以条件是充分的，不必要。'],
       ans:'<m>C<sub>10</sub></m> 就是反例'}
    ]}
  ]
},

{
  id:'6.6', title:'最短通路问题',
  blocks:[
    {t:'lead', h:'带权图上「从 A 到 B 最省」的问题。Dijkstra 是最经典的解法，也是贪心算法最漂亮的范例之一。'},
    {t:'p', h:'<b>Dijkstra 的思路</b>：维护一个「已确定最短路」的集合 <m>S</m>。每轮从未确定的点里挑出<b>当前距离最小</b>的那个，确定它，然后用它去松弛邻居。'},
    {t:'w', id:'dij'},
    {t:'p', h:'<b>为什么贪心是对的？</b>因为所有边权非负。当前距离最小的那个点，不可能通过绕道其他点变得更短——绕道只会更长。所以可以放心确定它，永不反悔。'},
    {t:'warn', h:'<p><b>Dijkstra 不能处理负权边。</b>一旦有负权，「绕道会更短」就可能成立，贪心的前提崩了。</p><p>负权要用 Bellman-Ford（跑 <m>n−1</m> 轮松弛），它还能检测负权环。</p>'},
    {t:'p', h:'<b>Floyd 算法</b>则一次性求出所有点对之间的最短距离，三重循环，思想是「逐个允许中间点」：<div class="f" style="margin:8px 0">d[i][j] = min(d[i][j], d[i][k] + d[k][j])</div>这和 5.4 的 Warshall 是同一个骨架，只是把「或」换成了「取最小」。'},

    {t:'exs', id:'6.6', items:[
      {q:'Dijkstra 算法能否用于有负权边的图？为什么？',
       hint:'想想贪心的前提。',
       steps:['Dijkstra 的核心假设是「当前最近的点的距离已经最终确定」。','有负权时，绕一个远点再回来可能更短。','假设被推翻，算法可能给出错误结果。'],
       ans:'不能，需改用 Bellman-Ford'},
      {q:'Floyd 算法的时间复杂度是多少？',
       hint:'看三重循环。',
       steps:['外层 k、内层 i、j 各 n 次。','共 <m>n<sup>3</sup></m> 次基本操作。'],
       ans:'<m>O(n<sup>3</sup>)</m>'}
    ]}
  ]
},

{
  id:'6.7', title:'平面图',
  blocks:[
    {t:'lead', h:'平面图问的是：<b>能不能把图画在纸上，让边不交叉</b>？这个问题和电路板布线、地图绘制直接相关。'},
    {t:'def', lb:'平面图', h:'<p>能在平面上画出且<b>边只在顶点处相交</b>的图，称为<b>平面图</b>。这样的画法叫平面嵌入。</p>'},
    {t:'thm', lb:'欧拉公式', h:'<p>对连通的平面图：</p><div class="f" style="margin:8px 0">V − E + F = 2</div><p>其中 <m>V</m> 是顶点数，<m>E</m> 是边数，<m>F</m> 是面数（<b>包括外部那个无限面</b>）。</p>'},
    {t:'p', h:'这个公式的威力在于：它把三个看似无关的量绑在一起。知道两个就能求第三个。'},
    {t:'thm', lb:'有用的推论', h:'<p>对 <m>V ≥ 3</m> 的连通平面简单图：</p><div class="f" style="margin:8px 0">E ≤ 3V − 6</div><p>若还没有三角形（围长 <m>≥ 4</m>），则 <m>E ≤ 2V − 4</m>。</p>'},
    {t:'p', h:'<b>用这个推论可以证明 <m>K<sub>5</sub></m> 和 <m>K<sub>3,3</sub></m> 都不是平面图。</b>'},
    {t:'ul', items:[
      '<m>K<sub>5</sub></m>：<m>V=5, E=10</m>，而 <m>3V−6 = 9 &lt; 10</m>，违反不等式。',
      '<m>K<sub>3,3</sub></m>：<m>V=6, E=9</m>，<m>3V−6=12</m> 没违反，但它没有三角形（二分图），所以用更强的 <m>E ≤ 2V−4 = 8 &lt; 9</m>，违反。'
    ]},
    {t:'thm', lb:'库拉托夫斯基定理', h:'<p>一个图是平面图，当且仅当它<b>不包含</b> <m>K<sub>5</sub></m> 或 <m>K<sub>3,3</sub></m> 的<b>细分</b>作为子图。</p><p>「细分」就是在边上插入新的二度顶点。所以只要你的图里藏着一个「拉长版的 <m>K<sub>5</sub></m>」，它就画不平。</p>'},

    {t:'ex', title:'例 1　用欧拉公式反推面数', q:'一个连通平面图有 8 个顶点、12 条边，有多少个面？',
      steps:['欧拉公式 <m>V − E + F = 2</m>。','<m>8 − 12 + F = 2</m>。','<m>F = 6</m>。'],
      ans:'6 个面（含外部面）'},

    {t:'exs', id:'6.7', items:[
      {q:'证明 <m>K<sub>5</sub></m> 不是平面图。',
       hint:'用 <m>E ≤ 3V−6</m>。',
       steps:['<m>K<sub>5</sub></m> 有 <m>V=5</m>，<m>E = C(5,2) = 10</m>。','若平面，则需 <m>E ≤ 3×5−6 = 9</m>。','<m>10 &gt; 9</m>，矛盾。'],
       ans:'得证'},
      {q:'一个平面图有 10 个顶点，最多能有多少条边？',
       hint:'用 <m>E ≤ 3V−6</m>。',
       steps:['<m>E ≤ 3×10 − 6</m>。','<m>= 24</m>。'],
       ans:'最多 24 条'}
    ]}
  ]
},

{
  id:'6.8', title:'图着色',
  blocks:[
    {t:'lead', h:'给图的顶点染色，要求<b>相邻的顶点颜色不同</b>。最少需要几种颜色？这个数叫色数，记作 <m>χ(G)</m>。'},
    {t:'def', lb:'色数', h:'<p><m>χ(G)</m> = 使图能正常着色的最少颜色数。</p>'},
    {t:'w', id:'color'},
    {t:'table', head:['图','色数','原因'],
      rows:[
        ['空图（无边）','1','所有点同色'],
        ['二分图（含树、偶圈）','2','两边各一色'],
        ['奇圈 <m>C<sub>2k+1</sub></m>','3','交替染到最后一格撞色'],
        ['完全图 <m>K<sub>n</sub></m>','<m>n</m>','两两相邻，必须各不相同'],
        ['平面图','≤ 4','四色定理'],
        ['轮图 <m>W<sub>n</sub></m>（n 为偶数）','3 或 4','看边界圈的长度']
      ]},
    {t:'thm', lb:'四色定理', h:'<p>任何平面图的色数不超过 <b>4</b>。</p><p>这条定理 1852 年提出，1976 年由 Appel 和 Haken 用计算机辅助证明——是第一个「必须借助计算机」才完成的主要数学定理。</p>'},
    {t:'p', h:'<b>贪心着色</b>：按某个顺序遍历顶点，每个点染上「邻居已用过的最小可用颜色」。这样得到的颜色数不超过 <m>Δ+1</m>（<m>Δ</m> 是最大度数），但不一定最优——顺序不同结果可能差很多。'},
    {t:'tip', h:'<p>着色问题和<b>地图着色</b>是一回事：把每个区域缩成一个点，相邻区域连一条边，就成了平面图。</p><p>它也和<b>排课表</b>、<b>寄存器分配</b>、<b>频率分配</b>是同一个数学模型——只要两个任务「不能同时」，它们之间就连边。'},

    {t:'exs', id:'6.8', items:[
      {q:'<m>C<sub>5</sub></m>（五边形）的色数是多少？',
       hint:'试试用 2 种颜色交替染。',
       steps:['用 2 色交替：1红 2蓝 3红 4蓝，第 5 个点与 4 和 1 都相邻。','4 是蓝、1 是红，第 5 个点两种都用不了。','必须引入第 3 色。'],
       ans:'3'},
      {q:'一个二分图的色数最多是多少？',
       hint:'二分图的两部分内部没有边。',
       steps:['把两部分分别染成两种颜色。','同一部分内部无边，不会冲突。','所以 2 色就够（除非没有边，那就 1 色）。'],
       ans:'至多 2'},
      {q:'为什么地图着色问题可以转化为图着色？',
       hint:'想想顶点和边分别对应什么。',
       steps:['把每个行政区域缩成一个顶点。','相邻（共享边界）的区域之间连一条边。','要求相邻区域颜色不同，就变成「相邻顶点颜色不同」。','地图对应平面图，所以四色定理适用。'],
       ans:'区域当顶点，相邻关系当边'}
    ]}
  ]
}

]};

CH[7] = {
  title: '树',
  en: 'Trees',
  intro: '树是「最省的连通图」——<b>n 个点，n−1 条边，不多不少</b>。这个「刚好够用」的性质让它在数据结构、文件系统、决策分析里无处不在。这一章不难，但每个结论都值得动手画一遍。',
  sections: [

{
  id:'7.1', title:'树的介绍',
  blocks:[
    {t:'lead', h:'树有很多等价定义，它们说的是同一件事的不同侧面。记住其中三个，做题时按需要切换。'},
    {t:'def', lb:'树', h:'<p><b>树</b>是连通的无向图，且<b>不含简单回路</b>。不含回路但可能不连通的图叫<b>森林</b>——它的每个连通分量都是树。</p>'},
    {t:'thm', lb:'树的等价刻画', h:'<p>对 <m>n</m> 个顶点的无向图 <m>G</m>，以下命题等价：</p><ol style="margin:6px 0 0"><li><m>G</m> 是树（连通且无回路）。</li><li><m>G</m> 连通，且恰有 <m>n−1</m> 条边。</li><li><m>G</m> 无回路，且恰有 <m>n−1</m> 条边。</li><li><m>G</m> 中任意两点之间<b>恰有一条</b>简单通路。</li><li><m>G</m> 连通，但删掉任意一条边就<b>不再连通</b>（极小连通）。</li></ol>'},
    {t:'p', h:'第 4 条最值得记：<b>「唯一路径」是树的本质特征</b>。有两条路径就构成回路，一条都没有就不连通。'},
    {t:'table', head:['概念','定义'],
      rows:[
        ['根','指定的一个特殊顶点'],
        ['叶子','度数为 1 的顶点（根也可能是叶子，如果只有它自己）'],
        ['内部顶点','有子节点的顶点'],
        ['<m>m</m> 叉树','每个内部顶点至多 <m>m</m> 个孩子'],
        ['满 <m>m</m> 叉树','每个内部顶点恰好 <m>m</m> 个孩子'],
        ['有序树','孩子的顺序有意义']
      ]},
    {t:'thm', lb:'满 m 叉树的叶子数', h:'<p>若满 <m>m</m> 叉树有 <m>i</m> 个内部顶点，则叶子数 <m>l = (m−1)i + 1</m>。</p><p>证明用度数之和：总顶点 <m>n = i + l</m>，总边数 <m>n − 1</m>（树的性质），而总边数也等于 <m>mi</m>（每个内部顶点发出 <m>m</m> 条边）。所以 <m>i + l − 1 = mi</m>，得 <m>l = (m−1)i + 1</m>。</p>'},

    {t:'exs', id:'7.1', items:[
      {q:'一棵树有 10 个顶点，它有多少条边？',
       hint:'<m>n−1</m>。',
       steps:['树的边数恒为 <m>n−1</m>。','<m>10−1 = 9</m>。'],
       ans:'9 条'},
      {q:'一棵满二叉树有 5 个内部顶点，它有多少个叶子？',
       hint:'用 <m>l = (m−1)i+1</m>，<m>m=2</m>。',
       steps:['<m>l = (2−1)×5 + 1</m>。','<m>= 6</m>。','验证：根 + 5 个内部点，每个内部点 2 个孩子，共 12 条边、11 个顶点，其中 6 个是叶子。'],
       ans:'6 个叶子'},
      {q:'一个图有 8 个顶点、7 条边，且无回路。它连通吗？',
       hint:'用等价刻画第 3 条。',
       steps:['无回路且 <m>E = n−1 = 7</m>。','由等价刻画，它是树。','树必然连通。'],
       ans:'连通（是树）'}
    ]}
  ]
},

{
  id:'7.2', title:'树的应用',
  blocks:[
    {t:'lead', h:'树之所以无处不在，是因为它用最少的边实现了「全连通」——<b>任何多余的边都是浪费</b>。'},
    {t:'h3', h:'二叉搜索树'},
    {t:'p', h:'每个节点满足：<b>左子树的所有值 &lt; 根 &lt; 右子树的所有值</b>。于是查找、插入、删除都是 <m>O(\log n)</m>（树平衡时）。'},
    {t:'p', h:'<b>中序遍历</b>二叉搜索树，得到的就是升序序列——这一点在做题时经常用到。'},
    {t:'h3', h:'哈夫曼编码'},
    {t:'p', h:'给字符设计变长编码，让出现频率高的字符编码短、频率低的编码长，从而压缩总长度。构造方法：'},
    {t:'ol', items:[
      '把每个字符按频率做成一个单节点树，放进优先队列。',
      '取出频率最小的两个，合并成一棵新树，根节点频率为两者之和。',
      '把新树放回队列，重复，直到只剩一棵树。',
      '左分支标 0、右分支标 1，从根到叶的路径就是该字符的编码。'
    ]},
    {t:'p', h:'哈夫曼编码是<b>前缀码</b>：没有任何编码是另一个的前缀。这保证了编码可以唯一解码——因为解码时不会出现「两种切分方式」的歧义。这个性质正好来自「编码对应叶子，不对应内部节点」。'},
    {t:'h3', h:'决策树与博弈树'},
    {t:'p', h:'每个内部节点是一次判断，每条边是一个结果，叶子是最终结论。排序算法的比较次数下界、井字棋的最优策略，都是在这棵树上分析的。'},

    {t:'ex', title:'例 1　哈夫曼编码', q:'字符 A、B、C、D、E 的频率分别为 0.4、0.2、0.2、0.1、0.1，构造哈夫曼编码。',
      steps:[
        '取最小的两个：D(0.1) 和 E(0.1)，合并为 0.2。',
        '现有 A(0.4)、B(0.2)、C(0.2)、DE(0.2)。取最小的两个（比如 B 和 C），合并为 0.4。',
        '现有 A(0.4)、BC(0.4)、DE(0.2)。取 0.2 和任一 0.4，合并为 0.6。',
        '最后 0.6 与剩下的 0.4 合并为 1.0。',
        '一种可能的编码：A=0，B=10，C=11，D=010，E=011。'
      ], ans:'平均码长 = 0.4×1 + 0.2×2 + 0.2×2 + 0.1×3 + 0.1×3 = 2.2 位/字符'},

    {t:'exs', id:'7.2', items:[
      {q:'为什么哈夫曼编码必须是前缀码？',
       hint:'想想解码时怎么区分边界。',
       steps:['如果某编码是另一个的前缀，例如 A=0、B=01。','读到 01 时无法判断是「B」还是「A 后面跟了个 1」。','把字符都放在叶子（而非内部节点）上，就自然避免了这种情况。'],
       ans:'否则解码有歧义'},
      {q:'二叉搜索树的中序遍历结果有什么特点？',
       hint:'左 &lt; 根 &lt; 右。',
       steps:['中序是「左 → 根 → 右」。','左子树全部小于根，右子树全部大于根。','递归下去，整个序列升序。'],
       ans:'升序排列'}
    ]}
  ]
},

{
  id:'7.3', title:'树的遍历',
  blocks:[
    {t:'lead', h:'三种遍历的区别只有一个字：<b>根被访问的时机</b>。前序先碰根，中序中间碰，后序最后碰。'},
    {t:'table', head:['遍历','顺序','典型用途'],
      rows:[
        ['前序 preorder','根 → 左 → 右','复制一棵树、前缀表达式'],
        ['中序 inorder','左 → 根 → 右','二叉搜索树排序、中缀表达式'],
        ['后序 postorder','左 → 右 → 根','释放内存、后缀表达式求值']
      ]},
    {t:'w', id:'trav'},
    {t:'p', h:'记忆锚点：<b>三种名字里的「序」指的都是根的位置</b>。前序 = 根在前，中序 = 根在中间，后序 = 根在最后。左右子树的相对顺序永远不变。'},
    {t:'p', h:'<b>表达式树</b>是最好的应用例子：<m>(a+b)×(c−d)</m> 画成树后，前序遍历得前缀表达式 <m>× + a b − c d</m>，后序遍历得后缀表达式 <m>a b + c d − ×</m>，中序得中缀（需要补括号）。'},

    {t:'ex', title:'例 1　手工推一遍', q:'树的结构：根为 A，左子树 B（其左 D、右 E），右子树 C（其左 F、右 G）。写出三种遍历。',
      steps:[
        '前序：先 A，再整棵左子树（B, D, E），再整棵右子树（C, F, G）。得 A B D E C F G。',
        '中序：先左子树（D, B, E），再 A，再右子树（F, C, G）。得 D B E A F C G。',
        '后序：先左（D, E, B），再右（F, G, C），最后 A。得 D E B F G C A。'
      ], ans:'前序 ABDECFG　中序 DBEAFCG　后序 DEBFGCA'},

    {t:'exs', id:'7.3', items:[
      {q:'已知前序 ABC、中序 BAC，还原这棵树。',
       hint:'前序第一个是根。',
       steps:['前序首字符 A 是根。','中序中 A 的位置把序列分成 B | A | C，所以左子树是 B，右子树是 C。','树为：A 的左孩子 B，右孩子 C。'],
       ans:'根 A，左 B，右 C'},
      {q:'为什么「已知前序和后序」不能唯一确定一棵二叉树？',
       hint:'想想只有一个孩子的情况。',
       steps:['前序和后序都无法区分「左孩子」和「右孩子」。','例如前序 AB、后序 BA：B 可能是 A 的左孩子，也可能是右孩子。','必须有中序才能定左右。'],
       ans:'缺少中序信息，无法区分左右'}
    ]}
  ]
},

{
  id:'7.4', title:'生成树',
  blocks:[
    {t:'lead', h:'一个连通图可能有很多边，但只需要<b>一部分</b>就能保持连通。这部分如果刚好是一棵树，就叫生成树。'},
    {t:'def', lb:'生成树', h:'<p>连通图 <m>G</m> 的<b>生成树</b>是包含 <m>G</m> 全部顶点的一个子图，且它本身是一棵树。</p><p><m>n</m> 个顶点的图，任何生成树都恰有 <m>n−1</m> 条边。</p>'},
    {t:'p', h:'<b>怎么找生成树？</b>两种基本方法：'},
    {t:'ul', items:[
      '<b>深搜（DFS）</b>：一路往下走，遇到已访问的点就退回来。走出来的边构成生成树。',
      '<b>广搜（BFS）</b>：一层层往外扩，得到的生成树叫「广度优先生成树」，它的特点是<b>从根到任一点的距离最短</b>。'
    ]},
    {t:'thm', lb:'生成树的存在性', h:'<p>一个图有生成树，当且仅当它<b>连通</b>。</p><p>不连通图的每个连通分量各有一棵生成树，合起来叫生成森林。</p>'},
    {t:'p', h:'<b>生成树的数量</b>可以用 Matrix-Tree 定理算（用到拉普拉斯矩阵的行列式），但本科阶段通常只要求会和图有关的简单计数，比如完全图 <m>K<sub>n</sub></m> 有 <m>n<sup>n−2</sup></m> 棵生成树（凯莱公式）。'},

    {t:'exs', id:'7.4', items:[
      {q:'<m>K<sub>4</sub></m> 有多少棵不同的生成树？',
       hint:'用凯莱公式 <m>n<sup>n−2</sup></m>。',
       steps:['<m>n = 4</m>。','<m>4<sup>4−2</sup> = 4<sup>2</sup> = 16</m>。'],
       ans:'16 棵'},
      {q:'一个连通图有 6 个顶点，它的任何生成树有多少条边？',
       hint:'生成树是树。',
       steps:['树的性质：<m>n</m> 个顶点有 <m>n−1</m> 条边。','<m>6−1 = 5</m>。'],
       ans:'5 条'}
    ]}
  ]
},

{

    {t:'w', id:'mst'},
    {t:'p', h:'<b>Prim 算法</b>：从一个顶点开始，每次选「连接已选集合与未选集合的最小边」，把新顶点拉进来。它长得更像 Dijkstra。'},
    {t:'table', head:['','Kruskal','Prim'],

    {t:'p', h:'一个容易混淆的点：<b>MST 不唯一</b>。当有多条边权值相同时，可能产生不同的最小生成树，但<b>总权值一定相同</b>。'},

    {t:'ex', title:'例 1　手算一遍 Kruskal', q:'5 个顶点 A、B、C、D、E，边为 BC=1, AB=2, DE=2, AC=3, BD=4, CD=5, CE=6。求最小生成树。',

CH[8] = {
  title: '布尔代数',
  en: 'Boolean Algebra',
  intro: '布尔代数就是<b>把逻辑当成算术来算</b>：只有 0 和 1，加法是「或」，乘法是「与」。这一章看起来抽象，其实它就是你手机里那颗芯片的设计语言——每一条 <code>if</code> 判断最终都化成一堆逻辑门。',

    {t:'p', h:'这就是为什么芯片厂商特别喜欢 NAND：<b>只用一种门</b>就能做出整个处理器，工艺简单、成本低、良率高。你听到的「NAND 闪存」名字也来源于这个电路结构。'},

    {t:'p', h:'极小化的目标是：<b>用最少的门、最少的连线</b>实现给定的函数。实践中最常用的工具是卡诺图（Karnaugh Map）。'},
    {t:'h3', h:'卡诺图的核心思想'},
    {t:'p', h:'把真值表重新排列成二维格子，让<b>相邻格子只差一个变量</b>（格雷码顺序）。这样，如果两个相邻格子都是 1，那么它们对应的两个小项可以合并，消去那个变化的变量。'},
    {t:'p', h:'例：<m>x̄ȳz + x̄yz = x̄z(ȳ + y) = x̄z</m>。两个小项变成一个，省掉了变量 <m>y</m>。'},

    {t:'ul', items:[

      '<b>边界是环绕的</b>——最左列和最右列相邻，最上行和最下行相邻。这是卡诺图最容易漏的地方。'

    {t:'h3', h:'卡诺图步骤'},
    {t:'ol', items:[
      '按格雷码顺序排列行和列（00, 01, 11, 10）。',

    {t:'w', id:'kmap'},
    {t:'warn', h:'<p>卡诺图对 <b>4 个变量以内</b>很好用，5 个变量已经很勉强，6 个以上基本不可行——因为格子数按 <m>2<sup>n</sup></m> 增长。</p><p>实际芯片设计用的是 Quine-McCluskey 算法或启发式工具（如 Espresso），它们是卡诺图的算法化版本。</p>'},
    {t:'tip', h:'<p><b>圈的时候有两个策略：</b></p><ul><li>先圈最大的、独一无二的（必须圈的「孤立 1」）。</li><li>再用大圈覆盖剩下的 1，别怕重叠。</li></ul><p>常见的失分点是「圈太小」——看到 4 个能连成方块就一定要圈 4 个，不要拆成两个 2。</p>'},

    {t:'ex', title:'例 1　三变量卡诺图化简', q:'化简 <m>f(x,y,z) = Σ(0,1,2,3,6,7)</m>（即这些编号的输入组合输出为 1）。',

       ans:'格雷码首尾只差一位，故首尾相邻'},
      {q:'化简 <m>f = xy + xȳ</m>。',
       hint:'提取 x。',

  blocks:[
    {t:'lead', h:'算法不是一段代码。<b>代码是算法的一种写法，算法是写代码之前那个东西</b>——把输入变成输出的明确规则。'},
    {t:'def', lb:'算法', h:'<p>算法是求解某类问题的一组有限步骤，必须满足五条：</p><ul style="margin:6px 0 0"><li><b>输入</b>：有明确给定的一组数据。</li><li><b>输出</b>：对每组输入都产生一个结果。</li><li><b>确定性</b>：每一步做什么，写得没有歧义。</li><li><b>有限性</b>：执行有限步后一定停。</li><li><b>正确性</b>：对合法输入，输出确实是正确答案。</li></ul>'},
    {t:'p', h:'注意「有限性」说的是<b>每一步都能在有限时间内完成</b>，并且<b>总步数有限</b>。一个永远不终止的过程，哪怕每步都对，也不算算法——它只是「半算法」。'},
    {t:'p', h:'写算法时我们不用具体语言，而用<b>伪代码</b>：像程序，但省掉声明、分号、内存管理这些细节，只留下逻辑骨架。'},
    {t:'h3', h:'第一个例子：在有序表里找一个数'},
    {t:'p', h:'<b>线性查找</b>从头到尾逐个比对，最坏要看 <m>n</m> 次。<b>二分查找</b>利用「表已排序」这个额外信息：每次看中间那个数，比它小就去左半，大就去右半，区间每次都砍一半。'},
    {t:'table', head:['','线性查找','二分查找'],
      rows:[
        ['要求','无','表必须已排序'],
        ['最坏比较次数','<m>n</m>','<m>⌊log<sub>2</sub>n⌋+1</m>'],
        ['n = 1000','1000','10'],
        ['n = 10<sup>6</sup>','100 万','20'],
        ['n = 10<sup>9</sup>','10 亿','30']
      ]},
    {t:'warn', h:'<p>二分查找快 100 万倍，代价是<b>必须先排序</b>。而排序本身要 <m>O(n log n)</m>。所以：<b>只查一次就线性查，要查很多次才值得先排序</b>。这是工程上最常被忽略的取舍。</p>'},
    {t:'w', id:'bsearch'},
    {t:'p', h:'这就是为什么「猜数字」游戏里高手总猜 50、再猜 25：每一问都把可能性减半，20 问就能覆盖 100 万种情况。信息论上，每次比较只给 1 bit 信息，<m>⌈log<sub>2</sub>n⌉</m> 次是理论下界，二分查找已经最优。'},

    {t:'ex', title:'例 1　二分查找的步数', q:'在 1 到 1000 之间猜一个数，每次被告知「大了 / 小了 / 对了」。最少保证几次能猜到？',
      steps:[
        '每次询问把候选集合分成两半，最坏情况留下较大的一半。',
        '<m>1000 → 500 → 250 → 125 → 63 → 32 → 16 → 8 → 4 → 2 → 1</m>，共 10 次。',
        '公式：<m>⌈log<sub>2</sub>1000⌉ = 10</m>。'
      ], ans:'10 次（<m>⌈log<sub>2</sub>1000⌉</m>）'},

    {t:'exs', id:'9.1', items:[
      {q:'为什么「用自然语言描述得很清楚的步骤」不一定算算法？',
       hint:'回到五条性质里找。',
       steps:['自然语言常有歧义，违反<b>确定性</b>。','比如「取合适的数」，不同人理解不同。','算法要求每步唯一确定，所以要用形式化描述或伪代码。'],
       ans:'自然语言有歧义，违反确定性'},
      {q:'对长度 <m>n=2<sup>20</sup></m> 的有序表做二分查找，最坏比较多少次？',
       hint:'<m>2<sup>20</sup></m> 是 1048576。',
       steps:['<m>log<sub>2</sub>2<sup>20</sup> = 20</m>。','最坏还要加 1（最后一次比较）。'],
       ans:'21 次'}
    ]}
  ]
},

{
  id:'9.2', title:'排序算法',
  blocks:[
    {t:'lead', h:'排序是算法课的第一个正经问题，因为它有<b>很多种正确解法，代价差别巨大</b>——正好用来理解「不同算法」到底差在哪。'},
    {t:'h3', h:'三种基本排序'},
    {t:'table', head:['算法','做法','最坏比较次数','时间复杂度'],
      rows:[
        ['冒泡排序','相邻两个比，大的往后挪，一轮定一个','<m>n(n−1)/2</m>','<m>O(n<sup>2</sup>)</m>'],
        ['插入排序','把新元素插进前面已排好的部分','<m>n(n−1)/2</m>','<m>O(n<sup>2</sup>)</m>，近乎有序时 <m>O(n)</m>'],
        ['归并排序','对半切开，各自排好，再合并','<m>O(n log n)</m>','<m>O(n log n)</m>，稳定'],
        ['快速排序','选基准，小的放左、大的放右，递归','<m>O(n<sup>2</sup>)</m>','平均 <m>O(n log n)</m>']
      ]},
    {t:'p', h:'<b>归并排序为什么是 <m>n log n</m>？</b>把长度为 <m>n</m> 的表对半分，切了 <m>log<sub>2</sub>n</m> 层才切到单元素；每一层合并所有段总共比较 <m>n</m> 次左右。层数乘每层工作量，就是 <m>n log n</m>。'},
    {t:'f', h:'T(n) = 2T(n/2) + n  ⟹  T(n) = O(n log n)', note:'递归式的展开见第 11.4 节'},
    {t:'p', h:'<b>为什么 <m>n log n</m> 是「比较排序」的天花板？</b>因为 <m>n</m> 个元素有 <m>n!</m> 种排列，每次比较只回答「是 / 否」两个结果，所以至少要 <m>log<sub>2</sub>(n!)</m> 次比较；由斯特林公式，<m>log<sub>2</sub>(n!) ≈ n log<sub>2</sub>n</m>。任何比较排序都跳不过这个下界。'},
    {t:'tip', h:'<p>想突破 <m>n log n</m>，唯一的办法是<b>不比大小</b>：计数排序、基数排序用「值的范围」当索引，能做到 <m>O(n+k)</m>。代价是要求数据是限定范围内的整数。</p><p>这也是算法设计的一条通用经验：<b>换个假设，下界就变了</b>。</p>'},
    {t:'p', h:'实践中没有「最好的排序」。数据近乎有序时插入排序最快；内存不够时用外部归并；要求稳定就避开堆排序和快排；有大量重复值时三路快排最优。'},

    {t:'ex', title:'例 1　冒泡排序的比较次数', q:'对 <m>n=6</m> 个数做冒泡排序，最坏要比较多少次？',
      steps:[
        '第 1 轮比较 5 次，第 2 轮 4 次……最后一轮 1 次。',
        '总数 <m>5+4+3+2+1 = 15</m>。',
        '一般式：<m>n(n−1)/2</m>；<m>n=6</m> 得 15。'
      ], ans:'15 次'},

    {t:'exs', id:'9.2', items:[
      {q:'<m>n=1000</m> 时，冒泡排序大约比归并排序多花多少倍时间？',
       hint:'用 <m>n/2</m> 与 <m>log<sub>2</sub>n</m> 比。',
       steps:['冒泡约 <m>n<sup>2</sup>/2 = 500000</m> 次比较。','归并约 <m>n log<sub>2</sub>n = 1000×10 = 10000</m> 次。','比值约 50。'],
       ans:'约 50 倍'},
      {q:'为什么说「比较排序的下界是 <m>n log n</m>」不算推翻归并排序的最优性？',
       hint:'下界说的是「不可能更快」，不是「某种算法更快」。',
       steps:['下界证明的是<b>任何</b>基于比较的算法都至少要这么多次。','归并排序达到了这个量级，所以它在比较模型内是最优的。','要更快必须换模型（基数排序等）。'],
       ans:'下界是模型内的极限，归并已达最优量级'}
    ]}
  ]
},

{
  id:'9.3', title:'增长函数与大 O',
  blocks:[
    {t:'lead', h:'大 O 不是「算运行时间」，而是<b>描述一条曲线的形状</b>。它回答的是：输入变大时，代价往哪个方向涨。'},
    {t:'def', lb:'大 O 记号', h:'<p><m>f(n) = O(g(n))</m> 表示：存在常数 <m>C</m> 和 <m>n<sub>0</sub></m>，使得当 <m>n &gt; n<sub>0</sub></m> 时，<m>|f(n)| ≤ C·|g(n)|</m>。</p><p>说人话：<b>从某个规模往后，<m>f</m> 长不过 <m>g</m> 的某个常数倍</b>。</p>'},
    {t:'table', head:['记号','读法','含义','类比'],
      rows:[
        ['<m>f = O(g)</m>','大 O','<m>f</m> 增长不快于 <m>g</m>（上界）','≤'],
        ['<m>f = Ω(g)</m>','大 Omega','<m>f</m> 增长不慢于 <m>g</m>（下界）','≥'],
        ['<m>f = Θ(g)</m>','大 Theta','<m>f</m> 与 <m>g</m> 同阶','='],
        ['<m>f = o(g)</m>','小 o','<m>f</m> 增长严格慢于 <m>g</m>','&lt;']
      ]},
    {t:'p', h:'<b>怎么用：</b>只留最高阶项，去掉系数。<m>3n<sup>2</sup> + 5n + 2 = O(n<sup>2</sup>)</m>，因为 <m>n</m> 变大后 <m>3n<sup>2</sup></m> 完全压住其余两项。'},
    {t:'warn', h:'<p>大 O 丢掉的是常数，但常数在工程上可能是<b>几十倍</b>。两个都是 <m>O(n log n)</m> 的排序，实际速度能差 3 倍。</p><p>所以：<b>先看阶，同阶再看常数</b>。不要因为同阶就认为一样快。</p>'},
    {t:'w', id:'growth'},
    {t:'h3', h:'常见增长速度排序'},
    {t:'f', h:'1 &lt; log n &lt; √n &lt; n &lt; n log n &lt; n² &lt; n³ &lt; 2ⁿ &lt; n!', note:'从慢到快'},
    {t:'table', head:['复杂度','n=10','n=50','n=100','n=1000'],
      rows:[
        ['<m>log<sub>2</sub>n</m>','3','6','7','10'],
        ['<m>n</m>','10','50','100','1000'],
        ['<m>n log<sub>2</sub>n</m>','33','282','664','9966'],
        ['<m>n<sup>2</sup></m>','100','2500','10<sup>4</sup>','10<sup>6</sup>'],
        ['<m>n<sup>3</sup></m>','1000','1.25×10<sup>5</sup>','10<sup>6</sup>','10<sup>9</sup>'],
        ['<m>2<sup>n</sup></m>','1024','10<sup>15</sup>','10<sup>30</sup>','10<sup>301</sup>']
      ]},
    {t:'p', h:'看最后一行：<m>n=50</m> 时 <m>2<sup>50</sup></m> 已经是 <m>10<sup>15</sup></m>——按每秒十亿次算要跑 13 天，<m>n=100</m> 时宇宙年龄都不够。这就是「指数爆炸」的真实含义，也是为什么 NP 完全问题让人头疼。'},

    {t:'ex', title:'例 1　证明 <m>3n<sup>2</sup>+5n+2 = O(n<sup>2</sup>)</m>', q:'按定义找出常数 <m>C</m> 和 <m>n<sub>0</sub></m>。',
      steps:[
        '当 <m>n ≥ 1</m> 时，<m>5n ≤ 5n<sup>2</sup></m>，<m>2 ≤ 2n<sup>2</sup></m>。',
        '所以 <m>3n<sup>2</sup>+5n+2 ≤ 3n<sup>2</sup>+5n<sup>2</sup>+2n<sup>2</sup> = 10n<sup>2</sup></m>。',
        '取 <m>C = 10</m>，<m>n<sub>0</sub> = 1</m>，定义成立。'
      ], ans:'<m>C=10</m>，<m>n<sub>0</sub>=1</m>'},

    {t:'exs', id:'9.3', items:[
      {q:'<m>f(n) = 2n<sup>3</sup> + 100n<sup>2</sup></m>，它是 <m>O(n<sup>2</sup>)</m> 吗？',
       hint:'看 n 很大时谁主导。',
       steps:['<m>n</m> 增大后 <m>n<sup>3</sup></m> 项压住 <m>n<sup>2</sup></m>。','不存在常数 <m>C</m> 使 <m>2n<sup>3</sup> ≤ Cn<sup>2</sup></m> 对所有大 <m>n</m> 成立。'],
       ans:'不是，它是 <m>O(n<sup>3</sup>)</m>'},
      {q:'<m>log<sub>2</sub>n</m> 和 <m>√n</m> 哪个增长快？',
       hint:'代 <m>n = 10<sup>6</sup></m> 试试。',
       steps:['<m>log<sub>2</sub>10<sup>6</sup> ≈ 20</m>。','<m>√(10<sup>6</sup>) = 1000</m>。','<m>n</m> 越大差距越大，<m>√n</m> 快得多。'],
       ans:'<m>√n</m> 快，<m>log n = O(√n)</m>'},
      {q:'一个算法要 <m>2<sup>n</sup></m> 步，另一个要 <m>n<sup>10</sup></m> 步。<m>n</m> 很小时谁快？很大时呢？',
       hint:'两条曲线会交叉。',
       steps:['<m>n=10</m>：<m>2<sup>10</sup>=1024</m>，<m>10<sup>10</sup></m>，指数快。','<m>n=100</m>：<m>2<sup>100</sup>≈10<sup>30</sup></m>，<m>100<sup>10</sup>=10<sup>20</sup></m>，多项式快。','交叉点大约在 <m>n≈60</m> 附近。'],
       ans:'小 n 时指数快，大 n 时多项式快'}
    ]}
  ]
},

{
  id:'9.4', title:'算法设计策略',
  blocks:[
    {t:'lead', h:'大部分算法不是凭空想出来的，而是套用几种固定套路。认识套路，比记住单个算法有用得多。'},
    {t:'h3', h:'贪心：每步都选眼前最好的'},
    {t:'p', h:'贪心的优点是简单快速，缺点是<b>不保证全局最优</b>。它对某些问题恰好正确（如活动选择、最小生成树），对另一些问题会翻车（如 0-1 背包）。'},
    {t:'p', h:'<b>找零问题</b>：币值 25、10、5、1 分，找 63 分。贪心给 25+25+10+1+1+1，共 6 枚，正确。但如果币值是 1、3、4 分，找 6 分，贪心给 4+1+1（3 枚），最优是 3+3（2 枚）——贪心失败。'},
    {t:'h3', h:'分治：切开、各自解决、合并'},
    {t:'p', h:'归并排序、二分查找、快速幂都是分治。判断能不能分治看两点：<b>子问题是否同型</b>，<b>合并是否便宜</b>。如果合并比原问题还贵，分治就白搭。'},
    {t:'h3', h:'动态规划：记住算过的'},
    {t:'p', h:'分治把问题切小，但子问题<b>互相独立</b>；动态规划处理的子问题<b>会重复</b>。做法是把每个子问题的答案存进表里，用空间换时间。'},
    {t:'table', head:['策略','适用信号','典型例子','失效场景'],
      rows:[
        ['贪心','局部最优能推出全局最优','活动选择、Huffman、最小生成树','0-1 背包、硬币面值不规则'],
        ['分治','子问题同型且独立','归并排序、快速幂、大整数乘法','子问题重叠严重'],
        ['动态规划','子问题重复、有最优子结构','斐波那契、背包、编辑距离','状态无法压缩'],
        ['回溯','需要枚举所有可行解','八皇后、数独','规模稍大就爆炸']
      ]},
    {t:'p', h:'<b>斐波那契</b>是动态规划最好的入门例子。朴素递归算 <m>f(40)</m> 要几亿次调用，因为同一个 <m>f(k)</m> 被反复重算；改成从 <m>f(1)</m> 往上递推，只要 40 次加法。'},
    {t:'w', id:'recur'},
    {t:'h3', h:'P 与 NP'},
    {t:'p', h:'<b>P</b> 是能在多项式时间内<b>求解</b>的问题；<b>NP</b> 是能在多项式时间内<b>验证</b>一个解的问题。显然 <m>P ⊆ NP</m>，但 <m>P = NP</m> 与否至今未解——这是克雷研究所七个千禧年问题之一。'},
    {t:'p', h:'直觉上：<b>解数独很难，检查一个填好的数独对不对却很快</b>。这类「验证容易、求解难」的问题就是 NP 的典型。如果哪天有人证明 <m>P = NP</m>，所有这类问题都能被快速求解，现代密码学大半要重写。'},

    {t:'ex', title:'例 1　为什么贪心在 0-1 背包上失败', q:'背包容量 10，物品 A（重 6，值 10）、B（重 5，值 9）、C（重 4，值 7）。按「单位重量价值最高」贪心会怎么选？最优是什么？',
      steps:[
        '单位价值：A ≈ 1.67，B = 1.8，C = 1.75。贪心先选 B。',
        '剩容量 5，C 重 4 装得下，再选 C。总重 9，总值 16，剩 1 装不下 A。',
        '但 A + C 总重 10、总值 17，比 16 更好。',
        '贪心错在只看比值，没看「选 B 之后浪费了 1 格、且挡住了 A」。'
      ], ans:'贪心得 16；最优是 A + C = 17'},
    {t:'exs', id:'9.4', items:[
      {q:'算 <m>f(30)</m> 时，朴素递归与递推的加法次数大约差多少？',
       hint:'斐波那契递归树节点数约 <m>1.6<sup>n</sup></m>。',
       steps:['朴素递归调用次数约 <m>1.6<sup>30</sup> ≈ 1.3×10<sup>6</sup></m>。','递推只需 29 次加法。','差约 4 万倍，而且 <m>n</m> 越大差得越快。'],
       ans:'约 4 万倍'},
      {q:'「给一个解，能在多项式时间内验证它对」属于 P 还是 NP？',
       hint:'看定义。',
       steps:['这是 NP 的定义：可快速验证。','注意 NP 不要求能快速求解。','P 问题也满足可快速验证，所以 <m>P ⊆ NP</m>。'],
       ans:'NP'}
    ]}
  ]
}

]};

CH[10] = {
  title: '数论与密码学',
  en: 'Number Theory and Cryptography',
  origin: 4,
  intro: '这一章只有一个核心动作：<b>把整数折起来</b>。模运算把无限长的数轴卷成一个有限长的环，于是「除以 7 余几」这种事可以像加减乘一样运算。听起来像玩具，但你每次在网上付款，背后跑的就是这套东西——RSA 的全部安全性，建立在「大整数分解很难」这一个事实上。',
  sections: [

{
  id:'10.1', title:'整除与模运算',
  blocks:[
    {t:'lead', h:'数论从一条最简单的定义开始：一个数能不能被另一个数整除。'},
    {t:'def', lb:'整除', h:'<p><m>a | b</m> 表示存在整数 <m>c</m> 使 <m>b = ac</m>。读作「<m>a</m> 整除 <m>b</m>」。</p><p>注意符号方向：<m>3 | 12</m> 成立，<m>12 | 3</m> 不成立。另外 <m>a | 0</m> 对一切非零 <m>a</m> 成立，因为 <m>0 = a·0</m>。</p>'},
    {t:'thm', lb:'整除的基本性质', h:'<ul style="margin:4px 0 0"><li>若 <m>a|b</m> 且 <m>b|c</m>，则 <m>a|c</m>（传递）</li><li>若 <m>a|b</m> 且 <m>a|c</m>，则 <m>a|(mb+nc)</m> 对任意整数 <m>m,n</m> 成立（线性组合）</li><li>若 <m>a|b</m> 且 <m>b|a</m>，则 <m>a = ±b</m></li></ul>'},
    {t:'def', lb:'带余除法', h:'<p>对任意整数 <m>a</m> 和正整数 <m>m</m>，存在唯一的 <m>q, r</m> 使 <m>a = qm + r</m>，其中 <m>0 ≤ r &lt; m</m>。</p><p><m>q</m> 叫商，<m>r</m> 叫余数，记作 <m>a mod m = r</m>。</p>'},
    {t:'p', h:'「唯一」这两个字是模运算能成立的根本。如果余数可以取多种值，<m>a mod m</m> 就不是一个确定的数，后面的运算全都无从谈起。'},
    {t:'def', lb:'同余', h:'<p><m>a ≡ b (mod m)</m> 表示 <m>m | (a − b)</m>。也就是说，<b><m>a</m> 和 <m>b</m> 除以 <m>m</m> 的余数相同</b>。</p>'},
    {t:'p', h:'同余是一种<b>等价关系</b>（第 5 章的概念）：它把全体整数分成 <m>m</m> 个类，同类里的数互相同余。这就是「把数轴卷成环」的准确说法。'},
    {t:'thm', lb:'同余的运算性质', h:'<p>若 <m>a ≡ b (mod m)</m> 且 <m>c ≡ d (mod m)</m>，则：</p><ul style="margin:4px 0 0"><li><m>a + c ≡ b + d</m></li><li><m>a − c ≡ b − d</m></li><li><m>ac ≡ bd</m></li><li><m>a<sup>k</sup> ≡ b<sup>k</sup></m>（对任意正整数 <m>k</m>）</li></ul><p style="margin-top:6px">这四条加起来的意思是：<b>同余式可以像等式一样做加减乘和乘方</b>。但<b>不能随便做除法</b>——下面会讲为什么。</p>'},
    {t:'warn', h:'<p><m>2×3 ≡ 2×8 (mod 10)</m> 成立（都是 6），但如果两边同时约掉 2，得 <m>3 ≡ 8 (mod 10)</m>，错了。</p><p><b>除法要成立，必须除数和模互素</b>。这一条是 10.4 节解同余方程的关键。</p>'},
    {t:'p', h:'<b>怎么快速算大指数的余数？</b>不能真去算 <m>3<sup>100</sup></m>，那是个 48 位数。办法是「降幂」：找到一个指数周期，把大指数折回小范围。这就要用到费马小定理和欧拉定理（10.5 节）。'},

    {t:'ex', title:'例 1　算 <m>3<sup>100</sup> mod 7</m>', q:'不直接计算 <m>3<sup>100</sup></m>，求它除以 7 的余数。',
      steps:[
        '先看 3 的幂模 7：<m>3<sup>1</sup>=3</m>，<m>3<sup>2</sup>=9≡2</m>，<m>3<sup>3</sup>≡6</m>，<m>3<sup>4</sup>≡4</m>，<m>3<sup>5</sup>≡5</m>，<m>3<sup>6</sup>≡1</m>。',
        '周期是 6（这正符合费马小定理：<m>3<sup>6</sup> ≡ 1 mod 7</m>）。',
        '<m>100 = 6×16 + 4</m>，所以 <m>3<sup>100</sup> ≡ (3<sup>6</sup>)<sup>16</sup>·3<sup>4</sup> ≡ 1·4 = 4</m>。'
      ], ans:'4'},

    {t:'exs', id:'10.1', items:[
      {q:'求 <m>7<sup>222</sup> mod 11</m>。',
       hint:'费马小定理：<m>7<sup>10</sup> ≡ 1 mod 11</m>。',
       steps:['<m>222 = 10×22 + 2</m>。','<m>7<sup>222</sup> ≡ (7<sup>10</sup>)<sup>22</sup>·7<sup>2</sup> ≡ 7<sup>2</sup> = 49</m>。','<m>49 = 4×11 + 5</m>。'],
       ans:'5'},
      {q:'<m>17 ≡ 2 (mod 5)</m>，那么 <m>17<sup>2</sup> mod 5</m> 等于多少？',
       hint:'用幂的同余性质。',
       steps:['<m>17<sup>2</sup> ≡ 2<sup>2</sup> = 4 (mod 5)</m>。','直接验算：<m>289 = 57×5 + 4</m>，一致。'],
       ans:'4'},
      {q:'为什么同余式两边不能随便约掉同一个数？',
       hint:'举一个反例。',
       steps:['<m>2×3 ≡ 2×8 (mod 10)</m> 成立。','约掉 2 得 <m>3 ≡ 8 (mod 10)</m>，不成立。','因为 2 与模 10 不互素，约分改变了模。'],
       ans:'除数和模必须互素才能约'}
    ]}
  ]
},

{
  id:'10.2', title:'整数表示与进制',
  blocks:[
    {t:'lead', h:'计算机里没有「十进制」这回事，只有高低电平。所以整数在机器里是二进制串，而人写代码时常用十六进制——因为 4 位二进制正好对应 1 位十六进制，读起来短。'},
    {t:'def', lb:'b 进制表示', h:'<p>正整数 <m>n</m> 写成 <m>(a<sub>k</sub>a<sub>k−1</sub>…a<sub>1</sub>a<sub>0</sub>)<sub>b</sub></m>，意思是</p><div class="f" style="margin:6px 0">n = a<sub>k</sub>b<sup>k</sup> + a<sub>k−1</sub>b<sup>k−1</sup> + … + a<sub>1</sub>b + a<sub>0</sub></div><p>其中每位 <m>0 ≤ a<sub>i</sub> &lt; b</m>。</p>'},
    {t:'table', head:['进制','基数','每位取值','用途'],
      rows:[
        ['二进制','2','0,1','机器内部'],
        ['八进制','8','0–7','旧式权限位'],
        ['十进制','10','0–9','人读'],
        ['十六进制','16','0–9, A–F','内存地址、颜色值、哈希']
      ]},
    {t:'h3', h:'十进制转 b 进制：除基取余'},
    {t:'p', h:'不断除以 <m>b</m>，把余数从下往上读。以 <m>241</m> 转二进制为例：'},
    {t:'table', head:['步骤','除法','商','余数'],
      rows:[
        ['1','241 ÷ 2','120','1'],
        ['2','120 ÷ 2','60','0'],
        ['3','60 ÷ 2','30','0'],
        ['4','30 ÷ 2','15','0'],
        ['5','15 ÷ 2','7','1'],
        ['6','7 ÷ 2','3','1'],
        ['7','3 ÷ 2','1','1'],
        ['8','1 ÷ 2','0','1']
      ]},
    {t:'p', h:'余数倒着读：<m>11110001</m>。验算：<m>128+64+32+16+1 = 241</m>。'},
    {t:'p', h:'转十六进制更快：<m>241 = 15×16 + 1</m>，即 <m>(F1)<sub>16</sub></m>。二进制四位一组也能直接换：<m>1111 0001 → F 1</m>。'},
    {t:'p', h:'<b>为什么程序员偏爱十六进制？</b>因为 <m>16 = 2<sup>4</sup></m>，一个十六进制位刚好对应四个二进制位，互相转换不需要计算器，肉眼就能换。十进制做不到这一点。'},
    {t:'p', h:'顺带一提，网页颜色 <code>#C08A5E</code> 就是三个字节的十六进制：红 <code>C0</code>=192，绿 <code>8A</code>=138，蓝 <code>5E</code>=94。'},

    {t:'ex', title:'例 1　二进制转十进制', q:'求 <m>(10110111)<sub>2</sub></m> 的十进制值。',
      steps:[
        '按位展开：<m>1×2<sup>7</sup> + 0×2<sup>6</sup> + 1×2<sup>5</sup> + 1×2<sup>4</sup> + 0×2<sup>3</sup> + 1×2<sup>2</sup> + 1×2 + 1</m>。',
        '即 <m>128 + 32 + 16 + 4 + 2 + 1</m>。',
        '求和得 183。'
      ], ans:'183'},

    {t:'exs', id:'10.2', items:[
      {q:'把 <m>(2A)<sub>16</sub></m> 转成十进制与二进制。',
       hint:'A 代表 10。',
       steps:['<m>2×16 + 10 = 42</m>。','<m>42 = 32 + 8 + 2 = 101010<sub>2</sub></m>。','也可逐位换：<m>2→0010，A→1010</m>，得 <m>00101010</m>。'],
       ans:'十进制 42，二进制 101010'},
      {q:'一个字节最多能表示多少个不同的值？',
       hint:'8 位，每位两种。',
       steps:['每位 0 或 1，共 <m>2<sup>8</sup></m> 种。','即 256 个，范围 0–255（无符号）。'],
       ans:'256 个'}
    ]}
  ]
},

{
  id:'10.3', title:'素数、最大公约数与欧几里得算法',
  blocks:[
    {t:'lead', h:'素数是大整数的「原子」：每个大于 1 的整数都能唯一分解成素数乘积。而求两个数的最大公约数，有一个两千多年前就最优的算法。'},
    {t:'def', lb:'素数', h:'<p>大于 1 且只能被 1 和自身整除的整数叫<b>素数</b>；否则叫<b>合数</b>。1 既不是素数也不是合数。</p>'},
    {t:'thm', lb:'算术基本定理', h:'<p>每个大于 1 的整数都能<b>唯一</b>地写成素数幂的乘积（不计顺序）：</p><div class="f" style="margin:6px 0">n = p<sub>1</sub><sup>a<sub>1</sub></sup> p<sub>2</sub><sup>a<sub>2</sub></sup> … p<sub>k</sub><sup>a<sub>k</sub></sup></div><p>「唯一」是这个定理的分量所在。它保证了 gcd、lcm、约数个数都有确定的公式。</p>'},
    {t:'p', h:'例：<m>3600 = 2<sup>4</sup>·3<sup>2</sup>·5<sup>2</sup></m>。有了分解式，最大公约数取每个素数的<b>最小</b>指数，最小公倍数取<b>最大</b>指数：'},
    {t:'f', h:'gcd(3600, 1260) = 2²·3²·5 = 180，lcm = 2⁴·3²·5²·7 = 25200'},
    {t:'def', lb:'互素', h:'<p><m>gcd(a,b) = 1</m> 时称 <m>a</m> 与 <m>b</m> <b>互素</b>。注意互素不要求各自是素数——<m>8</m> 和 <m>9</m> 互素，但都不是素数。</p>'},
    {t:'h3', h:'欧几里得算法'},
    {t:'thm', lb:'辗转相除', h:'<div class="f" style="margin:4px 0">gcd(a, b) = gcd(b, a mod b)</div><p>反复用这条等式，直到余数为 0，此时的除数就是 gcd。</p>'},
    {t:'p', h:'为什么成立？因为 <m>a</m> 和 <m>b</m> 的<b>公因数集合</b>，与 <m>b</m> 和 <m>a mod b</m> 的公因数集合完全相同。<m>a = qb + r</m> 说明任何同时整除 <m>a</m>、<m>b</m> 的数必整除 <m>r</m>，反之亦然。'},
    {t:'w', id:'euclid'},
    {t:'p', h:'<b>它有多快？</b>每两步规模至少减半，所以步数是 <m>O(log min(a,b))</m>。求两个 1000 位数的 gcd，只需几千步——这就是它两千年没被淘汰的原因。'},
    {t:'thm', lb:'贝祖定理', h:'<p>存在整数 <m>s, t</m> 使</p><div class="f" style="margin:6px 0">s·a + t·b = gcd(a, b)</div><p>把欧几里得算法<b>倒着推</b>就能求出 <m>s, t</m>，这叫扩展欧几里得算法。</p>'},
    {t:'p', h:'贝祖定理最重要的推论：<b><m>a</m> 在模 <m>m</m> 下有逆元，当且仅当 <m>gcd(a,m)=1</m></b>。因为 <m>sa + tm = 1</m> 两边模 <m>m</m> 得 <m>sa ≡ 1</m>，<m>s</m> 就是逆元。RSA 求私钥 <m>d</m> 用的正是这一步。'},

    {t:'ex', title:'例 1　求 gcd(414, 662)', q:'用欧几里得算法求最大公约数。',
      steps:[
        '<m>662 = 1×414 + 248</m>',
        '<m>414 = 1×248 + 166</m>',
        '<m>248 = 1×166 + 82</m>',
        '<m>166 = 2×82 + 2</m>',
        '<m>82 = 41×2 + 0</m>，余数为 0，停止。'
      ], ans:'gcd = 2'},

    {t:'exs', id:'10.3', items:[
      {q:'求 <m>7</m> 在模 <m>26</m> 下的逆元。',
       hint:'用扩展欧几里得倒推。',
       steps:['<m>26 = 3×7 + 5</m>，<m>7 = 1×5 + 2</m>，<m>5 = 2×2 + 1</m>。','回代：<m>1 = 5 − 2×2 = 5 − 2(7−5) = 3×5 − 2×7</m>。','再代 <m>5 = 26 − 3×7</m>：<m>1 = 3×26 − 11×7</m>。','所以 <m>−11×7 ≡ 1</m>，<m>−11 ≡ 15 (mod 26)</m>。'],
       ans:'15（验算 <m>7×15 = 105 = 4×26+1</m>）'},
      {q:'<m>gcd(17, 31)</m> 是多少？17 在模 31 下有逆元吗？',
       hint:'31 是素数，17 不是它的倍数。',
       steps:['31 是素数，17 不被 31 整除。','所以 <m>gcd(17,31) = 1</m>，互素。','由贝祖定理，逆元存在。'],
       ans:'gcd = 1，有逆元（逆元是 11，因 <m>17×11=187=6×31+1</m>）'},
      {q:'为什么「试除法判断素数」对 100 位数不可行？',
       hint:'要试到多少？',
       steps:['需试到 <m>√n</m>。','100 位数开方是 50 位数。','每秒试十亿个也要 <m>10<sup>41</sup></m> 秒，远超宇宙年龄。'],
       ans:'需试到 <m>√n</m>，规模仍是指数级'}
    ]}
  ]
},

{
  id:'10.4', title:'线性同余与中国剩余定理',
  blocks:[
    {t:'lead', h:'上一节解决了「求逆元」，这一节解决「解方程」。形式只有一种：<m>ax ≡ b (mod m)</m>，但它的解法和解的个数都有讲究。'},
    {t:'thm', lb:'线性同余方程', h:'<p>方程 <m>ax ≡ b (mod m)</m> 有解，当且仅当 <m>gcd(a,m) | b</m>。若有解，则在模 <m>m</m> 下恰有 <m>gcd(a,m)</m> 个不同的解。</p>'},
    {t:'p', h:'<b>怎么解？</b>三步：'},
    {t:'ol', items:[
      '先算 <m>d = gcd(a,m)</m>，检查 <m>d | b</m>。不整除就无解，结束。',
      '两边和模同时除以 <m>d</m>，得到 <m>(a/d)x ≡ (b/d) (mod m/d)</m>，此时 <m>a/d</m> 与 <m>m/d</m> 互素。',
      '用扩展欧几里得求 <m>a/d</m> 的逆元，乘到右边，得到 <m>x<sub>0</sub></m>；再加 <m>m/d</m> 的倍数，得到全部 <m>d</m> 个解。'
    ]},
    {t:'p', h:'<b>例：</b>解 <m>3x ≡ 4 (mod 7)</m>。<m>gcd(3,7)=1</m>，唯一解。3 的逆元是 5（<m>3×5=15≡1</m>），所以 <m>x ≡ 5×4 = 20 ≡ 6 (mod 7)</m>。'},
    {t:'h3', h:'中国剩余定理'},
    {t:'thm', lb:'CRT', h:'<p>设 <m>m<sub>1</sub>, …, m<sub>k</sub></m> <b>两两互素</b>，则同余方程组</p><div class="f" style="margin:4px 0">x ≡ a<sub>1</sub> (mod m<sub>1</sub>)，…，x ≡ a<sub>k</sub> (mod m<sub>k</sub>)</div><p>在模 <m>M = m<sub>1</sub>m<sub>2</sub>…m<sub>k</sub></m> 下有<b>唯一</b>解。</p>'},
    {t:'p', h:'<b>构造法</b>（考试常用的就是它）：'},
    {t:'ol', items:[
      '算 <m>M = m<sub>1</sub>…m<sub>k</sub></m>，以及每个 <m>M<sub>i</sub> = M / m<sub>i</sub></m>。',
      '对每个 <m>i</m>，求 <m>M<sub>i</sub></m> 在模 <m>m<sub>i</sub></m> 下的逆元 <m>y<sub>i</sub></m>。',
      '令 <m>x = Σ a<sub>i</sub>M<sub>i</sub>y<sub>i</sub></m>，再对 <m>M</m> 取余。'
    ]},
    {t:'p', h:'这个定理听起来抽象，其实它就是<b>「韩信点兵」</b>：士兵三人一排余 2、五人一排余 3、七人一排余 2，问有多少人。答案在 105 以内唯一。'},
    {t:'p', h:'工程上它有个漂亮的应用：<b>用多个小模数并行计算</b>。想算一个巨大整数的运算，可以拆成几组小模数分别算，最后用 CRT 拼回去，每组都能用 64 位整数装下。'},

    {t:'ex', title:'例 1　解同余方程组', q:'求满足 <m>x ≡ 2 (mod 3)</m>、<m>x ≡ 3 (mod 5)</m>、<m>x ≡ 2 (mod 7)</m> 的最小正整数。',
      steps:[
        '<m>M = 3×5×7 = 105</m>，<m>M<sub>1</sub>=35</m>，<m>M<sub>2</sub>=21</m>，<m>M<sub>3</sub>=15</m>。',
        '求逆元：<m>35 ≡ 2 (mod 3)</m>，2 的逆元是 2，故 <m>y<sub>1</sub>=2</m>；<m>21 ≡ 1 (mod 5)</m>，<m>y<sub>2</sub>=1</m>；<m>15 ≡ 1 (mod 7)</m>，<m>y<sub>3</sub>=1</m>。',
        '<m>x = 2×35×2 + 3×21×1 + 2×15×1 = 140 + 63 + 30 = 233</m>。',
        '<m>233 mod 105 = 23</m>。'
      ], ans:'23（验算：23÷3 余 2，÷5 余 3，÷7 余 2）'},

    {t:'exs', id:'10.4', items:[
      {q:'解 <m>4x ≡ 6 (mod 10)</m>。',
       hint:'先看 gcd(4,10)。',
       steps:['<m>d = gcd(4,10) = 2</m>，<m>2 | 6</m>，有解，共 2 个。','同除 2：<m>2x ≡ 3 (mod 5)</m>。','2 的逆元是 3，<m>x ≡ 9 ≡ 4 (mod 5)</m>。','两个解：<m>x ≡ 4</m> 和 <m>x ≡ 9 (mod 10)</m>。'],
       ans:'<m>x ≡ 4</m> 或 <m>9 (mod 10)</m>'},
      {q:'<m>x ≡ 1 (mod 2)</m>、<m>x ≡ 2 (mod 4)</m> 有解吗？',
       hint:'模数不互素，CRT 不直接适用。',
       steps:['第一个式子说明 x 是奇数。','第二个式子说明 x 除以 4 余 2，即 x 是偶数。','矛盾，无解。'],
       ans:'无解'},
      {q:'CRT 为什么要求模数两两互素？',
       hint:'如果不互素会怎样？',
       steps:['构造法里要求 <m>M<sub>i</sub></m> 在模 <m>m<sub>i</sub></m> 下可逆。','<m>M<sub>i</sub></m> 是除 <m>m<sub>i</sub></m> 外所有模数之积；若某个 <m>m<sub>j</sub></m> 与 <m>m<sub>i</sub></m> 不互素，则 <m>gcd(M<sub>i</sub>, m<sub>i</sub>) &gt; 1</m>。','逆元不存在，构造失败（此时可能无解，也可能解不唯一）。'],
       ans:'否则 <m>M<sub>i</sub></m> 不可逆，构造失效'}
    ]}
  ]
},

{
  id:'10.5', title:'RSA 公钥密码',
  blocks:[
    {t:'lead', h:'前面所有工具在这里合成一件事：<b>让加密方法公开，仍然没人能解密</b>。这不是魔术，是把「求幂容易」和「分解难」这两个不对称性拼在一起。'},
    {t:'def', lb:'欧拉函数', h:'<p><m>φ(n)</m> 表示 <m>1</m> 到 <m>n</m> 中与 <m>n</m> 互素的整数个数。</p><ul style="margin:4px 0 0"><li><m>p</m> 是素数时，<m>φ(p) = p − 1</m>。</li><li><m>n = pq</m>（两个不同素数），<m>φ(n) = (p−1)(q−1)</m>。</li></ul>'},
    {t:'thm', lb:'欧拉定理', h:'<p>若 <m>gcd(a, n) = 1</m>，则</p><div class="f" style="margin:6px 0">a<sup>φ(n)</sup> ≡ 1 (mod n)</div>'},
    {t:'thm', lb:'费马小定理', h:'<p><m>p</m> 为素数且 <m>p ∤ a</m> 时，</p><div class="f" style="margin:6px 0">a<sup>p−1</sup> ≡ 1 (mod p)</div><p>它是欧拉定理在 <m>n</m> 为素数时的特例（<m>φ(p)=p−1</m>）。</p>'},
    {t:'p', h:'这两个定理的实际用途是<b>降幂</b>：指数再大，都能先对 <m>φ(n)</m> 取余，把指数压下来。'},
    {t:'h3', h:'RSA 的六步'},
    {t:'ol', items:[
      '<b>选素数</b>：随机取两个大素数 <m>p, q</m>（实际各 1024 位以上）。',
      '<b>算模数</b>：<m>n = pq</m>，公开；<m>φ(n) = (p−1)(q−1)</m>，保密。',
      '<b>选公钥指数</b> <m>e</m>：满足 <m>1 &lt; e &lt; φ(n)</m> 且 <m>gcd(e, φ(n)) = 1</m>。常用 65537。',
      '<b>算私钥</b> <m>d</m>：解 <m>ed ≡ 1 (mod φ(n))</m>，即 <m>d</m> 是 <m>e</m> 的逆元。',
      '<b>加密</b>：<m>C = M<sup>e</sup> mod n</m>。',
      '<b>解密</b>：<m>M = C<sup>d</sup> mod n</m>。'
    ]},
    {t:'p', h:'<b>为什么解密能还原？</b>因为 <m>ed = 1 + kφ(n)</m>，所以'},
    {t:'f', h:'C<sup>d</sup> = M<sup>ed</sup> = M<sup>1+kφ(n)</sup> = M · (M<sup>φ(n)</sup>)<sup>k</sup> ≡ M · 1<sup>k</sup> = M　(mod n)'},
    {t:'p', h:'最后一步用了欧拉定理。整个 RSA 的正确性就压在这一行上。'},
    {t:'w', id:'rsa'},
    {t:'warn', h:'<p><b>实际使用有几个坑：</b></p><ul><li>明文不能直接当数用，要先做填充（OAEP），否则同样的明文每次加密结果相同，可被比对。</li><li><m>M</m> 必须小于 <m>n</m>，否则要分段。</li><li><m>p</m> 和 <m>q</m> 不能太接近，否则 <m>√n</m> 附近搜索就能分解。</li><li>教科书 RSA 是<b>确定性</b>的，不能直接当签名方案用，必须先哈希。</li></ul>'},
    {t:'h3', h:'为什么难破解'},
    {t:'p', h:'攻击者知道 <m>n</m> 和 <m>e</m>，想求 <m>d</m> 就得知道 <m>φ(n)</m>，而求 <m>φ(n)</m> 等价于分解 <m>n</m>。目前最快的分解算法（数域筛法）对 2048 位数仍需天文时间。<b>RSA 的安全性不是「证明安全」，而是「暂时没人做得到」</b>。'},
    {t:'p', h:'这也是为什么量子计算让人紧张：Shor 算法能在多项式时间内分解大整数。一旦实用量子计算机出现，RSA 就失效了——所以现在已经在推后量子密码。'},
    {t:'p', h:'<b>数字签名</b>是 RSA 的另一半用途，方向反过来：用<b>私钥</b>加密摘要（签名），别人用<b>公钥</b>解密验证。因为只有你持有 <m>d</m>，所以验证通过就说明确实是你发的。'},

    {t:'ex', title:'例 1　完整跑一遍小型 RSA', q:'取 <m>p=5</m>、<m>q=11</m>、<m>e=3</m>，加密 <m>M=8</m>，再解密验证。',
      steps:[
        '<m>n = 5×11 = 55</m>，<m>φ(n) = 4×10 = 40</m>。',
        '<m>e=3</m>，<m>gcd(3,40)=1</m>，合法。',
        '解 <m>3d ≡ 1 (mod 40)</m>：<m>3×27 = 81 = 2×40+1</m>，所以 <m>d=27</m>。',
        '加密：<m>C = 8<sup>3</sup> mod 55 = 512 mod 55 = 17</m>（<m>55×9=495</m>）。',
        '解密：<m>17<sup>27</sup> mod 55</m>。用快速幂算得 8。',
        '公钥 <m>(55, 3)</m>，私钥 <m>(55, 27)</m>。'
      ], ans:'密文 17，解密回 8'},

    {t:'exs', id:'10.5', items:[
      {q:'<m>p=7</m>、<m>q=13</m>、<m>e=5</m>，求 <m>n</m>、<m>φ(n)</m>、<m>d</m>。',
       hint:'<m>ed ≡ 1 (mod φ)</m>。',
       steps:['<m>n = 91</m>，<m>φ = 6×12 = 72</m>。','解 <m>5d ≡ 1 (mod 72)</m>。','<m>5×29 = 145 = 2×72+1</m>，所以 <m>d = 29</m>。'],
       ans:'<m>n=91</m>，<m>φ=72</m>，<m>d=29</m>'},
      {q:'为什么 <m>e</m> 常取 65537？',
       hint:'二进制是 10000000000000001。',
       steps:['65537 是素数，且 <m>65537 = 2<sup>16</sup>+1</m>。','二进制只有两个 1，快速幂只需 17 次平方和 1 次乘法。','加密很快，而安全性不受影响。'],
       ans:'它是 <m>2<sup>16</sup>+1</m>，快速幂只需 17 次平方，加密极快'},
      {q:'如果两个人用了相同的 <m>n</m>，但不同的 <m>e</m>，安全吗？',
       hint:'<m>φ(n)</m> 是共享的。',
       steps:['知道 <m>n</m> 和任一 <m>e</m> 仍无法求 <m>d</m>（要分解 n）。','但一旦其中一方的 <m>d</m> 泄露，就能算出 <m>φ(n)</m>，进而求出另一方的 <m>d</m>。','所以实际系统中每个用户必须有独立的 <m>n</m>。'],
       ans:'不安全，一个私钥泄露会连累另一个'}
    ]}
  ]
}

]};

CH[11] = {
  title: '归纳与递归',
  en: 'Induction and Recursion',
  origin: 5,
  intro: '归纳法常被误解成「举几个例子然后猜」。恰恰相反，它是<b>把无穷多个命题压成两步</b>的严密工具：一步验证起点，一步证明「如果这一步成立，下一步也成立」。而递归定义和归纳证明是同一枚硬币的两面——定义怎么长出来，证明就怎么长出来。',
  sections: [

{
  id:'11.1', title:'数学归纳法',
  blocks:[
    {t:'lead', h:'想象一排无限长的多米诺骨牌。<b>你只需要做两件事</b>：推倒第一块，并保证任意一块倒下时能撞倒下一块。剩下的，物理定律替你完成。'},
    {t:'thm', lb:'第一数学归纳法', h:'<p>要证对一切正整数 <m>n</m>，命题 <m>P(n)</m> 成立，只需：</p><ol style="margin:6px 0 0"><li><b>基础步</b>：<m>P(1)</m> 成立。</li><li><b>归纳步</b>：对任意 <m>k ≥ 1</m>，若 <m>P(k)</m> 成立，则 <m>P(k+1)</m> 成立。</li></ol><p style="margin-top:6px">两步都成立，则 <m>∀n P(n)</m>。</p>'},
    {t:'p', h:'<b>最容易搞混的一点</b>：归纳步里你不是在「假设 <m>P(n)</m> 对所有 n 成立」——那叫循环论证。你只假设<b>某一个</b> <m>k</m> 成立，然后推出 <m>k+1</m>。这个「如果……则……」的蕴涵，本身对每个 <m>k</m> 都要证。'},
    {t:'p', h:'把它想成一条链子：基础步给出第一环，归纳步给出「每一环都扣着下一环」的保证。链子的长度是无限的，但你要检查的只有两种连接方式。'},

    {t:'ex', title:'例 1　前 n 个奇数之和', q:'证明 <m>1 + 3 + 5 + … + (2n−1) = n<sup>2</sup></m>。',
      steps:[
        '<b>基础步</b>：<m>n=1</m> 时左边 <m>= 1</m>，右边 <m>= 1<sup>2</sup> = 1</m>，成立。',
        '<b>归纳假设</b>：设 <m>n=k</m> 时成立，即 <m>1+3+…+(2k−1) = k<sup>2</sup></m>。',
        '<b>推 <m>k+1</m></b>：<m>1+3+…+(2k−1)+(2k+1) = k<sup>2</sup> + 2k + 1</m>。',
        '<m>k<sup>2</sup>+2k+1 = (k+1)<sup>2</sup></m>，正好是 <m>n=k+1</m> 的右边。',
        '由归纳原理，对一切正整数成立。'
      ], ans:'成立'},

    {t:'exs', id:'11.1', items:[
      {q:'证明 <m>1 + 2 + … + n = n(n+1)/2</m>。',
       hint:'归纳步里把 <m>k(k+1)/2</m> 加上 <m>k+1</m>。',
       steps:['基础步：<m>n=1</m> 时 <m>1 = 1×2/2</m>。','假设 <m>Σ<sub>i=1</sub><sup>k</sup> i = k(k+1)/2</m>。','加 <m>k+1</m>：<m>k(k+1)/2 + (k+1) = (k+1)(k+2)/2</m>。','正是 <m>n=k+1</m> 的形式。'],
       ans:'成立'},
      {q:'证明当 <m>n ≥ 5</m> 时 <m>2<sup>n</sup> &gt; n<sup>2</sup></m>。',
       hint:'基础步从 <m>n=5</m> 开始，归纳步要说明 <m>2k<sup>2</sup> ≥ (k+1)<sup>2</sup></m>。',
       steps:['基础步：<m>2<sup>5</sup> = 32 &gt; 25</m>。','假设 <m>2<sup>k</sup> &gt; k<sup>2</sup></m>（<m>k ≥ 5</m>），则 <m>2<sup>k+1</sup> &gt; 2k<sup>2</sup></m>。','当 <m>k ≥ 3</m> 时 <m>2k<sup>2</sup> − (k+1)<sup>2</sup> = k<sup>2</sup>−2k−1 &gt; 0</m>。','所以 <m>2<sup>k+1</sup> &gt; (k+1)<sup>2</sup></m>。'],
       ans:'成立（从 n=5 起）'},
      {q:'下面这个证明错在哪：「任意 n 匹马都同色」。归纳步说：取 n+1 匹马，去掉第一匹得 n 匹（同色），去掉最后一匹也得 n 匹（同色），两组有重叠，故全部同色。',
       hint:'看看 n 最小的时候。',
       steps:['<m>n=1</m> 时（即从 1 匹推到 2 匹），「去掉第一匹」和「去掉最后一匹」得到的是两匹不同的马。','这两组<b>没有重叠</b>，无法传递同色。','归纳步要求对一切 <m>k ≥ 1</m> 成立，在 <m>k=1</m> 处断裂。'],
       ans:'归纳步在 k=1 时不成立，两组没有交集'}
    ]}
  ]
},

{
  id:'11.2', title:'强归纳法与良序性',
  blocks:[
    {t:'lead', h:'有些命题，推 <m>k+1</m> 时需要的不只是 <m>P(k)</m>，而是前面<b>所有</b>的结论。这时候用强归纳。'},
    {t:'thm', lb:'强归纳法', h:'<p>要证 <m>∀n ≥ n<sub>0</sub>, P(n)</m>：</p><ol style="margin:6px 0 0"><li><b>基础步</b>：验证 <m>P(n<sub>0</sub>)</m>（有时需要验证前几项）。</li><li><b>归纳步</b>：假设 <m>P(n<sub>0</sub>), P(n<sub>0</sub>+1), …, P(k)</m> <b>全部</b>成立，推出 <m>P(k+1)</m>。</li></ol>'},
    {t:'p', h:'<b>强归纳并不比普通归纳更强</b>。两种形式在逻辑上等价，只是「假设更多」让证明写起来方便。凡是能用强归纳证的，都能改写成普通归纳，只是要多绕几步。'},
    {t:'p', h:'为什么它更好用？因为很多问题天然是「拆成更小的部分」：把一个整数拆成两个更小的整数相乘，把一棵树拆成两棵子树。拆出来的部分比 <m>k</m> 小多少不确定，只知道「更小」，这时就需要对<b>所有</b>更小的情形都有结论。'},

    {t:'ex', title:'例 1　素数分解的存在性', q:'证明每个大于 1 的整数都能写成素数乘积。',
      steps:[
        '<b>基础步</b>：<m>n=2</m> 是素数，本身就是「一个素数的乘积」。',
        '<b>归纳步</b>：设对一切 <m>2 ≤ m &lt; n</m> 成立，考虑 <m>n</m>。',
        '若 <m>n</m> 是素数，直接成立。',
        '若 <m>n</m> 是合数，则 <m>n = ab</m>，其中 <m>2 ≤ a, b &lt; n</m>。',
        '由归纳假设，<m>a</m> 和 <m>b</m> 都能写成素数乘积，乘起来就是 <m>n</m> 的分解。'
      ], ans:'存在性成立（唯一性由算术基本定理给出）'},

    {t:'exs', id:'11.2', items:[
      {q:'用 4 分和 7 分邮票，证明任何 <m>n ≥ 18</m> 的邮资都能凑出。',
       hint:'验证 18、19、20、21 四个基础情形，之后每次加 4。',
       steps:['基础：<m>18=7+7+4</m>，<m>19=7+4+4+4</m>，<m>20=4×5</m>，<m>21=7×3</m>。','归纳步：设 <m>n ≥ 22</m> 时 <m>n−4 ≥ 18</m> 已能凑出。','在 <m>n−4</m> 的方案上再加一张 4 分，得 <m>n</m>。','因为递推跨度是 4，基础步要连续验 4 个。'],
       ans:'成立'},
      {q:'为什么强归纳的基础步有时要验好几项？',
       hint:'看递推的跨度。',
       steps:['如果归纳步从 <m>n−4</m> 推到 <m>n</m>，就需要连续 4 个起点。','起点不够，链条中间会断。','普通归纳只跨 1 步，所以验 1 项就够。'],
       ans:'递推跨度为 d 时，需连续验证 d 个基础情形'},
      {q:'叙述良序原理，并说明它为什么和归纳法等价。',
       hint:'反证：如果命题有反例，取最小的那个。',
       steps:['良序原理：任何非空正整数集都有最小元。','若归纳法成立而良序不成立，就能构造无穷递降，矛盾。','反之，若命题有反例，取最小反例 <m>m</m>，则 <m>m−1</m> 都成立，由归纳步得 <m>m</m> 成立，矛盾。'],
       ans:'非空正整数集必有最小元；与归纳法互为等价形式'}
    ]}
  ]
},

{
  id:'11.3', title:'递归定义与结构归纳',
  blocks:[
    {t:'lead', h:'归纳法证明「所有 n 如何」，结构归纳证明「所有对象如何」。前提是对象本身要用递归的方式定义出来。'},
    {t:'def', lb:'递归定义', h:'<p>一个结构用递归方式定义，必须包含三部分：</p><ol style="margin:6px 0 0"><li><b>基础情形</b>：最基本对象属于该集合。</li><li><b>递归规则</b>：由已有对象构造新对象的方法。</li><li><b>排斥条款</b>：除此之外没有别的对象（常省略，但逻辑上必需）。</li></ol>'},
    {t:'p', h:'例：阶乘 <m>n! = n·(n−1)!</m>，<m>0! = 1</m>；斐波那契 <m>f<sub>n</sub> = f<sub>n−1</sub>+f<sub>n−2</sub></m>，<m>f<sub>0</sub>=0, f<sub>1</sub>=1</m>；字符串长度 <m>l(λ)=0</m>，<m>l(wx)=l(w)+1</m>。'},
    {t:'p', h:'<b>第三条最容易被忽略</b>，但它决定了定义是否「紧」。没有排斥条款，你无法排除「偷偷混进来的额外对象」，后面的证明就失去基础。'},
    {t:'thm', lb:'结构归纳法', h:'<p>要证性质 <m>P</m> 对某个递归定义的结构全体成立：</p><ol style="margin:6px 0 0"><li>对<b>每个基础情形</b>验证 <m>P</m>。</li><li>对<b>每条递归规则</b>，假设输入对象满足 <m>P</m>，证明构造出的新对象也满足 <m>P</m>。</li></ol>'},
    {t:'p', h:'这和普通归纳的关系：普通归纳是按 <m>n</m> 从小到大证；结构归纳是按「构造的层数」证。树、表达式、语法串都只能用后者。'},

    {t:'ex', title:'例 1　满二叉树的叶子数', q:'满二叉树（每个内部结点恰有两个孩子）中，叶子数 <m>l(T)</m> 与内部结点数 <m>i(T)</m> 满足 <m>l(T) = i(T) + 1</m>。用结构归纳证明。',
      steps:[
        '<b>基础情形</b>：单个结点既是根也是叶子，<m>i=0</m>，<m>l=1</m>，<m>1 = 0+1</m>，成立。',
        '<b>递归规则</b>：设 <m>T</m> 由根、左子树 <m>T<sub>1</sub></m>、右子树 <m>T<sub>2</sub></m> 构成。',
        '归纳假设：<m>l(T<sub>1</sub>) = i(T<sub>1</sub>)+1</m>，<m>l(T<sub>2</sub>) = i(T<sub>2</sub>)+1</m>。',
        '则 <m>i(T) = i(T<sub>1</sub>)+i(T<sub>2</sub>)+1</m>，<m>l(T) = l(T<sub>1</sub>)+l(T<sub>2</sub>)</m>。',
        '代入：<m>l(T) = i(T<sub>1</sub>)+1+i(T<sub>2</sub>)+1 = i(T)+1</m>。'
      ], ans:'<m>l(T) = i(T)+1</m>'},

    {t:'exs', id:'11.3', items:[
      {q:'递归定义集合 <m>S = {3<sup>n</sup> | n ≥ 0}</m>。',
       hint:'基础情形 1，递归规则乘 3。',
       steps:['基础：<m>1 ∈ S</m>。','递归：若 <m>x ∈ S</m>，则 <m>3x ∈ S</m>。','排斥：<m>S</m> 中再无其他元素。'],
       ans:'<m>1∈S</m>；<m>x∈S ⟹ 3x∈S</m>'},
      {q:'用结构归纳证明：满二叉树的高度 <m>h</m> 满足 <m>h ≤ i(T)</m>（单结点高度记 0）。',
       hint:'基础情形 <m>h=0, i=0</m>。',
       steps:['基础：<m>0 ≤ 0</m>。','设 <m>T</m> 的两棵子树高度为 <m>h<sub>1</sub>, h<sub>2</sub></m>，则 <m>h = 1 + max(h<sub>1</sub>, h<sub>2</sub>)</m>。','由归纳假设 <m>h<sub>1</sub> ≤ i(T<sub>1</sub>)</m>，<m>h<sub>2</sub> ≤ i(T<sub>2</sub>)</m>。','<m>h ≤ 1 + max(i(T<sub>1</sub>), i(T<sub>2</sub>)) ≤ 1 + i(T<sub>1</sub>) + i(T<sub>2</sub>) = i(T)</m>。'],
       ans:'成立'}
    ]}
  ]
},

{
  id:'11.4', title:'递归算法',
  blocks:[
    {t:'lead', h:'递归算法就是「把问题交给一个更小的自己」。写法极短，但代价可能极高——关键在于<b>子问题有没有被重复计算</b>。'},
    {t:'p', h:'<b>汉诺塔</b>是最干净的递归：把 <m>n−1</m> 个盘子移到辅助柱，把最大的移过去，再把 <m>n−1</m> 个移过去。步数 <m>T(n) = 2T(n−1)+1</m>，解得 <m>T(n) = 2<sup>n</sup>−1</m>。64 个盘子要 <m>1.8×10<sup>19</sup></m> 步，按每秒一步要 5800 亿年。'},
    {t:'p', h:'<b>斐波那契</b>是反面教材：<m>f(n) = f(n−1)+f(n−2)</m> 直接递归，会把同一个 <m>f(k)</m> 算无数次。调用次数本身按黄金比 <m>φ<sup>n</sup></m> 增长。'},
    {t:'w', id:'recur'},
    {t:'p', h:'<b>递归式的展开</b>：把 <m>T(n)</m> 一层层代进去，直到出现基础情形，再把每层的工作量加起来。以归并排序为例：'},
    {t:'f', h:'T(n) = 2T(n/2) + n = 4T(n/4) + 2n = … = 2<sup>k</sup>T(n/2<sup>k</sup>) + kn'},
    {t:'p', h:'取 <m>k = log<sub>2</sub>n</m> 使 <m>n/2<sup>k</sup> = 1</m>，得 <m>T(n) = n·T(1) + n log<sub>2</sub>n = O(n log n)</m>。'},
    {t:'p', h:'这就是「递归树」方法：<b>树有多少层，每层总共做多少活</b>，两者相乘就是复杂度。'},
    {t:'table', head:['递归式','解法','典型算法'],
      rows:[
        ['<m>T(n)=T(n−1)+1</m>','<m>O(n)</m>','线性递归、阶乘'],
        ['<m>T(n)=2T(n−1)+1</m>','<m>O(2<sup>n</sup>)</m>','汉诺塔'],
        ['<m>T(n)=T(n/2)+1</m>','<m>O(log n)</m>','二分查找'],
        ['<m>T(n)=2T(n/2)+n</m>','<m>O(n log n)</m>','归并排序'],
        ['<m>T(n)=2T(n/2)+1</m>','<m>O(n)</m>','树的遍历']
      ]},
    {t:'tip', h:'<p><b>什么时候该把递归改成递推？</b>两个信号：子问题被重复计算（斐波那契），或者递归深度会爆栈（<m>n</m> 上万）。</p><p>前者用记忆化或自底向上填表，后者改写成循环加显式栈。</p>'},

    {t:'ex', title:'例 1　汉诺塔的步数', q:'<m>n</m> 个盘子最少要移动多少次？',
      steps:[
        '设 <m>T(n)</m> 为最少步数。',
        '必须先把上面 <m>n−1</m> 个移到辅助柱：<m>T(n−1)</m> 步。',
        '把最大的移到目标柱：1 步。',
        '再把 <m>n−1</m> 个移过去：<m>T(n−1)</m> 步。',
        '所以 <m>T(n) = 2T(n−1)+1</m>，<m>T(1)=1</m>。展开得 <m>T(n) = 2<sup>n</sup>−1</m>。'
      ], ans:'<m>2<sup>n</sup>−1</m>'},

    {t:'exs', id:'11.4', items:[
      {q:'朴素递归算 <m>f(10)</m> 要调用多少次？',
       hint:'调用次数 <m>C(n) = C(n−1)+C(n−2)+1</m>，<m>C(1)=C(2)=1</m>。',
       steps:['<m>C(3)=3</m>，<m>C(4)=5</m>，<m>C(5)=9</m>，<m>C(6)=15</m>。','继续：<m>C(7)=25</m>，<m>C(8)=41</m>，<m>C(9)=67</m>，<m>C(10)=109</m>。','而递推只要 9 次加法。'],
       ans:'109 次'},
      {q:'为什么二分查找的递归式是 <m>T(n)=T(n/2)+1</m> 而不是 <m>2T(n/2)</m>？',
       hint:'每次只走一半。',
       steps:['比较中间元素后，只在左半或右半<b>其中之一</b>继续找。','子问题只有 1 个，不是 2 个。','所以是 <m>T(n/2)</m>，解出 <m>O(log n)</m>。'],
       ans:'因为每步只递归一个子问题'},
      {q:'归并排序的递归树有几层？每层总工作量是多少？',
