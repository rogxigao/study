W.cycle = {
  title:'Machine Cycle Simulator · 机器周期',
  hint:'Fetch → Decode → Execute',
  cap:'程序 156C / 166D / 5056 / 30CE / C000 把 6C、6D 两个数相加存到 6E。每点一次走一个阶段：取指时 PC 自增，执行时才真正改寄存器或内存。',
  html:function(){
    return '<div class="w-ctl"><button class="w-btn" data-step>Step ▶</button><button class="w-btn" data-reset>Reset</button>'+
      '<span style="font-family:var(--mono);font-size:11px;color:var(--muted)">phase: <b data-phase style="color:var(--accent)">ready</b></span></div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">'+
      '<div><div class="small" style="margin-bottom:4px">MAIN MEMORY</div><div data-mem></div></div>'+
      '<div><div class="small" style="margin-bottom:4px">REGISTERS</div><div data-reg class="w-out"></div>'+
      '<div class="small" style="margin-top:10px;margin-bottom:4px">CYCLE LOG</div><div data-log style="font-size:11.5px;line-height:1.7;color:var(--ink2);max-height:150px;overflow:auto"></div></div>'+
      '</div>';
  },
  mount:function(root){
    var initial={PC:0,IR:'----',R0:0,R5:0,R6:0};
    var st={PC:0,IR:'----',R0:0,R5:0,R6:0,phase:0,halt:false,log:[]};
    var mem={'0':'156C','1':'166D','2':'5056','3':'30CE','4':'C000','6C':'0005','6D':'0003','6E':'0000'};
    function hex(n){ return n.toString(16).toUpperCase().padStart(4,'0'); }
    function reset(){
      st={PC:0,IR:'----',R0:0,R5:0,R6:0,phase:0,halt:false,log:[]};
      mem={'0':'156C','1':'166D','2':'5056','3':'30CE','4':'C000','6C':'0005','6D':'0003','6E':'0000'};
      render();
    }
    function render(){
      var ph=['fetch','decode','execute'][st.phase%3];
      if(st.halt) ph='halted';
      if(!st.log.length) ph='ready';
      root.querySelector('[data-phase]').textContent=ph;
      var rows='';
      ['0','1','2','3','4','6C','6D','6E'].forEach(function(a){
        var cur=(!st.halt && st.PC.toString(16).toUpperCase()===a.toUpperCase());
        rows+='<div style="display:flex;gap:8px;padding:2px 6px;border-radius:3px;background:'+(cur?'var(--accent-soft)':'transparent')+';font-family:var(--mono);font-size:11.5px">'+
          '<span style="color:var(--muted);width:26px">'+a.padStart(2,'0')+'</span><span style="color:'+(cur?'var(--accent)':'var(--ink)')+';font-weight:600">'+mem[a]+'</span></div>';
      });
      root.querySelector('[data-mem]').innerHTML=rows;
      root.querySelector('[data-reg]').innerHTML=
        '<div>PC &nbsp;<b>'+hex(st.PC)+'</b></div><div>IR &nbsp;<b>'+st.IR+'</b></div>'+
        '<div>R0 &nbsp;<b>'+hex(st.R0)+'</b> &nbsp; R5 &nbsp;<b>'+hex(st.R5)+'</b> &nbsp; R6 &nbsp;<b>'+hex(st.R6)+'</b></div>';
      root.querySelector('[data-log]').innerHTML=st.log.slice(-8).map(function(l){return '<div>'+l+'</div>';}).join('')||'<span style="color:var(--muted)">尚未开始</span>';
    }
    function step(){
      if(st.halt) return;
      var ph=st.phase%3;
      if(ph===0){
        var addr=st.PC.toString(16).toUpperCase();
        st.IR=mem[addr]||'----';
        st.log.push('<b style="color:var(--teal)">Fetch</b> mem['+addr+'] → IR = '+st.IR+'; PC++');
        st.PC++;
        st.phase++;
      } else if(ph===1){
        var op=st.IR[0];
        var name={'1':'LOAD','3':'STORE','5':'ADD','C':'HALT','B':'JUMP'}[op]||'OP';
        st.log.push('<b style="color:var(--amber)">Decode</b> opcode '+op+' = '+name);
        st.phase++;
      } else {
        var op=st.IR[0], reg=parseInt(st.IR[1],16), addr=st.IR.slice(2);
        if(op==='1'){
          st['R'+reg]=parseInt(mem[addr],16);
          st.log.push('<b style="color:var(--accent)">Execute</b> R'+reg+' ← mem['+addr+'] = '+hex(st['R'+reg]));
        } else if(op==='3'){
          mem[addr]=hex(st['R'+reg]);
          st.log.push('<b style="color:var(--accent)">Execute</b> mem['+addr+'] ← R'+reg+' = '+mem[addr]);
        } else if(op==='5'){
          st.R0=(st.R5+st.R6)&0xFFFF;
          st.log.push('<b style="color:var(--accent)">Execute</b> R0 ← R5 + R6 = '+hex(st.R0));
        } else if(op==='C'){
          st.halt=true;
          st.log.push('<b style="color:var(--bad)">HALT</b> 停机');
        }
        st.phase++;
      }
      render();
    }
    root.querySelector('[data-step]').addEventListener('click',step);
    root.querySelector('[data-reset]').addEventListener('click',reset);
    reset();
  }
};

/* ---------- 3.3 scheduler ---------- */
W.sched = {
  title:'CPU Scheduler · 时间片调度',
  hint:'换算法、拖时间片，看甘特图',
  cap:'FCFS 按到达顺序一次跑完；Round-Robin 每个进程最多跑一个时间片，时间片用完发中断、存现场、换下一个。时间片越短响应越快，但切换开销越大。',
  html:function(){
    return '<div class="w-ctl"><span class="chip on" data-alg="RR">Round-Robin</span><span class="chip" data-alg="FCFS">FCFS</span>'+
      '<label>quantum <input data-q type="range" min="1" max="4" value="2"><output data-qv>2</output></label></div>'+
      '<div data-gantt style="margin:8px 0 12px"></div>'+
      '<div data-stats></div>';
  },
  mount:function(root){
    var alg='RR', quantum=2;
    var procs=[{n:'P1',b:5,c:'var(--accent)'},{n:'P2',b:3,c:'var(--teal)'},{n:'P3',b:2,c:'var(--amber)'}];
    function run(){
      var segs=[], t=0, rem=procs.map(function(p){return p.b;});
      if(alg==='FCFS'){
        procs.forEach(function(p,i){ segs.push({i:i,s:t,e:t+p.b}); t+=p.b; });
      } else {
        var queue=[0,1,2];
        while(queue.length){
          var i=queue.shift();
          var d=Math.min(quantum,rem[i]);
          segs.push({i:i,s:t,e:t+d});
          t+=d; rem[i]-=d;
          if(rem[i]>0) queue.push(i);
        }
      }
      return segs;
    }
    function render(){
      var segs=run(), total=segs.length?segs[segs.length-1].e:1;
      var g='<div style="display:flex;height:34px;border:1px solid var(--line2);border-radius:5px;overflow:hidden;background:var(--surface-2)">';
      segs.forEach(function(s){
        var p=procs[s.i], w=(s.e-s.s)/total*100;
        g+='<div title="'+p.n+' '+s.s+'–'+s.e+'" style="width:'+w+'%;background:'+p.c+';color:#fff;font-family:var(--mono);font-size:10px;display:grid;place-items:center;border-right:1px solid rgba(255,255,255,.35)">'+((s.e-s.s)>=1?p.n:'')+'</div>';
      });
      g+='</div><div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:3px"><span>0</span><span>'+total+'</span></div>';
      root.querySelector('[data-gantt]').innerHTML=g;
      var rows='', sumW=0;
      var comp={};
      segs.forEach(function(s){ comp[s.i]=s.e; });
      procs.forEach(function(p,i){
        var c=comp[i]||0, tat=c, w=tat-p.b; sumW+=w;
        rows+='<tr><td><b style="color:'+p.c+'">'+p.n+'</b></td><td class="c">'+p.b+'</td><td class="c">'+c+'</td><td class="c">'+tat+'</td><td class="c">'+w+'</td></tr>';
      });
      root.querySelector('[data-stats]').innerHTML='<div class="tbl-wrap"><table class="tbl dense" style="min-width:0"><thead><tr><th>Process</th><th class="c">Burst</th><th class="c">Completion</th><th class="c">Turnaround</th><th class="c">Waiting</th></tr></thead><tbody>'+rows+
        '<tr><td colspan="4" style="text-align:right;color:var(--muted)">average waiting</td><td class="c"><b>'+(sumW/procs.length).toFixed(2)+'</b></td></tr></tbody></table></div>'+
        '<div class="w-note">'+(alg==='RR'?'时间片 = '+quantum+'；每次切换都要保存 PC、寄存器和内存现场，所以时间片不是越短越好。':'FCFS 无抢占：先到先服务，短作业可能被长作业堵住（convoy effect）。')+'</div>';
      root.querySelector('[data-qv]').textContent=quantum;
    }
    root.addEventListener('click',function(e){
      var a=e.target.closest('[data-alg]'); if(!a) return;
      alg=a.getAttribute('data-alg');
      qa(root,'[data-alg]').forEach(function(x){x.classList.toggle('on',x===a);});
      render();
    });
    root.querySelector('[data-q]').addEventListener('input',function(e){ quantum=+e.target.value; render(); });
    render();
  }
};

W.sem = {
  title:'Semaphore & Critical Section · 信号量与临界区',
  hint:'P 申请，V 释放',
  cap:'S=1 表示资源可用。P 操作先把 S 减 1；若 S 已为 0 就阻塞。V 操作唤醒等待者或把 S 加回 1。临界区一次只允许一个进程进入，否则会出现 lost update。',
  html:function(){
    return '<div class="w-ctl"><button class="w-btn" data-op="P">P() · wait</button><button class="w-btn" data-op="V">V() · signal</button><button class="w-btn" data-op="reset">Reset</button></div>'+
      '<div style="display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:8px 0 10px">'+
      '<div style="text-align:center"><div class="small">semaphore S</div><div data-s style="font-family:var(--mono);font-size:32px;font-weight:700;color:var(--accent)">1</div></div>'+
      '<div style="flex:1;min-width:160px"><div class="small">critical section</div><div data-cs style="height:32px;border-radius:6px;border:1px solid var(--line2);background:var(--surface-2);display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--muted)">empty</div></div>'+
      '<div style="text-align:center"><div class="small">blocked</div><div data-bl style="font-family:var(--mono);font-size:22px;color:var(--bad)">0</div></div></div>'+
      '<div data-log style="font-size:11.5px;line-height:1.75;color:var(--ink2);border-top:1px dashed var(--line);padding-top:8px;max-height:86px;overflow:auto"></div>';
  },
  mount:function(root){
    var S=1, cs=false, blocked=0, log=[];
    function render(){
      root.querySelector('[data-s]').textContent=S;
      root.querySelector('[data-bl]').textContent=blocked;
      var c=root.querySelector('[data-cs]');
      c.textContent=cs?'P inside':'empty';
      c.style.color=cs?'#fff':'var(--muted)';
      c.style.background=cs?'var(--green)':'var(--surface-2)';
      root.querySelector('[data-log]').innerHTML=log.slice(-5).map(function(x){return '<div>'+x+'</div>';}).join('')||'<span style="color:var(--muted)">点 P() 尝试进入临界区</span>';
    }
    root.addEventListener('click',function(e){
      var b=e.target.closest('[data-op]'); if(!b) return;
      var op=b.getAttribute('data-op');
      if(op==='reset'){ S=1; cs=false; blocked=0; log=[]; render(); return; }
      if(op==='P'){
        if(cs){ blocked++; log.push('<b>P():</b> 临界区已占用 → 阻塞（blocked='+blocked+'）'); }
        else if(S>0){ S--; cs=true; log.push('<b>P():</b> S=0，进入临界区'); }
        else { blocked++; log.push('<b>P():</b> S=0 → 阻塞（blocked='+blocked+'）'); }
      } else {
        if(blocked>0){ blocked--; cs=true; log.push('<b>V():</b> 唤醒一个等待进程，直接移交临界区'); }
        else if(cs){ cs=false; S=1; log.push('<b>V():</b> 离开临界区，S=1'); }
        else { log.push('<b>V():</b> 没有进程占用，S 保持'); }
      }
      render();
    });
    render();
  }
};

/* ---------- 5.5 / 12.3 growth ---------- */
W.growth = {
  title:'Growth of Complexity · 复杂度增长',
  hint:'拖 n，看五种函数怎么拉开',
  cap:'纵轴用对数刻度，否则 2ⁿ 会把别的曲线压成一条线。n 稍大时 n² 与 2ⁿ 的差距是数量级上的；这就是为什么“指数时间”在实际规模下不可行。',
  html:function(){
    return '<div class="w-ctl"><label>n <input data-n type="range" min="4" max="64" value="24"><output data-nv>24</output></label>'+
      '<span class="chip" data-curve="log">log₂n</span><span class="chip" data-curve="n">n</span><span class="chip" data-curve="nlogn">n log₂n</span><span class="chip" data-curve="n2">n²</span><span class="chip" data-curve="2n">2ⁿ</span></div>'+
      '<div data-chart></div><div data-vals class="w-out" style="margin-top:6px"></div>';
  },
  mount:function(root){
    var n=24, colors={log:'var(--teal)',n:'var(--green)',nlogn:'var(--amber)',n2:'var(--accent)',n2:'var(--accent)',n2:'var(--accent)',n2:'var(--accent)',n2:'var(--accent)',n2:'var(--accent)',n2:'var(--accent)',n2:'var(--accent)',n2:'var(--accent)','2n':'var(--bad)'};
    colors={log:'var(--teal)',n:'var(--green)',nlogn:'var(--amber)',n2:'var(--accent)','2n':'var(--bad)'};
    var fns={log:function(x){return Math.log2(x);},n:function(x){return x;},nlogn:function(x){return x*Math.log2(x);},n2:function(x){return x*x;},'2n':function(x){return Math.pow(2,x);}};
    var names={log:'log₂ n',n:'n',nlogn:'n log₂ n',n2:'n²','2n':'2ⁿ'};
    function fmt(v){ return v>=1e6?v.toExponential(2):(v>=1000?Math.round(v):(v>=10?Math.round(v*10)/10:Math.round(v*100)/100)); }
    function chart(){
      var Wd=600,Ht=260,pad={l:38,r:14,t:14,b:28};
      var maxLog=Math.log10(1+Math.pow(2,64));
      function X(x){ return pad.l+(x-4)/(64-4)*(Wd-pad.l-pad.r); }
      function Y(v){ return Ht-pad.b-(Math.log10(1+v)/maxLog)*(Ht-pad.t-pad.b); }
      var s='';
      for(var g=0;g<=4;g++){
        var yy=pad.t+g*(Ht-pad.t-pad.b)/4;
        s+='<line x1="'+pad.l+'" y1="'+yy+'" x2="'+(Wd-pad.r)+'" y2="'+yy+'" stroke="var(--line)" stroke-width="1"/>';
      }
      s+='<line x1="'+pad.l+'" y1="'+(Ht-pad.b)+'" x2="'+(Wd-pad.r)+'" y2="'+(Ht-pad.b)+'" stroke="var(--line2)"/>';
      s+='<line x1="'+pad.l+'" y1="'+pad.t+'" x2="'+pad.l+'" y2="'+(Ht-pad.b)+'" stroke="var(--line2)"/>';
      [4,16,32,48,64].forEach(function(x){ s+=T(X(x),Ht-10,x,{size:9,anchor:'middle',mono:true,fill:'var(--muted)'}); });
      s+=T(12,22,'log scale',{size:8.5,fill:'var(--muted)',mono:true});
      Object.keys(fns).forEach(function(k){
        var d='';
        for(var x=4;x<=64;x+=2){ d+=(d?'L':'M')+X(x).toFixed(1)+' '+Y(fns[k](x)).toFixed(1); }
        s+='<path d="'+d+'" fill="none" stroke="'+colors[k]+'" stroke-width="'+(k==='2n'?2.2:1.8)+'" opacity=".95"/>';
        var v=fns[k](64);
        s+=T(Wd-pad.r+2,Y(v)-2,names[k],{size:8.5,fill:colors[k],mono:true,anchor:'end'});
      });
      // current n line
      s+='<line x1="'+X(n)+'" y1="'+pad.t+'" x2="'+X(n)+'" y2="'+(Ht-pad.b)+'" stroke="var(--ink2)" stroke-width="1" stroke-dasharray="4 3"/>';
      Object.keys(fns).forEach(function(k){
        s+='<circle cx="'+X(n)+'" cy="'+Y(fns[k](n))+'" r="3.2" fill="'+colors[k]+'"/>';
      });
      s+=T(X(n),Ht-10,'n='+n,{size:9,anchor:'middle',mono:true,fill:'var(--ink2)'});
      root.querySelector('[data-chart]').innerHTML=svg(Wd,Ht,s);
    }
    function vals(){
      var h='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px">';
      Object.keys(fns).forEach(function(k){
        h+='<div style="border:1px solid var(--line);border-radius:5px;padding:3px 7px"><span style="font-size:9.5px;color:'+colors[k]+';font-family:var(--mono)">'+names[k]+'</span><div style="font-size:13px;color:var(--ink)">'+fmt(fns[k](n))+'</div></div>';
      });
      h+='</div>';
      root.querySelector('[data-vals]').innerHTML=h;
    }
    function upd(){ chart(); vals(); root.querySelector('[data-nv]').textContent=n; }
    root.querySelector('[data-n]').addEventListener('input',function(e){ n=+e.target.value; upd(); });

/* ---------- 5.4 binary search ---------- */
W.bsearch = {
  title:'Binary Search · 二分查找',
  hint:'有序表每次砍掉一半',
  cap:'课程约定：元素个数为偶数时，取后一半的第一个作 test entry，即 mid = (low + high + 1) / 2 向下取整。每比较一次范围减半，最坏 Θ(log₂ n)。',
  html:function(){
    return '<div class="w-ctl"><label>target <input data-t type="number" value="23" style="width:60px;padding:3px 6px;border:1px solid var(--line2);border-radius:4px;background:var(--surface);color:var(--ink);font-family:var(--mono)"></label>'+
      '<button class="w-btn" data-step>Step ▶</button><button class="w-btn" data-reset>Reset</button>'+
      '<span class="small" data-comp>comparisons: 0</span></div>'+
      '<div data-arr style="display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 10px"></div>'+
      '<div data-msg style="font-size:12.5px;line-height:1.75;color:var(--ink2);min-height:42px"></div>';
  },
  mount:function(root){
    var arr=[2,5,8,12,16,23,38,56,72,91];
    var t=23, lo=0, hi=arr.length-1, mid=-1, comp=0, done=false;
    function render(){
      var box=root.querySelector('[data-arr]');
      box.innerHTML=arr.map(function(v,i){
        var cls='';
        var bg='var(--surface)', bd='var(--line2)', col='var(--ink)';
        if(i<lo||i>hi){ bg='var(--surface-2)'; col='var(--muted)'; }
        if(i===mid){ bg='var(--accent-soft)'; bd='var(--accent)'; col='var(--accent)'; }
        if(done && v===t && i===mid){ bg='var(--green-soft)'; bd='var(--green)'; col='var(--green)'; }
        return '<div style="flex:1;min-width:44px;text-align:center;border:1px solid '+bd+';border-radius:5px;background:'+bg+';padding:6px 2px">'+
          '<div style="font-family:var(--mono);font-size:14px;font-weight:600;color:'+col+'">'+v+'</div>'+
          '<div style="font-family:var(--mono);font-size:8.5px;color:var(--muted)">'+i+'</div></div>';
      }).join('');
      root.querySelector('[data-comp]').textContent='comparisons: '+comp;
      root.querySelector('[data-msg]').innerHTML = done
        ? (arr[mid]===t?'<b style="color:var(--green)">Found '+t+' at index '+mid+'.</b> 共比较 '+comp+' 次。范围每次减半，所以是 Θ(log₂ n)。':'<b style="color:var(--bad)">Not found.</b> low 越过 high，搜索失败；共比较 '+comp+' 次。')
        : '当前范围 ['+lo+', '+hi+']，mid = ('+lo+'+'+hi+'+1)/2 = '+mid+'，test entry = '+arr[mid]+'。';
    }
    function reset(){
      t=parseInt(root.querySelector('[data-t]').value||'0',10);
      lo=0; hi=arr.length-1; mid=-1; comp=0; done=false;
      render();
    }
    function step(){
      if(done) return;
      if(lo>hi){ done=true; render(); return; }
      mid=Math.floor((lo+hi+1)/2); comp++;
      if(arr[mid]===t){ done=true; render(); return; }
      if(t<arr[mid]) hi=mid-1; else lo=mid+1;
      render();
    }
    root.querySelector('[data-step]').addEventListener('click',step);
    root.querySelector('[data-reset]').addEventListener('click',reset);
    root.querySelector('[data-t]').addEventListener('change',reset);
    reset();
  }
};

/* ---------- 5.4 insertion sort ---------- */
W.sort = {
  title:'Insertion Sort · 插入排序',
  hint:'逐步看“抽出枢轴、往后挪”',
  cap:'第 i 个元素作为 pivot 抽出，前面比它大的元素依次后移，再把 pivot 插进空位。最坏与平均都是 Θ(n²)，最好（已有序）是 Θ(n)。',
  html:function(){
    return '<div class="w-ctl"><button class="w-btn" data-step>Step ▶</button><button class="w-btn" data-prev>◀ Back</button><button class="w-btn" data-reset>Reset</button><button class="w-btn" data-shuffle>Shuffle</button><span class="small" data-cnt></span></div>'+
      '<div data-bars style="display:flex;gap:5px;align-items:flex-end;height:150px;padding:8px 4px;border-bottom:1px solid var(--line2);margin-bottom:8px"></div>'+
      '<div data-msg style="font-size:12.5px;line-height:1.75;color:var(--ink2);min-height:38px"></div>';
  },
  mount:function(root){
    var base=[5,2,4,6,1,3], steps=[], idx=0;
    function build(){
      var a=base.slice(), snaps=[{a:a.slice(),i:0,j:-1,note:'初始序列，从第 2 个元素开始。'}];
      for(var i=1;i<a.length;i++){
        var pivot=a[i], j=i-1;
        snaps.push({a:a.slice(),i:i,j:j,pivot:pivot,note:'取出 pivot = '+pivot+'，在左侧已排序区从右往左比较。'});
        while(j>=0 && a[j]>pivot){
          a[j+1]=a[j]; j--;
          snaps.push({a:a.slice(),i:i,j:j,pivot:pivot,note:'a['+(j+1)+'] > '+pivot+' → 后移一位，空位左移。'});
        }
        a[j+1]=pivot;
        snaps.push({a:a.slice(),i:i,j:j+1,pivot:pivot,note:'把 pivot 放进空位 a['+(j+1)+']。前 '+(i+1)+' 个元素已有序。'});
      }
      snaps.push({a:a.slice(),i:a.length,j:-1,note:'排序完成。'});
      steps=snaps; idx=0;
    }
    function render(){
      var st=steps[idx], max=Math.max.apply(null,base);
      root.querySelector('[data-bars]').innerHTML=st.a.map(function(v,i){
        var col='var(--line2)', h=(v/max*100);
        if(i<st.i) col='var(--green)';
        if(i===st.i) col='var(--accent)';
        if(i===st.j) col='var(--amber)';
        if(st.note.indexOf('完成')>=0) col='var(--green)';
        return '<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%">'+
          '<div style="width:100%;height:'+h+'%;background:'+col+';border-radius:2px 2px 0 0;min-height:8px"></div>'+
          '<div style="font-family:var(--mono);font-size:10.5px;color:var(--ink2);margin-top:2px">'+v+'</div></div>';
      }).join('');
      root.querySelector('[data-msg]').innerHTML=st.note;
      root.querySelector('[data-cnt]').textContent='step '+(idx+1)+' / '+steps.length;
    }

W.stackq = {
  title:'Stack vs Queue · 栈与队列',
  hint:'同样三个数，取出顺序不同',
  cap:'栈只在栈顶插入/删除，后进先出（LIFO）；队列在队尾插入、队头删除，先进先出（FIFO）。栈通常用顺序表实现，队列常用循环队列避免“爬出”存储块。',
  html:function(){
    return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">'+
      '<div><div class="small" style="margin-bottom:5px">STACK · LIFO</div><div data-stack style="display:flex;flex-direction:column-reverse;gap:3px;min-height:150px;border:1px solid var(--line2);border-radius:6px;padding:6px;background:var(--surface-2)"></div>'+
      '<div class="w-ctl" style="margin-top:6px"><button class="w-btn" data-spush>push</button><button class="w-btn" data-spop>pop</button></div></div>'+
      '<div><div class="small" style="margin-bottom:5px">QUEUE · FIFO</div><div data-queue style="display:flex;gap:3px;min-height:48px;border:1px solid var(--line2);border-radius:6px;padding:6px;background:var(--surface-2);align-items:center"></div>'+

  },
  mount:function(root){
    var stack=[1,2,3], queue=[1,2,3], next=4, log=[];
    function render(){
      root.querySelector('[data-stack]').innerHTML=stack.map(function(v,i){
        var top=i===stack.length-1;
        return '<div style="height:30px;border-radius:4px;background:'+(top?'var(--accent)':'var(--surface)')+';border:1px solid '+(top?'var(--accent)':'var(--line2)')+';color:'+(top?'#fff':'var(--ink2)')+';display:flex;align-items:center;justify-content:space-between;padding:0 9px;font-family:var(--mono);font-size:12px"><span>'+v+'</span><span style="font-size:9px;opacity:.7">'+(top?'TOP':'')+'</span></div>';
      }).join('')||'<div style="color:var(--muted);font-size:11px;text-align:center;padding:20px">empty</div>';
      var q='';

        q+='<div style="flex:1;min-width:30px;height:34px;border:1px solid '+(i===0?'var(--teal)':'var(--line2)')+';border-radius:4px;background:'+(i===0?'var(--teal-soft)':'var(--surface)')+';display:grid;place-items:center;font-family:var(--mono);font-size:12px;color:'+(i===0?'var(--teal)':'var(--ink2)')+'">'+v+'</div>';

      root.querySelector('[data-queue]').innerHTML=q||'<span style="color:var(--muted);font-size:11px">empty</span>';

/* ---------- 8.2 binary search tree ---------- */
W.bst = {
  title:'Binary Search Tree · 二叉搜索树',
  hint:'插入、中序遍历',
  cap:'左子树全部小于根，右子树全部大于根。查找像二分：每层排除一半。中序遍历（左–根–右）得到升序序列，这正是“按字母打印列表”的递归做法。',
  html:function(){
    return '<div class="w-ctl"><label>value <input data-v type="number" value="45" style="width:58px;padding:3px 6px;border:1px solid var(--line2);border-radius:4px;background:var(--surface);color:var(--ink);font-family:var(--mono)"></label>'+
      '<button class="w-btn" data-ins>Insert</button><button class="w-btn" data-inorder>Inorder ▶</button><button class="w-btn" data-reset>Reset</button></div>'+
      '<div data-tree style="min-height:220px"></div><div data-out class="w-out" style="font-size:12px"></div>';
  },
  mount:function(root){
    var rootNode=null, timer=null;
    function ins(node,v){
      if(!node) return {v:v,l:null,r:null};
      if(v<node.v) node.l=ins(node.l,v);
      else if(v>node.v) node.r=ins(node.r,v);
      return node;
    }
    function build(){
      rootNode=null; [50,30,70,20,40,60,80].forEach(function(v){rootNode=ins(rootNode,v);});
    }
    function layout(){
      var nodes=[], maxD=0;
      (function walk(n,d){
        if(!n) return;
        walk(n.l,d+1);
        n._x=nodes.length; n._d=d; nodes.push(n); maxD=Math.max(maxD,d);
        walk(n.r,d+1);
      })(rootNode,0);
      return {nodes:nodes,maxD:maxD};
    }
    function render(hl){
      if(!rootNode){ root.querySelector('[data-tree]').innerHTML=''; return; }
      var L=layout(), Wd=Math.max(420,L.nodes.length*54+40), Ht=(L.maxD+1)*66+30;
      var s='';
      (function edges(n){
        if(!n) return;
        [[n.l],[n.r]].forEach(function(c){
          if(c[0]){
            var x1=30+n._x*54, y1=26+n._d*66, x2=30+c[0]._x*54, y2=26+c[0]._d*66;
            s+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="var(--line2)" stroke-width="1.3"/>';
          }
        });
        edges(n.l); edges(n.r);
      })(rootNode);
      L.nodes.forEach(function(n){
        var x=30+n._x*54, y=26+n._d*66;
        var on=hl && hl.indexOf(n.v)>=0;
        s+='<circle cx="'+x+'" cy="'+y+'" r="17" fill="'+(on?'var(--accent)':'var(--surface)')+'" stroke="'+(on?'var(--accent)':'var(--line2)')+'" stroke-width="1.4"/>';
        s+=T(x,y+4,n.v,{size:10.5,anchor:'middle',mono:true,fill:on?'#fff':'var(--ink)'});
      });
      root.querySelector('[data-tree]').innerHTML=svg(Wd,Ht,s);
    }
    function inorder(n,arr){ if(!n) return arr; inorder(n.l,arr); arr.push(n.v); inorder(n.r,arr); return arr; }
    root.querySelector('[data-ins]').addEventListener('click',function(){
      var v=parseInt(root.querySelector('[data-v]').value,10);
      if(isNaN(v)) return;
      rootNode=ins(rootNode,v); render(); root.querySelector('[data-out]').textContent='inserted '+v+' · inorder: '+inorder(rootNode,[]).join(' ');
    });
    root.querySelector('[data-inorder]').addEventListener('click',function(){
      if(timer) clearInterval(timer);
      var seq=inorder(rootNode,[]), i=0;
      root.querySelector('[data-out]').textContent='inorder (left → root → right): '+seq.join(' → ');
      timer=setInterval(function(){
        render(seq.slice(0,i+1)); i++;
        if(i>=seq.length){ clearInterval(timer); timer=null; setTimeout(function(){render();},700); }
      },420);
    });
    root.querySelector('[data-reset]').addEventListener('click',function(){ build(); render(); root.querySelector('[data-out]').textContent=''; });
    build(); render();
  }
};

W.turing = {
  title:'Turing Machine · 图灵机加一',
  hint:'读状态、读符号、写、移动',
  cap:'图灵机每步只做三件事：写当前格、移动读写头、改变状态。它能计算所有“可计算”的函数（Church–Turing thesis）。这里用 START/ADD/RETURN/HALT 四个状态把二进制数加 1。',
  html:function(){
    return '<div class="w-ctl"><label>binary <input data-bin value="101" maxlength="7" style="width:88px;padding:3px 6px;border:1px solid var(--line2);border-radius:4px;background:var(--surface);color:var(--ink);font-family:var(--mono)"></label></div>'+
      '<div data-state class="w-out" style="margin:6px 0 8px"></div>'+
      '<div data-tape style="display:flex;gap:3px;flex-wrap:wrap;margin-bottom:8px"></div>'+
      '<div class="w-ctl"><button class="w-btn" data-step>Step ▶</button><button class="w-btn" data-reset>Reset</button><span class="small" data-log></span></div>';
  },
  mount:function(root){
    var tape=[], head=0, state='START', halt=false, steps=0;
    function load(){
      var b=(root.querySelector('[data-bin]').value||'101').replace(/[^01]/g,'')||'0';
      tape=['*'].concat(b.split('')).concat(['*']);
      head=0; state='START'; halt=false; steps=0; render();
    }
    function render(){
      root.querySelector('[data-state]').innerHTML='state <b style="color:var(--accent)">'+state+'</b> &nbsp; head @ <b>'+head+'</b> &nbsp; steps <b>'+steps+'</b>'+(halt?' &nbsp; <span style="color:var(--green)">HALTED</span>':'');
      root.querySelector('[data-tape]').innerHTML=tape.map(function(c,i){
        var on=i===head;
        return '<div style="width:38px;text-align:center"><div style="height:40px;border:1px solid '+(on?'var(--accent)':'var(--line2)')+';background:'+(on?'var(--accent-soft)':'var(--surface)')+';border-radius:4px;display:grid;place-items:center;font-family:var(--mono);font-size:17px;color:'+(on?'var(--accent)':'var(--ink)')+'">'+c+'</div>'+
          '<div style="font-size:8.5px;color:var(--muted);font-family:var(--mono);margin-top:2px">'+(on?'▲':'')+'</div></div>';
      }).join('');
      root.querySelector('[data-log]').textContent = halt ? 'tape = '+tape.join('')+' = '+parseInt(tape.filter(function(c){return c!=='*';}).join('')||'0',2) : '每步只改一格';
    }
    function step(){
      if(halt) return;
      steps++;
      var c=tape[head];
      if(state==='START'){
        if(c==='*' && head===tape.length-1){ head--; state='ADD'; }
        else if(c==='*'){ head++; }
        else { head++; }
      } else if(state==='ADD'){
        if(c==='1'){ tape[head]='0'; head--; }
        else if(c==='0'){ tape[head]='1'; head--; state='RETURN'; }
        else { tape[head]='1'; halt=true; state='HALT'; }
      } else if(state==='RETURN'){
        if(c==='*'){ halt=true; state='HALT'; }
        else head++;
      }
      render();
    }
    root.querySelector('[data-step]').addEventListener('click',step);
    root.querySelector('[data-reset]').addEventListener('click',load);
    root.querySelector('[data-bin]').addEventListener('change',load);
    load();
  }
};
