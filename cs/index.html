<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>计算机科学概论 · 双语精读 | Computer Science: An Overview</title>
<meta name="description" content="Brookshear《计算机科学概论》双语学习站：章节精读、结构图与交互演示、英文术语表、纯英文考试考点清单与自测卷。">
<meta name="keywords" content="计算机概论,计算机科学概论,Brookshear,Computer Science An Overview,英文术语,双语,期末复习">
<meta name="theme-color" content="#1F4E79">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231F4E79'/%3E%3Ctext x='32' y='43' font-family='Consolas,monospace' font-size='24' font-weight='700' fill='%23ffffff' text-anchor='middle'%3ECS%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --paper:#F4F1E9; --surface:#FFFDF8; --surface-2:#FAF7EF;
  --ink:#1E2329; --ink2:#4B525B; --muted:#7E858E;
  --line:#DFD8C9; --line2:#CEC5B2;
  --accent:#1F4E79; --accent-2:#2E6E9E; --accent-soft:#E8EFF6; --accent-line:#B9CDDF;
  --teal:#2A6F6B; --teal-soft:#E6F0EF;
  --green:#3E7550; --green-soft:#EAF2EC;
  --amber:#93651A; --amber-soft:#F8EFDB;
  --bad:#AC3F2C; --bad-soft:#F8E9E5;
  --violet:#5B4A7A; --violet-soft:#EEEAF5;
  --shadow:0 1px 2px rgba(40,32,20,.05),0 10px 28px -14px rgba(40,32,20,.18);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti SC","Noto Serif SC","Source Han Serif SC",SimSun,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  --mono:"SFMono-Regular","Cascadia Mono",Consolas,"Liberation Mono",Menlo,monospace;
}
[data-theme="dark"]{
  --paper:#14171B; --surface:#1B1F25; --surface-2:#20252C;
  --ink:#E9E5DB; --ink2:#B9B5AB; --muted:#86827A;
  --line:#2C3138; --line2:#3B424B;
  --accent:#7FB2DA; --accent-2:#9AC6E8; --accent-soft:#1B2731; --accent-line:#33485C;
  --teal:#7FB7B1; --teal-soft:#1B2A29;
  --green:#86B995; --green-soft:#1B2620;
  --amber:#D5A94E; --amber-soft:#2A2417;
  --bad:#E08974; --bad-soft:#2E1F1B;
  --violet:#A995C9; --violet-soft:#241F2E;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px -14px rgba(0,0,0,.7);
}
html{scroll-behavior:smooth}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:15.5px; line-height:1.9; -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background-image:
    linear-gradient(rgba(31,78,121,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(31,78,121,.055) 1px,transparent 1px);
  background-size:30px 30px;
  -webkit-mask-image:radial-gradient(ellipse 90% 60% at 55% 0%,#000 0%,transparent 78%);
  mask-image:radial-gradient(ellipse 90% 60% at 55% 0%,#000 0%,transparent 78%);
}
::selection{background:var(--accent-line);color:var(--ink)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px;border:2px solid var(--paper)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh;position:relative;z-index:1}
#side{
  width:278px;flex:0 0 278px;height:100vh;position:sticky;top:0;
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:40;
}
.brand{padding:20px 18px 15px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex:0 0 auto;cursor:pointer}
.mark{
  width:40px;height:40px;flex:0 0 40px;border-radius:8px;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-family:var(--mono);font-size:14px;font-weight:700;
  letter-spacing:-.04em;box-shadow:var(--shadow);position:relative;
}
.mark::after{content:"";position:absolute;inset:4px;border:1px solid rgba(255,255,255,.35);border-radius:4px}
.brand h1{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.02em;line-height:1.35}
.brand p{font-size:10.5px;color:var(--muted);letter-spacing:.02em;line-height:1.55;margin-top:3px}
.gauge{padding:13px 18px 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
.gauge-row{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--muted);margin-bottom:6px;letter-spacing:.02em}
.gauge-row b{color:var(--accent);font-family:var(--mono);font-size:14px;font-weight:600}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent));border-radius:2px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.gauge-sub{font-size:10.5px;color:var(--muted);margin-top:7px;display:flex;justify-content:space-between;letter-spacing:.02em}
.navbtn{
  margin:7px 11px 0;padding:8px 11px;border-radius:8px;border:1px dashed var(--line2);
  background:var(--surface-2);cursor:pointer;display:flex;align-items:center;gap:9px;transition:.15s;flex:0 0 auto;text-align:left;
}
.navbtn:hover{border-color:var(--accent);color:var(--accent)}
.navbtn.on{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.navbtn b{display:block;font-size:12.5px;font-weight:500;color:var(--ink2);line-height:1.4}
.navbtn span{display:block;font-size:10px;color:var(--muted);letter-spacing:.02em;line-height:1.4}
.navbtn.on b{color:var(--accent)}
.navbtn svg{flex:0 0 auto;opacity:.6}
#tree{overflow-y:auto;flex:1 1 auto;padding:10px 8px 26px;scrollbar-width:thin}
.ch{margin-bottom:1px}
.ch-h{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:6px;cursor:pointer;user-select:none;transition:background .15s}
.ch-h:hover{background:var(--surface-2)}
.ch-n{width:22px;height:22px;flex:0 0 22px;border-radius:4px;display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;font-weight:600;background:var(--line);color:var(--ink2);transition:.2s}
.ch.on .ch-n{background:var(--accent);color:#fff}
.ch-h b{font-size:12.5px;font-weight:500;flex:1;line-height:1.35;letter-spacing:.01em}
.ch-h em{display:block;font-style:normal;font-size:10px;color:var(--muted);letter-spacing:.02em;line-height:1.3}
.ch-h svg{flex:0 0 auto;opacity:.4;transition:transform .2s}
.ch.open .ch-h svg{transform:rotate(90deg)}
.ch-s{display:none;padding:2px 0 6px}
.ch.open .ch-s{display:block}
.sec{display:flex;align-items:flex-start;gap:7px;padding:5px 8px 5px 30px;border-radius:5px;cursor:pointer;font-size:12.3px;color:var(--ink2);line-height:1.45;transition:background .15s,color .15s;border-left:2px solid transparent;margin-left:2px}
.sec:hover{background:var(--surface-2);color:var(--ink)}
.sec.on{background:var(--accent-soft);color:var(--accent);font-weight:500;border-left-color:var(--accent)}
.sec .dot{width:5px;height:5px;flex:0 0 5px;border-radius:50%;margin-top:7px;border:1px solid var(--line2);background:transparent;transition:.2s}
.sec.v .dot{background:var(--line2);border-color:var(--line2)}
.sec.d .dot{background:var(--green);border-color:var(--green)}
.sec .num{font-family:var(--mono);font-size:10px;color:var(--muted);flex:0 0 auto;margin-top:2px;letter-spacing:-.02em}
.sec.on .num{color:var(--accent-2)}
#main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
#bar{
  position:sticky;top:0;z-index:30;height:52px;display:flex;align-items:center;gap:12px;
  padding:0 30px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--paper) 86%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);flex:0 0 auto;
}
#bar .crumb{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;min-width:0}
#bar .crumb b{color:var(--ink2);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .sp{flex:1}
.iconbtn{width:31px;height:31px;border-radius:6px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink2);transition:.15s}
.iconbtn:hover{border-color:var(--line2);color:var(--accent);transform:translateY(-1px)}
#burger{display:none}
#doc{padding:40px 30px 18px;max-width:880px;width:100%;margin:0 auto;flex:1 1 auto}
#pager{max-width:880px;width:100%;margin:0 auto;padding:6px 30px 48px;display:grid;grid-template-columns:1fr 1fr;gap:11px}
.pg{display:flex;flex-direction:column;gap:3px;padding:12px 15px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;transition:.18s;text-decoration:none}
.pg:hover{border-color:var(--accent-line);box-shadow:var(--shadow);transform:translateY(-1px)}
.pg span{font-size:10.5px;color:var(--muted);letter-spacing:.06em;font-family:var(--mono)}
.pg b{font-size:13px;font-weight:500;color:var(--ink);line-height:1.4}
.pg.next{text-align:right;grid-column:2}
.pg.empty{visibility:hidden}
footer{border-top:1px solid var(--line);padding:20px 30px 36px;text-align:center;font-size:11px;color:var(--muted);line-height:2}

/* ---------- typography ---------- */
.ch-head{margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.ch-kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--accent);font-weight:600;text-transform:uppercase;display:flex;align-items:center;gap:9px;margin-bottom:10px}
.ch-kicker::after{content:"";flex:1;height:1px;background:var(--accent-line)}
.ch-head h1{font-family:var(--serif);font-size:32px;font-weight:600;line-height:1.3;letter-spacing:.01em;margin-bottom:4px}
.ch-head h1 em{font-style:normal;color:var(--accent)}
.ch-head .zh{font-family:var(--serif);font-size:16px;color:var(--ink2);letter-spacing:.08em;margin-bottom:12px}
.ch-desc{font-size:13.8px;color:var(--ink2);line-height:1.9;max-width:680px}
h2#sec-title{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.35;margin:0 0 2px;letter-spacing:.01em;scroll-margin-top:70px}
.sec-zh{font-family:var(--serif);font-size:14.5px;color:var(--ink2);letter-spacing:.06em;margin-bottom:14px}
.sec-meta{font-size:11px;color:var(--muted);letter-spacing:.03em;margin-bottom:24px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.sec-meta::after{content:"";flex:1;height:1px;background:var(--line)}
.sec-meta .goals{display:flex;gap:6px;flex-wrap:wrap}
.sec-meta .goal{border:1px solid var(--line);background:var(--surface-2);border-radius:20px;padding:2px 9px;font-size:10.5px;color:var(--ink2)}
h3{font-family:var(--serif);font-size:17px;font-weight:600;margin:32px 0 10px;letter-spacing:.015em;line-height:1.5;scroll-margin-top:70px}
h3::before{content:"§";color:var(--accent);font-size:12px;margin-right:8px;opacity:.65;font-family:var(--serif)}
h4{font-size:13.5px;font-weight:600;margin:20px 0 6px;color:var(--ink2);letter-spacing:.02em}
p{margin:0 0 12px}
p.lead{font-size:15px;color:var(--ink2);line-height:1.95}
ul,ol{margin:0 0 13px;padding-left:1.45em}
li{margin-bottom:5px}
li::marker{color:var(--muted)}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent-line)}
a:hover{border-bottom-color:var(--accent)}
b,strong{font-weight:600;color:var(--ink)}
k{font-weight:600;color:var(--accent);font-style:normal}
code{font-family:var(--mono);font-size:.88em;background:var(--surface-2);padding:1px 5px;border-radius:3px;border:1px solid var(--line)}
pre{font-family:var(--mono);font-size:12.5px;line-height:1.75;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:13px 15px;overflow-x:auto;margin:14px 0}
pre code{background:none;border:0;padding:0;font-size:inherit}
hr{border:0;border-top:1px solid var(--line);margin:28px 0}
.mono{font-family:var(--mono);font-size:.94em;letter-spacing:.01em}
.bit{font-family:var(--mono);letter-spacing:.14em;color:var(--accent);font-weight:600}
.en{font-family:var(--serif);font-style:italic}
.zh-note{display:block;font-size:13.2px;color:var(--ink2);margin-top:3px}
.small{font-size:12px;color:var(--muted);line-height:1.75}

/* bilingual definition */
.bi{display:block;margin:2px 0 0;padding-left:2px}
.bi .t{font-family:var(--serif);font-weight:600;color:var(--ink);font-size:14.6px}
.bi .z{display:block;font-size:13.4px;color:var(--ink2);line-height:1.8}

/* callouts */
.def,.key,.tip,.warn,.exam{
  border-radius:8px;padding:14px 17px 13px;margin:18px 0;font-size:14.2px;line-height:1.85;
  border:1px solid var(--line);background:var(--surface);position:relative;
}
.def{border-left:3px solid var(--accent);background:var(--accent-soft);border-color:var(--accent-line)}
.key{border-left:3px solid var(--teal);background:var(--teal-soft);border-color:var(--teal)}
.tip{border-left:3px solid var(--green);background:var(--green-soft);border-color:var(--green)}
.warn{border-left:3px solid var(--amber);background:var(--amber-soft);border-color:var(--amber)}
.exam{border-left:3px solid var(--violet);background:var(--violet-soft);border-color:var(--violet)}
.def .lb,.key .lb,.tip .lb,.warn .lb,.exam .lb{
  display:block;font-family:var(--mono);font-size:9.8px;letter-spacing:.13em;font-weight:700;
  margin-bottom:6px;text-transform:uppercase;
}
.def .lb{color:var(--accent)} .key .lb{color:var(--teal)} .tip .lb{color:var(--green)}
.warn .lb{color:var(--amber)} .exam .lb{color:var(--violet)}
.def p:last-child,.key p:last-child,.tip p:last-child,.warn p:last-child,.exam p:last-child{margin-bottom:0}
.def b,.key b{color:inherit}
.exam .lb::before{content:"▸ "}
.warn .lb::before{content:"! "}

/* tables */
.tbl-wrap{overflow-x:auto;margin:16px 0;border-radius:8px}
.tbl{width:100%;border-collapse:collapse;font-size:13.2px;background:var(--surface);border-radius:8px;overflow:hidden;border:1px solid var(--line);min-width:520px}
.tbl th{background:var(--surface-2);font-weight:600;font-size:11.5px;letter-spacing:.04em;color:var(--ink2);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.72}
.tbl tr:last-child td{border-bottom:0}
.tbl td.c,.tbl th.c{text-align:center}
.tbl code{font-size:.86em}
.tbl.dense td,.tbl.dense th{padding:7px 10px;font-size:12.5px}

/* glossary term */
.term{
  border-bottom:1px dashed var(--accent-2);cursor:help;color:inherit;
  text-underline-offset:2px;transition:background .15s;
}
.term:hover{background:var(--accent-soft)}
#tip{
  position:fixed;z-index:95;max-width:330px;padding:10px 13px;border-radius:8px;
  background:var(--surface);border:1px solid var(--line2);box-shadow:0 16px 40px -18px rgba(0,0,0,.4);
  font-size:12.5px;line-height:1.7;color:var(--ink2);display:none;pointer-events:none;
}
#tip b{display:block;font-family:var(--serif);font-size:14px;color:var(--accent);margin-bottom:2px;letter-spacing:.01em}
#tip .zh{font-size:12px;color:var(--ink2);margin-bottom:4px}
#tip .df{color:var(--ink2)}
#tip .ex{margin-top:5px;padding-top:5px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--muted)}

/* figures & widgets */
.fig{margin:22px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.fig-h{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--ink2);font-weight:600;text-transform:uppercase}
.fig-h .sq{width:6px;height:6px;border-radius:1px;background:var(--accent);flex:0 0 6px}
.fig-b{padding:12px 14px;overflow-x:auto}
.fig-b svg{display:block;width:100%;height:auto;min-width:440px}
.fig-cap{font-size:11.2px;color:var(--muted);line-height:1.7;padding:0 14px 11px}
.w{margin:22px 0;border:1px solid var(--line2);border-radius:10px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.w-h{display:flex;align-items:center;gap:8px;padding:10px 15px;border-bottom:1px solid var(--line);background:var(--surface-2);font-size:11.5px;letter-spacing:.04em;color:var(--ink2);font-weight:600}
.w-h .sq{width:7px;height:7px;border-radius:2px;background:var(--accent);flex:0 0 7px}
.w-h em{font-style:normal;font-weight:400;color:var(--muted);font-size:10.5px;margin-left:auto;letter-spacing:.02em}
.w-b{padding:16px}
.w-cap{font-size:11px;color:var(--muted);line-height:1.7;padding:0 15px 12px}
.w-ctl{display:flex;flex-wrap:wrap;gap:9px 16px;align-items:center;margin-bottom:13px}
.w-ctl label{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);white-space:nowrap}
.w-ctl output{font-family:var(--mono);font-size:12.5px;color:var(--accent);min-width:24px;display:inline-block;text-align:center;font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;background:var(--line2);width:116px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:pointer}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);cursor:pointer}
.w-btn{font-family:var(--sans);font-size:11.5px;padding:4px 11px;border-radius:5px;cursor:pointer;border:1px solid var(--line2);background:var(--surface);color:var(--ink2);transition:.15s}
.w-btn:hover{border-color:var(--accent);color:var(--accent)}
.w-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.w-btn.sm{padding:2px 8px;font-size:11px}
.w-out{font-family:var(--mono);font-size:13px;line-height:1.95}
.w-out .big{font-size:20px;color:var(--accent);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;border:1px solid var(--line2);background:var(--surface-2);color:var(--ink2);cursor:pointer;transition:.15s;font-family:var(--sans)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.w-note{font-size:11.5px;color:var(--muted);line-height:1.7;margin-top:10px}

/* example */
.ex{border:1px solid var(--line);border-radius:9px;background:var(--surface);margin:18px 0;overflow:hidden}
.ex-h{display:flex;align-items:center;gap:9px;padding:11px 15px 0;font-size:11px;letter-spacing:.06em;color:var(--accent);font-weight:600;font-family:var(--mono)}
.ex-q{padding:5px 15px 11px;font-size:14.2px;line-height:1.85}
.ex-q p:last-child{margin-bottom:0}
.ex-t{padding:0 15px 12px}
.tbtn{font-family:var(--sans);font-size:11.5px;padding:3px 10px;border-radius:5px;cursor:pointer;border:1px solid var(--line2);background:transparent;color:var(--ink2);transition:.15s}
.tbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.ex-s{display:none;margin:0 15px 14px;padding:12px 14px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line2);font-size:13.2px;line-height:1.85}
.ex-s.show{display:block}
.ex-s .lb{color:var(--teal);font-family:var(--mono);font-size:9.8px;letter-spacing:.12em;font-weight:700;display:block;margin-bottom:7px}
.ex-s .st{display:flex;gap:8px;margin-bottom:6px}
.ex-s .st>i{font-style:normal;width:16px;height:16px;flex:0 0 16px;border-radius:3px;background:var(--teal);color:#fff;font-size:9.5px;display:grid;place-items:center;margin-top:3px;font-family:var(--mono)}
.ex-s .st>div{flex:1;min-width:0}
.ex-s .an{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line2)}
.ex-s .an b{color:var(--accent)}

/* inline quick check */
.qc{border:1px dashed var(--line2);border-radius:9px;background:var(--surface-2);padding:13px 15px;margin:18px 0}
.qc .qh{font-family:var(--mono);font-size:9.8px;letter-spacing:.13em;color:var(--accent);font-weight:700;margin-bottom:6px}
.qc .qq{font-size:14px;line-height:1.8;margin-bottom:9px}
.qc .qo{display:flex;flex-wrap:wrap;gap:6px}
.qc .qo button{font-family:var(--sans);font-size:12.5px;padding:4px 11px;border-radius:6px;border:1px solid var(--line2);background:var(--surface);color:var(--ink2);cursor:pointer;transition:.14s;text-align:left}
.qc .qo button:hover{border-color:var(--accent)}
.qc .qo button.ok{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.qc .qo button.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.qc .qs{display:none;margin-top:9px;font-size:12.8px;color:var(--ink2);line-height:1.75;padding-top:8px;border-top:1px dashed var(--line2)}
.qc .qs.show{display:block}

/* mark done */
.markdone{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:34px 0 6px;padding:14px 18px;border:1px dashed var(--line2);border-radius:9px;background:var(--surface-2);font-size:12.5px;color:var(--ink2)}
.markdone button{font-size:12px;padding:6px 14px;border-radius:6px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff;transition:.15s;font-family:var(--sans);white-space:nowrap}
.markdone button:hover{filter:brightness(1.08)}
.markdone.done{border-style:solid;border-color:var(--green);background:var(--green-soft)}
.markdone.done button{background:var(--green);border-color:var(--green)}

/* home / map */
.hero{padding:8px 0 26px;border-bottom:1px solid var(--line);margin-bottom:26px}
.hero .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--accent);font-weight:600;margin-bottom:12px}
.hero h1{font-family:var(--serif);font-size:38px;line-height:1.2;font-weight:600;letter-spacing:.01em;margin-bottom:5px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .sub{font-family:var(--serif);font-size:16px;color:var(--ink2);letter-spacing:.06em;margin-bottom:14px}
.hero .lede{font-size:14.2px;color:var(--ink2);line-height:1.95;max-width:660px}
.hero-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.hero-chips span{font-size:11px;padding:3px 10px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:var(--ink2);font-family:var(--mono)}
.map-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:18px 0 30px}
.mapcard{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:15px 16px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.mapcard:hover{border-color:var(--accent-line);box-shadow:var(--shadow);transform:translateY(-2px)}
.mapcard .no{font-family:var(--mono);font-size:10px;letter-spacing:.13em;color:var(--accent);font-weight:600}
.mapcard h3{font-family:var(--serif);font-size:16px;margin:4px 0 1px;letter-spacing:.01em}
.mapcard h3::before{content:none}
.mapcard .zh{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.mapcard p{font-size:12.3px;color:var(--ink2);line-height:1.7;margin:8px 0 10px}
.mapcard .bar{height:3px}
.mapcard .pct{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:16px 0 28px}
.howto div{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:13px 15px}
.howto b{display:block;font-size:12.5px;margin-bottom:4px;color:var(--ink)}
.howto p{font-size:12px;color:var(--ink2);line-height:1.7;margin:0}
.note-strip{border-left:3px solid var(--amber);background:var(--amber-soft);border-radius:0 8px 8px 0;padding:11px 15px;font-size:12.5px;line-height:1.8;color:var(--ink2);margin:18px 0}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:11px;color:var(--muted);margin:8px 0 0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* glossary */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);position:sticky;top:52px;z-index:20}
.toolbar input[type=search]{flex:1;min-width:150px;padding:6px 10px;font-family:var(--sans);font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:5px;outline:none}
.toolbar input[type=search]:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(31,78,121,.08)}
.toolbar .fl{display:flex;flex-wrap:wrap;gap:5px}
.toolbar .fl button{font-family:var(--sans);font-size:11px;padding:3px 9px;border-radius:14px;border:1px solid var(--line2);background:var(--surface);color:var(--ink2);cursor:pointer;white-space:nowrap}
.toolbar .fl button:hover{border-color:var(--accent);color:var(--accent)}
.toolbar .fl button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.toolbar .tgl{font-size:11.5px;color:var(--ink2);display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.toolbar .tgl input{accent-color:var(--accent)}
.gcount{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin:0 0 10px;letter-spacing:.03em}
.gtable{width:100%;border-collapse:collapse;font-size:12.6px;background:var(--surface);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.gtable thead th{background:var(--surface-2);position:static;text-align:left;padding:8px 10px;font-size:10.5px;letter-spacing:.07em;color:var(--ink2);border-bottom:1px solid var(--line2);text-transform:uppercase}
.gtable td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.66}
.gtable tr:hover td{background:var(--surface-2)}
.gtable .term-en{font-family:var(--serif);font-weight:600;font-size:13.4px;color:var(--ink);min-width:130px}
.gtable .term-zh{color:var(--ink2);min-width:82px}
.gtable .term-ch{font-family:var(--mono);font-size:10px;color:var(--accent);white-space:nowrap}
.gtable .term-df{min-width:230px}
.gtable .term-ex{color:var(--muted);font-size:11.8px;min-width:180px}
.gtable.hidezh .term-zh{color:transparent;background:var(--line);border-radius:3px;user-select:none}
.gtable.hidezh .term-zh:hover{color:var(--ink2);background:transparent}
.gempty{padding:28px;text-align:center;color:var(--muted);font-size:12.5px}

/* exam */
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 24px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);position:sticky;top:52px;z-index:20}
.pills button{font-family:var(--sans);font-size:11.5px;padding:4px 11px;border-radius:15px;border:1px solid var(--line2);background:var(--surface);color:var(--ink2);cursor:pointer;white-space:nowrap;transition:.15s}
.pills button:hover{border-color:var(--accent);color:var(--accent)}
.pills button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pills .sp{flex:1}
.exam-sec{margin:0 0 38px;scroll-margin-top:118px}
.exam-sec h2{font-family:var(--serif);font-size:21px;font-weight:600;margin-bottom:4px}
.exam-sec .sub{font-size:11.5px;color:var(--muted);margin-bottom:14px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.hot-ch{margin:16px 0 8px}
.hot-ch h3{font-size:14.5px;margin:0 0 8px}
.hot-ch h3::before{content:none}
.hot-ch h3 span{font-family:var(--mono);font-size:10px;color:var(--accent);margin-right:8px}
.hot{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.hot:last-child{border-bottom:0}
.hot .st{font-family:var(--mono);font-size:10px;color:var(--amber);flex:0 0 32px;letter-spacing:-.02em;margin-top:1px}
.hot .tx{flex:1;font-size:13.3px;line-height:1.8}
.hot .tx b{font-family:var(--serif);font-size:13.8px}
.hot .tx span{display:block;font-size:11.8px;color:var(--muted);line-height:1.7;margin-top:1px}
.checklist{display:grid;grid-template-columns:1fr;gap:4px}
.ck{display:flex;gap:9px;align-items:flex-start;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12.9px;line-height:1.7;transition:background .14s}
.ck:hover{background:var(--surface-2)}
.ck input{margin-top:5px;accent-color:var(--green);flex:0 0 auto}
.ck.done span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line2)}
.ck span{flex:1}
.ck .ch{font-family:var(--mono);font-size:9.5px;color:var(--accent);flex:0 0 24px;margin-top:2px}
.ckgrp{margin:0 0 18px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:10px 12px}
.ckgrp h3{font-size:13.5px;margin:0 0 7px}
.ckgrp h3::before{content:none}
.ckgrp h3 span{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:8px}
.defs{display:grid;gap:8px}
.defrow{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:11px 14px}
.defrow .en{font-family:var(--serif);font-size:13.8px;font-weight:600;color:var(--ink);line-height:1.7}
.defrow .zh{font-size:12.5px;color:var(--ink2);line-height:1.75;margin-top:2px}
.defrow .ch{font-family:var(--mono);font-size:9.5px;color:var(--accent);float:right;margin-left:8px}
.pair{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:12.9px;line-height:1.75}
.pair:last-child{border-bottom:0}
.pair .ab{font-family:var(--serif);font-weight:600;color:var(--accent);font-size:13px}
.pair .ab em{font-style:normal;color:var(--muted);font-size:10.5px;display:block;font-family:var(--sans)}
.pair .df b{color:var(--ink)}
.pair .df .trap{color:var(--amber);font-size:12px}

/* quiz */
.qz-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:18px 0 10px}
.qz-card{position:relative;border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--surface);cursor:pointer;transition:.18s}
.qz-card:hover{border-color:var(--accent-line);box-shadow:var(--shadow);transform:translateY(-1px)}
.qz-card.done{border-color:var(--green)}
.qz-card .no{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--accent);font-weight:600}
.qz-card h3{font-family:var(--serif);font-size:14.5px;font-weight:600;margin:3px 0 0;letter-spacing:.01em}
.qz-card h3::before{content:none}
.qz-card .meta{font-size:10.5px;color:var(--muted);display:flex;gap:12px;margin-top:7px;font-family:var(--mono)}
.qz-card .sc{position:absolute;top:12px;right:14px;font-family:var(--mono);font-size:18px;color:var(--accent);line-height:1}
.qz-card .sc em{font-style:normal;font-size:9.5px;color:var(--muted)}
.qz-bar{position:sticky;top:52px;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:9px 13px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);margin:0 0 20px;font-size:12px;color:var(--ink2)}
.qz-bar .sp{flex:1}
.qz-bar b{color:var(--accent);font-family:var(--mono);font-size:13px}
.q{padding:16px 0;border-bottom:1px solid var(--line)}
.q:last-of-type{border-bottom:0}
.q-stem{display:flex;gap:10px;font-size:14px;line-height:1.82;margin-bottom:10px}
.q-stem>div{flex:1;min-width:0}
.q-no{width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line2);display:grid;place-items:center;font-size:10.5px;color:var(--muted);margin-top:3px;font-family:var(--mono)}
.q-opt{display:flex;gap:9px;align-items:flex-start;padding:8px 11px;border:1px solid var(--line);border-radius:7px;margin-bottom:6px;cursor:pointer;font-size:12.9px;line-height:1.7;background:var(--surface);transition:.14s}
.q-opt:hover{border-color:var(--accent-line);background:var(--surface-2)}
.q-opt .k{width:18px;height:18px;flex:0 0 18px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:10px;color:var(--muted);margin-top:2px;font-family:var(--mono)}
.q-opt.sel{border-color:var(--accent-2);background:var(--accent-soft)}
.q-opt.sel .k{background:var(--accent-2);border-color:var(--accent-2);color:#fff}
.q-opt.ok{border-color:var(--green);background:var(--green-soft)}
.q-opt.ok .k{background:var(--green);border-color:var(--green);color:#fff}
.q-opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.q-opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
.q.locked .q-opt{cursor:default}
.q.locked .q-opt:hover{border-color:var(--line);background:var(--surface)}
.q.locked .q-opt.ok:hover{border-color:var(--green);background:var(--green-soft)}
.q.locked .q-opt.bad:hover{border-color:var(--bad);background:var(--bad-soft)}
.q-sol{display:none;margin-top:8px;padding:10px 13px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line2);font-size:12.5px;line-height:1.8}
.q-sol.show{display:block}
.q-sol .lb{color:var(--teal);font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;font-weight:700;display:block;margin-bottom:4px}
.qz-result{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:16px 18px;margin:0 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.qz-result .big{font-family:var(--mono);font-size:38px;line-height:1;color:var(--accent)}
.qz-result .big em{font-style:normal;font-size:13px;color:var(--muted)}
.qz-result .txt{font-size:12.5px;color:var(--ink2);line-height:1.9;flex:1;min-width:190px}
.qz-act{display:flex;gap:9px;margin-top:22px;flex-wrap:wrap;align-items:center}
.qz-act button{font-family:var(--sans);font-size:12.5px;padding:8px 20px;border-radius:7px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:#fff;transition:.15s}
.qz-act button:hover{filter:brightness(1.08)}
.qz-act button.ghost{background:transparent;color:var(--ink2);border-color:var(--line2)}
.qz-act button.ghost:hover{border-color:var(--accent);color:var(--accent);filter:none}
.wrong-card{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:12px 14px;margin-bottom:8px}
.wrong-card .stem{font-size:13px;line-height:1.8}
.wrong-card .from{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:6px}

/* command palette */
#rdbar{position:fixed;top:0;left:0;height:2px;width:0;background:var(--accent);z-index:60;transition:width .08s linear;pointer-events:none}
#pal{position:fixed;inset:0;z-index:90;display:none;align-items:flex-start;justify-content:center;padding-top:10vh;background:rgba(25,30,35,.38);backdrop-filter:blur(3px)}
#pal.on{display:flex}
.pal-box{width:min(640px,92vw);background:var(--surface);border:1px solid var(--line2);border-radius:12px;box-shadow:0 26px 64px -22px rgba(0,0,0,.45);overflow:hidden}
.pal-box input{width:100%;border:0;background:transparent;padding:16px 19px;font-size:15px;color:var(--ink);outline:none;font-family:var(--sans);border-bottom:1px solid var(--line)}
.pal-box input::placeholder{color:var(--muted)}
.pal-list{max-height:55vh;overflow-y:auto;padding:5px}
.pal-item{display:flex;gap:11px;align-items:baseline;padding:8px 12px;border-radius:7px;cursor:pointer;font-size:13px;line-height:1.6}
.pal-item .g{font-family:var(--mono);font-size:9.5px;color:var(--muted);white-space:nowrap;min-width:74px;letter-spacing:.02em}
.pal-item .t{flex:1;min-width:0}
.pal-item.sel{background:var(--accent-soft)}
.pal-item.sel .t{color:var(--accent)}
.pal-empty{padding:24px;text-align:center;color:var(--muted);font-size:12.5px}
.pal-foot{padding:7px 13px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.03em}

/* mobile */
#mask{display:none;position:fixed;inset:0;background:rgba(25,30,35,.35);z-index:35;backdrop-filter:blur(2px)}
@media (max-width:920px){
  #side{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:0 0 40px rgba(0,0,0,.18)}
  body.nav #side{transform:none}
  body.nav #mask{display:block}
  #burger{display:grid}
  .hero h1{font-size:26px}
  .hero .sub{font-size:14px}
  .hero .lede{font-size:13.4px}
  .fig-b svg{min-width:560px}
  .w-b svg{min-width:520px}
  .w-b{overflow-x:auto}
  #doc{padding:26px 17px 14px}
  #bar{padding:0 14px}
  #pager{padding:6px 17px 36px;grid-template-columns:1fr}
  .pg.next{grid-column:1;text-align:left}
  .ch-head h1{font-size:26px}
  h2#sec-title{font-size:21px}
  .qz-grid{grid-template-columns:1fr}
  .toolbar,.pills{top:52px}
  .gtable thead{display:none}
  .gtable,.gtable tbody,.gtable tr,.gtable td{display:block;width:100%}
  .gtable{border:0;background:transparent}
  .gtable tr{border:1px solid var(--line);border-radius:9px;background:var(--surface);margin-bottom:8px;padding:8px 10px}
  .gtable td{border:0;padding:3px 0;min-width:0}
  .gtable td::before{content:attr(data-l);display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:1px}
  .gtable .term-en{font-size:14px}
  .gtable .term-ch{white-space:normal}
  .pair{grid-template-columns:1fr;gap:3px}
  .w-b{padding:12px}
  .toolbar input[type=search]{flex:1 1 100%}
}
@media print{
  #side,#bar,#pager,footer,.markdone,.toolbar,.pills,#pal,#rdbar,#tip,.w-ctl,.ex-t{display:none!important}
  #doc{max-width:none;padding:0}
  body{background:#fff;font-size:10.5pt}
  body::before{display:none}
  .ex-s,.q-sol{display:block!important}
  .w,.fig,.ex,.def,.key,.tip,.warn,.exam{break-inside:avoid}
}
</style>
</head>
<body>
<div id="rdbar"></div>
<div id="tip"></div>
<div id="pal">
  <div class="pal-box">
    <input id="palIn" placeholder="搜索章节、术语、考点…" spellcheck="false" autocomplete="off">
    <div class="pal-list" id="palList"></div>
    <div class="pal-foot">↑ ↓ 选择 · Enter 打开 · Esc 关闭 · Ctrl/⌘ K 随时唤起</div>
  </div>
</div>
<div id="app">
  <aside id="side">
    <div class="brand">
      <div class="mark">CS</div>
      <div>
        <h1>计算机科学概论</h1>
        <p>Computer Science: An Overview<br>Brookshear · 双语精读</p>
      </div>
    </div>
    <div class="gauge">
      <div class="gauge-row"><span>学习进度</span><b id="pct">0%</b></div>
      <div class="bar"><i id="pbar" style="width:0%"></i></div>
      <div class="gauge-sub"><span id="psec">0 / 0 节</span><span id="pex">0 题做对</span></div>
    </div>
    <button class="navbtn" id="mapBtn">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3.5l4-1.5 4 1.5 4-1.5v10l-4 1.5-4-1.5-4 1.5z"/><path d="M6 2v10M10 3.5v10"/></svg>
      <div><b>学习地图</b><span>全书结构与用法</span></div>
    </button>
    <button class="navbtn" id="glossBtn">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2.5h8.5A1.5 1.5 0 0 1 13 4v9.5H4.5A1.5 1.5 0 0 1 3 12z"/><path d="M3 12a1.5 1.5 0 0 1 1.5-1.5H13"/><path d="M5.5 5h5M5.5 7.5h3"/></svg>
      <div><b>英文术语表</b><span>按章检索 · 可遮盖自测</span></div>
    </button>
    <button class="navbtn" id="examBtn">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2" width="11" height="12" rx="1.6"/><path d="M5 5.2h6M5 8h6M5 10.8h4"/><path d="M11.5 10.8l1 1 2-2" stroke-width="1.1"/></svg>
      <div><b>考点与背诵</b><span>高频 · 易混 · 必背清单</span></div>
    </button>
    <button class="navbtn" id="quizBtn">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M5.2 6.2l1.3 1.3 2.4-2.4"/><path d="M5.2 10.6h5.4"/></svg>
      <div><b>自测卷</b><span>章测 + 两套模拟</span></div>
      <span class="bdg" id="qzBadge" style="display:none;margin-left:auto;min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:9.5px;line-height:17px;text-align:center"></span>
    </button>
    <nav id="tree"></nav>
  </aside>
  <div id="mask"></div>
  <div id="main">
    <header id="bar">
      <button class="iconbtn" id="burger" aria-label="目录">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
      </button>
      <div class="crumb"><b id="crumb">学习地图</b></div>
      <div class="sp"></div>
      <button class="iconbtn" id="palBtn" aria-label="搜索（Ctrl+K）">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5L14 14"/></svg>
      </button>
      <button class="iconbtn" id="theme" aria-label="切换深浅色">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="3.2"/><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3.1 3.1l1.1 1.1M11.8 11.8l1.1 1.1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1"/></svg>
      </button>
    </header>
    <article id="doc"></article>
    <nav id="pager"></nav>
    <footer>
      依据 Brookshear《Computer Science: An Overview》第 12 版章节编排 · 配合课程 PPT（Ch1–9, Ch12）整理<br>
      英文术语与考试表述为主，中文解释为辅 · 进度与成绩保存在本机浏览器
    </footer>
  </div>
</div>

<script>
/* ================= framework ================= */
var CH = window.CH || {};
var W = window.W || {};
var FIG = window.FIG || {};
var GLOSS = window.GLOSS || [];
var EXAM = window.EXAM || null;
var QUIZ = window.QUIZ || [];
var BOOK = window.BOOK || {};
var TERMS = {};
var ORDER = [];
var KEY = 'cs.overview.v1';

function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; } }
var ST = load();
ST.sec = ST.sec || {};
ST.ex  = ST.ex  || {};
ST.qz  = ST.qz  || {};
ST.wrong = ST.wrong || {};
ST.check = ST.check || {};
ST.theme = ST.theme || 'light';
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(ST)); }catch(e){} }

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function byId(id){ return document.getElementById(id); }
function pad(n){ return n<10 ? '0'+n : ''+n; }

/* glossary index */
function normKey(k){
  return String(k).toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim();
}
function lookupTerm(k){ return TERMS[normKey(k)]; }
function indexTerms(){
  TERMS = {};
  GLOSS.forEach(function(g){
    var keys = [g.t, g.zh].concat(g.alias||[]);
    keys.forEach(function(k){
      if(!k) return;
      TERMS[normKey(k)] = g;
    });
  });
}
function termSpan(key, label){
  var g = lookupTerm(key);
  if(!g) return '<span class="term" title="未收录">' + (label||key) + '</span>';
  return '<span class="term" data-k="'+esc(g.t)+'">' + (label||key) + '</span>';
}
function rich(s){
  if(!s) return '';
  var out = String(s).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, function(_, k, label){
    return termSpan(k.trim(), (label||k).trim());
  });
  /* auto-enrich bold English/Chinese terms when they exist in the glossary */
  out = out.replace(/<b>([^<>]{2,48})<\/b>/g, function(m, txt){
    var g = lookupTerm(txt.replace(/&amp;/g,'&'));
    return g ? '<span class="term" data-k="'+esc(g.t)+'">'+m+'</span>' : m;
  });
  return out;
}

/* build flat order */
function buildOrder(){
  ORDER = [];
  var nums = Object.keys(CH).map(Number).sort(function(a,b){return a-b;});
  nums.forEach(function(n){
    CH[n].sections.forEach(function(s){
      ORDER.push({c:n, sid:s.id, t:s.en, zh:s.zh, s:s});
    });
  });
}
function secById(id){
  for(var i=0;i<ORDER.length;i++) if(ORDER[i].sid===id) return ORDER[i];
  return null;
}

/* ---------- sidebar ---------- */
function buildTree(){
  var box = byId('tree'), out = '';
  var curCh = ST.cur && ST.cur.indexOf('.')>0 ? String(ST.cur).split('.')[0] : null;
  var nums = Object.keys(CH).map(Number).sort(function(a,b){return a-b;});
  nums.forEach(function(n){
    var c = CH[n];
    var done = c.sections.filter(function(s){return ST.sec[s.id]===2;}).length;
    var open = (curCh == n) || (ST.open && ST.open[n]);
    out += '<div class="ch'+(open?' open':'')+'" data-ch="'+n+'">';
    out += '<div class="ch-h" data-toggle="'+n+'">';
    out += '<span class="ch-n">'+n+'</span><b>'+c.short+'<em>'+c.zh+'</em></b>';
    out += '<svg width="8" height="8" viewBox="0 0 8 8" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 1L5.5 4L2.5 7"/></svg>';
    out += '</div><div class="ch-s">';
    c.sections.forEach(function(s){
      var st = ST.sec[s.id]||0;
      var cls = 'sec'+(st===1?' v':'')+(st===2?' d':'')+(ST.cur===s.id?' on':'');
      out += '<div class="'+cls+'" data-sec="'+s.id+'"><span class="dot"></span><span class="num">'+s.id+'</span><span>'+s.shortZh+'</span></div>';
    });
    out += '</div></div>';
  });
  box.innerHTML = out;
  var cur = box.querySelector('.sec.on');
  if(cur && box.getBoundingClientRect){
    var br = box.getBoundingClientRect(), cr = cur.getBoundingClientRect();
    if(cr.top < br.top + 12 || cr.bottom > br.bottom - 12) box.scrollTop += (cr.top - br.top) - 64;
  }
  byId('mapBtn').classList.toggle('on', ST.cur==='map' || !ST.cur);
  byId('glossBtn').classList.toggle('on', ST.cur==='glossary');
  byId('examBtn').classList.toggle('on', ST.cur==='exam');
  byId('quizBtn').classList.toggle('on', ST.cur==='quiz');
  updateBadge();
  updateGauge();
}

function updateGauge(){
  var total = ORDER.length, done = 0, qok = 0;
  ORDER.forEach(function(o){ if(ST.sec[o.sid]===2) done++; });
  Object.keys(ST.qz).forEach(function(k){ qok += (ST.qz[k].s||0); });
  var pct = total ? Math.round(done/total*100) : 0;
  byId('pct').textContent = pct+'%';
  byId('pbar').style.width = pct+'%';
  byId('psec').textContent = done+' / '+total+' 节';
  byId('pex').textContent = qok+' 题做对';
}

/* ---------- block renderer ---------- */
function callout(cls, arr){
  return '<div class="'+cls+'"><span class="lb">'+arr[0]+'</span>'+rich(arr[1])+'</div>';
}
function renderBlocks(blocks){
  var out = '';
  (blocks||[]).forEach(function(b, i){
    if(b.l) out += '<p class="lead">'+rich(b.l)+'</p>';
    else if(b.p) out += '<p>'+rich(b.p)+'</p>';
    else if(b.h) out += '<h3>'+rich(b.h)+'</h3>';
    else if(b.h4) out += '<h4>'+rich(b.h4)+'</h4>';
    else if(b.hr) out += '<hr>';
    else if(b.ul) out += '<ul>'+b.ul.map(function(x){return '<li>'+rich(x)+'</li>';}).join('')+'</ul>';
    else if(b.ol) out += '<ol>'+b.ol.map(function(x){return '<li>'+rich(x)+'</li>';}).join('')+'</ol>';
    else if(b.d) out += callout('def', b.d);
    else if(b.k) out += callout('key', b.k);
    else if(b.tip) out += callout('tip', b.tip);
    else if(b.warn) out += callout('warn', b.warn);
    else if(b.exam) out += callout('exam', b.exam);
    else if(b.tb){
      var hd = b.tb[0], rows = b.tb[1];
      out += '<div class="tbl-wrap"><table class="tbl'+(b.dense?' dense':'')+'"><thead><tr>'+
        hd.map(function(x){return '<th>'+rich(x)+'</th>';}).join('')+'</tr></thead><tbody>'+
        rows.map(function(r){return '<tr>'+r.map(function(x){return '<td>'+rich(x)+'</td>';}).join('')+'</tr>';}).join('')+
        '</tbody></table></div>';
    }
    else if(b.w){
      out += '<div class="w" data-w="'+b.w.id+'">'+(b.w.cap?'<div class="w-cap">'+rich(b.w.cap)+'</div>':'')+'</div>';
    }
    else if(b.fig){
      out += '<figure class="fig"><div class="fig-h"><span class="sq"></span>'+rich(b.fig.title||'Diagram')+'</div>'+
        '<div class="fig-b" data-fig="'+b.fig.id+'"></div>'+
        (b.fig.cap?'<figcaption class="fig-cap">'+rich(b.fig.cap)+'</figcaption>':'')+'</figure>';
    }
    else if(b.ex){
      var e = b.ex;
      out += '<div class="ex"><div class="ex-h">'+ (e.no||'Example') +'</div>'+
        '<div class="ex-q">'+rich(e.q)+'</div>'+
        '<div class="ex-t"><button class="tbtn" data-act="ex">Show solution · 看解析</button></div>'+
        '<div class="ex-s"><span class="lb">SOLUTION · 解析</span>'+
        (e.steps||[]).map(function(s,k){return '<div class="st"><i>'+(k+1)+'</i><div>'+rich(s)+'</div></div>';}).join('')+
        (e.ans?'<div class="an"><b>Answer:</b> '+rich(e.ans)+'</div>':'')+
        '</div></div>';
    }
    else if(b.q){
      var q = b.q, qid = 'qc-'+(ST.cur||'x')+'-'+i;
      out += '<div class="qc" data-qc="'+qid+'" data-correct="'+q.a+'"><div class="qh">QUICK CHECK · 即时检验</div>'+
        '<div class="qq">'+rich(q.q)+'</div><div class="qo">'+
        q.opts.map(function(x,k){return '<button data-opt="'+k+'">'+'ABCD'[k]+'. '+rich(x)+'</button>';}).join('')+
        '</div><div class="qs"><b>Answer: '+'ABCD'[q.a]+'</b> — '+rich(q.s)+'</div></div>';
    }
    else if(b.note) out += '<p class="small">'+rich(b.note)+'</p>';
  });
  return out;
}

/* ---------- routing ---------- */
function go(sid, push){
  var o = secById(sid);
  if(!o) return goMap();
  ST.cur = sid;
  if(!ST.sec[sid]) ST.sec[sid] = 1;
  ST.open = {}; ST.open[o.c] = true;
  save();

  var c = CH[o.c];
  var idx = c.sections.indexOf(o.s);
  var html = '';
  if(idx === 0){
    html += '<div class="ch-head"><div class="ch-kicker">Chapter '+o.c+' · '+ (c.tag||'') +'</div>'+
      '<h1>'+c.en+'<em> · '+c.zh+'</em></h1>'+
      '<div class="zh">'+c.subzh+'</div>'+
      '<div class="ch-desc">'+rich(c.intro)+'</div></div>';
  }
  html += '<h2 id="sec-title">'+sid+'&nbsp;&nbsp;'+o.t+'</h2>';
  html += '<div class="sec-zh">'+o.zh+'</div>';
  html += '<div class="sec-meta"><span>Chapter '+o.c+' · '+c.en+'</span>'+
    (o.s.goals?'<span class="goals">'+o.s.goals.map(function(g){return '<span class="goal">'+g+'</span>';}).join('')+'</span>':'')+
    '</div>';
  html += renderBlocks(o.s.blocks||[]);

  var done = ST.sec[sid]===2;
  html += '<div class="markdone'+(done?' done':'')+'" data-mark="'+sid+'">'+
    '<span>'+(done?'本节已标记为学完。随时回来复习。':'读完了？标记一下，侧栏进度会同步。')+'</span>'+
    '<button data-act="mark">'+(done?'✓ 已学完':'标记本节已学')+'</button></div>';

  byId('doc').innerHTML = html;
  byId('crumb').innerHTML = 'Ch'+o.c+' · '+c.short+' <span style="opacity:.35">/</span> '+sid+' '+o.t;
  document.title = sid+' '+o.t+' · 计算机科学概论';

  document.querySelectorAll('#doc [data-w]').forEach(function(el){
    var id = el.getAttribute('data-w'), fn = W[id];
    if(!fn){ el.innerHTML = '<div class="warn">Widget "'+id+'" 未加载</div>'; return; }
    el.innerHTML = '<div class="w-h"><span class="sq"></span>'+(fn.title||id)+'<em>'+(fn.hint||'')+'</em></div>'+
      '<div class="w-b">'+(fn.html?fn.html():'')+'</div>'+(fn.cap?'<div class="w-cap">'+fn.cap+'</div>':'');
    if(fn.mount) fn.mount(el);
  });
  document.querySelectorAll('#doc [data-fig]').forEach(function(el){
    var id = el.getAttribute('data-fig'), fn = FIG[id];
    if(!fn){ el.innerHTML = '<div class="warn">Diagram "'+id+'" 未加载</div>'; return; }
    el.innerHTML = fn();
  });

  buildTree();
  buildPager(sid, o.c);
  try{ if(push!==false) history.replaceState(null,'','#/s/'+sid); }catch(err){}
  window.scrollTo(0,0);
  document.body.classList.remove('nav');
  save();
}

function buildPager(sid, ch){
  var i = ORDER.map(function(o){return o.sid;}).indexOf(sid);
  var prev = i>0 ? ORDER[i-1] : null;
  var next = i<ORDER.length-1 ? ORDER[i+1] : null;
  var h = '';
  h += prev ? '<a class="pg" data-go="'+prev.sid+'"><span>← PREVIOUS</span><b>'+prev.sid+' '+prev.t+'</b></a>' : '<div class="pg empty"></div>';
  h += next ? '<a class="pg next" data-go="'+next.sid+'"><span>NEXT →</span><b>'+next.sid+' '+next.t+'</b></a>' : '<div class="pg empty"></div>';
  byId('pager').innerHTML = h;
}

/* ---------- home / map ---------- */
function goMap(push){
  ST.cur = 'map'; save();
  var total = ORDER.length;
  var h = '<div class="hero"><div class="k">COMPUTER SCIENCE · AN OVERVIEW</div>'+
    '<h1>计算机科学概论<em> · 双语精读</em></h1>'+
    '<div class="sub">From bits to Turing machines · 从一个比特到一台图灵机</div>'+
    '<div class="lede">按 Brookshear 第 12 版章节组织，覆盖课程 PPT 的 Ch1–9 与 Ch12。每一节先给英文定义与考试表述，再用中文把机制讲透；关键处配可操作的结构图、逐帧演示与即时小测。右侧术语表和考点清单可以直接当考前背诵材料。</div>'+
    '<div class="hero-chips"><span>11 chapters</span><span>'+total+' sections</span><span>'+GLOSS.length+' terms</span><span>'+QUIZ.reduce(function(a,q){return a+q.qs.length;},0)+' questions</span><span>English closed-book</span></div>'+
    '</div>';

  h += '<section class="exam-sec"><h2>全书结构 · How the chapters fit</h2>'+
    '<div class="sub">先看这张依赖图：左边是机器，右边是使用机器的方法，最右是理论边界。</div>'+
    '<figure class="fig"><div class="fig-h"><span class="sq"></span>Course Concept Map</div><div class="fig-b" data-fig="coursemap"></div>'+
    '<figcaption class="fig-cap">读图顺序：数据如何表示（Ch1）→ 如何被处理（Ch2）→ 谁管理资源（Ch3）→ 如何连成网络（Ch4）→ 如何设计算法与程序（Ch5–6）→ 如何组织大型软件（Ch7）→ 如何抽象数据（Ch8）→ 如何持久保存（Ch9）→ 计算的边界（Ch12）。</figcaption></figure></section>';

  h += '<section class="exam-sec"><h2>三遍用法 · How to use this site</h2>'+
    '<div class="sub">不同阶段看不同的层，不要一上来就背术语。</div>'+
    '<div class="howto">'+
    '<div><b>第一遍 · 建立结构</b><p>按章读正文，只看每节的英文定义、结构图和中文讲解。目标是能用自己的话解释“它解决什么问题”。</p></div>'+
    '<div><b>第二遍 · 对准考试</b><p>打开「考点与背诵」，按章过高频考点和易混对比；不熟的术语回术语表点开看考试语境。</p></div>'+
    '<div><b>第三遍 · 自测收口</b><p>做章测，错题自动进错题本；考前只刷错题 + 背诵清单，不再从头翻书。</p></div>'+
    '</div>'+
    '<div class="note-strip"><b>考试范围提示：</b>课程 PPT 覆盖 Chapter 1–9 与 Chapter 12（Chapter 10 Computer Graphics、Chapter 11 Artificial Intelligence 未配课件，本站不展开）。英文闭卷，题干常用 define / explain / compare / convert / trace 这类动词，正文里的 <span class="mono">Exam phrasing</span> 专门标了对应问法。</div>'+
    '</section>';

  h += '<section class="exam-sec"><h2>章节 · Chapters</h2><div class="sub">点卡片进入；进度条按“已标记学完”的节数计算。</div><div class="map-grid">';
  Object.keys(CH).map(Number).sort(function(a,b){return a-b;}).forEach(function(n){
    var c = CH[n];
    var done = c.sections.filter(function(s){return ST.sec[s.id]===2;}).length;
    var pct = Math.round(done/c.sections.length*100);
    h += '<div class="mapcard" data-go="'+c.sections[0].id+'">'+
      '<div class="no">CHAPTER '+pad(n)+'</div>'+
      '<h3>'+c.en+'</h3><div class="zh">'+c.zh+' · '+c.sections.length+' 节</div>'+
      '<p>'+c.card+'</p>'+
      '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
      '<div class="pct"><span>'+done+' / '+c.sections.length+' done</span><span>'+pct+'%</span></div></div>';
  });
  h += '</div></section>';
  h += '<section class="exam-sec"><h2>图例 · Legend</h2><div class="legend">'+
    '<span><i style="background:var(--accent)"></i>Definition / 定义</span>'+
    '<span><i style="background:var(--teal)"></i>Key idea / 核心机制</span>'+
    '<span><i style="background:var(--green)"></i>Tip / 记忆法</span>'+
    '<span><i style="background:var(--amber)"></i>Common trap / 易错</span>'+
    '<span><i style="background:var(--violet)"></i>Exam phrasing / 考法</span></div></section>';

  byId('doc').innerHTML = h;
  byId('crumb').innerHTML = '学习地图 <span style="opacity:.35">/</span> 全书结构';
  document.title = '学习地图 · 计算机科学概论';
  document.querySelectorAll('#doc [data-fig]').forEach(function(el){
    var fn = FIG[el.getAttribute('data-fig')];
    if(fn) el.innerHTML = fn();
  });
  byId('pager').innerHTML = '<div class="pg empty"></div><a class="pg next" data-go="'+ORDER[0].sid+'"><span>START →</span><b>'+ORDER[0].sid+' '+ORDER[0].t+'</b></a>';
  buildTree();
  try{ if(push!==false) history.replaceState(null,'','#/map'); }catch(err){}
  window.scrollTo(0,0);
  document.body.classList.remove('nav');
}

/* ---------- glossary ---------- */
var GQ = {q:'', ch:'all', hide:false};
function goGloss(push){
  ST.cur = 'glossary'; save();
  var h = '<div class="ch-head"><div class="ch-kicker">Vocabulary · 术语</div>'+
    '<h1>英文术语表<em> · Key Terms</em></h1>'+
    '<div class="ch-desc">按章整理的高频术语。每一行给：英文术语、中文、所属知识点、简短定义、考试语境。勾选「遮盖中文」可以遮住中文列，自己先回忆，再把鼠标移上去核对。</div></div>';
  h += '<div class="toolbar"><input id="gq" type="search" placeholder="搜索英文 / 中文 / 定义…" value="'+esc(GQ.q)+'">'+
    '<div class="fl" id="gfl"></div>'+
    '<label class="tgl"><input type="checkbox" id="ghide"'+(GQ.hide?' checked':'')+'> 遮盖中文</label></div>';
  h += '<div class="gcount" id="gcount"></div><div id="gbody"></div>';
  byId('doc').innerHTML = h;

function submitQuiz(){
  var p = quizById(QZ.id); if(!p) return;
  var correct = 0;
  p.qs.forEach(function(q,i){
    var sel = QZ.ans[i];
    var el = document.querySelector('.q[data-q="'+i+'"]');
    el.classList.add('locked');
    el.querySelectorAll('.q-opt').forEach(function(o,k){
      o.classList.remove('sel');
      if(k===q.a) o.classList.add('ok');
      if(k===sel && k!==q.a) o.classList.add('bad');
    });
    if(sel===q.a){ correct++; delete ST.wrong[QZ.id+'-'+i]; }
    else {
      if(!ST.wrong[QZ.id+'-'+i]) ST.wrong[QZ.id+'-'+i] = {q:q.q, id:QZ.id, i:i};
    }
    el.querySelector('.q-sol').classList.add('show');
  });
  QZ.done = true;
  var prevScore = ST.qz[QZ.id];
  if(!prevScore || correct > prevScore.s) ST.qz[QZ.id] = {s:correct, t:p.qs.length};
  save(); updateBadge(); updateGauge();
  var pct = Math.round(correct/p.qs.length*100);
  var box = document.createElement('div');
  box.className = 'qz-result';
  box.innerHTML = '<div class="big">'+correct+'<em>/'+p.qs.length+'</em></div>'+
    '<div class="txt"><b>'+pct+'%</b> · '+(pct>=85?'很稳，可以去背下一章。':pct>=60?'及格线以上，错题回看解析再重做。':'先回正文把标★的段落读一遍，再做一次。')+'<br>'+
    '错题已收进错题本，共 '+wrongCount()+' 题。</div>'+
    '<button class="w-btn" data-go="quiz">返回列表</button>';
  var act = document.querySelector('.qz-act');
  act.parentNode.insertBefore(box, act);
  act.querySelector('[data-act="submit"]').textContent = '已交卷';
  act.querySelector('[data-act="submit"]').disabled = true;
  box.scrollIntoView({behavior:'smooth',block:'center'});
}

/* ---------- global events ---------- */
document.addEventListener('click', function(e){
  var t = e.target;
  var goEl = t.closest('[data-go]');
  if(goEl){ var g = goEl.getAttribute('data-go'); location.hash = '#/'+g; return; }
  var sec = t.closest('[data-sec]');
  if(sec){ location.hash = '#/s/'+sec.getAttribute('data-sec'); return; }
  var ch = t.closest('[data-toggle]');
  if(ch){ var box = ch.parentNode; box.classList.toggle('open'); var n = box.getAttribute('data-ch'); ST.open = ST.open||{}; ST.open[n]=box.classList.contains('open'); save(); return; }
  var exb = t.closest('[data-act="ex"]');
  if(exb){ exb.closest('.ex').querySelector('.ex-s').classList.toggle('show'); return; }
  var mark = t.closest('[data-act="mark"]');
  if(mark){
    var sid = mark.closest('[data-mark]').getAttribute('data-mark');
    ST.sec[sid] = ST.sec[sid]===2 ? 1 : 2; save();
    var wrap = mark.closest('.markdone');
    wrap.classList.toggle('done', ST.sec[sid]===2);
    mark.textContent = ST.sec[sid]===2 ? '✓ 已学完' : '标记本节已学';
    buildTree();
    return;
  }
  var opt = t.closest('.qc .qo button');
  if(opt){
    var qc = opt.closest('.qc');
    if(qc.getAttribute('data-done')) return;
    qc.setAttribute('data-done','1');
    var qi = Array.prototype.indexOf.call(qc.querySelectorAll('.qo button'), opt);
    var right = parseInt(qc.getAttribute('data-correct'),10);
    qc.querySelectorAll('.qo button').forEach(function(b,k){
      if(k===right) b.classList.add('ok');
      else if(k===qi) b.classList.add('no');
    });
    qc.querySelector('.qs').classList.add('show');
    return;
  }
  var qopt = t.closest('.q .q-opt');
  if(qopt){
    var qEl = qopt.closest('.q'); if(qEl.classList.contains('locked')) return;
    var qi2 = parseInt(qEl.getAttribute('data-q'),10);
    QZ.ans[qi2] = parseInt(qopt.getAttribute('data-opt'),10);
    qEl.querySelectorAll('.q-opt').forEach(function(o){o.classList.remove('sel');});
    qopt.classList.add('sel');
    var p = quizById(QZ.id);
    byId('qProgress').textContent = Object.keys(QZ.ans).length+' / '+p.qs.length;
    return;
  }
  var sub = t.closest('[data-act="submit"]');
  if(sub && !sub.disabled){ submitQuiz(); return; }
  var qcard = t.closest('[data-quiz]');
  if(qcard){ location.hash = '#/quiz/'+qcard.getAttribute('data-quiz'); return; }
  var wcard = t.closest('[data-wrong]');
  if(wcard){ location.hash = '#/wrong'; return; }
  if(t.closest('[data-act="clearwrong"]')){ ST.wrong={}; save(); goWrong(); return; }
  if(t.closest('[data-print]')){ window.print(); return; }
  var jump = t.closest('[data-jump]');
  if(jump){
    var target = byId(jump.getAttribute('data-jump'));
    if(target) target.scrollIntoView({behavior:'smooth',block:'start'});
    document.querySelectorAll('#expills button').forEach(function(x){x.classList.toggle('on', x===jump);});
    return;
  }
});

  if(e.target.closest('.term')) byId('tip').style.display='none';
});
document.addEventListener('click', function(e){
  var el = e.target.closest('.term');
  if(el){ GQ.q = el.getAttribute('data-k'); goGloss(); }
});

/* theme */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', ST.theme||'light');
}
byId('theme').addEventListener('click', function(){
  ST.theme = ST.theme==='dark' ? 'light' : 'dark'; save(); applyTheme();
});

/* nav buttons */
byId('mapBtn').addEventListener('click', function(){ location.hash='#/map'; });
byId('glossBtn').addEventListener('click', function(){
  if(ST.cur==='glossary'){ GQ.q=''; GQ.ch='all'; goGloss(); }
  else { GQ.q=''; location.hash='#/glossary'; }
});
document.querySelector('.brand').addEventListener('click', function(){ location.hash='#/map'; });
byId('examBtn').addEventListener('click', function(){ location.hash='#/exam'; });
byId('quizBtn').addEventListener('click', function(){ location.hash='#/quiz'; });
byId('burger').addEventListener('click', function(){ document.body.classList.toggle('nav'); });
byId('mask').addEventListener('click', function(){ document.body.classList.remove('nav'); });
byId('palBtn').addEventListener('click', palOpen);
byId('palIn').addEventListener('input', function(e){ palRender(e.target.value); });
byId('pal').addEventListener('click', function(e){ if(e.target===byId('pal')) palClose(); });
document.addEventListener('keydown', function(e){
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); palOpen(); return; }
  if(byId('pal').classList.contains('on')){
    if(e.key==='Escape'){ palClose(); }
    else if(e.key==='ArrowDown'){ e.preventDefault(); PAL.sel=Math.min(PAL.list.length-1,PAL.sel+1); palMark(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); PAL.sel=Math.max(0,PAL.sel-1); palMark(); }
    else if(e.key==='Enter'){ e.preventDefault(); palChoose(PAL.sel); }
  }
});
function palMark(){
  document.querySelectorAll('.pal-item').forEach(function(x,i){ x.classList.toggle('sel', i===PAL.sel); });
  var s = document.querySelector('.pal-item.sel'); if(s) s.scrollIntoView({block:'nearest'});
}
byId('palList').addEventListener('click', function(e){
  var it = e.target.closest('[data-pi]'); if(it) palChoose(parseInt(it.getAttribute('data-pi'),10));
});
byId('palList').addEventListener('mousemove', function(e){
  var it = e.target.closest('[data-pi]'); if(!it) return;
  PAL.sel = parseInt(it.getAttribute('data-pi'),10); palMark();
});

/* reading progress */
function updRd(){
  var h = document.documentElement;
  var max = h.scrollHeight - h.clientHeight;
  byId('rdbar').style.width = (max>0 ? (h.scrollTop/max*100) : 0)+'%';
}
document.addEventListener('scroll', updRd, {passive:true});
window.addEventListener('resize', updRd);

/* route */
function route(){
  var h = location.hash.replace(/^#\/?/,'');
  if(!h || h==='map') return goMap(false);
  if(h.indexOf('s/')===0) return go(h.slice(2), false);
  if(h==='glossary') return goGloss(false);
  if(h==='exam') return goExam(false);
  if(h==='quiz') return goQuizList(false);
  if(h.indexOf('quiz/')===0) return goQuiz(h.slice(5), false);
  if(h==='wrong') return goWrong(false);
  goMap(false);
}

/* boot */
function boot(){
  indexTerms();
  buildOrder();
  buildPalette();
  applyTheme();
  route();
  window.addEventListener('hashchange', route);
  updRd();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

<script>
/* ===== w1.js ===== */
/* ===== w1: bits, gates, numbers ===== */
(function(){
var W = window.W = window.W || {};
function qa(root, sel){ return Array.prototype.slice.call(root.querySelectorAll(sel)); }
function svg(w,h,inner){ return '<svg viewBox="0 0 '+w+' '+h+'" class="wsvg" xmlns="http://www.w3.org/2000/svg">'+inner+'</svg>'; }
function T(x,y,s,opt){ opt=opt||{}; return '<text x="'+x+'" y="'+y+'" fill="'+(opt.fill||'var(--ink)')+'" font-size="'+(opt.size||12)+'" font-family="'+(opt.mono?'var(--mono)':'var(--sans)')+'" text-anchor="'+(opt.anchor||'start')+'"'+(opt.weight?' font-weight="'+opt.weight+'"':'')+'>'+s+'</text>'; }

/* ---------- 1.1 Boolean gate lab ---------- */
W.gate = {
  title:'Boolean Gate Lab · 门电路实验台',
  hint:'切换 A/B，看真值表怎么走',
  cap:'AND 只在全 1 时输出 1；OR 有 1 就 1；XOR 相异为 1；NOT 取反。门是构造计算机的最小积木，触发器由门交叉连接而成，能存住一位。',
  html:function(){
    var gates=['AND','OR','XOR','NOT'];
    return '<div class="w-ctl" data-gates>'+gates.map(function(g,i){return '<span class="chip'+(i===0?' on':'')+'" data-g="'+g+'">'+g+'</span>';}).join('')+'</div>'+
      '<div style="display:flex;gap:22px;flex-wrap:wrap;align-items:center;margin-bottom:12px">'+
      '<div style="display:flex;flex-direction:column;gap:8px">'+
      '<button class="w-btn" data-in="0">A = <b class="va">0</b></button>'+
      '<button class="w-btn" data-in="1">B = <b class="vb">1</b></button></div>'+
      '<div data-sym style="flex:0 0 auto"></div>'+
      '<div style="text-align:center"><div style="font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em">OUTPUT</div>'+
      '<div data-out style="font-family:var(--mono);font-size:34px;font-weight:700;color:var(--accent);line-height:1.2">0</div></div></div>'+
      '<div data-tt></div>';
  },
  mount:function(root){
    var st={g:'AND',a:0,b:1};
    function calc(){
      if(st.g==='AND') return st.a&st.b;
      if(st.g==='OR') return st.a|st.b;
      if(st.g==='XOR') return st.a^st.b;
      return st.a?0:1;
    }
    function sym(){
      var a=st.a,b=st.b,out=calc();
      var s='';
      var on='var(--accent)', off='var(--line2)', ink='var(--ink)';
      function wire(x1,y1,x2,y2,v){ s+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+(v?on:off)+'" stroke-width="2.4" stroke-linecap="round"/>'; }
      wire(6,18,52,18,a); wire(6,54,52,54,b);
      if(st.g==='AND'){
        s+='<path d="M52 8 H82 A26 26 0 0 1 82 64 H52 Z" fill="var(--surface-2)" stroke="'+ink+'" stroke-width="1.6"/>';
        s+=T(66,40,'&',{size:20,anchor:'middle',weight:700});
      } else if(st.g==='OR'){
        s+='<path d="M52 8 Q88 8 94 36 Q88 64 52 64 Q70 36 52 8 Z" fill="var(--surface-2)" stroke="'+ink+'" stroke-width="1.6"/>';
        s+=T(74,41,'≥1',{size:15,anchor:'middle',weight:700});
      } else if(st.g==='XOR'){
        s+='<path d="M46 8 Q62 36 46 64" fill="none" stroke="'+ink+'" stroke-width="1.6"/>';
        s+='<path d="M56 8 Q92 8 98 36 Q92 64 56 64 Q74 36 56 8 Z" fill="var(--surface-2)" stroke="'+ink+'" stroke-width="1.6"/>';
        s+=T(78,41,'=1',{size:15,anchor:'middle',weight:700});
      } else {
        s+='<path d="M52 8 L88 36 L52 64 Z" fill="var(--surface-2)" stroke="'+ink+'" stroke-width="1.6"/>';
        s+='<circle cx="93" cy="36" r="5" fill="none" stroke="'+ink+'" stroke-width="1.6"/>';
      }
      var ox = st.g==='NOT'?98:100;
      wire(ox,36,ox+26,36,out);
      root.querySelector('[data-sym]').innerHTML = svg(132,72,s);
    }
    function truth(){
      var rows=[[0,0],[0,1],[1,0],[1,1]], out='<table class="tbl dense" style="min-width:0"><thead><tr><th class="c">A</th><th class="c">B</th><th class="c">OUT</th></tr></thead><tbody>';
      rows.forEach(function(r){
        var v=0;
        if(st.g==='AND') v=r[0]&r[1]; else if(st.g==='OR') v=r[0]|r[1]; else if(st.g==='XOR') v=r[0]^r[1]; else v=r[0]?0:1;
        var hi=(r[0]===st.a && r[1]===st.b);
        out+='<tr'+(hi?' style="background:var(--accent-soft)"':'')+'><td class="c">'+r[0]+'</td><td class="c">'+r[1]+'</td><td class="c"><b>'+v+'</b></td></tr>';
      });
      return out+'</tbody></table>';
    }
    function upd(){
      root.querySelectorAll('[data-in]').forEach(function(b){
        var i=+b.getAttribute('data-in');
        b.querySelector(i?'b.vb':'b.va').textContent = i?st.b:st.a;
      });
      sym();
      root.querySelector('[data-out]').textContent = calc();
      root.querySelector('[data-tt]').innerHTML = truth();
    }
    root.querySelector('[data-gates]').addEventListener('click',function(e){
      var c=e.target.closest('[data-g]'); if(!c) return;
      st.g=c.getAttribute('data-g');
      qa(root,'[data-g]').forEach(function(x){x.classList.toggle('on',x===c);});
      upd();
    });
    root.querySelectorAll('[data-in]').forEach(function(b){
      b.addEventListener('click',function(){
        if(b.getAttribute('data-in')==='0') st.a=st.a?0:1; else st.b=st.b?0:1; upd();
      });
    });
    upd();
  }
};

/* ---------- 1.5 Bit / hex lab ---------- */
W.bitlab = {
  title:'Bit Pattern Lab · 位模式实验台',
  hint:'点每一位，或输入 0–255',
  cap:'8 位一字节能写出 256 种模式。同一串位，按无符号解释是 0–255，按补码解释是 −128–127；十六进制只是每 4 位一组的简写。',
  html:function(){
    var bits=[1,0,1,0,1,1,0,0];
    return '<div class="w-ctl"><label>Decimal <input data-dec type="number" min="0" max="255" value="172" style="width:64px;padding:3px 6px;border:1px solid var(--line2);border-radius:4px;background:var(--surface);color:var(--ink);font-family:var(--mono)"></label>'+
      '<button class="w-btn" data-set="0">clear</button><button class="w-btn" data-set="255">all 1</button></div>'+
      '<div data-bits style="display:flex;gap:5px;margin:6px 0 14px;flex-wrap:wrap"></div>'+
      '<div class="w-out" data-out></div>';
  },
  mount:function(root){
    var bits=[1,0,1,0,1,1,0,0];
    function val(){ return bits.reduce(function(a,b){return a*2+b;},0); }
    function render(){
      var box=root.querySelector('[data-bits]');
      box.innerHTML=bits.map(function(b,i){
        return '<button class="w-btn'+(b?' on':'')+'" data-bit="'+i+'" style="width:34px;padding:8px 0;font-family:var(--mono);font-size:15px">'+b+'</button>';
      }).join('');
      var v=val(), signed=v>127?v-256:v;
      var bin=bits.join(''), hex=('0'+v.toString(16).toUpperCase()).slice(-2);
      root.querySelector('[data-out]').innerHTML =
        '<div>binary &nbsp;<span class="big">'+bin.slice(0,4)+' '+bin.slice(4)+'</span></div>'+
        '<div>hex &nbsp;&nbsp;&nbsp;&nbsp;<b>0x'+hex+'</b> &nbsp; decimal <b>'+v+'</b></div>'+
        '<div>unsigned &nbsp;<b>'+v+'</b> &nbsp; two\'s complement &nbsp;<b style="color:'+(signed<0?'var(--bad)':'var(--green)')+'">'+signed+'</b></div>'+
        '<div class="w-note">MSB（最左）权重 2⁷=128；补码里它也当符号位，所以 10101100 = 172（无符号）= −84（有符号）。</div>';
      var inp=root.querySelector('[data-dec]'); if(document.activeElement!==inp) inp.value=v;
    }
    root.addEventListener('click',function(e){
      var b=e.target.closest('[data-bit]');
      if(b){ var i=+b.getAttribute('data-bit'); bits[i]=bits[i]?0:1; render(); return; }
      var s=e.target.closest('[data-set]');
      if(s){ var v=+s.getAttribute('data-set'); bits=v.toString(2).padStart(8,'0').split('').map(Number); render(); }
    });
    root.querySelector('[data-dec]').addEventListener('input',function(e){
      var v=Math.max(0,Math.min(255,parseInt(e.target.value||'0',10)||0));
      bits=v.toString(2).padStart(8,'0').split('').map(Number); render();
    });
    render();
  }
};

/* ---------- 1.6 Two's complement / excess ---------- */
W.twos = {
  title:'Signed Number Explorer · 补码与余码',
  hint:'拖动取值，或点 +1 看溢出',
  cap:'4 位补码的范围是 −8…+7，正数最高位 0、负数最高位 1。求相反数：从右往左抄 0 直到第一个 1，之后各位取反。4 位余码（excess-8）则是把真值整体平移 +8，所以 −8 写成 0000。',
  html:function(){
    return '<div class="w-ctl"><label>value <input data-r type="range" min="-8" max="7" step="1" value="-6"><output data-v>-6</output></label>'+
      '<button class="w-btn" data-inc>+1</button><button class="w-btn" data-reset>reset</button></div>'+
      '<div class="w-out" data-out></div>'+
      '<div data-tbl style="margin-top:10px"></div>';
  },
  mount:function(root){
    var v=-6, overflow=false;
    function bits4(n){ return ((n+16)%16).toString(2).padStart(4,'0'); }
    function render(){
      var b=bits4(v), tw=b, ex=bits4(v+8);
      var sign=b[0], mag=parseInt(b.slice(1),2);
      root.querySelector('[data-v]').textContent=v;
      root.querySelector('[data-r]').value=v;
      root.querySelector('[data-out]').innerHTML =
        '<div style="display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end">'+
        '<div><div class="small">two\'s complement</div><span class="big mono">'+tw+'</span></div>'+
        '<div><div class="small">excess-8</div><span class="big mono">'+ex+'</span></div>'+
        '<div><div class="small">sign / value</div><b>'+sign+'</b> / '+mag+'</div></div>'+
        '<div class="w-note">'+(overflow?'<b style="color:var(--bad)">Overflow:</b> +7 加 1 越过上界，位模式回到 1000，被解释成 −8。':'当前值 '+v+'，位模式 '+tw+'；最高位 '+sign+' 表示'+(v<0?'负':'正')+'。')+'</div>';
      var rows='';
      for(var n=-8;n<=7;n++){
        rows+='<tr'+(n===v?' style="background:var(--accent-soft)"':'')+'><td class="c">'+n+'</td><td class="c mono">'+bits4(n)+'</td><td class="c mono">'+bits4(n+8)+'</td></tr>';
      }
      root.querySelector('[data-tbl]').innerHTML='<div class="tbl-wrap" style="max-height:180px;overflow:auto"><table class="tbl dense" style="min-width:0"><thead><tr><th class="c">value</th><th class="c">two\'s comp.</th><th class="c">excess-8</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    }
    root.querySelector('[data-r]').addEventListener('input',function(e){ v=+e.target.value; overflow=false; render(); });
    root.querySelector('[data-inc]').addEventListener('click',function(){ overflow=(v===7); v=(v+1>7)?-8:v+1; render(); });
    root.querySelector('[data-reset]').addEventListener('click',function(){ v=-6; overflow=false; render(); });

  }
};

/* ---------- 1.7 8-bit floating point ---------- */
W.float8 = {
  title:'Floating-Point Encoder · 8 位浮点数',
  hint:'1 符号 + 3 阶码（余 4）+ 4 尾数',
  cap:'课程用的 8 位格式：符号 1 位、指数 3 位用 excess-4、尾数 4 位存规范化后的 0.xxxx。值 = (−1)^s × 0.M × 2^(E−4)。尾数不够就截断，这就是 truncation error。',
  html:function(){
    var presets=[['2¾',0,6,11],['1⅛',0,5,9],['5⁄32',0,2,10],['−2½',1,6,10]];
    return '<div class="w-ctl">'+presets.map(function(p,i){return '<button class="w-btn" data-p="'+i+'">'+p[0]+'</button>';}).join('')+'</div>'+
      '<div data-fields style="display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 12px"></div>'+
      '<div class="w-out" data-out></div>';
  },
  mount:function(root){
    var names=['Sign','2²','2¹','2⁰','M₁','M₂','M₃','M₄'];
    var bits=[0,1,1,0,1,0,1,1];
    function render(){
      var box=root.querySelector('[data-fields]');
      box.innerHTML=bits.map(function(b,i){
        var color=i===0?'var(--violet)':(i<4?'var(--teal)':'var(--accent)');
        return '<button data-fb="'+i+'" style="flex:1;min-width:44px;border:1px solid var(--line2);background:var(--surface);border-radius:5px;padding:5px 2px;cursor:pointer;font-family:var(--mono)">'+
          '<span style="display:block;font-size:8.5px;color:var(--muted);letter-spacing:.02em">'+names[i]+'</span>'+
          '<b style="font-size:17px;color:'+color+'">'+b+'</b></button>';
      }).join('');
      var s=bits[0], E=parseInt(bits.slice(1,4).join(''),2), M=bits.slice(4).join('');

      var val=(s?-1:1)*frac*Math.pow(2,e);
      root.querySelector('[data-out]').innerHTML =
        '<div>sign <b>'+(s?'−':'+')+'</b> · exponent <b>'+E+'</b> − 4 = <b>'+e+'</b> · mantissa <b>0.'+M+'</b> = '+frac+'</div>'+
        '<div style="margin-top:4px">value = '+(s?'−':'')+frac+' × 2<sup>'+e+'</sup> = <span class="big">'+val+'</span></div>'+
        '<div class="w-note">'+ (frac===0?'尾数为 0，这个模式表示 0（本课程格式未定义 NaN/Infinity）。':'规范化要求尾数从最左边的 1 开始填；若原数位数超过 4 位，多出的部分被截断。')+'</div>';
    }
    var presets=[[0,6,11],[0,5,9],[0,2,10],[1,6,10]];
    root.addEventListener('click',function(e){
      var fb=e.target.closest('[data-fb]');
      if(fb){ var i=+fb.getAttribute('data-fb'); bits[i]=bits[i]?0:1; render(); return; }
      var p=e.target.closest('[data-p]');
      if(p){ var a=presets[+p.getAttribute('data-p')]; bits=[a[0],a[1].toString(2).padStart(3,'0'),a[2].toString(2).padStart(4,'0')].join('').split('').map(Number); render(); }
    });
    render();
  }
};

/* ---------- 1.4 Text encoding ---------- */
W.chars = {
  title:'Text → ASCII → Bits · 字符编码',
  hint:'输入英文，逐字符看编码',
  cap:'ASCII 用 7 位表示 128 个常用字符，存进字节时最高位补 0；Unicode 扩展到 21 位（常用语言 16 位）。UTF-8 对 ASCII 字符保持单字节，所以英文文本在 ASCII 与 UTF-8 下完全相同。',
  html:function(){
    return '<div class="w-ctl"><label>text <input data-txt value="CS50" maxlength="14" style="width:150px;padding:4px 8px;border:1px solid var(--line2);border-radius:4px;background:var(--surface);color:var(--ink);font-family:var(--mono)"></label></div>'+
      '<div data-out></div>';
  },
  mount:function(root){
    function render(){
      var txt=root.querySelector('[data-txt]').value||'';
      var rows='';
      for(var i=0;i<txt.length;i++){
        var ch=txt[i], code=ch.codePointAt(0);
        var asc=code<128?code:null;
        var bin=asc===null?'—':asc.toString(2).padStart(8,'0');
        rows+='<tr><td class="c" style="font-family:var(--mono);font-size:15px">'+(ch===' '?'␠':ch)+'</td>'+
          '<td class="c mono">'+(asc===null?'non-ASCII':asc)+'</td>'+
          '<td class="c mono">'+(asc===null?'—':'0x'+asc.toString(16).toUpperCase().padStart(2,'0'))+'</td>'+
          '<td class="c mono" style="letter-spacing:.08em">'+bin+'</td></tr>';
      }
      root.querySelector('[data-out]').innerHTML='<div class="tbl-wrap"><table class="tbl dense" style="min-width:0"><thead><tr><th class="c">char</th><th class="c">decimal</th><th class="c">hex</th><th class="c">8-bit pattern</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
        '<div class="w-note">大写 A = 65 = 0x41 = 01000001；小写 a = 97 = 0x61。字母表连续，所以 '+(txt.length?'“'+txt+'”':'')+' 的编码可以顺推。</div>';
    }
    root.querySelector('[data-txt]').addEventListener('input',render);
    render();
  }
};

})();

/* ===== w2: machine, OS ===== */
(function(){

var FIG = window.FIG = window.FIG || {};
function qa(root, sel){ return Array.prototype.slice.call(root.querySelectorAll(sel)); }

/* ---------- 2.1 von Neumann architecture ---------- */
W.arch = {
