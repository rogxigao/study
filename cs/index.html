{t:"ALU",zh:"算术逻辑单元",ch:2,def:"Arithmetic/logic unit: the CPU component that performs arithmetic and Boolean operations.",exam:"Adds, subtracts, ANDs, ORs, XORs; writes results to registers."},
{t:"control unit",zh:"控制器",ch:2,def:"The CPU component that coordinates the machine cycle and issues control signals.",exam:"Fetches instructions, decodes them, and directs other units."},
{t:"register",zh:"寄存器",ch:2,def:"A small, very fast storage location inside the CPU.",exam:"General-purpose registers hold operands; PC and IR are special-purpose."},
{t:"bus",zh:"总线",ch:2,def:"A shared communication path connecting the CPU, memory, and peripherals.",exam:"Data bus, address bus, and control bus have different roles."},
{t:"data bus",zh:"数据总线",ch:2,def:"The bus lines that carry data between components.",exam:"Its width is often related to the machine word size."},
{t:"address bus",zh:"地址总线",ch:2,def:"The bus lines that carry the address of the memory cell or device being accessed.",exam:"Width determines maximum addressable memory: 32 bits → 4 GB."},
{t:"control bus",zh:"控制总线",ch:2,def:"The bus lines that carry control signals such as read, write, and interrupt.",exam:"Coordinates timing between CPU and other units."},
{t:"stored-program concept",zh:"存储程序概念",ch:2,def:"The idea that instructions and data are both stored in main memory as bit patterns and executed by the CPU.",exam:"Explains why programs can be loaded and changed easily."},
{t:"cache memory",zh:"高速缓存",ch:2,def:"A small high-speed memory inside or near the CPU holding recently used data.",exam:"Reduces average memory access time."},
{t:"machine instruction",zh:"机器指令",ch:2,def:"An instruction encoded as a bit pattern that the CPU can recognize and execute.",exam:"Contains an op-code and operands."},
{t:"machine language",zh:"机器语言",ch:2,def:"The set of all instructions recognized by a particular machine.",exam:"Machine-dependent; directly executable but hard to read."},
{t:"op-code",zh:"操作码",ch:2,def:"The part of an instruction that specifies which operation to perform.",exam:"In 156C, 1 = LOAD; in 35A7, 3 = STORE."},
{t:"operand",zh:"操作数",ch:2,def:"The part of an instruction that provides details such as a register number or address.",exam:"Its interpretation depends on the op-code."},
{t:"RISC",zh:"精简指令集计算机",ch:2,def:"A design philosophy with few, simple, fixed-length instructions and heavy pipelining.",exam:"Examples: ARM, PowerPC."},
{t:"CISC",zh:"复杂指令集计算机",ch:2,def:"A design philosophy with many complex instructions that may do more work each.",exam:"Example: Intel x86."},
{t:"program counter",zh:"程序计数器",ch:2,def:"A special register holding the address of the next instruction to execute.",exam:"Incremented during the fetch phase; changed by a jump."},
{t:"instruction register",zh:"指令寄存器",ch:2,def:"A special register holding the instruction currently being executed.",exam:"Receives the fetched instruction before decoding."},
{t:"machine cycle",zh:"机器周期",ch:2,def:"The fetch–decode–execute sequence the CPU repeats for each instruction.",exam:"Fetch gets the instruction; decode interprets it; execute performs it."},
{t:"fetch",zh:"取指",ch:2,def:"The machine-cycle phase that retrieves the next instruction from memory into the IR.",exam:"PC is incremented so it points to the following instruction."},
{t:"decode",zh:"译码",ch:2,def:"The machine-cycle phase that determines what operation an instruction specifies.",exam:"The op-code selects the operation; operands are interpreted."},
{t:"execute",zh:"执行",ch:2,def:"The machine-cycle phase that carries out the instruction.",exam:"May modify registers, memory, or the program counter."},
{t:"jump instruction",zh:"跳转指令",ch:2,def:"A control instruction that changes the program counter, altering the execution order.",exam:"B258: if R2 equals R0, jump to address 58."},
{t:"masking",zh:"掩码",ch:2,def:"Using a bit pattern with AND/OR/XOR to clear, set, or flip selected bits.",exam:"AND with 0 clears; OR with 1 sets; XOR with 1 flips."},
{t:"circular shift",zh:"循环移位",ch:2,def:"A shift in which bits moved out at one end re-enter at the other end.",exam:"11100101 circular right → 11110010."},
{t:"logical shift",zh:"逻辑移位",ch:2,def:"A shift that discards bits leaving the boundary and fills vacated positions with 0.",exam:"Used for unsigned bit manipulation."},
{t:"arithmetic shift",zh:"算术移位",ch:2,def:"A shift that preserves the sign bit, used for signed numbers.",exam:"Arithmetic right shift roughly divides by 2 while keeping the sign."},
{t:"controller",zh:"控制器（设备）",ch:2,def:"An intermediary device that handles communication between the computer and a peripheral.",exam:"Translates bus signals into device-specific operations."},
{t:"port",zh:"端口",ch:2,def:"The point at which a peripheral device connects to a computer.",exam:"USB and Ethernet ports are common examples."},
{t:"memory-mapped I/O",zh:"内存映射 I/O",ch:2,def:"A scheme in which peripheral devices are assigned memory addresses and accessed with ordinary load/store instructions.",exam:"Simplifies CPU–device communication."},
{t:"handshaking",zh:"握手",ch:2,def:"The process of coordinating data transfer between components by exchanging status information.",exam:"Uses a status word from the device."},
{t:"status word",zh:"状态字",ch:2,def:"A bit pattern generated by a peripheral that reports its state to the controller.",exam:"Bits indicate ready, busy, error, etc."},
{t:"DMA",zh:"直接内存存取",ch:2,def:"Direct memory access: a controller transfers data to or from main memory without CPU involvement for each item.",exam:"Overlaps I/O with computation but complicates bus arbitration."},
{t:"von Neumann bottleneck",zh:"冯·诺依曼瓶颈",ch:2,def:"The performance limit caused by the CPU and memory sharing a single bus.",exam:"Insufficient bus speed impedes overall performance."},
{t:"serial communication",zh:"串行通信",ch:2,def:"Transmission of bits one after another over a single path.",exam:"USB and FireWire are serial."},
{t:"parallel communication",zh:"并行通信",ch:2,def:"Transmission of several bits simultaneously over multiple paths.",exam:"Faster in theory but prone to skew."},
{t:"bandwidth",zh:"带宽",ch:2,def:"The maximum data transfer rate of a communication channel.",exam:"Measured in bps; note the difference from Bps (bytes per second)."},
{t:"pipelining",zh:"流水线",ch:2,def:"Overlapping stages of the machine cycle so several instructions are in progress at once.",exam:"Increases throughput, not the latency of a single instruction."},
{t:"SIMD",zh:"单指令流多数据流",ch:2,def:"A parallel architecture that applies one instruction to multiple data items simultaneously.",exam:"Used in array and graphics processors."},
{t:"MIMD",zh:"多指令流多数据流",ch:2,def:"A parallel architecture in which different processors execute different instructions on different data.",exam:"Multicore processors and clusters are MIMD."},
{t:"SISD",zh:"单指令流单数据流",ch:2,def:"A conventional single-processor architecture with no parallelism.",exam:"The baseline against which parallel architectures are compared."},

/* ---- Ch3 ---- */
{t:"operating system",zh:"操作系统",ch:3,def:"Software that controls the overall operation of a computer: files, user interface, scheduling, and program execution.",exam:"Function question: file management, interface, scheduling, coordination."},
{t:"batch processing",zh:"批处理",ch:3,def:"Executing jobs grouped on input tape in sequence without user interaction.",exam:"Early OS model; FIFO job queue, no dialogue."},
{t:"interactive processing",zh:"交互式处理",ch:3,def:"Allowing a running program to carry on a dialogue with the user through a terminal.",exam:"Enabled by remote terminals; contrast with batch."},
{t:"time-sharing",zh:"分时",ch:3,def:"Rapidly switching the CPU among users or processes so each gets a time slice.",exam:"Creates the illusion of simultaneous execution on one CPU."},
{t:"real-time",zh:"实时",ch:3,def:"A system that must respond to events within a strict time limit.",exam:"Used in control systems; requires high reliability."},
{t:"application software",zh:"应用软件",ch:3,def:"Software that performs specific tasks for users.",exam:"Contrast with system software."},
{t:"system software",zh:"系统软件",ch:3,def:"Software that provides infrastructure for applications, including the OS and utilities.",exam:"OS + utility software."},
{t:"utility software",zh:"工具软件",ch:3,def:"System software that performs maintenance tasks such as compression or formatting.",exam:"Part of system software, not the kernel."},
{t:"shell",zh:"外壳",ch:3,def:"The text-based user interface of an operating system that interprets commands.",exam:"Older interface; GUI is the graphical alternative."},
{t:"GUI",zh:"图形用户界面",ch:3,def:"A graphical user interface using windows, icons, and menus.",exam:"Contrast with a text-based shell."},
{t:"kernel",zh:"内核",ch:3,def:"The internal part of an operating system that performs basic functions.",exam:"Contains file manager, device drivers, memory manager, scheduler/dispatcher."},
{t:"file manager",zh:"文件管理程序",ch:3,def:"The kernel component that manages files, directories, and access.",exam:"A directory is a user-created bundle of files and subdirectories."},
{t:"device driver",zh:"设备驱动程序",ch:3,def:"Software that communicates with a controller or device to carry out operations.",exam:"Translates generic requests into device-specific steps."},
{t:"memory manager",zh:"内存管理程序",ch:3,def:"The kernel component that allocates memory and implements virtual memory.",exam:"Moves pages between main memory and mass storage."},
{t:"virtual memory",zh:"虚拟内存",ch:3,def:"The illusion of more main memory than physically exists, created by paging data to disk.",exam:"Explains why a program can exceed available RAM."},
{t:"paging",zh:"分页",ch:3,def:"Moving fixed-size blocks (pages) between main memory and mass storage.",exam:"The mechanism behind virtual memory."},
{t:"boot loader",zh:"引导加载程序",ch:3,def:"A program in ROM that runs at power-on and loads the operating system from mass storage.",exam:"Sequence: power on → boot loader → self-test → load OS → jump to OS."},
{t:"BIOS",zh:"基本输入输出系统",ch:3,def:"Firmware in ROM that initializes hardware and starts the boot process.",exam:"An example of firmware and a boot loader."},
{t:"firmware",zh:"固件",ch:3,def:"Software stored permanently in ROM or flash memory.",exam:"BIOS is firmware."},
{t:"directory",zh:"目录",ch:3,def:"A user-created bundle of files and other directories.",exam:"Also called a folder; a directory path is a sequence of directories."},
{t:"directory path",zh:"目录路径",ch:3,def:"A sequence of directories that locates a file within a file system.",exam:"Part of a URL and of a file's location."},
{t:"process",zh:"进程",ch:3,def:"The activity of executing a program, including its current state.",exam:"State includes PC, registers, and related memory; contrast with a static program."},
{t:"process state",zh:"进程状态",ch:3,def:"The current status of a process: running, ready, or waiting.",exam:"Waiting → ready when the awaited event occurs."},
{t:"process table",zh:"进程表",ch:3,def:"A kernel data structure recording each process's state, priority, memory, and open files.",exam:"Used by the scheduler and dispatcher."},
{t:"scheduler",zh:"调度程序",ch:3,def:"The kernel component that selects which process should run next.",exam:"Adds new processes and removes completed ones."},
{t:"dispatcher",zh:"分派程序",ch:3,def:"The kernel component that allocates time slices and switches the CPU to the selected process.",exam:"Controls how long a process runs."},
{t:"time slice",zh:"时间片",ch:3,def:"The interval for which a process is allowed to use the CPU before being interrupted.",exam:"Its end is signaled by an interrupt."},
{t:"interrupt",zh:"中断",ch:3,def:"A signal that causes the CPU to suspend the current process and handle an event.",exam:"Used for time slicing, I/O completion, and errors."},
{t:"interrupt handler",zh:"中断处理程序",ch:3,def:"The routine executed when an interrupt occurs; it saves the current state and handles the event.",exam:"After handling, the previous process may resume."},
{t:"critical region",zh:"临界区",ch:3,def:"A section of code that only one process may execute at a time.",exam:"Requires mutual exclusion to avoid lost updates."},
{t:"mutual exclusion",zh:"互斥",ch:3,def:"The requirement that only one process access a critical region at a time.",exam:"Implemented with semaphores or monitors."},
{t:"semaphore",zh:"信号量",ch:3,def:"A control flag with P (wait) and V (signal) operations used to enforce mutual exclusion.",exam:"P decrements or blocks; V increments or wakes a waiting process."},
{t:"deadlock",zh:"死锁",ch:3,def:"A situation in which processes wait for resources held by each other in a cycle, so none can proceed.",exam:"Four conditions: mutual exclusion, hold and wait, no preemption, circular wait."},
{t:"hold and wait",zh:"占有并等待",ch:3,def:"A deadlock condition in which a process holds one resource while requesting another.",exam:"Breaking it: request all resources at once."},
{t:"no preemption",zh:"非抢占",ch:3,def:"A deadlock condition in which an allocated resource cannot be forcibly taken away.",exam:"Breaking it: allow preemption."},
{t:"circular wait",zh:"循环等待",ch:3,def:"A deadlock condition in which a cycle of processes each waits for a resource held by the next.",exam:"Breaking it: impose a global ordering on resources."},
{t:"spooling",zh:"假脱机",ch:3,def:"Queuing requests for a non-sharable device (such as a printer) so it appears sharable.",exam:"Reduces competition and can prevent deadlock."},
{t:"privileged mode",zh:"特权模式",ch:3,def:"A CPU mode in which all instructions, including sensitive ones, may be executed.",exam:"Prevents unconstrained processes from accessing protected memory."},
{t:"auditing software",zh:"审计软件",ch:3,def:"Software that records and analyzes system events to detect security violations.",exam:"A countermeasure to intrusion and sniffing."},
{t:"sniffing software",zh:"嗅探软件",ch:3,def:"Software that secretly records user activity or network traffic and reports it to an attacker.",exam:"Keyloggers and fake login screens are examples."},

/* ---- Ch4 ---- */
{t:"PAN",zh:"个域网",ch:4,def:"Personal area network: a short-range network, typically within a few meters.",exam:"Example: wireless headset to smartphone."},
{t:"LAN",zh:"局域网",ch:4,def:"Local area network: computers in a single building or campus.",exam:"Typically owned by one organization."},
{t:"MAN",zh:"城域网",ch:4,def:"Metropolitan area network: a network spanning a city or community.",exam:"Intermediate between LAN and WAN."},
{t:"WAN",zh:"广域网",ch:4,def:"Wide area network: a network linking machines over long distances.",exam:"The Internet is a worldwide internet of many WANs."},
{t:"protocol",zh:"协议",ch:4,def:"A set of rules governing communication between parties.",exam:"Without protocols, received bits cannot be interpreted."},
{t:"CSMA/CD",zh:"载波侦听多路访问/冲突检测",ch:4,def:"An Ethernet protocol: listen before sending, and detect collisions while transmitting.",exam:"Used in wired Ethernet; not suitable for wireless."},
{t:"CSMA/CA",zh:"载波侦听多路访问/冲突避免",ch:4,def:"A wireless protocol that avoids collisions rather than detecting them.",exam:"Used in Wi-Fi; handles the hidden terminal problem."},
{t:"hidden terminal problem",zh:"隐藏终端问题",ch:4,def:"Two wireless stations can both reach the AP but cannot hear each other, so their signals collide at the AP.",exam:"A reason CSMA/CD is unsuitable for wireless."},
{t:"repeater",zh:"中继器",ch:4,def:"A device that forwards and amplifies signals between two buses without interpreting them.",exam:"Extends a network's physical reach."},
{t:"bridge",zh:"网桥",ch:4,def:"A device that connects two compatible networks and forwards frames by destination address.",exam:"More selective than a repeater."},
{t:"switch",zh:"交换机",ch:4,def:"A bridge with multiple ports that connects several compatible networks.",exam:"Forwards frames only to the destination segment."},
{t:"router",zh:"路由器",ch:4,def:"A device that connects incompatible networks and forwards packets between them.",exam:"Builds an internet; uses a forwarding table."},
{t:"gateway",zh:"网关",ch:4,def:"The point at which a network connects to the outside world, often a router or an AP-plus-router unit.",exam:"Term used loosely for the entry/exit of a network."},
{t:"internet",zh:"互联网（网络互联）",ch:4,def:"A network of networks; lowercase i is the general concept, uppercase Internet is the global one.",exam:"Routers connect autonomous networks into an internet."},
{t:"ISP",zh:"互联网服务提供商",ch:4,def:"Internet service provider: an organization that builds and maintains access to the Internet.",exam:"Tier-1 backbone, tier-2 regional, tier-3 access."},
{t:"end system",zh:"终端系统",ch:4,def:"A device connected to an access ISP; also called a host.",exam:"Laptops, phones, cameras, appliances."},
{t:"hot spot",zh:"热点",ch:4,def:"The area covered by an access point or group of access points.",exam:"Often public or free Wi-Fi."},
{t:"last mile problem",zh:"最后一公里问题",ch:4,def:"The performance bottleneck caused by legacy analog links between providers and homes.",exam:"Modern digital backbones still end in old local loops."},
{t:"IP address",zh:"IP 地址",ch:4,def:"A 32-bit (IPv4) or 128-bit (IPv6) unique identifier for a device on an internet.",exam:"IPv4 is written in dotted decimal, e.g. 192.207.177.133."},
{t:"dotted decimal notation",zh:"点分十进制",ch:4,def:"Writing an IPv4 address as four decimal bytes separated by periods.",exam:"Each byte is 0–255."},
{t:"IPv6",zh:"第六版互联网协议",ch:4,def:"The 128-bit version of IP, created to overcome IPv4 address exhaustion.",exam:"Much larger address space."},
{t:"domain name",zh:"域名",ch:4,def:"A mnemonic name for a host, such as www.scau.edu.cn.",exam:"Translated to an IP address by DNS."},
{t:"top-level domain",zh:"顶级域名",ch:4,def:"The last part of a domain name, such as .cn, .edu, or .com.",exam:"Managed within the DNS hierarchy."},
{t:"DNS",zh:"域名系统",ch:4,def:"The distributed system that translates domain names into IP addresses.",exam:"A DNS lookup returns the IP before a connection is made."},
{t:"name server",zh:"域名服务器",ch:4,def:"A server that answers DNS queries by returning IP addresses for names.",exam:"Part of the distributed DNS database."},
{t:"URL",zh:"统一资源定位符",ch:4,def:"A unique address of a Web document: protocol, server, directory path, and document name.",exam:"Be ready to split a URL into four parts."},
{t:"HTTP",zh:"超文本传输协议",ch:4,def:"The protocol used by browsers and Web servers to transfer Web documents.",exam:"HTTPS adds encryption via SSL/TLS."},
{t:"HTML",zh:"超文本标记语言",ch:4,def:"A tag-based language describing the structure and links of a Web document.",exam:"Tags include h1, p, a href, img src."},
{t:"XML",zh:"可扩展标记语言",ch:4,def:"A meta-language for defining markup languages, allowing custom tags for structured data.",exam:"Unlike HTML, it does not have a fixed tag set."},
{t:"hypertext",zh:"超文本",ch:4,def:"Text containing links to other documents.",exam:"The basis of the World Wide Web."},
{t:"client-server",zh:"客户机/服务器",ch:4,def:"A model in which one server provides service to many clients, and clients initiate requests.",exam:"Server runs continuously; clients are many."},
{t:"peer-to-peer",zh:"对等网络",ch:4,def:"A model in which processes communicate as equals, each providing and receiving service.",exam:"Peers may be short-lived; used in messaging and file sharing."},
{t:"distributed system",zh:"分布式系统",ch:4,def:"A system whose parts run on different computers and cooperate over a network.",exam:"Cluster, grid, and cloud computing are examples."},
{t:"cloud computing",zh:"云计算",ch:4,def:"On-demand access to computing resources over a network, often billed by use.",exam:"Example: Amazon EC2, Google Drive."},
{t:"malware",zh:"恶意软件",ch:4,def:"Software designed to harm or exploit a system, including viruses, worms, Trojans, spyware, and phishing software.",exam:"Classify by propagation and payload."},
{t:"virus",zh:"病毒",ch:4,def:"Malware that attaches itself to a host program and spreads when the host runs.",exam:"Requires a host; contrast with a worm."},
{t:"worm",zh:"蠕虫",ch:4,def:"Self-replicating malware that spreads over a network without a host program.",exam:"Exploits network services and vulnerabilities."},
{t:"Trojan horse",zh:"特洛伊木马",ch:4,def:"Malware disguised as a useful program that hides malicious behavior.",exam:"Relies on user deception."},
{t:"phishing",zh:"网络钓鱼",ch:4,def:"Using fake messages or websites to trick users into revealing credentials.",exam:"A social-engineering attack."},
{t:"denial of service",zh:"拒绝服务",ch:4,def:"An attack that floods a service so legitimate users cannot use it.",exam:"Abbreviated DoS; distributed version is DDoS."},
{t:"firewall",zh:"防火墙",ch:4,def:"A security device that filters incoming and outgoing network traffic.",exam:"Can block ports, addresses, or protocols."},
{t:"proxy server",zh:"代理服务器",ch:4,def:"A server that acts on behalf of clients, often caching content and hiding internal addresses.",exam:"A defense and performance tool."},
{t:"public-key encryption",zh:"公钥加密",ch:4,def:"Encryption in which the recipient's public key encrypts and the private key decrypts.",exam:"Solves key distribution; used in HTTPS."},
{t:"private key",zh:"私钥",ch:4,def:"The secret key used to decrypt messages encrypted with the corresponding public key.",exam:"Never distributed; also used to sign."},
{t:"digital signature",zh:"数字签名",ch:4,def:"A cryptographic technique that proves the origin and integrity of a message.",exam:"Often created with the sender's private key and verified with the public key."},
{t:"certificate authority",zh:"认证机构",ch:4,def:"A trusted organization that issues digital certificates binding a public key to an identity.",exam:"Part of the HTTPS trust chain."},

/* ---- Ch5 ---- */
{t:"primitive",zh:"原语",ch:5,def:"A basic building block from which algorithm representations are constructed.",exam:"Each primitive has syntax and semantics."},
{t:"syntax",zh:"语法",ch:5,def:"The symbolic form of a primitive or statement.",exam:"Syntax is about form; semantics is about meaning."},
{t:"semantics",zh:"语义",ch:5,def:"The meaning of a primitive or statement.",exam:"Two statements can have the same semantics but different syntax."},
{t:"pseudocode",zh:"伪代码",ch:5,def:"A language-independent notation using structured keywords and indentation to describe algorithms.",exam:"Preferred in exams: precise but not tied to a language."},
{t:"flowchart",zh:"流程图",ch:5,def:"A diagram of an algorithm using boxes and arrows for steps and control flow.",exam:"Good for visualizing branches and loops."},
{t:"assignment",zh:"赋值",ch:5,def:"A statement that stores the value of an expression into a variable.",exam:"Form: name = expression."},
{t:"conditional selection",zh:"条件选择",ch:5,def:"A control structure that executes one of two branches depending on a condition.",exam:"if / else."},
{t:"iteration",zh:"迭代",ch:5,def:"Repeated execution of a block of statements.",exam:"Implemented by while or repeat-until."},
{t:"pre-test loop",zh:"先测试循环",ch:5,def:"A loop that tests its condition before executing the body, so the body may run zero times.",exam:"while loop."},
{t:"post-test loop",zh:"后测试循环",ch:5,def:"A loop that executes its body before testing the condition, so the body runs at least once.",exam:"repeat-until loop."},
{t:"sequential search",zh:"顺序查找",ch:5,def:"Searching a list by examining entries one by one from the beginning.",exam:"Θ(n); works on unsorted lists."},
{t:"binary search",zh:"二分查找",ch:5,def:"Searching a sorted list by comparing the target with the middle entry and discarding half.",exam:"Θ(log₂ n); list must be sorted."},
{t:"insertion sort",zh:"插入排序",ch:5,def:"Sorting by removing each entry and inserting it into its correct position among the already sorted entries.",exam:"Θ(n²) worst and average; Θ(n) best."},
{t:"recursion",zh:"递归",ch:5,def:"A technique in which a function calls itself on a smaller version of the problem.",exam:"Needs a base case and progress toward it."},
{t:"base case",zh:"基例",ch:5,def:"The condition under which a recursive function stops calling itself.",exam:"Without it, recursion never terminates."},
{t:"big theta",zh:"Θ 记号",ch:5,def:"A notation for an algorithm's growth class, ignoring constant factors and lower-order terms.",exam:"3n² + 5n is Θ(n²)."},
{t:"best case",zh:"最好情况",ch:5,def:"The input arrangement that causes the fewest operations.",exam:"Insertion sort on an already sorted list is Θ(n)."},
{t:"worst case",zh:"最坏情况",ch:5,def:"The input arrangement that causes the most operations.",exam:"Insertion sort on a reverse-ordered list is Θ(n²)."},
{t:"assertion",zh:"断言",ch:5,def:"A statement that is claimed to be true at a particular point in a program.",exam:"Used in correctness proofs."},
{t:"precondition",zh:"前置条件",ch:5,def:"A condition that must hold before a program unit executes.",exam:"If it fails, the unit's behavior is not guaranteed."},
{t:"loop invariant",zh:"循环不变式",ch:5,def:"A condition that is true before and after every iteration of a loop.",exam:"Used to prove that a loop computes the intended result."},
{t:"stepwise refinement",zh:"逐步细化",ch:5,def:"A top-down design technique that repeatedly decomposes a problem into smaller subproblems.",exam:"A standard algorithm-discovery heuristic."},

/* ---- Ch6 ---- */
{t:"assembly language",zh:"汇编语言",ch:6,def:"A second-generation language using mnemonic op-codes and symbolic addresses.",exam:"One-to-one with machine instructions; translated by an assembler."},
{t:"assembler",zh:"汇编程序",ch:6,def:"A program that translates assembly language into machine language.",exam:"One assembly instruction → one machine instruction."},
{t:"compiler",zh:"编译器",ch:6,def:"A program that translates a high-level language into machine language.",exam:"One high-level statement may become many machine instructions."},
{t:"interpreter",zh:"解释器",ch:6,def:"A program that executes source code directly without producing a separate object file.",exam:"Python is often interpreted."},
{t:"high-level language",zh:"高级语言",ch:6,def:"A third-generation language with machine-independent primitives such as if, while, and functions.",exam:"Examples: FORTRAN, COBOL, C, Java, Python."},
{t:"imperative paradigm",zh:"命令式范式",ch:6,def:"A programming style that describes computation as statements that change state.",exam:"C and procedural Python are imperative."},
{t:"functional paradigm",zh:"函数式范式",ch:6,def:"A style that treats computation as the evaluation and composition of functions.",exam:"Lisp and Scheme are examples."},
{t:"object-oriented paradigm",zh:"面向对象范式",ch:6,def:"A style that organizes computation around objects that combine data and methods.",exam:"Java and C++ are examples."},
{t:"declarative paradigm",zh:"声明式范式",ch:6,def:"A style that describes what is true or desired rather than how to compute it step by step.",exam:"Prolog and SQL are declarative."},
{t:"data type",zh:"数据类型",ch:6,def:"A classification of data specifying its possible values and operations.",exam:"Integer, real, character, Boolean."},
{t:"array",zh:"数组",ch:6,def:"A block of homogeneous elements accessed by index.",exam:"In C-like languages indices start at 0."},
{t:"aggregate",zh:"聚合（结构体）",ch:6,def:"A block of data items that may have different types or sizes, accessed by field name.",exam:"Also called a struct or record."},
{t:"field",zh:"域",ch:6,def:"One data item within an aggregate.",exam:"Accessed by name, e.g. Employee.Age."},
{t:"control statement",zh:"控制语句",ch:6,def:"A statement that changes the order of execution, such as if, while, for, or switch.",exam:"Contrast with assignment and declaration."},
{t:"comment",zh:"注释",ch:6,def:"Explanatory text in a program that is ignored by the compiler.",exam:"For human readers; does not affect execution."},
{t:"subprogram",zh:"子程序",ch:6,def:"A named unit of code that can be called to perform a task.",exam:"Also called procedure, function, subroutine, or method."},
{t:"local variable",zh:"局部变量",ch:6,def:"A variable declared inside a function and visible only there.",exam:"Created on call, destroyed on return."},
{t:"global variable",zh:"全局变量",ch:6,def:"A variable visible both inside and outside functions.",exam:"Convenient but risky; harder to debug."},
{t:"formal parameter",zh:"形式参数",ch:6,def:"A parameter name in a function definition.",exam:"Receives the value or reference supplied by an actual parameter."},
{t:"actual parameter",zh:"实际参数",ch:6,def:"The value or variable supplied at a function call.",exam:"Also called an argument."},
{t:"pass by value",zh:"按值传递",ch:6,def:"Passing a copy of a value to a function, so the caller's variable cannot be changed.",exam:"Safer; changes remain local."},
{t:"pass by reference",zh:"按引用传递",ch:6,def:"Passing the address of a variable so the function can modify the caller's value.",exam:"More efficient for large objects; used to return multiple results."},
{t:"fruitful function",zh:"有返回值的函数",ch:6,def:"A function that returns a value.",exam:"Contrast with a void function."},
{t:"void function",zh:"无返回值函数",ch:6,def:"A function that does not return a value; also called a procedure.",exam:"Produces side effects such as printing."},
{t:"lexical analysis",zh:"词法分析",ch:6,def:"The translation phase that converts a character stream into tokens.",exam:"First phase of compilation."},
{t:"parsing",zh:"语法分析",ch:6,def:"The translation phase that checks syntax and builds a parse tree.",exam:"Second phase of compilation."},
{t:"code generation",zh:"代码生成",ch:6,def:"The translation phase that produces target machine instructions from the parse tree.",exam:"Third phase of compilation."},
{t:"syntax diagram",zh:"语法图",ch:6,def:"A diagram that describes the legal structure of statements in a language.",exam:"Used to define grammar visually."},
{t:"parse tree",zh:"语法树",ch:6,def:"A tree representing the syntactic structure of a statement.",exam:"Different trees for the same string indicate ambiguity."},
{t:"ambiguity",zh:"歧义",ch:6,def:"The situation in which one statement has more than one valid parse tree.",exam:"Dangling else is the classic example."},
{t:"object",zh:"对象",ch:6,def:"A program unit that combines data and the methods that operate on that data.",exam:"An instance of a class."},
{t:"class",zh:"类",ch:6,def:"A template from which objects are constructed.",exam:"Defines instance variables, methods, and constructors."},
{t:"instance",zh:"实例",ch:6,def:"An object created from a class.",exam:"Laser1 is an instance of LaserClass."},
{t:"instance variable",zh:"实例变量",ch:6,def:"A variable that belongs to an object and holds its state.",exam:"Each object has its own copy."},
{t:"method",zh:"方法",ch:6,def:"A procedure defined within an object or class.",exam:"Describes an action the object can perform."},
{t:"constructor",zh:"构造器",ch:6,def:"A special method that initializes a new object when it is created.",exam:"Often sets initial values of instance variables."},
{t:"encapsulation",zh:"封装",ch:6,def:"Restricting access to an object's internal components, exposing only a controlled interface.",exam:"Private data, public methods."},
{t:"inheritance",zh:"继承",ch:6,def:"Defining a new class in terms of an existing class, reusing its members.",exam:"RechargeableLaser extends LaserClass."},
{t:"polymorphism",zh:"多态",ch:6,def:"The ability of the same method call to behave differently depending on the object that receives it.",exam:"A draw() call draws a square or a circle depending on the object."},
{t:"thread",zh:"线程",ch:6,def:"A single sequence of execution within a process.",exam:"Threads share the process's data, so access must be synchronized."},
{t:"monitor",zh:"监控程序",ch:6,def:"A data item combined with the ability to control access to itself.",exam:"A high-level synchronization construct."},
{t:"resolution",zh:"消解",ch:6,def:"A declarative inference rule that combines two clauses to produce a new clause.",exam:"(P OR Q) and (R OR ¬Q) resolve to (P OR R)."},
{t:"Prolog",zh:"Prolog 语言",ch:6,def:"A logic programming language based on facts and rules.",exam:"Rule form: conclusion :- premise."},
{t:"fact",zh:"事实",ch:6,def:"A Prolog statement asserting a relationship, e.g. parent(bill, mary).",exam:"A single predicate with arguments."},
{t:"rule",zh:"规则",ch:6,def:"A Prolog statement of the form conclusion :- premise, meaning the conclusion holds if the premise holds.",exam:":- is read as “if”."},

/* ---- Ch7 ---- */
{t:"software engineering",zh:"软件工程",ch:7,def:"The branch of computer science that seeks principles to guide the development of large, complex software systems.",exam:"Definition question: large, complex, principles."},
{t:"software life cycle",zh:"软件生命周期",ch:7,def:"The stages a software product goes through: development, use, and maintenance.",exam:"Development = requirements, design, implementation, testing."},
{t:"requirements",zh:"需求",ch:7,def:"Application-oriented descriptions of what the user needs.",exam:"Contrast with technically oriented specifications."},
{t:"specification",zh:"规格说明",ch:7,def:"A technically precise description of system behavior, used for design and acceptance.",exam:"Translates requirements into technical terms."},
{t:"waterfall model",zh:"瀑布模型",ch:7,def:"A development model that proceeds through phases in one direction.",exam:"Assumes stable requirements; hard to revisit earlier phases."},
{t:"incremental model",zh:"增量模型",ch:7,def:"A model that builds the system in increments, each adding features.",exam:"Delivers working subsets earlier."},
{t:"iterative model",zh:"迭代模型",ch:7,def:"A model that repeatedly refines each version of the product.",exam:"Related to but distinct from incremental."},
{t:"prototyping",zh:"原型开发",ch:7,def:"Building an incomplete version of a system to clarify requirements or explore design.",exam:"Evolutionary vs throwaway."},
{t:"evolutionary prototyping",zh:"演化式原型",ch:7,def:"Prototyping in which the prototype evolves into the final product.",exam:"Contrast with throwaway prototyping."},
{t:"throwaway prototyping",zh:"抛弃式原型",ch:7,def:"Prototyping in which the prototype is discarded and the final system is reimplemented.",exam:"Used to clarify requirements or demonstrate interaction."},
{t:"open-source development",zh:"开源开发",ch:7,def:"A development model in which source code is published and improved by a community.",exam:"Linux is the classic example."},
{t:"extreme programming",zh:"极限编程",ch:7,def:"An agile methodology using small teams, shared workspace, frequent feedback, and continuous testing.",exam:"Abbreviated XP; belongs to incremental/iterative approaches."},
{t:"modularity",zh:"模块化",ch:7,def:"Dividing a system into independent modules with well-defined interfaces.",exam:"Goal: low coupling, high cohesion."},
{t:"coupling",zh:"耦合",ch:7,def:"The degree of linkage between modules.",exam:"Lower is better; control and data coupling are types."},
{t:"cohesion",zh:"内聚",ch:7,def:"The degree of relatedness among the internal parts of a module.",exam:"Higher is better; functional cohesion is strongest."},
{t:"control coupling",zh:"控制耦合",ch:7,def:"Coupling that occurs when one module passes control to another, as in a function call.",exam:"A form of coupling to minimize."},
{t:"data coupling",zh:"数据耦合",ch:7,def:"Coupling that occurs when modules share the same data item.",exam:"Changes to the data format can affect both modules."},
{t:"logical cohesion",zh:"逻辑内聚",ch:7,def:"Weak cohesion in which a module's parts perform logically similar activities.",exam:"Example: a module that handles all input regardless of type."},
{t:"functional cohesion",zh:"功能内聚",ch:7,def:"Strong cohesion in which all parts of a module focus on a single activity.",exam:"The most desirable form of cohesion."},
{t:"information hiding",zh:"信息隐藏",ch:7,def:"Restricting knowledge of a module's internal structure to the module itself.",exam:"Supports abstraction and safe modification."},
{t:"component",zh:"构件",ch:7,def:"A reusable unit of software, often a collection of objects.",exam:"Component architecture assembles systems from prefabricated components."},
{t:"data flow diagram",zh:"数据流图",ch:7,def:"A diagram showing how data moves through processes, stores, and external entities.",exam:"An analysis/design tool."},
{t:"entity-relationship diagram",zh:"实体联系图",ch:7,def:"A diagram showing entities and their relationships, including 1:1, 1:N, and M:N.",exam:"Used in database and system design."},
{t:"data dictionary",zh:"数据字典",ch:7,def:"A central repository of metadata about every data item in a system.",exam:"Includes name, type, range, storage, and references."},
{t:"UML",zh:"统一建模语言",ch:7,def:"A family of modeling notations for object-oriented design, including use case, class, and sequence diagrams.",exam:"Know which diagram shows what."},
{t:"use case diagram",zh:"用例图",ch:7,def:"A UML diagram showing actors and the use cases they perform with the system.",exam:"Views the system from the outside."},
{t:"class diagram",zh:"类图",ch:7,def:"A UML diagram showing classes, their members, and associations.",exam:"Static structure; multiplicities and generalizations."},
{t:"sequence diagram",zh:"序列图",ch:7,def:"A UML interaction diagram showing the order of messages among objects over time.",exam:"Dynamic behavior; lifelines."},
{t:"CRC card",zh:"类-职责-协作卡",ch:7,def:"A card describing a class's responsibilities and collaborators, used in design walkthroughs.",exam:"Not part of UML."},
{t:"design pattern",zh:"设计模式",ch:7,def:"A reusable template for solving a recurring design problem.",exam:"Adapter and Decorator are examples."},
{t:"glass-box testing",zh:"白盒测试",ch:7,def:"Testing that uses knowledge of the software's internal structure.",exam:"Also called white-box; basis path testing is an example."},
{t:"black-box testing",zh:"黑盒测试",ch:7,def:"Testing from the user's point of view without knowledge of internal structure.",exam:"Boundary value and beta testing are examples."},
{t:"basis path testing",zh:"基本路径测试",ch:7,def:"A glass-box strategy that designs test data so every instruction executes at least once.",exam:"Coverage-oriented."},
{t:"boundary value analysis",zh:"边界值分析",ch:7,def:"Testing values at the edges of equivalence classes rather than in the middle.",exam:"For range 1–100, test 0, 1, 100, 101."},
{t:"alpha testing",zh:"α 测试",ch:7,def:"Testing performed at the developer's site before release.",exam:"Contrast with beta testing at user sites."},
{t:"beta testing",zh:"β 测试",ch:7,def:"Giving a preliminary version to real users to evaluate it before final release.",exam:"A black-box strategy."},
{t:"Pareto principle",zh:"帕累托原则",ch:7,def:"The observation that a small portion of causes produces most effects; in testing, focus on error-prone modules.",exam:"Concentrate testing where defects cluster."},
{t:"user documentation",zh:"用户文档",ch:7,def:"Documentation explaining features and how to use the software for end users.",exam:"Application-oriented language."},
{t:"system documentation",zh:"系统文档",ch:7,def:"Documentation describing internal composition so the software can be maintained.",exam:"Includes source code and design documents."},
{t:"technical documentation",zh:"技术文档",ch:7,def:"Documentation describing installation, configuration, updates, and problem reporting.",exam:"For installers and operators."},
{t:"copyright",zh:"版权",ch:7,def:"Legal protection of the expression of a work, asserted automatically.",exam:"Covers specifications, source code, and final product."},
{t:"software license",zh:"软件许可证",ch:7,def:"A legal agreement granting permissions without transferring ownership.",exam:"Defines how the software may be used or redistributed."},
{t:"patent",zh:"专利",ch:7,def:"Legal protection for an invention that is new, useful, and non-obvious.",exam:"Expensive and slow to obtain."},

/* ---- Ch8 ---- */
{t:"list",zh:"列表",ch:8,def:"A collection of data entries arranged sequentially.",exam:"Has a head (first entry) and a tail (last entry)."},
{t:"head",zh:"表头",ch:8,def:"The first entry of a list or the top of a stack.",exam:"In a stack, push and pop operate at the head."},
{t:"tail",zh:"表尾",ch:8,def:"The last entry of a list or the insertion end of a queue.",exam:"Queue inserts at the tail, removes at the head."},
{t:"stack",zh:"栈",ch:8,def:"A list in which entries are inserted and removed only at the head.",exam:"LIFO; operations push and pop."},
{t:"LIFO",zh:"后进先出",ch:8,def:"Last in, first out; the discipline of a stack.",exam:"The most recently pushed item is popped first."},
{t:"push",zh:"进栈",ch:8,def:"To insert an entry at the top of a stack.",exam:"The new entry becomes the top."},
{t:"pop",zh:"出栈",ch:8,def:"To remove the entry at the top of a stack.",exam:"The most recently pushed entry is removed."},
{t:"queue",zh:"队列",ch:8,def:"A list in which entries are inserted at the tail and removed at the head.",exam:"FIFO; operations enqueue and dequeue."},
{t:"FIFO",zh:"先进先出",ch:8,def:"First in, first out; the discipline of a queue.",exam:"The earliest inserted item is removed first."},
{t:"tree",zh:"树",ch:8,def:"A collection of data entries organized hierarchically.",exam:"Root at top, leaves at bottom."},
{t:"node",zh:"结点",ch:8,def:"An entry in a tree or linked structure.",exam:"May contain data and pointers to children."},
{t:"root",zh:"根结点",ch:8,def:"The top node of a tree.",exam:"Has no parent; the entry point for traversal."},
{t:"leaf",zh:"叶子结点",ch:8,def:"A terminal node of a tree with no children.",exam:"Also called a terminal node."},
{t:"parent",zh:"父结点",ch:8,def:"The node immediately above a given node.",exam:"Its child is immediately below."},
{t:"child",zh:"孩子结点",ch:8,def:"A node immediately below a given node.",exam:"A binary tree node has at most two children."},
{t:"sibling",zh:"兄弟结点",ch:8,def:"Nodes that share the same parent.",exam:"In an array representation, siblings are at 2i and 2i+1."},
{t:"depth",zh:"深度",ch:8,def:"The number of nodes in the longest path from root to leaf.",exam:"Also described as the number of horizontal layers."},
{t:"binary tree",zh:"二叉树",ch:8,def:"A tree in which every node has at most two children.",exam:"Can be stored with pointers or in an array by level."},
{t:"binary search tree",zh:"二叉搜索树",ch:8,def:"A binary tree in which every left descendant is smaller and every right descendant is larger than the node.",exam:"Inorder traversal gives sorted order; search is Θ(log n) if balanced."},
{t:"inorder traversal",zh:"中序遍历",ch:8,def:"Traversing a binary tree by visiting the left subtree, then the root, then the right subtree.",exam:"On a BST, produces ascending order."},
{t:"pointer",zh:"指针",ch:8,def:"A storage area that contains the address of a data item.",exam:"Used to build linked lists and trees."},
{t:"null",zh:"空指针",ch:8,def:"A non-pointer value marking the end of a linked structure.",exam:"The last node's next pointer is null."},
{t:"contiguous list",zh:"顺序表",ch:8,def:"A list whose entries are stored in consecutive memory cells.",exam:"Fast index access; insertion may require shifting."},
{t:"linked list",zh:"链表",ch:8,def:"A list whose entries are connected by pointers.",exam:"Cheap insertion/deletion; sequential access only."},
{t:"static structure",zh:"静态结构",ch:8,def:"A data structure whose shape and size do not change during execution.",exam:"Easier to manage than a dynamic structure."},
{t:"dynamic structure",zh:"动态结构",ch:8,def:"A data structure whose shape or size changes as entries are added or removed.",exam:"Requires memory allocation and pointer maintenance."},
{t:"circular queue",zh:"循环队列",ch:8,def:"A queue implementation that reuses its storage block by wrapping the tail back to the beginning.",exam:"Prevents the queue from crawling out of its allotted space."},
{t:"abstract data type",zh:"抽象数据类型",ch:8,def:"A user-defined data type including data and operations, with implementation hidden behind an interface.",exam:"StackType is an example."},
{t:"immediate addressing",zh:"立即寻址",ch:8,def:"An addressing mode in which the instruction contains the data value itself.",exam:"MOV AH, 80H where 80H is the value."},
{t:"direct addressing",zh:"直接寻址",ch:8,def:"An addressing mode in which the instruction contains the address of the data.",exam:"The operand field points to the memory cell."},
{t:"indirect addressing",zh:"间接寻址",ch:8,def:"An addressing mode in which the instruction contains the address of an address.",exam:"Adds a level of indirection, enabling pointers."},

/* ---- Ch9 ---- */
{t:"database",zh:"数据库",ch:9,def:"A multidimensional collection of data whose internal links make it accessible from many perspectives.",exam:"Contrast with a flat file."},
{t:"DBMS",zh:"数据库管理系统",ch:9,def:"A software layer that manipulates a database in response to application requests.",exam:"Applications do not manipulate the database directly."},
{t:"schema",zh:"模式",ch:9,def:"A description of the structure of an entire database.",exam:"Used by the DBMS to maintain the database."},
{t:"subschema",zh:"子模式",ch:9,def:"A description of only the portion of a database relevant to a particular user.",exam:"Prevents unauthorized access to sensitive data."},
{t:"data independence",zh:"数据独立性",ch:9,def:"The ability to change a database's organization without changing the application software.",exam:"A key advantage of using a DBMS."},
{t:"distributed database",zh:"分布式数据库",ch:9,def:"A database stored on multiple machines, with the distribution hidden from users.",exam:"DBMS masks the organizational detail."},
{t:"relational model",zh:"关系模型",ch:9,def:"A database model that represents data as rectangular tables (relations).",exam:"Relation, attribute, tuple = table, column, row."},
{t:"relation",zh:"关系",ch:9,def:"A rectangular table in the relational model.",exam:"Each row is a tuple; each column an attribute."},
{t:"attribute",zh:"属性",ch:9,def:"A column of a relation.",exam:"Describes one property of the entities."},
{t:"tuple",zh:"元组",ch:9,def:"A row of a relation.",exam:"One record or entity instance."},
{t:"redundancy",zh:"冗余",ch:9,def:"Unnecessary repetition of data, often caused by combining multiple concepts in one relation.",exam:"Leads to update anomalies and wasted space."},
{t:"decomposition",zh:"分解",ch:9,def:"Dividing the columns of a relation into two or more relations while preserving relationships.",exam:"Must be lossless."},
{t:"lossless decomposition",zh:"无损分解",ch:9,def:"A decomposition that does not lose information when the relations are joined back.",exam:"A correct decomposition."},
{t:"select operation",zh:"选择运算",ch:9,def:"The relational operation that chooses rows satisfying a condition.",exam:"σ; SQL WHERE."},
{t:"project operation",zh:"投影运算",ch:9,def:"The relational operation that chooses columns.",exam:"π; SQL SELECT list."},
{t:"join",zh:"连接",ch:9,def:"A relational operation that combines information from two or more relations using a common attribute.",exam:"⨝; SQL JOIN … ON."},
{t:"SQL",zh:"结构化查询语言",ch:9,def:"The standard language for querying and modifying relational databases.",exam:"SELECT, INSERT, UPDATE, DELETE."},
{t:"transaction",zh:"事务",ch:9,def:"A sequence of operations that must all happen together or not at all.",exam:"Example: transferring money between accounts."},
{t:"transaction log",zh:"事务日志",ch:9,def:"A non-volatile record of a transaction's activities, written before execution.",exam:"Used to redo or roll back after a failure."},
{t:"commit point",zh:"提交点",ch:9,def:"The point at which a transaction has been recorded in the log.",exam:"After it, the transaction is committed."},
{t:"rollback",zh:"回滚",ch:9,def:"Undoing a transaction's changes.",exam:"Restores the database to its previous consistent state."},
{t:"lost update",zh:"丢失更新",ch:9,def:"A concurrency problem in which one transaction overwrites another's update.",exam:"Solved by locking."},
{t:"shared lock",zh:"共享锁",ch:9,def:"A lock allowing concurrent reads but preventing writes.",exam:"Used when reading data."},
{t:"exclusive lock",zh:"排他锁",ch:9,def:"A lock allowing only one transaction to access an item, for reading or writing.",exam:"Used when modifying data."},
{t:"sequential file",zh:"顺序文件",ch:9,def:"A file whose contents can only be read in order.",exam:"Records sorted by a key field; good for batch updates."},
{t:"index",zh:"索引",ch:9,def:"A list of key values and the locations of their associated records.",exam:"Speeds lookup but must be maintained."},
{t:"hashing",zh:"散列",ch:9,def:"A technique that computes a record's bucket directly from its key.",exam:"Avoids index lookup; collisions must be handled."},
{t:"hash function",zh:"散列函数",ch:9,def:"A function that converts a key into a bucket number.",exam:"A good function distributes keys uniformly."},
{t:"bucket",zh:"桶",ch:9,def:"A storage section holding several records in a hashing system.",exam:"Records are dispersed among buckets by the hash function."},
{t:"collision",zh:"碰撞",ch:9,def:"The case in which two keys hash to the same bucket.",exam:"More frequent when the table is over about 75% full."},
{t:"rehash",zh:"重新散列",ch:9,def:"Increasing the number of buckets and redistributing all records.",exam:"The usual remedy for excessive collisions."},
{t:"data mining",zh:"数据挖掘",ch:9,def:"The area of computer science that discovers patterns in collections of data.",exam:"Techniques include clustering, association, and outlier analysis."},
{t:"data warehouse",zh:"数据仓库",ch:9,def:"A static collection of data prepared for mining.",exam:"Separate from operational databases."},
{t:"data cube",zh:"数据立方体",ch:9,def:"Data presented from many perspectives to enable mining.",exam:"Multidimensional view."},
{t:"cluster analysis",zh:"聚类分析",ch:9,def:"A data-mining strategy that groups similar items together.",exam:"Used for segmentation and pattern discovery."},
{t:"association analysis",zh:"关联分析",ch:9,def:"A data-mining strategy that finds items that frequently occur together.",exam:"Market-basket analysis is an example."},
{t:"outlier analysis",zh:"孤立点分析",ch:9,def:"A data-mining strategy that identifies unusual data points.",exam:"Useful for fraud or anomaly detection."},

/* ---- Ch12 ---- */
{t:"computable function",zh:"可计算函数",ch:12,def:"A function for which an algorithm exists that produces the correct output for every input.",exam:"Equivalently, a Turing-computable function."},
{t:"noncomputable function",zh:"不可计算函数",ch:12,def:"A function that cannot be computed by any algorithm.",exam:"Its existence is proved; the halting problem is one example."},
{t:"Turing machine",zh:"图灵机",ch:12,def:"A theoretical computing device with a tape, a read/write head, states, and transition rules.",exam:"Each step: write, move, change state."},
{t:"Turing computable",zh:"图灵可计算的",ch:12,def:"A function that can be computed by a Turing machine.",exam:"Believed to coincide with algorithmically computable."},
{t:"Church-Turing thesis",zh:"丘奇-图灵论题",ch:12,def:"The thesis that Turing-computable functions are exactly the functions computable by any algorithmic means.",exam:"A foundational claim, not a theorem to prove."},
{t:"universal programming language",zh:"通用编程语言",ch:12,def:"A language in which any Turing-computable function can be expressed.",exam:"Most practical languages are universal."},
{t:"Bare Bones",zh:"Bare Bones 语言",ch:12,def:"A minimal universal language with clear, incr, decr, and while statements.",exam:"Used to show that universal computation needs very little."},
{t:"halting problem",zh:"停机问题",ch:12,def:"The problem of deciding whether an arbitrary program eventually halts on a given input.",exam:"Proved unsolvable by contradiction."},
{t:"time complexity",zh:"时间复杂度",ch:12,def:"The number of instruction executions required by an algorithm as a function of input size.",exam:"Usually the default meaning of “complexity”."},
{t:"big O",zh:"大 O 记号",ch:12,def:"A notation for an upper bound on a function's growth.",exam:"A problem in O(f(n)) has a solution in Θ(f(n)), possibly better."},
{t:"class P",zh:"P 类问题",ch:12,def:"The class of problems solvable by a deterministic algorithm in polynomial time.",exam:"Sorting and searching are in P."},
{t:"class NP",zh:"NP 类问题",ch:12,def:"The class of problems solvable by a nondeterministic algorithm in polynomial time, or verifiable in polynomial time.",exam:"P ⊆ NP; equality is unknown."},
{t:"NP-complete",zh:"NP 完全",ch:12,def:"A class of problems in NP to which every NP problem can be reduced; a polynomial solution to one solves all.",exam:"Traveling salesperson is a classic example."},
{t:"traveling salesperson problem",zh:"旅行商问题",ch:12,def:"Finding a minimum-length tour that visits each city once and returns to the start.",exam:"No known polynomial-time algorithm; NP-complete."},
{t:"merge sort",zh:"归并排序",ch:12,def:"A recursive sorting algorithm that splits the list, sorts each half, and merges them.",exam:"Θ(n log n)."},
{t:"public key",zh:"公钥",ch:12,def:"The key distributed openly and used to encrypt messages.",exam:"In RSA, the pair (n, e)."},

pairs:[
 {a:"RAM",b:"ROM",diff:"RAM can be read and written, and is volatile; ROM is read-only and non-volatile.",trap:"ROM is not “random access”? It is random access too; the distinction is writability."},
 {a:"Volatile",b:"Non-volatile",diff:"Volatile loses data without power (RAM, DRAM); non-volatile keeps it (ROM, disk, flash, SSD).",trap:"Cache is volatile even though it is fast and expensive."},
 {a:"Two's complement",b:"Excess notation",diff:"Two's complement uses the sign bit and complements negatives; excess adds a fixed bias.",trap:"In excess-8, zero is 1000, not 0000."},
 {a:"Overflow",b:"Truncation",diff:"Overflow: value too large for the range; truncation: value cannot be represented exactly and low bits are dropped.",trap:"Overflow wraps to the other end; truncation loses precision, not range."},
 {a:"Lossy",b:"Lossless",diff:"Lossy discards information (JPEG, MP3); lossless reconstructs exactly (RLE, Huffman, LZW).",trap:"GIF is lossless; JPEG is lossy, even though both are image formats."},
 {a:"Parity bit",b:"Hamming code",diff:"Parity detects an odd number of errors; a code with distance ≥3 can correct one bit.",trap:"Parity cannot locate the flipped bit, so it cannot correct."},
 {a:"RISC",b:"CISC",diff:"RISC: few simple fixed-length instructions, heavy pipelining; CISC: many complex instructions.",trap:"RISC does not mean “fewer total instructions executed”; it means a smaller instruction set."},
 {a:"Data bus",b:"Address bus",diff:"Data bus carries contents; address bus selects the location.",trap:"Address bus width determines maximum memory; data bus width affects word size/throughput."},
 {a:"Cache",b:"Main memory",diff:"Cache is small, fast, inside/near the CPU; main memory is larger, slower, and off-chip.",trap:"Both are volatile; cache is not a disk cache in this context."},
 {a:"Pipelining",b:"Parallel processing",diff:"Pipelining overlaps stages of different instructions; parallel processing uses multiple processors.",trap:"Pipelining increases throughput but not the latency of one instruction."},
 {a:"Program",b:"Process",diff:"Program is static code; process is a dynamic execution with state.",trap:"One program can have many processes."},
 {a:"Scheduler",b:"Dispatcher",diff:"Scheduler chooses which process runs; dispatcher allocates the time slice and switches context.",trap:"The scheduler does not decide how long; the dispatcher does."},
 {a:"Batch",b:"Time-sharing",diff:"Batch runs queued jobs without interaction; time-sharing switches among users to provide interaction.",trap:"Time-sharing is not true simultaneous execution on a single CPU."},
 {a:"CSMA/CD",b:"CSMA/CA",diff:"Ethernet detects collisions after they happen; Wi-Fi avoids them because it cannot reliably detect them.",trap:"Hidden terminal is a wireless problem, so CSMA/CD is unsuitable for Wi-Fi."},
 {a:"Bridge",b:"Router",diff:"Bridge connects compatible networks and forwards by link address; router connects incompatible networks and forwards by IP.",trap:"A switch is essentially a multi-port bridge, not a router."},
 {a:"TCP",b:"UDP",diff:"TCP is connection-oriented, acknowledged, and reliable; UDP is connectionless, unacknowledged, and unreliable.",trap:"UDP is not “bad”; it is preferred for real-time traffic where latency matters more than reliability."},
 {a:"IPv4",b:"IPv6",diff:"IPv4 uses 32-bit addresses in dotted decimal; IPv6 uses 128-bit addresses.",trap:"IPv6 was created for address space, not because IPv4 cannot route."},
 {a:"Circuit switching",b:"Packet switching",diff:"Circuit switching reserves a path; packet switching sends independent packets that may take different routes.",trap:"Packet switching can reorder packets; TCP reassembles them."},
 {a:"Client-server",b:"Peer-to-peer",diff:"One always-on server serves many clients; peers are equal and may be short-lived.",trap:"P2P still needs some lookup/tracker infrastructure in practice."},
 {a:"Compiler",b:"Interpreter",diff:"Compiler translates the whole program to an object program; interpreter executes source directly.",trap:"Both can be used for the same language; the distinction is implementation strategy."},
 {a:"Pass by value",b:"Pass by reference",diff:"Value passes a copy; reference passes the address so changes affect the caller.",trap:"Arrays/objects in Java are references passed by value — the reference itself is copied."},
 {a:"Encapsulation",b:"Inheritance",diff:"Encapsulation hides internal state; inheritance reuses a class's members.",trap:"They are complementary, not alternatives; a class can do both."},
 {a:"Coupling",b:"Cohesion",diff:"Coupling is linkage between modules (minimize); cohesion is relatedness within a module (maximize).",trap:"“High cohesion” is good; “high coupling” is bad."},
 {a:"Black-box testing",b:"Glass-box testing",diff:"Black-box uses only inputs/outputs; glass-box uses internal structure.",trap:"Beta testing is black-box; basis path testing is glass-box."},
 {a:"Alpha testing",b:"Beta testing",diff:"Alpha is at the developer's site; beta is at user sites before release.",trap:"Both are black-box; the difference is location and audience."},
 {a:"Contiguous list",b:"Linked list",diff:"Contiguous stores entries in consecutive cells; linked connects nodes by pointers.",trap:"Linked lists are faster to insert/delete but slower to index."},
 {a:"Stack",b:"Queue",diff:"Stack is LIFO at one end; queue is FIFO with insert at tail and remove at head.",trap:"A queue removes at the head, not the tail."},
 {a:"Select (σ)",b:"Project (π)",diff:"Select chooses rows; project chooses columns.",trap:"SQL's SELECT chooses columns; do not confuse it with relational select."},
 {a:"Shared lock",b:"Exclusive lock",diff:"Shared allows concurrent reads; exclusive allows only one transaction to access the item.",trap:"An exclusive lock blocks readers too, not just writers."},
 {a:"P",b:"NP",diff:"P: solvable in polynomial time deterministically; NP: solvable in polynomial time nondeterministically, or verifiable in polynomial time.",trap:"NP does not mean “non-polynomial”. P ⊆ NP."},
 {a:"Computable",b:"Noncomputable",diff:"Computable has an algorithm; noncomputable has none at all.",trap:"“Slow” or “impractical” is not the same as noncomputable."},
 {a:"Requirements",b:"Specifications",diff:"Requirements are application-oriented; specifications are technically precise.",trap:"Requirements ask “what”; specifications describe “how the system behaves”."}

defs:[
 {ch:0,en:"An algorithm is an ordered set of unambiguous, executable steps that defines a terminating process.",zh:"算法是定义可终止过程的一组有序、无歧义、可执行的步骤。"},
 {ch:0,en:"Abstraction is the distinction between the external properties of an entity and the details of its internal composition.",zh:"抽象是把实体的外部属性与内部组成细节分离。"},
 {ch:1,en:"A bit is a binary digit, either 0 or 1. A bit pattern is a sequence of bits used to represent information.",zh:"位是二进制数字 0 或 1；位模式是用一串位表示信息。"},
 {ch:1,en:"Two's complement is a signed-integer notation in which the leftmost bit is the sign and negative values are stored as the complement of the corresponding positive value.",zh:"补码用最高位作符号位，负数存为其正数形式的补码。"},
 {ch:1,en:"Floating-point notation consists of a sign bit, a mantissa field, and an exponent field.",zh:"浮点数由符号位、尾数域和指数域组成。"},
 {ch:1,en:"A parity bit is an extra bit added so that the total number of 1s is odd or even.",zh:"校验位是额外加的一位，使 1 的总数为奇数或偶数。"},
 {ch:2,en:"The stored-program concept is the idea that instructions and data are both stored in main memory as bit patterns and can be fetched and executed by the CPU.",zh:"存储程序概念：指令和数据都以位模式存于主存，CPU 可取指并执行。"},
 {ch:2,en:"The machine cycle consists of fetch, decode, and execute.",zh:"机器周期由取指、译码、执行三个阶段组成。"},
 {ch:3,en:"A process is the activity of executing a program; its state includes the program counter, registers, and related memory.",zh:"进程是程序的一次执行，其状态包括 PC、寄存器和相关内存。"},
 {ch:3,en:"A deadlock occurs when a set of processes wait for resources held by each other in a cycle.",zh:"死锁是一组进程循环等待彼此占用资源的状态。"},
 {ch:3,en:"Virtual memory is the illusion of more main memory than physically exists, created by moving pages between main memory and mass storage.",zh:"虚拟内存通过在主存与外存之间移动页面，制造出比物理内存更大的假象。"},
 {ch:4,en:"A protocol is a set of rules governing communication between parties.",zh:"协议是管理通信双方交互的规则集合。"},
 {ch:4,en:"TCP is a connection-oriented, reliable transport protocol that uses acknowledgments and retransmission. UDP is connectionless and does not retransmit.",zh:"TCP 面向连接、可靠、有确认重传；UDP 无连接、不重传。"},
 {ch:4,en:"DNS translates mnemonic domain names into IP addresses.",zh:"DNS 把域名翻译成 IP 地址。"},
 {ch:4,en:"A URL consists of a protocol, a server address, a directory path, and a document name.",zh:"URL 由协议、服务器地址、目录路径和文档名组成。"},
 {ch:5,en:"Binary search repeatedly compares the target with the middle entry of a sorted list and discards half of the remaining entries.",zh:"二分查找把目标与有序表的中间项比较，每次舍弃一半。"},
 {ch:5,en:"Recursion is a technique in which a function calls itself on a smaller version of the problem, stopping at a base case.",zh:"递归是函数在问题的更小版本上调用自身，并在基例停止。"},
 {ch:5,en:"Big theta notation describes an algorithm's growth class, ignoring constants and lower-order terms.",zh:"Θ 记号描述算法的增长级别，忽略常数与低阶项。"},
 {ch:6,en:"A compiler translates a high-level program into machine language; an assembler translates assembly language one-to-one.",zh:"编译器把高级语言翻成机器语言；汇编器把汇编语言一一对应地翻译。"},
 {ch:6,en:"Encapsulation restricts access to an object's internal components; inheritance defines a new class in terms of an existing one; polymorphism lets the same call behave differently.",zh:"封装限制访问内部组件；继承基于已有类定义新类；多态让同一调用有不同行为。"},
 {ch:7,en:"Coupling is the degree of linkage between modules; cohesion is the degree of relatedness within a module.",zh:"耦合是模块间的联系程度；内聚是模块内部的关联程度。"},
 {ch:7,en:"Black-box testing tests behavior from the user's point of view; glass-box testing uses knowledge of internal structure.",zh:"黑盒测试从用户视角测行为；白盒测试利用内部结构知识。"},
 {ch:8,en:"A stack is a LIFO list with insertion and removal at the head; a queue is a FIFO list with insertion at the tail and removal at the head.",zh:"栈是在头部插入删除的 LIFO 表；队列是在尾部插入、头部删除的 FIFO 表。"},
 {ch:8,en:"A binary search tree is a binary tree in which every left descendant is smaller and every right descendant is larger than the node.",zh:"二叉搜索树中，左子树全部小于结点，右子树全部大于结点。"},
 {ch:9,en:"A transaction is a sequence of operations that must all happen together or not at all.",zh:"事务是一组要么全部执行、要么全部不执行的操作。"},
 {ch:9,en:"A database is a multidimensional collection of data whose internal links make it accessible from a variety of perspectives.",zh:"数据库是多维数据集合，内部链接让信息可从多角度访问。"},
 {ch:9,en:"Hashing computes a bucket number directly from a key; a collision occurs when two keys map to the same bucket.",zh:"散列直接从关键字算出桶号；两个关键字映射到同一桶叫碰撞。"},
 {ch:12,en:"A Turing machine is a theoretical device with a tape, a read/write head, states, and transition rules; each step writes, moves, and changes state.",zh:"图灵机由纸带、读写头、状态和转移规则组成；每步写、移、变状态。"},
 {ch:12,en:"The Church–Turing thesis states that Turing-computable functions are exactly the functions computable by any algorithmic means.",zh:"丘奇-图灵论题：图灵可计算函数恰好是所有算法可计算的函数。"},
 {ch:12,en:"P is the class of problems solvable in polynomial time by a deterministic algorithm; NP is the class solvable in polynomial time by a nondeterministic algorithm.",zh:"P 是确定性多项式时间可解的问题类；NP 是非确定性多项式时间可解的问题类。"},
 {ch:12,en:"RSA encryption computes c = m^e mod n; decryption computes m = c^d mod n.",zh:"RSA 加密 c = mᵉ mod n；解密 m = cᵈ mod n。"}
],

{id:"c9",ch:9,type:"chapter",title:"Chapter 9 · Database Systems",mins:8,tag:"关系模型、SQL、事务锁与散列。",qs:[
 {q:"In the relational model, a row is called a …",o:["relation","attribute","tuple","field"],a:2,s:"Relation = table, attribute = column, tuple = row."},
 {q:"A subschema is used to …",o:["describe the whole database","restrict a user’s view to the relevant portion","speed up hashing","store backups"],a:1,s:"Subschemas prevent unauthorized access to sensitive data."},
 {q:"Which relational operation chooses rows satisfying a condition?",o:["Project","Select","Join","Union"],a:1,s:"Select (σ) chooses rows; project (π) chooses columns."},
 {q:"Which relational operation chooses columns?",o:["Select","Project","Join","Insert"],a:1,s:"Project (π) returns a subset of attributes."},
 {q:"Which operation combines information from two relations using a common attribute?",o:["Select","Project","Join","Delete"],a:2,s:"Join (⨝) assembles a larger relation from matching tuples."},
 {q:"A transaction is a sequence of operations that …",o:["can be partially executed","must all happen together or not at all","only reads data","never uses a log"],a:1,s:"Transactions are atomic: all or nothing, with a log for redo/rollback."},
 {q:"A shared lock allows …",o:["only one transaction to read","concurrent reads but no writes","only writes","no access at all"],a:1,s:"Shared locks permit other transactions to read, but not modify, the item."},
 {q:"A hash collision occurs when …",o:["two keys map to the same bucket","a bucket is empty","a record is deleted","an index is rebuilt"],a:0,s:"Collisions become much more likely when the table is over about 75% full."},
 {q:"Compared with an index, hashing …",o:["requires more index maintenance","computes the location directly from the key","only works on sorted files","cannot handle collisions"],a:1,s:"Hashing avoids index lookup by computing a bucket number from the key."},
 {q:"A static collection of data prepared for mining is called a …",o:["data cube","data warehouse","transaction log","subschema"],a:1,s:"A data warehouse is a separate, static collection used for analysis and mining."}
]},

{id:"c12",ch:12,type:"chapter",title:"Chapter 12 · Theory of Computation",mins:9,tag:"图灵机、停机问题、P/NP 与 RSA。定义题居多。",qs:[
 {q:"At each step, a Turing machine performs which three actions?",o:["Read, compile, execute","Write, move the head, change state","Push, pop, peek","Encode, encrypt, decrypt"],a:1,s:"The machine reads the current cell and then writes, moves, and changes state."},
 {q:"The Church–Turing thesis states that …",o:["all problems are computable","Turing-computable functions are exactly the algorithmically computable functions","P equals NP","every program halts"],a:1,s:"It is a foundational thesis identifying Turing computability with algorithmic computability."},
 {q:"The halting problem is …",o:["solvable in polynomial time","unsolvable","solvable only for small programs","a hardware problem"],a:1,s:"No general algorithm can decide termination for every program/input pair; it is proved by contradiction."},
 {q:"Class P contains problems that are …",o:["solvable in polynomial time by a deterministic algorithm","verifiable but not solvable","unsolvable","exponential in all cases"],a:0,s:"P = deterministic polynomial time."},
 {q:"Class NP contains problems that are …",o:["non-polynomial","solvable in polynomial time by a nondeterministic algorithm","unsolvable","always harder than P"],a:1,s:"NP means nondeterministic polynomial time; it does not mean “non-polynomial”."},
 {q:"A problem is NP-complete if …",o:["it is in P","it is in NP and every NP problem reduces to it","it cannot be solved","it has no input"],a:1,s:"A polynomial solution to one NP-complete problem would give polynomial solutions to all NP problems."},
 {q:"The time complexity of merge sort is …",o:["Θ(n)","Θ(n log n)","Θ(n²)","Θ(2ⁿ)"],a:1,s:"Merge sort splits the list, sorts each half, and merges in linear time, giving n log n."},
 {q:"RSA encryption computes …",o:["c = m + e mod n","c = mᵉ mod n","c = eᵐ mod n","c = m × e"],a:1,s:"Encryption raises the message to the public exponent e modulo n."},
 {q:"With p = 7 and q = 13, what is n?",o:["20","72","91","101"],a:2,s:"n = p × q = 7 × 13 = 91. φ(n) = 6 × 12 = 72."},
 {q:"RSA security relies on the difficulty of …",o:["sorting large lists","factoring a large product of two primes","searching a hash table","routing packets"],a:1,s:"An attacker who can factor n into p and q can compute the private exponent d."}
]},
